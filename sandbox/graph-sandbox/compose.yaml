  checkout-data:
    labels:
      com.latent-sre.graph-sandbox.run-id: ${GRAPH_RUN_ID:?activation owns the run ID}
      com.latent-sre.graph-sandbox.scope: ${GRAPH_SCOPE_HASH:?activation owns the scope hash}
      com.latent-sre.graph-sandbox.source-revision: ${SOURCE_REVISION:?activation owns the revision}
