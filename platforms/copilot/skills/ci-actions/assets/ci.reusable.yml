# Generated by scripts/generate_platform_adapters.py; do not edit.
# Starter reusable CI workflow; copy to .github/workflows/ and adapt from reviewed requirements.
# Reusable via workflow_call. Third-party actions are pinned by SHA; a typed `reviewer` agent reviews
# action provenance, untrusted inputs, permissions, and secret exposure before merge.
name: ci

on:
  workflow_call:
    # Add typed inputs only when a caller consumes them.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest migrates gradually and varies run-to-run mid-migration
    strategy:
      matrix: { python-version: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1 — needs a Node 24 runner; refuses fork checkout under pull_request_target
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1 — no @v10 floating tag exists; cache auto-disabled on pull_request_target/workflow_run/release
        with: { python-version: "${{ matrix.python-version }}" }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q

  # Deployment belongs in a separate protected-environment job/workflow.
  # production deployment requires current human release-owner approval evidence for the exact target and rollback.
  # Use an approved credential source and never place a password in command argv.
