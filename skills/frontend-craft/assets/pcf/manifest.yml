# manifest.yml — the UI as its own PCF app on the staticfile buildpack.
# The API is a separate app mapped on the same host under its context path (routes below), so the
# browser sees one origin and sends no CORS preflight. Environment values here feed .profile, which
# writes public/config.json at container start; none of them is a secret.
---
applications:
  - name: orders-console
    path: .
    buildpacks:
      - staticfile_buildpack
    memory: 64M
    instances: 2
    health-check-type: http
    health-check-http-endpoint: /
    routes:
      - route: orders-console.apps.example.internal
    env:
      UI_ENVIRONMENT: staging
      UI_API_BASE_URL: /v1
      UI_LOG_SEARCH_URL_TEMPLATE: https://splunk.example.internal/en-US/app/search/search?q=search%20request_id%3D{request_id}
      UI_TRACE_URL_TEMPLATE: https://grafana.example.internal/explore?schemaVersion=1&panes=%7B%22t%22%3A%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22query%22%3A%22{request_id}%22%7D%5D%7D%7D
# The API app, in the same space, carries the context-path route for the same host:
#   routes:
#     - route: orders-console.apps.example.internal/v1
