# Project manifest: dependency groups, lint, format and type-check configuration. The repository is
# not a package (tool.uv.package = false); uv.lock holds every exact version. Ruff lints the eval runner
# (evals/build_probe.py and evals/probe/), the run comparison (evals/compare_runs.py), the turn-count
# summary (evals/turn_counts.py), the graders, the Inspect pilot, the evals tests and their shared
# helpers (evals/probe_testkit.py), the fleet tooling and its suites (scripts/), and the Python bundled
# in skills/. It formats the eval code but its tests; scripts/ and skills/ keep their hand layouts.
# Strict mypy covers the eval code without the tests or their helpers, plus the scripts/ modules that
# are fully typed: the read-only guard and its session preflight, the Gate A path,
# and the scripts/ test helpers. CI runs all three in the component-tests job.
# judge.py, clean_room.py and oracles/ keep their byte-bound layouts and incremental typing:
# CI separately runs Ruff's syntax, invalid-control-flow and undefined-name rules on them.
# A global format/type migration needs a measured benefit; it would replace calibration and case
# identities without changing evaluation behavior. Their behavioral tests remain required.

[project]
# Not published. The plugin's own version is .claude-plugin/plugin.json; this manifest only names the
# development environment that uv.lock resolves.
name = "save-toolkit"
version = "0.0.0"
requires-python = ">=3.12"  # repository-wide compatibility floor (CONTRIBUTING.md)
dependencies = []

[dependency-groups]
# `uv sync` installs `test`: the fleet, build-oracle and Inspect regression tests, lint and type checks.
# Floors are the versions the suite was last proven on before a re-resolution; uv.lock is the pin.
test = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-socket>=0.8.1",
    "hypothesis>=6.168.5",
    "types-PyYAML>=6.0.12.20260906",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.5",
    "inspect-ai>=0.3.263",
    "inspect-swe>=0.2.70",
    "anthropic>=1.4.0",
    "docker>=7.2.0",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    { include-group = "gate" },
    { include-group = "grafana" },
]
# Gate A's path (scripts/gate_a.py and the scripts it imports) reads frontmatter through
# scripts/fleet_frontmatter.py, which needs PyYAML and nothing else; the validate job syncs this group
# alone on the 3.12 floor. A further gate-path third-party import joins this group.
gate = [
    "pyyaml>=6.0.3",
]
# Grafana analysis workflows (skills/grafana/scripts); run with `python -I` in the project environment.
grafana = [
    "deepdiff>=9.1.0",
    "pillow>=13.0.0",
    "polars>=2.0.0",
    "promql-parser>=0.11.0",
]
# Optional WP-08 SWE-bench evaluation environment, approved by its run plan.
swebench = [
    "swebench>=5.0.2",
    "docker>=7.2.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]
# Optional independent SWT worker environment. evals/swt_adapter/verifier.py admits exactly the
# versions pinned here and reads them from this group. Conflicts below keep the group out of the project
# environment: install it with `uv sync --locked --only-group swt` into a separate UV_PROJECT_ENVIRONMENT.
swt = [
    "docker==7.2.0",
    "datasets==5.1.0",
    "editdistance==0.8.1",
    "GitPython==3.2.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "unidiff==1.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "pytest>=9.1.1",
]
# Optional WP-09 Harbor SDK environment, Apache-2.0. evals/harbor_adapter/contracts.py reads this
# release's version and wheel hash from uv.lock; a version change also updates its upstream source
# commit there and the frozen manifest's harbor block.
# Conflicts below keep it out of the project environment: install it with
# `uv sync --locked --only-group harbor` into a separate UV_PROJECT_ENVIRONMENT.
harbor = [
    "harbor==0.25.0",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
default-groups = ["test"]
# litellm (Harbor's dependency) declares filelock<4 although it imports filelock only in two proxy CLI
# commands, through the FileLock API that 4.x keeps unchanged; the Harbor modules the fleet adapter
# imports never import litellm. filelock 3.x carries three advisories fixed only in 4.2.1, so the
# Harbor group takes the 4.x line that every other group already has. Drop this once litellm lifts
# its upper bound; the WP-09 Harbor smoke on a Docker host remains the live check of that environment.
override-dependencies = ["filelock>=4.2.7"]
# harbor and swt resolve apart from the project environment and from each other; swebench
# installs on top of test.
conflicts = [
    [{ group = "harbor" }, { group = "test" }],
    [{ group = "harbor" }, { group = "grafana" }],
    [{ group = "harbor" }, { group = "swebench" }],
    [{ group = "harbor" }, { group = "swt" }],
    [{ group = "swt" }, { group = "test" }],
    [{ group = "swt" }, { group = "grafana" }],
    [{ group = "swt" }, { group = "swebench" }],
]

[tool.ruff]
target-version = "py312"  # repository-wide compatibility floor (CONTRIBUTING.md)
line-length = 120
# scripts/ is its suites' import root (`import validate_fleet`, `from testkit import ...`), so those
# modules sort as first-party. evals/ is deliberately absent: reclassifying its modules would reorder
# imports in evals/probe/, whose bytes are the eval runner's identity.
src = [".", "scripts"]
include = [
    "evals/build_probe.py",
    "evals/codex_probe.py",
    "evals/codex_fixture_tools.py",
    "evals/codex_gcp_queries.py",
    "evals/compare_runs.py",
    "evals/campaign_report.py",
    "evals/catalog.py",
    "evals/testing_block.py",
    "evals/wp04_linux_cli.py",
    "evals/itbench_adapter/**/*.py",
    "evals/itbench_pilot.py",
    "evals/itbench_testkit.py",
    "evals/swt_adapter/**/*.py",
    "evals/swt_pilot.py",
    "evals/harbor_adapter/**/*.py",
    "evals/harbor_pilot.py",
    "evals/turn_counts.py",
    "evals/probe/**/*.py",
    "evals/swebench_adapter/**/*.py",
    "evals/swebench_repair.py",
    "evals/graders.py",
    "evals/inspect_pilot.py",
    "evals/inspect_fleet.py",
    "evals/test_*.py",
    "evals/probe_testkit.py",
    "evals/golden_runs.py",
    "scripts/*.py",
    "skills/**/*.py",
]

[tool.ruff.format]
# Hand layouts stay: the tests' compact tables, and the fleet tooling and bundled helpers, which
# predate the formatter. The lint rules still apply to all of them.
exclude = ["evals/test_*.py", "scripts/*.py", "skills/**/*.py"]

[tool.ruff.lint]
# The stack profile's bugbear (B) beside errors, imports, upgrades and simplifications. Local imports
# are deliberate where a module is needed by one rarely used path, and are marked where they occur.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PLC0415"]
ignore = ["E501"]  # the formatter owns line length; long messages and patterns stay whole

[tool.ruff.lint.per-file-ignores]
"evals/test_*.py" = ["RUF012"]  # test classes hold read-only fixtures as class constants
"scripts/test_*.py" = ["RUF012"]
# The guard's allow and deny gates keep one condition per decision: each is the policy, read alone.
"scripts/readonly-guard.py" = ["SIM102", "SIM103"]
# Preserve evaluated aliases; changing their runtime representation is separate from raising the
# supported interpreter floor.
"scripts/fleet_frontmatter.py" = ["UP040"]

[tool.mypy]
python_version = "3.12"
files = [
    "evals/probe", "evals/build_probe.py", "evals/compare_runs.py", "evals/turn_counts.py", "evals/graders.py",
    "evals/inspect_pilot.py", "evals/inspect_fleet.py", "evals/catalog.py", "evals/campaign_report.py", "evals/testing_block.py", "evals/wp04_linux_cli.py",
    "evals/itbench_adapter", "evals/itbench_pilot.py",
    "evals/swt_adapter", "evals/swt_pilot.py",
    "evals/harbor_adapter", "evals/harbor_pilot.py",
    "evals/swebench_adapter", "evals/swebench_repair.py",
    # A file joins once it is clean.
    "evals/codex_probe.py", "evals/codex_fixture_tools.py", "evals/codex_gcp_queries.py",
    "scripts/readonly-guard.py", "scripts/guard-session-preflight.py", "scripts/gate_a.py", "scripts/check_links.py",
    "scripts/validate_fleet.py", "scripts/generate_platform_adapters.py", "scripts/fleet_frontmatter.py",
    "scripts/testkit.py", "scripts/local_tests.py",
]
mypy_path = "evals,scripts"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Typing these would change the bytes the judge calibration receipt binds (see the header).
module = ["clean_room", "judge"]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional pinned SDK is verified in its isolated environment, not installed in the native runner.
module = ["harbor", "harbor.*"]
follow_imports = "skip"
ignore_missing_imports = true
