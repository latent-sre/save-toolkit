# Lint, format and type-check configuration only: this file does not make the repository a package,
# and every dependency stays pinned in requirements-dev.txt. Ruff lints the eval runner
# (evals/build_probe.py and evals/probe/), the run comparison (evals/compare_runs.py), the turn-count
# summary (evals/turn_counts.py), the graders,
# the Inspect pilot and the evals tests, and formats all of them but the tests; strict mypy covers
# the same code without the tests. CI runs
# them in the component-tests job. evals/judge.py, evals/clean_room.py and evals/oracles/ stay outside
# all three: the judge calibration receipt binds the first two byte for byte and each case's identity
# binds the oracles, so even a formatting change would reject the receipt or orphan the saved runs.

[tool.ruff]
target-version = "py312"  # the runner's compatibility floor (evals/README.md)
line-length = 120
# scripts/ is its suites' import root (`import validate_fleet`, `from testkit import ...`), so those
# modules sort as first-party. evals/ is deliberately absent: reclassifying its modules would reorder
# imports in evals/probe/, whose bytes are the eval runner's identity.
src = [".", "scripts"]
include = [
    "evals/build_probe.py",
    "evals/compare_runs.py",
    "evals/turn_counts.py",
    "evals/probe/**/*.py",
    "evals/graders.py",
    "evals/inspect_pilot.py",
    "evals/test_*.py",
    "scripts/*.py",
    "skills/**/*.py",
]

# Floors below the runner's 3.12, so upgrade rules never propose syntax a supported interpreter
# rejects: the read-only guard, the Gate A path and the fleet atlas run on 3.11
# (gate_a.MINIMUM_PYTHON). Bundled skill code runs on users' interpreters; most of it states no floor
# and still parses as 3.8, and a lower lint target only withholds suggestions, never raises a floor.
[tool.ruff.per-file-target-version]
"scripts/*.py" = "py311"
"skills/**/*.py" = "py38"

[tool.ruff.format]
# Hand layouts stay: the tests' compact tables, and the fleet tooling and bundled helpers, which
# predate the formatter. The lint rules still apply to all of them.
exclude = ["evals/test_*.py", "scripts/*.py", "skills/**/*.py"]

[tool.ruff.lint]
# The stack profile's bugbear (B) beside errors, imports, upgrades and simplifications. Local imports
# are deliberate where a module is needed by one rarely used path, and are marked where they occur.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PLC0415"]
ignore = ["E501"]  # the formatter owns line length; long messages and patterns stay whole

[tool.ruff.lint.per-file-ignores]
"evals/test_*.py" = ["RUF012"]  # test classes hold read-only fixtures as class constants
"scripts/test_*.py" = ["RUF012"]
# The guard's allow and deny gates keep one condition per decision: each is the policy, read alone.
"scripts/readonly-guard.py" = ["SIM102", "SIM103"]

[tool.mypy]
python_version = "3.12"
files = ["evals/probe", "evals/build_probe.py", "evals/compare_runs.py", "evals/turn_counts.py", "evals/graders.py", "evals/inspect_pilot.py"]
mypy_path = "evals"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Typing these would change the bytes the judge calibration receipt binds (see the header).
module = ["clean_room", "judge"]
follow_imports = "skip"
ignore_missing_imports = true
