name: Publish immutable release

run-name: Release ${{ inputs.version }} from ${{ inputs.candidate_sha }}

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed main commit (40 lowercase hexadecimal characters)
        required: true
        type: string
      version:
        description: Stable manifest version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      expires_at:
        description: Whole-second UTC approval expiry, no more than 24 hours from run creation (RFC3339)
        required: true
        type: string
      recovery_tag:
        description: Prior save-toolkit--vX.Y.Z tag, or uninstall for the first release
        required: true
        type: string
      review_evidence:
        description: Merged pull request URL whose merge commit is candidate_sha
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: save-toolkit-release
  queue: max
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: '2.1.227'
  CODEX_CLI_VERSION: '0.147.0'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      issued_at: ${{ steps.run-state.outputs.issued_at }}
      packet_digest: ${{ steps.packet-digest.outputs.packet_digest }}
      packet_artifact_id: ${{ steps.upload-packet.outputs.artifact-id }}
      recovery_sha: ${{ steps.recovery.outputs.recovery_sha }}
    steps:
      - name: Reject an untrusted dispatch boundary explicitly
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          EXPECTED_REQUEST_ACTOR: ${{ vars.RELEASE_REQUEST_ACTOR }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          script: |
            const fail = (message) => { throw new Error(message); };
            if (process.env.REPOSITORY !== 'latent-sre/save-toolkit') fail('unexpected repository');
            if (process.env.REF !== 'refs/heads/main' || process.env.REF_PROTECTED !== 'true') {
              fail('release requests must target protected main');
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.CANDIDATE_SHA || '') || process.env.CANDIDATE_SHA !== process.env.EVENT_SHA || process.env.CANDIDATE_SHA !== process.env.WORKFLOW_SHA) {
              fail('candidate, event, and workflow SHAs must be the same exact lowercase commit');
            }
            if (!process.env.EXPECTED_REQUEST_ACTOR || process.env.ACTOR !== process.env.EXPECTED_REQUEST_ACTOR || process.env.TRIGGERING_ACTOR !== process.env.EXPECTED_REQUEST_ACTOR) {
              fail('workflow actor is not the configured human release requester');
            }

      - name: Bind issuance to immutable workflow-run metadata
        id: run-state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fail = (message) => { throw new Error(message); };
            const current = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: Number(process.env.PROMOTION_RUN_ID),
            });
            const issuedAt = current.data.created_at;
            if (String(current.data.id) !== process.env.PROMOTION_RUN_ID || current.data.head_sha?.toLowerCase() !== process.env.CANDIDATE_SHA) {
              fail('workflow-run metadata is not bound to this candidate and run id');
            }
            if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$/.test(issuedAt || '')) {
              fail('workflow-run created_at is not an exact whole-second UTC timestamp');
            }
            core.setOutput('issued_at', issuedAt);

      - name: Check out the exact reviewed candidate without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'

      - name: Refresh the trusted main identity
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Validate exact review evidence
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          REVIEW_EVIDENCE: ${{ inputs.review_evidence }}
        with:
          script: |
            const match = process.env.REVIEW_EVIDENCE.match(
              /^https:\/\/github\.com\/latent-sre\/save-toolkit\/pull\/([1-9][0-9]*)$/,
            );
            if (!match) {
              core.setFailed('review_evidence must be this repository\'s pull-request URL');
              return;
            }
            const pull = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(match[1]),
            });
            if (!pull.data.merged_at || pull.data.base.ref !== 'main') {
              core.setFailed('review_evidence must identify a merged pull request into main');
              return;
            }
            if ((pull.data.merge_commit_sha || '').toLowerCase() !== process.env.CANDIDATE_SHA) {
              core.setFailed('review_evidence is not bound to candidate_sha');
            }

      - name: Validate and bind the recovery target
        id: recovery
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_TAG: save-toolkit--v${{ inputs.version }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        with:
          script: |
            const fail = (message) => { throw new Error(message); };
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const recovery = process.env.RECOVERY_TAG;
            const releaseTag = process.env.RELEASE_TAG;
            const releaseTagPattern = /^save-toolkit--v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/;
            const versionTuple = (tag) => tag.slice('save-toolkit--v'.length).split('.').map(Number);
            const isOlder = (left, right) => left.some((value, index) =>
              value < right[index] && left.slice(0, index).every((prior, priorIndex) => prior === right[priorIndex])
            );

            if (recovery === 'uninstall') {
              const releases = await github.paginate(github.rest.repos.listReleases, {
                owner, repo, per_page: 100,
                headers: { 'X-GitHub-Api-Version': '2026-03-10' },
              });
              if (releases.some((item) => releaseTagPattern.test(item.tag_name) && item.immutable === true && !item.draft && !item.prerelease)) {
                fail("recovery_tag 'uninstall' is allowed only until the first usable immutable release exists");
              }
              core.setOutput('recovery_sha', '');
              return;
            }
            if (!/^save-toolkit--v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/.test(recovery) || !isOlder(versionTuple(recovery), versionTuple(releaseTag))) {
              fail('recovery tag must be a strictly older stable Save Toolkit version');
            }
            const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${recovery}` });
            if (ref.data.object.type !== 'tag') fail('recovery tag must be annotated');
            const tagObject = await github.rest.git.getTag({ owner, repo, tag_sha: ref.data.object.sha });
            if (tagObject.data.object.type !== 'commit' || !/^[0-9a-f]{40}$/.test(tagObject.data.object.sha)) {
              fail('recovery tag does not resolve to one commit');
            }
            const priorRelease = await github.request('GET /repos/{owner}/{repo}/releases/tags/{tag}', {
              owner, repo, tag: recovery,
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            if (priorRelease.data.immutable !== true || priorRelease.data.draft || priorRelease.data.prerelease) {
              fail('recovery tag has no published immutable stable GitHub Release');
            }
            core.setOutput('recovery_sha', tagObject.data.object.sha.toLowerCase());

      - name: Build the effect-bound release packet
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
          RECOVERY_SHA: ${{ steps.recovery.outputs.recovery_sha }}
          REVIEW_EVIDENCE: ${{ inputs.review_evidence }}
          PROMOTION_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
          ISSUED_AT: ${{ steps.run-state.outputs.issued_at }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python scripts/release_contract.py \
            --candidate-sha "$CANDIDATE_SHA" \
            --version "$VERSION" \
            --issued-at "$ISSUED_AT" \
            --expires-at "$EXPIRES_AT" \
            --recovery-tag "$RECOVERY_TAG" \
            --recovery-sha "$RECOVERY_SHA" \
            --review-evidence "$REVIEW_EVIDENCE" \
            --actor "$PROMOTION_ACTOR" \
            --triggering-actor "$TRIGGERING_ACTOR" \
            --run-id "$PROMOTION_RUN_ID" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            > "$RUNNER_TEMP/release-request.json"

      - name: Gate A structural verification
        run: python scripts/gate_a.py

      - name: Install the pinned Claude Code CLI
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Validate the Claude plugin contract
        run: claude plugin validate . --strict

      - name: Prove the derived Claude release tag without publishing
        env:
          EXPECTED_TAG: save-toolkit--v${{ inputs.version }}
        run: |
          claude plugin tag . --dry-run 2>&1 | tee "$RUNNER_TEMP/claude-tag-dry-run.txt"
          test "$(grep -Ec '^Tag:[[:space:]]+' "$RUNNER_TEMP/claude-tag-dry-run.txt")" -eq 1
          test "$(sed -n 's/^Tag:[[:space:]]*//p' "$RUNNER_TEMP/claude-tag-dry-run.txt")" = "$EXPECTED_TAG"

      - name: Digest the reviewed release packet
        id: packet-digest
        run: echo "packet_digest=$(sha256sum "$RUNNER_TEMP/release-request.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Show the exact plan and recovery before protected approval
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: save-toolkit--v${{ inputs.version }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
          RECOVERY_SHA: ${{ steps.recovery.outputs.recovery_sha }}
          ISSUED_AT: ${{ steps.run-state.outputs.issued_at }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          REVIEW_EVIDENCE: ${{ inputs.review_evidence }}
          REQUEST_ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo '## Immutable release approval packet'
            echo
            echo "- Effect: create annotated tag and immutable GitHub Release \`$RELEASE_TAG\`"
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Requester: \`$REQUEST_ACTOR\`"
            echo "- Nonce: \`$RUN_ID\`"
            echo "- Issued: \`$ISSUED_AT\`"
            echo "- Expires: \`$EXPIRES_AT\`"
            echo "- Review: $REVIEW_EVIDENCE"
            echo "- Recovery: \`$RECOVERY_TAG\` ${RECOVERY_SHA:+at \`$RECOVERY_SHA\`}"
            echo '- Rollback never moves or deletes a published tag.'
            echo '- Approval prerequisite: current owner evidence must show admin bypass disabled on both release environments and the publisher App as the sole ruleset bypass; the least-privileged API token cannot expose those fields.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the exact preflight packet
        id: upload-packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-request-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-request.json
          if-no-files-found: error
          retention-days: 30

  publish_tag:
    name: Publish protected release tag
    needs: preflight
    environment: release-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint scoped promotion token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: save-toolkit

      - name: Create or reconcile the protected annotated tag
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          EXPECTED_REQUEST_ACTOR: ${{ vars.RELEASE_REQUEST_ACTOR }}
          EXPECTED_REVIEWER: ${{ vars.RELEASE_ENVIRONMENT_REVIEWER }}
          EXPECTED_ENVIRONMENT: release-tag
          RULESET_ID: ${{ vars.RELEASE_TAG_RULESET_ID }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_PROTECTED: ${{ github.ref_protected }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
          ISSUED_AT: ${{ needs.preflight.outputs.issued_at }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
          RECOVERY_SHA: ${{ needs.preflight.outputs.recovery_sha }}
          REVIEW_EVIDENCE: ${{ inputs.review_evidence }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fail = (message) => { throw new Error(message); };
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const candidate = process.env.CANDIDATE_SHA;
            const version = process.env.VERSION;
            const tag = `save-toolkit--v${version}`;
            const runId = process.env.PROMOTION_RUN_ID;
            const reservationTag = `save-toolkit--attempt-v${version}--run-${runId}`;
            const reservationPrefix = `tags/save-toolkit--attempt-v${version}--run-`;
            const expiry = Date.parse(process.env.EXPIRES_AT);
            const annotation = [
              `Save Toolkit v${version}`,
              `repository: ${owner}/${repo}`,
              `candidate-sha: ${candidate}`,
              `workflow-sha: ${process.env.WORKFLOW_SHA}`,
              `promotion-run-id: ${runId}`,
              `reservation-tag: ${reservationTag}`,
              `issued-at: ${process.env.ISSUED_AT}`,
              `expires-at: ${process.env.EXPIRES_AT}`,
              `recovery-tag: ${process.env.RECOVERY_TAG}`,
              `recovery-sha: ${process.env.RECOVERY_SHA || 'none'}`,
              `review-evidence: ${process.env.REVIEW_EVIDENCE}`,
              `actor: ${process.env.ACTOR}`,
              `triggering-actor: ${process.env.TRIGGERING_ACTOR}`,
            ].join('\n');

            if (!/^[0-9a-f]{40}$/.test(candidate) || !/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version) || !/^[1-9][0-9]*$/.test(runId)) {
              fail('release identity is malformed');
            }
            if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$/.test(process.env.ISSUED_AT || '') || !/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$/.test(process.env.EXPIRES_AT || '')) {
              fail('issued_at and expires_at must be exact whole-second RFC3339 UTC timestamps');
            }
            if (!process.env.EXPECTED_REQUEST_ACTOR || process.env.ACTOR !== process.env.EXPECTED_REQUEST_ACTOR || process.env.TRIGGERING_ACTOR !== process.env.EXPECTED_REQUEST_ACTOR) {
              fail('workflow actor is not the configured human release requester');
            }
            if (process.env.REF_PROTECTED !== 'true') {
              fail('main is not reported as a protected ref');
            }

            const readTag = async () => {
              let ref;
              try {
                ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
              if (ref.data.object.type !== 'tag') {
                fail('existing release tag is not annotated');
              }
              const object = await github.rest.git.getTag({ owner, repo, tag_sha: ref.data.object.sha });
              return { candidate: object.data.object.sha.toLowerCase(), message: object.data.message.trim() };
            };
            const assertExact = (existing) => {
              if (existing.candidate !== candidate || existing.message !== annotation) {
                fail('existing tag belongs to another candidate or promotion run');
              }
            };

            const reservations = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: reservationPrefix,
              per_page: 100,
            });
            let currentReservation = null;
            for (const reservation of reservations) {
              if (reservation.ref !== `refs/tags/${reservationTag}`) {
                fail(`VERSION_RESERVED: ${tag} is permanently reserved by ${reservation.ref}`);
              }
              if (reservation.object?.type !== 'commit' || reservation.object.sha?.toLowerCase() !== candidate) {
                fail('current-run version reservation does not bind the exact candidate commit');
              }
              currentReservation = reservation;
            }

            const existing = await readTag();
            if (existing) {
              if (!currentReservation) fail('existing release tag has no protected current-run reservation');
              assertExact(existing);
              core.notice(`reconciled exact tag ${tag} without another write`);
              return;
            }
            if (!Number.isFinite(expiry) || Date.now() >= expiry) {
              fail('release approval expired before tag publication');
            }

            const main = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            if (main.data.object.sha.toLowerCase() !== candidate) {
              fail('main advanced after approval; dispatch a new request for the new head');
            }
            const immutable = await github.request('GET /repos/{owner}/{repo}/immutable-releases', {
              owner, repo, headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            if (immutable.data.enabled !== true) fail('immutable releases are not enabled');

            const environment = await github.request('GET /repos/{owner}/{repo}/environments/{environment_name}', {
              owner, repo, environment_name: process.env.EXPECTED_ENVIRONMENT,
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            const reviewerRule = (environment.data.protection_rules || []).find((rule) => rule.type === 'required_reviewers');
            const reviewerNames = (reviewerRule?.reviewers || []).map((item) =>
              item.reviewer?.login || item.reviewer?.slug
            );
            if (!process.env.EXPECTED_REVIEWER || process.env.EXPECTED_REVIEWER === process.env.EXPECTED_REQUEST_ACTOR || reviewerNames.length !== 1 || reviewerNames[0] !== process.env.EXPECTED_REVIEWER || reviewerRule?.prevent_self_review !== true) {
              fail('release environment lacks a distinct configured reviewer with self-review prevention');
            }
            if ('can_admins_bypass' in environment.data && environment.data.can_admins_bypass !== false) {
              fail('release environment permits administrator bypass');
            }
            if (!('can_admins_bypass' in environment.data)) {
              core.warning('GitHub did not expose can_admins_bypass in the environment response; live closure evidence must prove it is disabled');
            }
            const branchPolicy = environment.data.deployment_branch_policy || {};
            if (branchPolicy.protected_branches !== true || branchPolicy.custom_branch_policies !== false) {
              fail('release environment is not limited to protected branches');
            }

            if (!/^[1-9][0-9]*$/.test(process.env.RULESET_ID || '')) fail('RELEASE_TAG_RULESET_ID is missing');
            const ruleset = await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}', {
              owner, repo, ruleset_id: Number(process.env.RULESET_ID),
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            const includes = ruleset.data.conditions?.ref_name?.include || [];
            const excludes = ruleset.data.conditions?.ref_name?.exclude || [];
            const ruleTypes = new Set((ruleset.data.rules || []).map((rule) => rule.type));
            const requiredRules = ['creation', 'update', 'deletion', 'non_fast_forward'];
            const bypassActors = Array.isArray(ruleset.data.bypass_actors)
              ? ruleset.data.bypass_actors
              : null;
            if (bypassActors !== null) {
              if (bypassActors.length !== 1) fail('release tag ruleset must have exactly one bypass actor');
              const appBypass =
                bypassActors[0].actor_type === 'Integration' &&
                String(bypassActors[0].actor_id) === String(process.env.APP_ID) &&
                bypassActors[0].bypass_mode === 'always';
              if (!appBypass) fail('release App is not the sole always-on ruleset bypass');
            } else {
              core.warning('ruleset bypass actors are hidden from this least-privileged token; the protected approval packet must carry current owner evidence');
            }
            const requiredIncludes = ['refs/tags/save-toolkit--v*', 'refs/tags/save-toolkit--attempt-v*'];
            if (ruleset.data.target !== 'tag' || ruleset.data.enforcement !== 'active' || includes.length !== requiredIncludes.length || !requiredIncludes.every((pattern) => includes.includes(pattern)) || excludes.length !== 0 || !requiredRules.every((rule) => ruleTypes.has(rule))) {
              fail('release tag ruleset is not active and complete for the exact release namespace');
            }

            const installation = await github.request('GET /installation');
            const permissions = installation.data.permissions || {};
            const allowedPermissions = new Set(['actions', 'administration', 'contents', 'metadata']);
            const unexpected = Object.keys(permissions).filter((name) => !allowedPermissions.has(name));
            if (permissions.actions !== 'read' || permissions.administration !== 'read' || permissions.contents !== 'write' || unexpected.length) {
              fail(`promotion App permissions are missing or overbroad: ${JSON.stringify(permissions)}`);
            }

            const currentRun = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(runId),
            });
            const titlePattern = new RegExp(`^Release ${version.replaceAll('.', '\\.')} from ([0-9a-f]{40})$`);
            const priorRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: currentRun.data.workflow_id,
              per_page: 100,
            });
            for (const prior of priorRuns) {
              if (String(prior.id) === runId) continue;
              const title = (prior.display_title || '').match(titlePattern);
              if (!title) continue;
              if ((prior.head_sha || '').toLowerCase() !== title[1]) {
                fail(`prior release run ${prior.id} has inconsistent title and head identity`);
              }
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: prior.id,
                filter: 'all',
                per_page: 100,
              });
              if (jobs.some((job) => job.name === 'Publish protected release tag' && job.conclusion !== 'skipped' && job.started_at)) {
                fail(`VERSION_RESERVED: ${tag} was already attempted by workflow run ${prior.id}; never redispatch this version`);
              }
            }

            if (process.env.RUN_ATTEMPT !== '1') {
              fail('UNKNOWN_OUTCOME: a rerun may reconcile an exact tag but cannot issue a new tag write');
            }

            if (!currentReservation) {
              let reservationError = null;
              try {
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${reservationTag}`,
                  sha: candidate,
                });
              } catch (error) {
                reservationError = error;
              }
              let reserved;
              try {
                reserved = await github.rest.git.getRef({ owner, repo, ref: `tags/${reservationTag}` });
              } catch (readError) {
                fail(`UNKNOWN_OUTCOME: version reservation could not be read after its write attempt; never redispatch ${tag}: ${readError.message}`);
              }
              if (reserved.data.object.type !== 'commit' || reserved.data.object.sha.toLowerCase() !== candidate) {
                fail('version reservation conflicts with the exact candidate commit');
              }
              if (reservationError) {
                core.warning(`reservation API returned an error but exact protected state reconciled: ${reservationError.message}`);
              }
            }

            try {
              const created = await github.rest.git.createTag({
                owner, repo, tag, message: annotation, object: candidate, type: 'commit',
              });
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: created.data.sha });
              const published = await readTag();
              if (!published) fail('UNKNOWN_OUTCOME: tag ref was not readable after publication');
              assertExact(published);
            } catch (error) {
              let reconciled;
              try {
                reconciled = await readTag();
              } catch (readError) {
                fail(`UNKNOWN_OUTCOME: tag publication could not be read after an error; do not retry automatically: ${readError.message}`);
              }
              if (!reconciled) {
                fail(`UNKNOWN_OUTCOME: tag write failed and confirmed absence cannot authorize replay: ${error.message}`);
              }
              assertExact(reconciled);
              core.warning(`tag API returned an error but exact remote state reconciled: ${error.message}`);
              return;
            }

  published_smoke:
    name: Verify published tag and recovery
    needs:
      - preflight
      - publish_tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      smoke_artifact_id: ${{ steps.upload-smoke.outputs.artifact-id }}
    steps:
      - name: Refuse to resurrect an earlier smoke attempt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PROMOTION_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const fail = (message) => { throw new Error(message); };
            const runId = Number(process.env.PROMOTION_RUN_ID);
            const runAttempt = Number(process.env.RUN_ATTEMPT);
            if (!Number.isSafeInteger(runId) || !Number.isSafeInteger(runAttempt) || runAttempt < 1) {
              fail('workflow run or attempt identity is malformed');
            }
            for (let attempt = 1; attempt < runAttempt; attempt += 1) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                ...context.repo,
                run_id: runId,
                attempt_number: attempt,
                per_page: 100,
              });
              if (jobs.some((job) => job.name === 'Verify published tag and recovery' && job.conclusion !== 'skipped' && job.started_at)) {
                fail(`SMOKE_BURNED: published-tag smoke already started in attempt ${attempt}; it cannot be replayed`);
              }
            }

      - name: Check out the protected published tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: save-toolkit--v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag identity and promotion nonce
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: save-toolkit--v${{ inputs.version }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-annotation.txt"
          grep -Fx -- "candidate-sha: $CANDIDATE_SHA" "$RUNNER_TEMP/tag-annotation.txt"
          grep -Fx -- "promotion-run-id: $PROMOTION_RUN_ID" "$RUNNER_TEMP/tag-annotation.txt"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.11'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'

      - name: Install pinned host CLIs
        run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" "@openai/codex@$CODEX_CLI_VERSION"

      - name: Install, inventory, and uninstall every supported published surface
        env:
          MARKETPLACE_SOURCE: latent-sre/save-toolkit@save-toolkit--v${{ inputs.version }}
        run: |
          python scripts/host_install_probe.py \
            --root . \
            --target "/tmp/save-toolkit-host-probe-${GITHUB_RUN_ID}" \
            --hosts claude,codex,vscode \
            --marketplace-source "$MARKETPLACE_SOURCE" \
            --allow-vscode-file-probe-without-cli \
            --require-pass \
            --json > "$RUNNER_TEMP/release-host-smoke.json"

      - name: Check out the prior immutable recovery release
        if: inputs.recovery_tag != 'uninstall'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.recovery_tag }}
          path: recovery-checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the prior recovery tag and reinstall path
        if: inputs.recovery_tag != 'uninstall'
        env:
          RECOVERY_SHA: ${{ needs.preflight.outputs.recovery_sha }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          test "$(git -C recovery-checkout rev-parse HEAD)" = "$RECOVERY_SHA"
          test "$(git -C recovery-checkout cat-file -t "$RECOVERY_TAG")" = "tag"
          python recovery-checkout/scripts/host_install_probe.py \
            --root recovery-checkout \
            --target "/tmp/save-toolkit-recovery-probe-${GITHUB_RUN_ID}" \
            --hosts claude,codex,vscode \
            --marketplace-source "latent-sre/save-toolkit@$RECOVERY_TAG" \
            --allow-vscode-file-probe-without-cli \
            --require-pass \
            --json > "$RUNNER_TEMP/recovery-host-smoke.json"

      - name: Show published and recovery smoke status before final approval
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_TAG: save-toolkit--v${{ inputs.version }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
          SMOKE_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          {
            echo '## Published-artifact smoke'
            echo
            echo "- Candidate: \`$RELEASE_TAG\` at \`$CANDIDATE_SHA\`"
            echo "- Recovery: \`$RECOVERY_TAG\`"
            echo "- Run/attempt: \`$RUN_ID/$RUN_ATTEMPT\`"
            echo "- Job state: \`$SMOKE_STATUS\`"
            echo '- A failed smoke permanently burns this version; later attempts cannot finalize it.'
            echo '- Before release-finalize approval, reconfirm the hidden admin-bypass and sole-ruleset-bypass evidence from the request packet.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the published-host evidence
        if: always()
        id: upload-smoke
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-host-smoke-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-host-smoke.json
            ${{ runner.temp }}/recovery-host-smoke.json
          if-no-files-found: error
          retention-days: 30

  finalize_release:
    needs:
      - preflight
      - published_smoke
    environment: release-finalize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact same-run producer artifact IDs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PROMOTION_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PACKET_ARTIFACT_ID: ${{ needs.preflight.outputs.packet_artifact_id }}
          SMOKE_ARTIFACT_ID: ${{ needs.published_smoke.outputs.smoke_artifact_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fail = (message) => { throw new Error(message); };
            const runId = process.env.PROMOTION_RUN_ID;
            const runAttempt = process.env.RUN_ATTEMPT;
            const packetId = process.env.PACKET_ARTIFACT_ID;
            const smokeId = process.env.SMOKE_ARTIFACT_ID;
            if (![runId, runAttempt, packetId, smokeId].every((value) => /^[1-9][0-9]*$/.test(value || ''))) {
              fail('producer run, attempt, and artifact IDs must be nonempty decimal integers');
            }
            if (packetId === smokeId) fail('release packet and smoke must be different artifacts');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: Number(runId),
              per_page: 100,
            });
            const byId = new Map(artifacts.map((artifact) => [String(artifact.id), artifact]));
            const packetArtifact = byId.get(packetId);
            const smokeArtifact = byId.get(smokeId);
            if (!packetArtifact || !smokeArtifact) {
              fail('producer artifact ID is not owned by this workflow run');
            }
            if (packetArtifact.expired !== false || smokeArtifact.expired !== false) {
              fail('producer artifact expired before release finalization');
            }
            const packetName = (packetArtifact.name || '').match(/^release-request-attempt-([1-9][0-9]*)$/);
            const smokeName = (smokeArtifact.name || '').match(/^release-host-smoke-attempt-([1-9][0-9]*)$/);
            if (!packetName || !smokeName) fail('producer artifact has an unexpected immutable name');
            const packetAttempt = packetName[1];
            const smokeAttempt = smokeName[1];
            if (packetAttempt !== smokeAttempt || Number(packetAttempt) > Number(runAttempt)) {
              fail('release packet and smoke are not bound to one completed workflow attempt');
            }

      - name: Download the reviewed release packet
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.preflight.outputs.packet_artifact_id }}
          path: release-request

      - name: Download the published-host evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.published_smoke.outputs.smoke_artifact_id }}
          path: release-host-smoke

      - name: Mint scoped promotion token
        id: app-token
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # v2.1.1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: save-toolkit

      - name: Create or reconcile the immutable GitHub Release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          EXPECTED_REQUEST_ACTOR: ${{ vars.RELEASE_REQUEST_ACTOR }}
          EXPECTED_REVIEWER: ${{ vars.RELEASE_ENVIRONMENT_REVIEWER }}
          EXPECTED_ENVIRONMENT: release-finalize
          RELEASE_RECONCILIATION_KEY: ${{ secrets.RELEASE_RECONCILIATION_KEY }}
          RULESET_ID: ${{ vars.RELEASE_TAG_RULESET_ID }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VERSION: ${{ inputs.version }}
          ISSUED_AT: ${{ needs.preflight.outputs.issued_at }}
          EXPIRES_AT: ${{ inputs.expires_at }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
          RECOVERY_SHA: ${{ needs.preflight.outputs.recovery_sha }}
          REVIEW_EVIDENCE: ${{ inputs.review_evidence }}
          PROMOTION_RUN_ID: ${{ github.run_id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          PACKET_DIGEST: ${{ needs.preflight.outputs.packet_digest }}
          PACKET_PATH: release-request/release-request.json
          SMOKE_PATH: release-host-smoke/release-host-smoke.json
          RECOVERY_SMOKE_PATH: release-host-smoke/recovery-host-smoke.json
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const fail = (message) => { throw new Error(message); };
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const candidate = process.env.CANDIDATE_SHA;
            const version = process.env.VERSION;
            const tag = `save-toolkit--v${version}`;
            const runId = process.env.PROMOTION_RUN_ID;
            const reservationTag = `save-toolkit--attempt-v${version}--run-${runId}`;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;

            if (!process.env.EXPECTED_REQUEST_ACTOR || process.env.ACTOR !== process.env.EXPECTED_REQUEST_ACTOR || process.env.TRIGGERING_ACTOR !== process.env.EXPECTED_REQUEST_ACTOR) {
              fail('workflow actor is not the configured human release requester');
            }
            if (!/^[0-9a-f]{64}$/.test(process.env.RELEASE_RECONCILIATION_KEY || '')) {
              fail('RELEASE_RECONCILIATION_KEY must be an environment-protected 256-bit lowercase hex secret');
            }
            const packetBytes = fs.readFileSync(process.env.PACKET_PATH);
            const digest = crypto.createHash('sha256').update(packetBytes).digest('hex');
            if (digest !== process.env.PACKET_DIGEST) fail('release packet digest changed between jobs');
            const packet = JSON.parse(packetBytes.toString('utf8'));
            const smoke = JSON.parse(fs.readFileSync(process.env.SMOKE_PATH, 'utf8'));
            const recoveryIsUninstall = process.env.RECOVERY_TAG === 'uninstall';
            const rollbackMatches = recoveryIsUninstall
              ? packet.rollback?.mode === 'uninstall' && packet.rollback?.tag === null && packet.rollback?.candidate_sha === null && !process.env.RECOVERY_SHA
              : packet.rollback?.mode === 'prior_release' && packet.rollback?.tag === process.env.RECOVERY_TAG && packet.rollback?.candidate_sha === process.env.RECOVERY_SHA;
            if (packet.schema_version !== 1 || packet.repository !== 'latent-sre/save-toolkit' || packet.effect?.action !== 'publish-immutable-release' || packet.effect?.candidate_sha !== candidate || packet.effect?.tag !== tag || packet.approval?.run_id !== runId || packet.approval?.workflow_sha !== process.env.WORKFLOW_SHA || packet.approval?.review_evidence !== process.env.REVIEW_EVIDENCE || packet.approval?.actor !== process.env.ACTOR || packet.approval?.triggering_actor !== process.env.TRIGGERING_ACTOR || packet.approval?.issued_at !== process.env.ISSUED_AT || packet.approval?.expires_at !== process.env.EXPIRES_AT || packet.distribution?.marketplace_source !== `latent-sre/save-toolkit@${tag}` || !rollbackMatches) {
              fail('release packet is not bound to this exact workflow request');
            }
            const expectedEvidenceIds = new Set(
              ['claude', 'codex', 'vscode'].flatMap((host) =>
                ['install', 'inventory', 'uninstall', 'authority'].map((criterion) => `host.${host}.probe-${criterion}`)
              )
            );
            const assertStrictSmoke = (report, expectedSha, expectedTag, label) => {
              const evidence = Array.isArray(report.evidence) ? report.evidence : [];
              const criteria = new Set(evidence.map((item) => item?.criterion));
              if (report.revision !== expectedSha || report.summary?.pass !== 12 || report.summary?.fail !== 0 || report.summary?.skip !== 0 || report.summary?.inconclusive !== 0 || evidence.length !== expectedEvidenceIds.size || criteria.size !== expectedEvidenceIds.size || !evidence.every((item) => expectedEvidenceIds.has(item?.criterion) && item?.status === 'pass' && item.environment?.source_worktree_clean === true)) {
                fail(`${label} evidence is not a strict clean-source 12/12 pass for its exact commit`);
              }
              const marketplaceSource = `latent-sre/save-toolkit@${expectedTag}`;
              const marketplaceEvidence = evidence.filter((item) => item?.criterion?.startsWith('host.claude.') || item?.criterion?.startsWith('host.codex.'));
              if (marketplaceEvidence.some((item) => item.environment?.marketplace_source !== marketplaceSource || item.environment?.marketplace_source_kind !== 'pinned-version-tag')) {
                fail(`${label} evidence is not bound to the exact remote marketplace tag`);
              }
              const installedEvidence = marketplaceEvidence.filter((item) => item?.criterion?.endsWith('probe-install') || item?.criterion?.endsWith('probe-inventory'));
              if (installedEvidence.length !== 4 || installedEvidence.some((item) => item.source?.details?.marketplace_revision_matches !== true || item.source?.details?.marketplace_checkout_clean !== true || item.source?.details?.installed_tree_matches !== true)) {
                fail(`${label} evidence does not prove clean exact installed bytes for Claude and Codex`);
              }
            };
            assertStrictSmoke(smoke, candidate, tag, 'published-host');
            if (!recoveryIsUninstall) {
              if (!fs.existsSync(process.env.RECOVERY_SMOKE_PATH)) fail('prior-release recovery smoke is missing');
              const recoverySmoke = JSON.parse(fs.readFileSync(process.env.RECOVERY_SMOKE_PATH, 'utf8'));
              assertStrictSmoke(recoverySmoke, process.env.RECOVERY_SHA, process.env.RECOVERY_TAG, 'recovery-host');
            } else if (fs.existsSync(process.env.RECOVERY_SMOKE_PATH)) {
              fail('unexpected prior-release recovery smoke exists for first-release uninstall recovery');
            }

            const tagRef = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
            if (tagRef.data.object.type !== 'tag') fail('release tag is not annotated');
            const reservationRef = await github.rest.git.getRef({ owner, repo, ref: `tags/${reservationTag}` });
            if (reservationRef.data.object.type !== 'commit' || reservationRef.data.object.sha.toLowerCase() !== candidate) {
              fail('protected version reservation no longer binds the exact candidate');
            }
            const tagObject = await github.rest.git.getTag({ owner, repo, tag_sha: tagRef.data.object.sha });
            const expectedAnnotation = [
              `Save Toolkit v${version}`,
              `repository: ${owner}/${repo}`,
              `candidate-sha: ${candidate}`,
              `workflow-sha: ${process.env.WORKFLOW_SHA}`,
              `promotion-run-id: ${runId}`,
              `reservation-tag: ${reservationTag}`,
              `issued-at: ${process.env.ISSUED_AT}`,
              `expires-at: ${process.env.EXPIRES_AT}`,
              `recovery-tag: ${process.env.RECOVERY_TAG}`,
              `recovery-sha: ${process.env.RECOVERY_SHA || 'none'}`,
              `review-evidence: ${process.env.REVIEW_EVIDENCE}`,
              `actor: ${process.env.ACTOR}`,
              `triggering-actor: ${process.env.TRIGGERING_ACTOR}`,
            ].join('\n');
            if (tagObject.data.object.sha.toLowerCase() !== candidate || tagObject.data.message.trim() !== expectedAnnotation) {
              fail('release tag no longer matches the approved candidate and nonce');
            }

            const publisherProof = crypto
              .createHmac('sha256', Buffer.from(process.env.RELEASE_RECONCILIATION_KEY, 'hex'))
              .update([owner + '/' + repo, tag, candidate, process.env.WORKFLOW_SHA, runId, process.env.PACKET_DIGEST].join('\n'))
              .digest('hex');
            const metadata = [
              `candidate-sha: ${candidate}`,
              `workflow-sha: ${process.env.WORKFLOW_SHA}`,
              `promotion-run-id: ${runId}`,
              `reservation-tag: ${reservationTag}`,
              `recovery-tag: ${process.env.RECOVERY_TAG}`,
              `recovery-sha: ${process.env.RECOVERY_SHA || 'none'}`,
              `review-evidence: ${process.env.REVIEW_EVIDENCE}`,
              `request-actor: ${process.env.ACTOR}`,
              `triggering-actor: ${process.env.TRIGGERING_ACTOR}`,
              `approval-issued-at: ${process.env.ISSUED_AT}`,
              `approval-expires-at: ${process.env.EXPIRES_AT}`,
              `published-host-smoke: ${runUrl}`,
              `publisher-proof: hmac-sha256:${publisherProof}`,
            ];
            const releaseName = `Save Toolkit v${version}`;
            const body = `${packet.release_notes.trim()}\n\n### Promotion evidence\n\n${metadata.map((line) => `- ${line}`).join('\n')}\n`;
            const sameRelease = (release) =>
              release.tag_name === tag &&
              release.name === releaseName &&
              (release.body || '') === body &&
              release.draft === false &&
              release.prerelease === false;
            const exactRelease = (release) => sameRelease(release) && release.immutable === true;
            const readRelease = async () => {
              try {
                return (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            };
            const readReleaseSettled = async ({ retryAbsent = false } = {}) => {
              let observed = null;
              for (let attempt = 0; attempt < 6; attempt += 1) {
                observed = await readRelease();
                if (observed && (!sameRelease(observed) || observed.immutable === true)) return observed;
                if (!observed && !retryAbsent) return null;
                if (attempt < 5) await new Promise((resolve) => setTimeout(resolve, 2000));
              }
              return observed;
            };

            const existing = await readReleaseSettled();
            if (existing) {
              if (!sameRelease(existing)) fail('existing GitHub Release belongs to another request');
              if (!exactRelease(existing)) {
                fail('UNKNOWN_OUTCOME: exact release remained non-immutable after bounded reconciliation');
              }
              core.notice(`reconciled exact release ${tag} without another write`);
              return;
            }
            if (process.env.RUN_ATTEMPT !== '1') {
              fail('UNKNOWN_OUTCOME: a rerun may reconcile an exact release but cannot issue a new release write');
            }
            const expiry = Date.parse(process.env.EXPIRES_AT);
            if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$/.test(process.env.ISSUED_AT || '') || !/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$/.test(process.env.EXPIRES_AT || '')) {
              fail('issued_at and expires_at must be exact whole-second RFC3339 UTC timestamps');
            }
            if (!Number.isFinite(expiry) || Date.now() >= expiry) fail('release approval expired before finalization');

            const immutable = await github.request('GET /repos/{owner}/{repo}/immutable-releases', {
              owner, repo, headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            if (immutable.data.enabled !== true) fail('immutable releases are not enabled');
            const environment = await github.request('GET /repos/{owner}/{repo}/environments/{environment_name}', {
              owner, repo, environment_name: process.env.EXPECTED_ENVIRONMENT,
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            const reviewerRule = (environment.data.protection_rules || []).find((rule) => rule.type === 'required_reviewers');
            const reviewerNames = (reviewerRule?.reviewers || []).map((item) => item.reviewer?.login || item.reviewer?.slug);
            if (!process.env.EXPECTED_REVIEWER || process.env.EXPECTED_REVIEWER === process.env.EXPECTED_REQUEST_ACTOR || reviewerNames.length !== 1 || reviewerNames[0] !== process.env.EXPECTED_REVIEWER || reviewerRule?.prevent_self_review !== true) {
              fail('release environment no longer has a distinct configured reviewer');
            }
            if ('can_admins_bypass' in environment.data && environment.data.can_admins_bypass !== false) fail('release environment permits administrator bypass');
            const branchPolicy = environment.data.deployment_branch_policy || {};
            if (branchPolicy.protected_branches !== true || branchPolicy.custom_branch_policies !== false) fail('release environment is not limited to protected branches');
            if (!/^[1-9][0-9]*$/.test(process.env.RULESET_ID || '')) fail('RELEASE_TAG_RULESET_ID is missing');
            const ruleset = await github.request('GET /repos/{owner}/{repo}/rulesets/{ruleset_id}', {
              owner, repo, ruleset_id: Number(process.env.RULESET_ID),
              headers: { 'X-GitHub-Api-Version': '2026-03-10' },
            });
            const ruleTypes = new Set((ruleset.data.rules || []).map((rule) => rule.type));
            const requiredRules = ['creation', 'update', 'deletion', 'non_fast_forward'];
            const includes = ruleset.data.conditions?.ref_name?.include || [];
            const excludes = ruleset.data.conditions?.ref_name?.exclude || [];
            const bypassActors = Array.isArray(ruleset.data.bypass_actors) ? ruleset.data.bypass_actors : null;
            if (bypassActors !== null) {
              if (bypassActors.length !== 1) fail('release tag ruleset must have exactly one bypass actor');
              const appBypass = bypassActors[0].actor_type === 'Integration' && String(bypassActors[0].actor_id) === String(process.env.APP_ID) && bypassActors[0].bypass_mode === 'always';
              if (!appBypass) fail('release App is not the sole always-on ruleset bypass');
            } else {
              core.warning('ruleset bypass actors are hidden from this least-privileged token; the protected approval packet must carry current owner evidence');
            }
            const requiredIncludes = ['refs/tags/save-toolkit--v*', 'refs/tags/save-toolkit--attempt-v*'];
            if (ruleset.data.target !== 'tag' || ruleset.data.enforcement !== 'active' || includes.length !== requiredIncludes.length || !requiredIncludes.every((pattern) => includes.includes(pattern)) || excludes.length !== 0 || !requiredRules.every((rule) => ruleTypes.has(rule))) {
              fail('release tag ruleset is no longer complete for the release namespace');
            }
            const installation = await github.request('GET /installation');
            const permissions = installation.data.permissions || {};
            const allowedPermissions = new Set(['actions', 'administration', 'contents', 'metadata']);
            const unexpected = Object.keys(permissions).filter((name) => !allowedPermissions.has(name));
            if (permissions.actions !== 'read' || permissions.administration !== 'read' || permissions.contents !== 'write' || unexpected.length) {
              fail(`promotion App permissions are missing or overbroad: ${JSON.stringify(permissions)}`);
            }

            let writeError = null;
            try {
              await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: candidate,
                name: releaseName, body, draft: false, prerelease: false,
              });
            } catch (error) {
              writeError = error;
            }
            let reconciled;
            try {
              reconciled = await readReleaseSettled({ retryAbsent: true });
            } catch (readError) {
              fail(`UNKNOWN_OUTCOME: release publication could not be read after the write attempt; do not retry automatically: ${readError.message}`);
            }
            if (!reconciled) {
              fail(`UNKNOWN_OUTCOME: release write outcome remained absent after bounded reconciliation${writeError ? `: ${writeError.message}` : ''}`);
            }
            if (!sameRelease(reconciled)) fail('existing GitHub Release conflicts with this request');
            if (!exactRelease(reconciled)) {
              fail('UNKNOWN_OUTCOME: exact release remained non-immutable after bounded reconciliation');
            }
            if (writeError) {
              core.warning(`release API returned an error but exact immutable remote state reconciled: ${writeError.message}`);
            }

  verify_release:
    needs: finalize_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify immutable release and exact tag target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: save-toolkit--v${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          gh --version
          gh release verify "$RELEASE_TAG" --repo "$REPOSITORY" --format json > "$RUNNER_TEMP/release-verify.json"
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$CANDIDATE_SHA"
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq .immutable)" = "true"

      - name: Retain immutable-release verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: immutable-release-verification-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-verify.json
          if-no-files-found: error
          retention-days: 30
