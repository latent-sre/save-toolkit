name: Validate fleet

# The repo once documented its fleet validator as a "CI gate" while no CI existed -- the check only
# ran when someone remembered to run it, which is the same silent-failure mode a gate exists to catch.
# This is that gate.

on:
  pull_request:
  push:
    branches:
      - main
  # A push/PR-only gate is invisible when it is switched off: it does not fail, it simply stops
  # running. This workflow was disabled by hand on 2026-08-02 and six PRs merged unverified before
  # anyone noticed. Manual dispatch makes "is the gate alive?" a ten-second question.
  workflow_dispatch:
  # Weekly floor so the whole gate runs even in a week with no pushes.
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Gate A owns the live-tree structural roster. Component tests and eval dependencies stay
      # with the implementation that changed them.
      - name: Gate A -- mechanical audit
        run: python scripts/gate_a.py

  validate-windows:
    # Keep native Windows path and generated-byte validation. Invoke `python`, never the Store-stub
    # `python3`.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Gate A -- mechanical audit
        run: python scripts/gate_a.py

  component-tests:
    # Gate A is deliberately structural and does not run test_*.py, on the reasoning that component
    # tests belong with the implementation that changed them. That holds for authoring, but it left
    # CI running no test file at all -- and three were failing on main with nobody notified. This is
    # that gate.
    #
    # Cost, measured 2026-08-26: 30 tests in ~48 s wall, sequential. Three files dominate
    # (evals/test_run_evals.py ~15 s, scripts/test_mutation_guard.py ~13 s,
    # scripts/test_readonly_guard.py ~8 s), so parallelising would buy little and would make a
    # failure harder to attribute. The pip install adds a few seconds.
    #
    # Limitation, stated rather than discovered later: this runs on ubuntu only. Windows behaviour
    # of these tests is unverified in CI; validate-windows still covers the structural gate there.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # PyYAML is required, not optional: evals/test_graders.py is layered, and without the
      # dependency its layer-2 scenario checks SKIP while the run still reports green. Running
      # these tests without it is worse than not running them.
      - name: Install pinned dev dependencies
        run: python -m pip install -r requirements-dev.txt

      # Run the runner's own behavioural tests DIRECTLY first. Invoked through the runner they
      # see COMPONENT_TEST_CHILD=1 and skip their recursion-unsafe cases, so the runner would be
      # the only thing in CI whose guard never actually fires -- the exact defect class this job
      # exists to catch.
      - name: Component-test runner self-tests
        run: python scripts/test_run_component_tests.py

      - name: Component tests
        run: python scripts/run_component_tests.py

  claude-plugin-contract:
    # The repository validator enforces fleet-specific authority and projection rules. Claude's
    # own strict validator independently checks manifest, component discovery, frontmatter, and
    # hook schema. It is local/offline and needs no API key.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pin the CLI so an upstream release cannot change the contract in the middle of a PR.
      # Bump this together with an explicit plugin probe and recorded migration evidence.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.219

      - name: Validate plugin manifest, frontmatter, and hooks
        run: claude plugin validate . --strict
