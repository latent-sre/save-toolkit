name: Validate fleet

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Required status checks are configured in the repository ruleset.
permissions:
  contents: read

jobs:
  component-tests:
    # The required check. It proves what the plugin ships: Gate A's grant, delegation, wiring and
    # adapter contracts; the guard, hooks and bundled skill scripts on the Python floor; and the
    # host's own plugin validator. Eval-harness tests run before a campaign, not here.
    name: component-tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the locked test environment
        run: |
          uv sync --locked
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never

      - name: Gate A
        run: python scripts/gate_a.py

      - name: Shipped-code tests
        run: python -m pytest -q scripts -n 4 --dist worksteal --durations=10 -p xdist -p hypothesispytest -p pytest_timeout -p pytest_socket
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

      # Track upstream compatibility; the resolved version stays in every run's log.
      - name: Install the Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      # Root CLAUDE.md serves repository authors, not installed plugin context, so its warning stays.
      - name: Validate plugin manifest, frontmatter, and hooks
        run: claude plugin validate .claude-plugin/plugin.json
