name: Validate fleet

# The repo once documented its fleet validator as a "CI gate" while no CI existed -- the check only
# ran when someone remembered to run it, which is the same silent-failure mode a gate exists to catch.
# This is that gate.

on:
  pull_request:
  push:
    branches:
      - main
  # A push/PR-only gate is invisible when it is switched off: it does not fail, it simply stops
  # running. This workflow was disabled by hand on 2026-08-02 and six PRs merged unverified before
  # anyone noticed. Manual dispatch makes "is the gate alive?" a ten-second question.
  workflow_dispatch:
  # Weekly floor so the whole gate runs even in a week with no pushes.
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC

permissions:
  contents: read

jobs:
  validate:
    # The matrix is not ceremony. scripts/readonly-guard-hook.sh exists *because* the guard's earlier
    # inline form SILENTLY DISABLED ITSELF on Windows: `command -v python3` resolved to the Microsoft
    # Store stub, which is not an interpreter, so the hook ran nothing and every Bash call sailed
    # through unguarded. A Linux-only CI would never have seen it. That incident is now reproduced
    # directly by scripts/test_hook_wiring.py (a stub `python3` first on PATH), which runs on every
    # OS here. Windows itself runs in the `validate-windows` job below on every pull request -- as
    # a separate job so its ~44 s does not hold this fail-fast matrix, not as a skipped one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            py: python3
          - os: macos-latest
            py: python3
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # PyYAML: the graders' layer-2 scenario tests load scenario files, and they FAIL (not skip)
      # without it. Gate A preflights this and refuses to run rather than half-running, but CI should
      # simply have the deps -- and PINNED, which is the point of the requirements file.
      - name: Install eval-harness deps
        run: ${{ matrix.py }} -m pip install -r requirements-dev.txt

      # ONE STEP, ONE SOURCE OF TRUTH. Gate A (scripts/gate_a.py) is the mechanical audit: fleet
      # structure, the validator's own tests, the read-only guard's allow/deny corpus, the eval
      # graders, and the eval suite's parse check. It is what CI runs and what the spec's run
      # protocol (Section 0) tells a human or agent to run locally -- the same command, so the two
      # cannot drift.
      #
      # This used to be six transcribed steps here and a SECOND transcription in the spec. They had
      # already disagreed (the spec's copy dropped the install step above, so a cold checkout died on
      # ModuleNotFoundError). The repo's own anti-rot doctrine says never transcribe an artifact that
      # lives in the repo -- point at it. This points at it.
      #
      # Gate A also fixes the interpreter war by not having an opinion: it re-invokes its sub-steps
      # under sys.executable, so `python` (Windows), `python3` (Linux/macOS), and `py -3` all do the
      # right thing. `python3` on Windows is the Microsoft Store stub -- not an interpreter -- which
      # is how the guard's earlier inline form SILENTLY DISABLED ITSELF, running nothing while every
      # Bash call sailed through unguarded. A Linux-only CI would never have seen it. Hence the matrix.
      - name: Gate A -- mechanical audit
        run: ${{ matrix.py }} scripts/gate_a.py

  validate-windows:
    # Same gate, Windows host, on every pull request. Its own job rather than a matrix entry so its
    # ~44 s does not hold the Linux/macOS fail-fast matrix, but never skipped: the guard, the gate
    # lock, the adapters, and the host-install probes all have Windows-only behavior that the other
    # two OSes cannot exercise, and `Protect main` has no required status check, so post-merge
    # detection is too late. `python`, never `python3`: on this runner `python3` is the Store stub.
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install eval-harness deps
        run: python -m pip install -r requirements-dev.txt

      - name: Gate A -- mechanical audit
        run: python scripts/gate_a.py

  claude-plugin-contract:
    # The repository validator enforces fleet-specific authority and projection rules. Claude's
    # own strict validator independently checks manifest, component discovery, frontmatter, and
    # hook schema. It is local/offline and needs no API key.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pin the CLI so an upstream release cannot change the contract in the middle of a PR.
      # Bump this together with an explicit plugin probe and recorded migration evidence.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.219

      - name: Validate plugin manifest, frontmatter, and hooks
        run: claude plugin validate . --strict
