name: Validate fleet

# The repo once documented its fleet validator as a "CI gate" while no CI existed -- the check only
# ran when someone remembered to run it, which is the same silent-failure mode a gate exists to catch.
# This is that gate.

on:
  pull_request:
  push:
    branches:
      - main
  # A push/PR-only gate is invisible when it is switched off: it does not fail, it simply stops
  # running. This workflow was disabled by hand on 2026-08-02 and six PRs merged unverified before
  # anyone noticed. Manual dispatch makes "is the gate alive?" a ten-second question.
  workflow_dispatch:
  # Weekly floor so the whole gate runs even in a week with no pushes.
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC

# Whether these checks BLOCK a merge is a property of the branch ruleset, not of this file. As of
# 2026-08-26 `Protect main` carries no required_status_checks rule, so every job here is advisory:
# a red run does not stop a merge. Do not trust that sentence — it is the kind of fact that drifts.
# Check it: gh api repos/latent-sre/save-toolkit/rulesets --jq '.[].name'
#           gh api repos/latent-sre/save-toolkit/rulesets/<id> --jq '.rules[].type'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # Gate A owns the live-tree structural roster (check_links + validate_fleet +
      # check_context_cost). It runs no test_*.py; component-tests does, on both operating systems.
      - name: Gate A -- mechanical audit
        run: python scripts/gate_a.py

  component-tests:
    # Gate A is deliberately structural and does not run test_*.py, on the reasoning that component
    # tests belong with the implementation that changed them. That holds for authoring, but it left
    # CI running no test file at all -- and three were failing on main with nobody notified. This is
    # that gate.
    #
    # Windows moved HERE from a separate `validate-windows` job on 2026-09-03. That job ran
    # `gate_a.py` and nothing else, and `gate_a.py` runs no test file -- so it could not exercise
    # the guard, the gate lock, the adapters, or the host-install probes its own justification
    # cited. The one Windows-only defect this repository has had (8.3 short paths defeating the
    # link-containment check, fixed by resolving the root in scripts/check_links.py) was caught by
    # test FIXTURES under an OS matrix. Across the last 200 CI runs, validate-windows never failed
    # without the Linux Gate A failing too, while component-tests failed alone twelve times.
    # Windows coverage therefore belongs where the tests are.
    #
    # Cost, measured 2026-09-03: the whole workflow ran 32-52 s wall; component-tests was 30-45 s
    # of it on ubuntu. Windows Gate A had been 13-15 s. Invoke `python`, never the Store-stub
    # `python3`, so Windows resolves the real interpreter.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # PyYAML is required, not optional: evals/test_graders.py is layered, and without the
      # dependency its layer-2 scenario checks SKIP while the run still reports green. Running
      # these tests without it is worse than not running them. pytest itself is pinned here too.
      - name: Install pinned dev dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Component tests
        run: python -m pytest -q

  claude-plugin-contract:
    # The repository validator enforces fleet-specific authority and projection rules. Claude's
    # own strict validator independently checks manifest, component discovery, frontmatter, and
    # hook schema. It is local/offline and needs no API key.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Pin the CLI so an upstream release cannot change the contract in the middle of a PR.
      # Bump this together with an explicit plugin probe and recorded migration evidence.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.219

      - name: Validate plugin manifest, frontmatter, and hooks
        run: claude plugin validate . --strict
