name: Validate fleet

on:
  pull_request:
  push:
    branches:
      - main
  # Manual and weekly runs keep validation available without a new pull request.
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC

# Required status checks are configured in the repository ruleset.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: true

      # gate_a.py owns the structural roster; component suites run in the matrix below.
      # No gate-path script imports a third-party package, so this job installs nothing;
      # test_validate_workflow.py fails once one does (see docs/decisions/2026-08-23).
      - name: Gate A -- mechanical audit
        run: python scripts/gate_a.py

  changes:
    # A pull request confined to documentation or agent and skill prose cannot change the outcome
    # of the eval-machinery tests, so eval-tests runs only when a trigger path changed
    # (scripts/eval_tests_needed.py). Every other event runs everything.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eval: ${{ steps.filter.outputs.eval }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Decide whether the eval-machinery tests must run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "eval=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | tee changed-paths.txt
          echo "eval=$(python scripts/eval_tests_needed.py < changed-paths.txt)" >> "$GITHUB_OUTPUT"

  fast-tests:
    # The default pytest run: everything except the heavy eval-machinery files. The last matrix
    # selection is the complement of the others, so every test runs in exactly one shard.
    name: fast-tests (${{ matrix.group }}, ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: scripts
            selection: scripts
          - group: other
            selection: not (scripts)
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          check-latest: true
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-dev.txt
            requirements-grafana.txt

      # Install the constrained test set so dependency-backed checks do not silently skip.
      - name: Install pinned fleet test dependencies
        run: python -m pip install -r requirements-test.txt

      # Four workers match the hosted runner's cores; worksteal balances slow individual cases.
      # CLI options stay with the outer run; PYTEST_ADDOPTS would spawn workers in fixture suites.
      # Load only the outer run's plugins; nested suites opt into plugins they actually require.
      # No bytecode: the eval runner digests every file under skills/, so a .pyc written by
      # one worker reads as plugin drift to a native trial running in another. The default run
      # skips the heavy eval-machinery files (conftest.py HEAVY); the eval-tests job runs them.
      - name: Fast tests
        run: python -m pytest -q -k "${{ matrix.selection }}" -n 4 --dist worksteal --durations=20 -p xdist -p hypothesispytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'

      # pyproject.toml scopes these to the eval runner; they run even when a test failed.
      - name: Lint, format and type-check the eval runner
        if: ${{ !cancelled() }}
        run: |
          python -m ruff check
          python -m ruff check --isolated --select E9,F63,F7,F82 evals/judge.py evals/clean_room.py evals/oracles
          python -m ruff format --check
          python -m mypy
        env:
          PYTHONDONTWRITEBYTECODE: '1'

  eval-tests:
    # Webhook observation windows and the Python-craft oracles each take a shard; the last
    # selection is the complement of the others, so every heavy test runs in exactly one shard.
    # Skipped on a pull request that touched no trigger path (see the changes job).
    name: eval-tests (${{ matrix.group }}, ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.eval == 'true' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: webhook
            selection: pager_webhook
          - group: python
            selection: python_craft_oracle or python_new_code_probe or python_package_refactor or python_library_selection_oracle or python_index_probe
          - group: other
            selection: not (pager_webhook or python_craft_oracle or python_new_code_probe or python_package_refactor or python_library_selection_oracle or python_index_probe)
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          check-latest: true
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements-dev.txt
            requirements-grafana.txt

      - name: Install pinned fleet test dependencies
        run: python -m pip install -r requirements-test.txt

      # Early collection excludes fast files; worker options stay out of nested pytest environments.
      - name: Eval machinery tests
        run: python -m pytest -q -m heavy -k "${{ matrix.selection }}" -n 4 --dist worksteal --durations=20 -p xdist -p hypothesispytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'

  component-tests:
    # The required check: it passes only when fast tests passed and every eval matrix entry either
    # passed or was skipped because the changes job found no trigger path. A job whose needs failed
    # is skipped, and a skipped required check counts as passing, so this one always runs and checks.
    name: component-tests (ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [changes, fast-tests, eval-tests]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Both test shards passed, or the eval shard was skipped for a non-trigger change
        run: |
          test "${{ needs.fast-tests.result }}" = success
          case "${{ needs.eval-tests.result }}" in
            success) ;;
            skipped) test "${{ needs.changes.outputs.eval }}" = false ;;
            *) exit 1 ;;
          esac

  claude-plugin-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Track upstream compatibility; retain the resolved version in every run's log.
      - name: Install the Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      # Root CLAUDE.md serves repository authors, not installed plugin context.
      # Display plugin warnings; validation errors still fail this job.
      - name: Validate plugin manifest, frontmatter, and hooks
        run: claude plugin validate .claude-plugin/plugin.json
