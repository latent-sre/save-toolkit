name: Validate fleet

on:
  pull_request:
  push:
    branches:
      - main
  # The weekly run also audits the locked dependency sets (dependency-audit below).
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'  # Mondays 14:00 UTC

# Required status checks are configured in the repository ruleset.
permissions:
  contents: read

jobs:
  component-tests:
    # The required check. It proves what the plugin ships: Gate A's grant, delegation, wiring and
    # adapter contracts; the guard, hooks and bundled skill scripts on the Python floor; and the
    # host's own plugin validator. Eval-harness tests run before a campaign, not here.
    name: component-tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install the locked test environment
        run: |
          uv sync --locked
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
          UV_PYTHON_DOWNLOADS: never

      - name: Gate A
        run: python scripts/gate_a.py

      - name: Shipped-code tests
        run: python -m pytest -q scripts -n 4 --dist worksteal --durations=10 -p xdist -p hypothesispytest -p pytest_timeout -p pytest_socket
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

      # Track upstream compatibility; the resolved version stays in every run's log.
      - name: Install the Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version

      - name: Validate marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      # Root CLAUDE.md serves repository authors, not installed plugin context, so its warning stays.
      - name: Validate plugin manifest, frontmatter, and hooks
        run: claude plugin validate .claude-plugin/plugin.json

  dependency-audit:
    # Known-advisory scan of the locked dependency sets, on the weekly run and on demand. Advisory
    # databases change without a commit, so this job is not part of the required check.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      # harbor and swt are conflicting groups, so each is exported and audited on its own
      # (pip-audit refuses one package at two versions in a single call); the project export carries
      # the default test group plus swebench. --no-deps audits exactly the locked versions and
      # resolves nothing. Every set is audited before the step fails.
      - name: Audit the locked dependency sets
        run: |
          status=0
          uv export --locked --no-emit-project --no-hashes --format requirements.txt --group swebench > project.txt
          uv export --locked --no-emit-project --no-hashes --format requirements.txt --only-group harbor > harbor.txt
          uv export --locked --no-emit-project --no-hashes --format requirements.txt --only-group swt > swt.txt
          for group in project harbor swt; do
            echo "::group::$group"
            uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip --progress-spinner off -r "$group.txt" || status=1
            echo "::endgroup::"
          done
          exit "$status"
