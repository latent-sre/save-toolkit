name: Brokered Codex Sol conformance

# This workflow is the only supported live path for the Codex conformance runners. Dispatch it from
# trusted main against an immutable canary ref. The API key is consumed by the pinned OpenAI action
# before candidate code is checked out; that action starts a tokenless loopback proxy and removes
# sudo. Candidate code and model-controlled commands never receive the key.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to evaluate
        required: true
        type: string
      canary_ref:
        description: Immutable canary/<phase>/<candidate_sha> branch holding that commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-sol-conformance-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      tree_sha: ${{ steps.bind.outputs.tree_sha }}
      workflow_blob_sha: ${{ steps.bind.outputs.workflow_blob_sha }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: trusted-main
          persist-credentials: false

      - name: Check out candidate without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Bind trusted workflow, candidate, and canary ref
        id: bind
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANARY_REF: ${{ inputs.canary_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ ! "${CANARY_REF}" =~ ^canary/[a-z0-9][a-z0-9._-]*/[0-9a-f]{40}$ ]]; then
            echo "canary_ref must be canary/<phase>/<full-sha>." >&2
            exit 1
          fi
          if [[ "${CANARY_REF##*/}" != "${CANDIDATE_SHA}" ]]; then
            echo "canary_ref must end with candidate_sha." >&2
            exit 1
          fi
          if [[ "$(git -C candidate rev-parse HEAD)" != "${CANDIDATE_SHA}" ]]; then
            echo "Candidate checkout did not resolve to candidate_sha." >&2
            exit 1
          fi
          REMOTE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANARY_REF}" --jq .object.sha)"
          if [[ "${REMOTE_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "Remote immutable canary ref does not equal candidate_sha." >&2
            exit 1
          fi
          echo "tree_sha=$(git -C candidate rev-parse 'HEAD^{tree}')" >> "${GITHUB_OUTPUT}"
          echo "workflow_blob_sha=$(git -C trusted-main hash-object .github/workflows/codex-sol-conformance.yml)" >> "${GITHUB_OUTPUT}"

  conformance:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      skill_report_sha256: ${{ steps.run.outputs.skill_report_sha256 }}
      agent_report_sha256: ${{ steps.run.outputs.agent_report_sha256 }}
    steps:
      # Source reviewed at openai/codex-action commit dd78cb653811af44014baa08fe954e28d32c1bf9.
      # No prompt is supplied: this invocation only starts the Responses API proxy, writes its
      # credential-free provider config, removes sudo, and verifies that sudo no longer works.
      - name: Establish credential broker and drop sudo
        uses: openai/codex-action@dd78cb653811af44014baa08fe954e28d32c1bf9
        with:
          openai-api-key: ${{ secrets.CODEX_CONFORMANCE_OPENAI_API_KEY }}
          codex-version: 0.145.0
          codex-home: ${{ runner.temp }}/sre-agents-broker-home
          safety-strategy: drop-sudo

      - name: Check out candidate after the credential boundary exists
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false

      - name: Recheck candidate and immutable canary before model execution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANARY_REF: ${{ inputs.canary_ref }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${CANDIDATE_SHA}" ]]; then
            echo "Candidate checkout changed after preflight." >&2
            exit 1
          fi
          REMOTE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANARY_REF}" --jq .object.sha)"
          if [[ "${REMOTE_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "Canary ref moved or disappeared before conformance." >&2
            exit 1
          fi

      # Keep this last. The runners reduce model output to hashes, and no later step in this job
      # receives a GitHub token or other secret after model-controlled processes have existed.
      - name: Run pinned Sol skill and agent conformance
        id: run
        shell: bash
        env:
          CODEX_HOME: ${{ runner.temp }}/sre-agents-broker-home
        run: |
          set +e
          python3 -X utf8 evals/run_codex_conformance.py \
            --run \
            --broker-config "${CODEX_HOME}/config.toml" \
            --output "${RUNNER_TEMP}/codex-sol-skills.json"
          SKILL_STATUS=$?
          python3 -X utf8 evals/run_codex_agent_conformance.py \
            --run \
            --broker-config "${CODEX_HOME}/config.toml" \
            --output "${RUNNER_TEMP}/codex-sol-agents.json"
          AGENT_STATUS=$?
          set -e

          if [[ ! -s "${RUNNER_TEMP}/codex-sol-skills.json" || ! -s "${RUNNER_TEMP}/codex-sol-agents.json" ]]; then
            echo "A sanitized conformance report was not produced." >&2
            exit 2
          fi
          echo "skill_report_sha256=$(sha256sum "${RUNNER_TEMP}/codex-sol-skills.json" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
          echo "agent_report_sha256=$(sha256sum "${RUNNER_TEMP}/codex-sol-agents.json" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"
          if [[ ${SKILL_STATUS} -ne 0 || ${AGENT_STATUS} -ne 0 ]]; then
            echo "Required Sol conformance lanes did not all pass." >&2
            exit 1
          fi

  evidence:
    needs: [preflight, conformance]
    runs-on: ubuntu-latest
    steps:
      - name: Recheck immutable canary ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANARY_REF: ${{ inputs.canary_ref }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANARY_REF}" --jq .object.sha)"
          if [[ "${REMOTE_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "Canary ref moved or disappeared during conformance." >&2
            exit 1
          fi

      - name: Write trusted brokered-run attestation
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_BLOB_SHA: ${{ needs.preflight.outputs.workflow_blob_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANARY_REF: ${{ inputs.canary_ref }}
          TREE_SHA: ${{ needs.preflight.outputs.tree_sha }}
          SKILL_REPORT_SHA256: ${{ needs.conformance.outputs.skill_report_sha256 }}
          AGENT_REPORT_SHA256: ${{ needs.conformance.outputs.agent_report_sha256 }}
        run: |
          python3 - <<'PY'
          import datetime
          import json
          import os

          evidence = {
              "schema_version": 1,
              "repository": os.environ["REPOSITORY"],
              "workflow_path": ".github/workflows/codex-sol-conformance.yml",
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_blob_sha": os.environ["WORKFLOW_BLOB_SHA"],
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              "actor": os.environ["ACTOR"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "canary_ref": os.environ["CANARY_REF"],
              "tree_sha": os.environ["TREE_SHA"],
              "model": "gpt-5.6-sol",
              "codex_action_sha": "dd78cb653811af44014baa08fe954e28d32c1bf9",
              "skill_report_sha256": os.environ["SKILL_REPORT_SHA256"],
              "agent_report_sha256": os.environ["AGENT_REPORT_SHA256"],
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          with open("codex-sol-conformance-attestation.json", "w", encoding="utf-8", newline="\n") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Upload brokered-run attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-sol-conformance-${{ inputs.candidate_sha }}
          path: codex-sol-conformance-attestation.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
