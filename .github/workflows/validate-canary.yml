name: Validate immutable canary

# This workflow is intentionally manual and must be dispatched from protected main. The workflow
# definition is therefore trusted independently of the candidate it evaluates. Candidate code runs
# on ephemeral hosted runners with no secret, environment, OIDC, or repository-write authority.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character commit SHA to evaluate
        required: true
        type: string
      canary_ref:
        description: Immutable canary/<phase>/<candidate_sha> branch holding that commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-canary-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tree_sha: ${{ steps.bind.outputs.tree_sha }}
      workflow_blob_sha: ${{ steps.bind.outputs.workflow_blob_sha }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: trusted-main
          persist-credentials: false

      - name: Check out candidate without credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false

      - name: Bind trusted workflow, candidate, and canary ref
        id: bind
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANARY_REF: ${{ inputs.canary_ref }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Canary validation must be dispatched with ref=main." >&2
            exit 1
          fi
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          if [[ ! "${CANARY_REF}" =~ ^canary/[a-z0-9][a-z0-9._-]*/[0-9a-f]{40}$ ]]; then
            echo "canary_ref must be canary/<phase>/<full-sha>." >&2
            exit 1
          fi
          if [[ "${CANARY_REF##*/}" != "${CANDIDATE_SHA}" ]]; then
            echo "canary_ref must end with candidate_sha." >&2
            exit 1
          fi

          CHECKED_OUT_SHA="$(git -C candidate rev-parse HEAD)"
          if [[ "${CHECKED_OUT_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "Candidate checkout did not resolve to candidate_sha." >&2
            exit 1
          fi
          REMOTE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANARY_REF}" --jq .object.sha)"
          if [[ "${REMOTE_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "Remote immutable canary ref does not equal candidate_sha." >&2
            exit 1
          fi

          WORKFLOW_SHA="$(git -C trusted-main rev-parse HEAD)"
          if [[ "${WORKFLOW_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "Trusted checkout does not equal the dispatched main workflow SHA." >&2
            exit 1
          fi
          TREE_SHA="$(git -C candidate rev-parse 'HEAD^{tree}')"
          WORKFLOW_BLOB_SHA="$(git -C trusted-main hash-object .github/workflows/validate-canary.yml)"
          echo "tree_sha=${TREE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "workflow_blob_sha=${WORKFLOW_BLOB_SHA}" >> "${GITHUB_OUTPUT}"

  gate:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            py: python3
          - os: macos-latest
            py: python3
          - os: windows-latest
            py: python
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned development dependencies
        run: ${{ matrix.py }} -m pip install -r requirements-dev.txt

      - name: Gate A at exact candidate SHA
        run: ${{ matrix.py }} scripts/gate_a.py

  evidence:
    needs: [preflight, gate]
    if: ${{ always() && needs.preflight.result == 'success' && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Recheck immutable canary ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANARY_REF: ${{ inputs.canary_ref }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CANARY_REF}" --jq .object.sha)"
          if [[ "${REMOTE_SHA}" != "${CANDIDATE_SHA}" ]]; then
            echo "Canary ref moved or disappeared during validation." >&2
            exit 1
          fi

      - name: Write trusted evidence
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_BLOB_SHA: ${{ needs.preflight.outputs.workflow_blob_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANARY_REF: ${{ inputs.canary_ref }}
          TREE_SHA: ${{ needs.preflight.outputs.tree_sha }}
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os

          evidence = {
              "schema_version": 1,
              "repository": os.environ["REPOSITORY"],
              "workflow_path": ".github/workflows/validate-canary.yml",
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "workflow_blob_sha": os.environ["WORKFLOW_BLOB_SHA"],
              "workflow_run_id": int(os.environ["WORKFLOW_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              "actor": os.environ["ACTOR"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "canary_ref": os.environ["CANARY_REF"],
              "tree_sha": os.environ["TREE_SHA"],
              "gate_result": os.environ["GATE_RESULT"],
              "gate_matrix": ["ubuntu-latest", "macos-latest", "windows-latest"],
              "generated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          with open("canary-evidence.json", "w", encoding="utf-8", newline="\n") as handle:
              json.dump(evidence, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Upload immutable canary evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-evidence-${{ inputs.candidate_sha }}
          path: canary-evidence.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
