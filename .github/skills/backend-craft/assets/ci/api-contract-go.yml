# API contract gates for a Go/Huma service: copy to .github/workflows/api-contract.yml and adapt
# the paths. `go test` runs the document drift test, the house-rules test and Schemathesis; the
# last step fails the pull request on a breaking change to the committed openapi.json against the
# base branch. Load the ci-actions skill before changing anything beyond these steps.
name: api-contract

on:
  pull_request:

permissions:
  contents: read

env:
  SERVICE_DIR: . # Directory containing go.mod and openapi.json; may be nested.

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch's openapi.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.SERVICE_DIR }}/go.mod
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Schemathesis
        run: |
          uv tool install schemathesis==4.30.1
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Tests, document drift and Schemathesis
        working-directory: ${{ env.SERVICE_DIR }}
        run: go test ./...
      - name: Breaking changes against the base branch
        working-directory: ${{ env.SERVICE_DIR }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify "origin/${BASE_REF}^{commit}" >/dev/null
          document="$(git rev-parse --show-prefix)openapi.json"
          if git cat-file -e "origin/${BASE_REF}:${document}" 2>/dev/null; then
            git show "origin/${BASE_REF}:${document}" > "${RUNNER_TEMP}/base-openapi.json"
            go run github.com/oasdiff/oasdiff@v1.33.0 breaking --fail-on ERR --format githubactions \
              "${RUNNER_TEMP}/base-openapi.json" openapi.json
          else
            echo "No ${document} on ${BASE_REF}: the first contract has nothing to compare."
          fi
