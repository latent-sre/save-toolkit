# nginx/conf/includes/spa.conf — included inside `location /` by the staticfile buildpack
# (Staticfile: `location_include: includes/*.conf`). nginx adds headers per level, and a level
# with its own add_header lines inherits none, so every location below repeats the ones it needs.
# HSTS is not here: the buildpack's http_strict_transport_security options add it in the same
# `location /`, and a second add_header would send the header twice.
# script-src is 'self' only: a production Vite build emits no inline scripts; add one
# 'sha256-…' for the theme boot script if the app uses it, never 'unsafe-inline'.
# style-src carries 'unsafe-inline' because kits that build their styles at runtime (sonner's
# toaster, Mantine's provider, Emotion-based kits such as Material UI) insert <style> elements
# that a static server cannot nonce. Drop it when every kit in the app ships stylesheet files
# only (Tailwind-based kits do) and the served build shows no CSP violation in the console.

# The HTML shell: never cached, never framed, never sniffed.
add_header Cache-Control "no-cache" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Hashed build output: immutable when it exists, and a missing file is a 404, not the app. The
# cache header has no `always`, so a 404 for a chunk requested mid-rollout is not pinned for a
# year. `^~` keeps this prefix ahead of the regex location below.
location ^~ /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header X-Content-Type-Options "nosniff" always;
  try_files $uri =404;
}

# Runtime configuration, written by .profile at container start: always fresh.
location = /config.json {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  try_files $uri =404;
}

# Anything else that looks like a file is a file (favicons, fonts, manifests from public/): a
# typo or a stale deploy is a 404, never the app's HTML with a 200.
location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|txt|xml|webmanifest)$ {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  try_files $uri =404;
}
