id: discovery-principal-engineer-defers-design-review
max_turns: 20
split: regression
# The work is a design document, the design lane's own vocabulary, but the request is an
# independent merge judgment. The document is inline; the checkout holds the two consumers it names,
# so its compatibility claim can be checked: the fulfilment worker ignores an added field, while
# the nightly report builds a strict record from each payload. Without them every session searched,
# found nothing and answered inline (EVAL-016). With them the main session reviews the document
# itself, which the owner accepted on 2026-10-08: a review the main session keeps passes, as does
# one handed to reviewer; the design lane taking it fails. The fixture must not name the answer.
prompt: |
  A teammate wants to merge this design document as docs/design/order-events-v2.md. It is not in
  this checkout, so here it is in full:

  > # Order events v2
  > Add account_id to order events. Additive fields are backward compatible, so every consumer
  > keeps working. Consumers: the fulfilment worker and the nightly report. Rollout: ship the
  > producer change, then update consumers at their own pace. Recovery: revert the producer.

  Before it merges, I want an independent check: do its compatibility claims hold for the
  consumers it lists, and is anything missing? Give me findings with evidence and a merge verdict.
target: {kind: agent, name: principal-engineer}
routing:
  expect: not_fire
  expected_alternative: [main_session, {kind: agent, name: reviewer}]
tools: [Glob, Grep, Read, Skill, Task]
fixture:
  files:
    README.md: |
      # order-events

      The order events producer and its two consumers. Run the suite with
      `python -m unittest discover -s tests -t .`.
    events/__init__.py: ""
    events/producer.py: |
      """Builds the order event payload the producer publishes today."""


      def order_event(order_id: str, status: str, total: int) -> dict:
          return {"order_id": order_id, "status": status, "total": total}
    fulfilment/__init__.py: ""
    fulfilment/worker.py: |
      """The fulfilment worker: ships paid orders."""


      def handle(payload: dict) -> str:
          if payload["status"] != "paid":
              return "skip"
          return f"ship {payload['order_id']}"
    reports/__init__.py: ""
    reports/nightly.py: |
      """The nightly report: paid revenue across the day's order events."""

      from dataclasses import dataclass


      @dataclass(frozen=True)
      class OrderEvent:
          order_id: str
          status: str
          total: int


      def load(payloads: list[dict]) -> list[OrderEvent]:
          return [OrderEvent(**payload) for payload in payloads]


      def paid_revenue(payloads: list[dict]) -> int:
          return sum(event.total for event in load(payloads) if event.status == "paid")
    tests/__init__.py: ""
    tests/test_consumers.py: |
      import unittest

      from events.producer import order_event
      from fulfilment.worker import handle
      from reports.nightly import paid_revenue


      class ConsumerTests(unittest.TestCase):
          def test_worker_ships_paid_orders(self):
              self.assertEqual("ship o-1", handle(order_event("o-1", "paid", 300)))

          def test_report_sums_paid_revenue(self):
              events = [order_event("o-1", "paid", 300), order_event("o-2", "cancelled", 50)]
              self.assertEqual(300, paid_revenue(events))
success_criteria:
  - Keeps the independent merge judgment on a design document with the main session or reviewer; the design lane does not take it.
