id: service-lifecycle-resolver-integration-loading
max_turns: 12
split: regression
skill: service-lifecycle
tools:
- Skill
- Read
prompt: 'Review the optional resolver integration for a synthetic service-lifecycle consumer. This is
  design validation only, not a live assessment: do not run commands, obtain credentials or change records.
  The producer''s deployment projection is 31 days old; an older projection omits ownerRef and lifecycle;
  a failed resolve has an earlier cached success available. No operational receipts exist. Select one
  value per field and return only those fields:

  - consumer_contract: KEEP_V1ALPHA2_FORBIDDEN_AND_FRESHNESS | REMOVE_UNSUPPORTED_REQUIREMENTS

  - deployment_age_31: FAIL_FRESHNESS | ACCEPT_AS_CURRENT

  - missing_owner_lifecycle: REPORT_INCOMPATIBILITY | ASSUME_ACTIVE_AND_OWNED

  - failed_resolve: RETURN_FAILURE_AND_OWNER_ACTION | SILENTLY_USE_CACHED_SUCCESS

  - fixture_result: NON_OPERATIONAL_NO_ACTION_SELECTION | AUTHORIZES_LIVE_TRANSITION

  '
success_criteria:
- Returns the applicable decisions without inventing current evidence or live authority.
- Conditional reference loads are assessed separately from successful Read receipts; reference paths are
  not injected into the prompt.
graders:
- type: exact_fields
  fields:
    consumer_contract: KEEP_V1ALPHA2_FORBIDDEN_AND_FRESHNESS
    deployment_age_31: FAIL_FRESHNESS
    missing_owner_lifecycle: REPORT_INCOMPATIBILITY
    failed_resolve: RETURN_FAILURE_AND_OWNER_ACTION
    fixture_result: NON_OPERATIONAL_NO_ACTION_SELECTION
