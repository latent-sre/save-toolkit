id: discovery-active-alert-does-not-dispatch-assistant
split: calibration
# Agent-target routing probe: calibration-only evidence of model/host propensity (evals/README.md).
# The opener names no environment, window, or read, so a bounded dispatch cannot yet be assigned.
prompt: |
  I just got paged, something about checkout errors. I don't know what's failing or since when.
  What do I do?
success_criteria:
- Does not dispatch the sre-assistant agent while what is failing, where, and since when are unknown
- Loads the human-facing incident-investigation skill instead
target:
  kind: agent
  name: sre-assistant
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: incident-investigation
tools:
- Glob
- Grep
- Read
- Skill
- Task
