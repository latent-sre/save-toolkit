id: discovery-external-version-research
split: calibration
prompt: |
  Using current official documentation and upstream source, determine which public release first
  introduced the ExampleClient retry_budget option. Do not inspect any local repository.
success_criteria:
- Delegates the public version question to the external researcher lane
- Keeps official documentation and upstream implementation provenance separate
target:
  kind: agent
  name: researcher
routing:
  expect: fire
tools:
- Glob
- Grep
- Read
- Skill
- Task
