schema_version: 1
id: discovery-software-engineer-build-cli-with-tests
mode: discovery
split: calibration
target:
  kind: agent
  name: software-engineer
prompt: |
  Write a small Python CLI at scripts/wordfreq.py that prints the ten most common words in a text
  file, with pytest tests for the counting and for an empty file. Build it end to end in this repo
  and tell me what you ran to verify it. This is a code change, not a design question, not a
  review, and not an incident.
routing:
  expect: fire
success_criteria:
  - Delegates to the build lane rather than answering inline or routing to reviewer, sre, or scribe
  - Names the artifact and its tests in the response
  - States explicitly what was verified, or that nothing was — the disclosure AGENTS.md requires of every result
graders:
  # Discovery measures selection, not execution: the clean room denies Read/Write/Edit/Bash to the
  # main session AND to every subagent it dispatches, so a routed `software-engineer` can only report, never
  # build. Graders must be satisfiable by a tool-less, routed response; the routing grader carries
  # the delegation proof.
  #
  # The third grader is the fleet's evidence contract, not an execution demand. It was deleted on
  # 2026-08-22 as "unsatisfiable" and restored the same day after review: the then-current tool-less
  # build-lane agent CAN and MUST say that nothing was verified. Its vocabulary was then widened
  # once, against the nine real
  # Sonnet transcripts, every one of which is an honest refusal in a different phrasing ("no command
  # was run", "nothing was executed", "No Python or pytest command was run", "the build didn't
  # happen", "not performed"): 9/9 pass; a bare dispatch notice ("I've kicked off the software-engineer agent…
  # I'll report back") and an evidence-free success claim ("Built it. Everything looks good.") fail.
  # The harness grades the LAST root result event, so an intermediate progress note is not what is
  # scored — a red here is a result that genuinely omits the disclosure.
  - type: contains_any
    of: ["wordfreq", "word frequency", "most common"]
  - type: contains_any
    of: ["pytest", "test_", "tests"]
  - type: regex
    pattern: '\[verified\]|\[unverified\]|not verified|unverified|(?:could ?n.t|cannot|can.t|unable to|did not|didn.t|never|nothing (?:was |got )?|not (?:been )?)[^.\n]{0,40}?\b(?:verif|run\b|ran\b|built|creat|execut|tested|happen|produced|written|performed)|\bno\b[^.\n]{0,30}?\b(?:command|test|pytest|output|file|script)s?\b[^.\n]{0,25}?\b(?:run|ran|executed|produced|created|written|exists?|to show)|\bno (?:pytest|test) run\b'
