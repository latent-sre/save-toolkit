schema_version: 1
id: discovery-local-question-does-not-use-researcher
mode: discovery
split: calibration
target:
  kind: agent
  name: researcher
prompt: |
  Trace how our private current checkout turns BROKER_URL into client configuration, including the
  uncommitted changes, and cite the exact local files and lines. Do not use external sources.
routing:
  expect: not_fire
  expected_alternative:
    kind: agent
    name: repository-investigator
success_criteria:
  - Keeps the private checkout request out of the external researcher lane
  - Delegates to repository-investigator
graders:
  - type: contains_any
    of: ["repository-investigator", "local repository investigator"]
  - type: contains_any
    of: ["file:line", "local", "checkout"]
