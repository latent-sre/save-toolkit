schema_version: 1
id: discovery-incident-navigation-defers-alert-interpretation
mode: discovery
split: regression
target:
  kind: skill
  name: incident-navigation
prompt: |
  Review the supplied CheckoutErrorBudgetBurn definition and linked SLO. Use only the supplied
  evidence; do not search the repository or delegate evidence retrieval.

  Supplied definition:
  - SLI: successful checkout attempts divided by total checkout attempts.
  - Measured failed-request fraction: 0.0004 over the current evaluation period.
  - SLO-permitted failed-request fraction: 0.001 from the 99.9% availability objective.
  - Ratio definition: measured fraction divided by permitted fraction.
  - Fast pair: one-hour long window and five-minute short window, threshold 14.4.
  - Slow pair: six-hour long window and thirty-minute short window, threshold 6.
  - Paging rule: the matching long AND short windows must both exceed their threshold.
  - Owner: checkout on-call.
  - Notification route: PagerDuty checkout-primary.
  - Runbook: ops://checkout/error-budget-burn.

  The alert is not currently firing. Render the window rule as
  `1h AND 5m at 14.4x; 6h AND 30m at 6x`. Explain whether the windows page on user-impacting
  symptoms, whether the notification is actionable, and what should be tuned. Because delivery and
  runbook resolution are unverified, do not call the notification fully verified actionable. State
  that silence is not an all-clear or proof of remaining budget. Keep every threshold statement
  inside the boundary that changes are unsupported by this evidence, and name window-specific
  measurements, fire/resolve behavior, notification delivery, and runbook resolution as verification
  gaps. Return exactly the following thirteen non-empty plaintext field lines and no other prose;
  derive the first seven values from the supplied evidence and copy the final six values exactly:
  `Observed bad fraction: <measured fraction over the current evaluation period>`
  `Allowed bad fraction: <permitted fraction>`
  `Burn rate: <observed divided by allowed>`
  `Window rule: 1h AND 5m at 14.4x; 6h AND 30m at 6x`
  `Owner: checkout on-call`
  `Notification route: PagerDuty checkout-primary`
  `Runbook: ops://checkout/error-budget-burn`
  `Current verdict: not currently firing; paired-window measurements [unverified]`
  `Paging basis: user-facing checkout-success symptom; not an infrastructure cause`
  `Notification actionability: not verified; delivery and runbook resolution [unverified]`
  `Silence boundary: a silent alert is not an all-clear or proof of remaining budget`
  `Threshold boundary: no threshold change is supported by the supplied evidence`
  `Verification gaps: window-specific measurements; fire/resolve behavior; notification delivery; runbook resolution [unverified]`
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: obs-alerting
success_criteria:
  - Routes known steady-state alert interpretation to obs-alerting
  - Does not invoke incident orientation when the evidence source and question are already known
graders:
  - type: incident_navigation_known_alert_contract
    required_observed_fraction: "0.0004"
    required_allowed_fraction: "0.001"
    required_fast_long_window: 1h
    required_fast_short_window: 5m
    required_fast_threshold: "14.4"
    required_slow_long_window: 6h
    required_slow_short_window: 30m
    required_slow_threshold: "6"
    required_owner: checkout on-call
    required_notification_route: PagerDuty checkout-primary
    required_runbook: ops://checkout/error-budget-burn
    required_current_verdict: "not currently firing; paired-window measurements [unverified]"
    required_paging_basis: "user-facing checkout-success symptom; not an infrastructure cause"
    required_notification_actionability: "not verified; delivery and runbook resolution [unverified]"
    required_silence_boundary: "a silent alert is not an all-clear or proof of remaining budget"
    required_threshold_boundary: "no threshold change is supported by the supplied evidence"
    required_verification_gaps: "window-specific measurements; fire/resolve behavior; notification delivery; runbook resolution [unverified]"
