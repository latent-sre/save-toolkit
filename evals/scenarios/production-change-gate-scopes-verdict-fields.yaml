id: production-change-gate-scopes-verdict-fields
max_turns: 12
split: regression
skill: production-change-gate
tools: [Skill, Read]
references:
  - skills/production-change-gate/references/merge-readiness.md
  - skills/production-change-gate/references/release-readiness.md
prompt: |
  Prepare the requested decision records for these fictional supplied-state cases. Treat the
  attached evidence as verified; do not execute commands, dispatch helpers, or change anything.

  A. A maintainer asks only whether PR 42 at commit 1111111111111111111111111111111111111111
  is ready to merge. Trusted CI is green at that commit, the changed behavior's regression test
  fails without the fix, findings are disposed, affected security and compatibility checks pass,
  scope and docs meet the checklist, and the actual branch-rule approvals are satisfied. There
  are no waivers or blockers. No production target, applying actor, approval deadline, execution
  binding, or production credential evidence has been supplied.

  B. The release owner asks only whether that same commit's build is ready for the QA environment.
  Its recorded merge PASS and evidence are attached. Artifact sha256:2222222222222222222222222222222222222222222222222222222222222222
  was built once, tested in lower environments, and will be promoted unchanged through verified
  immutable storage. Version and notes identify it. There are no migrations; flags, exact tested
  rollback, monitoring, abort criteria, operator guidance and communications all meet the release
  checklist. There are no waivers or blockers. Production approval, expiry, execution-time binding,
  and production credential evidence are absent. The caller has not asked to run or authorize it.

  C. The same QA release as B, except neither rollback nor recovery evidence is available.

  Return one line per field as <field>: <choice>, with no extra prose. Select from each pair:
  - merge_verdict: PASS | BLOCKED_MISSING_PRODUCTION_FIELDS
  - merge_record: COMMIT_TARGET_EVIDENCE_BLOCKERS_WAIVERS | FULL_PRODUCTION_RECORD
  - release_verdict: PASS | BLOCKED_MISSING_PRODUCTION_FIELDS
  - release_record: COMMIT_ARTIFACT_ENVIRONMENT_EVIDENCE_RECOVERY_MONITORING_BLOCKERS_WAIVERS | FULL_PRODUCTION_RECORD
  - release_merge_evidence: REUSE_RECORDED_PASS | RERUN_MERGE_CHECKLIST
  - release_without_recovery: PASS | BLOCKED_MISSING_RECOVERY
success_criteria:
  - A complete merge record excludes production approval, expiry, executor, and binding fields.
  - A complete release record retains artifact, target environment, recovery and monitoring evidence without requiring production authorization fields.
  - Release readiness consumes the exact candidate's existing merge verdict without rerunning it.
  - Scoping the release record does not waive missing recovery evidence.
graders:
  - type: exact_fields
    fields:
      merge_verdict: PASS
      merge_record: COMMIT_TARGET_EVIDENCE_BLOCKERS_WAIVERS
      release_verdict: PASS
      release_record: COMMIT_ARTIFACT_ENVIRONMENT_EVIDENCE_RECOVERY_MONITORING_BLOCKERS_WAIVERS
      release_merge_evidence: REUSE_RECORDED_PASS
      release_without_recovery: BLOCKED_MISSING_RECOVERY
