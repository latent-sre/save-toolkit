schema_version: 1
id: discovery-akamai-edge-defers-obs-logs
mode: discovery
split: regression
target:
  kind: skill
  name: akamai-edge
prompt: |
  Write the Splunk query over our Akamai DataStream 2 records that trends cacheStatus and errorCode
  by five-minute bucket for the last hour. The edge-versus-origin leg is already known; this request
  is only for the backend log-query dialect.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: obs-logs
success_criteria:
  - Routes a DataStream backend query to the log-query lane
  - Does not reopen Akamai edge triage when the requested work is SPL construction
graders:
  - type: contains_any
    of: ["| stats", "| timechart", "| bin", "earliest=-1h"]
