schema_version: 1
id: agent-authoring-trigger-and-shape-contract
mode: direct
# Calibration until measured. GRADER-003 moved this contract here from
# discovery-agent-authoring-trigger-and-shape for the reason recorded in that scenario: activation
# and output shape are separate measurements, and proving a response separates them is a contract
# test, not a routing test.
# Measured 3/3 (skill fired 3/3) in batch 20260825T225402Z-8ff050e2, and deliberately NOT
# promoted on that alone. This branch measured discovery-agent-authoring-trigger-and-shape at
# 3/3 and then 1/3 with no change made to it, so one clean trial is a sample, not a property.
# A second batch (20260825T233556Z-5fb69d7b) then measured loop-contract 3/3 again and
# trigger-and-shape 2/3 -- it varied with no change made to it, which is why neither was
# promoted on the first. Promotion is not an eval outcome at all: AGENTS.md reserves it to
# human acceptance of the exact revision.
split: calibration
target:
  kind: skill
  name: agent-authoring
prompt: |
  A release-notes skill fires for unrelated documentation requests and returns prose instead of its
  required JSON. Design the bounded Loop Engineering fix: measure activation separately from output
  shape, reproduce both failures against a baseline before changing anything, allow exactly one
  candidate, reuse the same focused cases for both dimensions, and name the adoption condition and
  the stop conditions.
success_criteria:
  - Measures activation separately from output shape, against the same focused cases
  - Reproduces a baseline before changing anything and allows exactly one candidate
  - Names the adoption condition and the stop conditions without unbounded iteration
graders:
  - type: contains_any
    of: ["activation", "routing"]
  - type: regex
    pattern: '(?i)\boutput[\s\-_]?(?:shape|format|contract|schema|behaviou?r)\b|\bjson[\s\-_]?(?:shape|contract|schema)(?:\s+(?:compliance|assertions?))?\b|\brequired\s+json\s+schema\b'
  - type: regex
    pattern: '(?i)\b(?:separate|separately|independent|independently|distinct|apart|in isolation|decoupl)\w*\b'
  - type: contains_any
    of: ["baseline", "reproduce", "regression case", "focused case", "focused set", "test corpus", "fixed corpus"]
    # Regex, derived from batch 20260825T233556Z-5fb69d7b trial 1, which wrote "## Candidate -
    # exactly one", "No second candidate is authorized", and "**Single-candidate stop:**". The
    # behaviour was unmistakable; the word list missed it on reversed order and a hyphen. Fifteenth
    # traced red on this item, fifteenth with the behaviour present.
  - type: regex
    pattern: '(?i)\bone candidate\b|\bcandidate budget\b|\bsingle[-\s]candidate\b|\bcandidates?\b[^.\n]{0,24}\bexactly one\b|\bexactly one\b[^.\n]{0,24}\bcandidates?\b|\bno second candidate\b' 
  - type: regex
    pattern: '(?i)\b(?:human\s+acceptance|human\s+approves|human\s+promotion|adoption\s+(?:authority|condition|criteria|gate)|adopted\s+when|adopt\s+only\s+if)\b'
  - type: regex
    pattern: '(?i)\b(?:stop|halt|end|terminate)\w*\b[^.\n]{0,100}\b(?:when|if|after|on|budget(?:\s+is)?\s+exhausted|no[\s-]progress|safety|authority)\b|\b(?:budget(?:\s+is)?\s+exhausted|no[\s-]progress|safety|authority)\b[^.\n]{0,100}\b(?:stop|halt|end|terminate)\w*\b'
  # Echo-rejector, required by evals/README.md:231. Every grader above is satisfied by this
  # scenario's own prompt, so without this one a prompt echo scored PASS. The vocabulary is
  # anchored on "Binary pass/fail", which IS in the committed batch record
  # (docs/reviews/2026-08-25-grader-003-verification-batch.md). The other alternatives are
  # `[unverified]` -- plausible scoring vocabulary, not transcript-cited, because the transcripts
  # themselves are gone (EVIDENCE-001). Inflections are covered deliberately: an earlier draft used
  # \bscored?\b, which missed "scoring" -- the form evals/README.md itself uses.
  - type: regex
    pattern: '(?i)\bpass\s*(?:/|or)\s*fail\b|\bexact match\b|\bscor(?:e|es|ed|ing|er)\b|\bincumbent\b|\btrue positives?\b|\bprecision\b[^.\n]{0,40}\brecall\b|\bassertions?\b|\bvalid\s+required\s+json\b|\brequired\s+json\b[^.\n]{0,24}\bvalid\b'
  - type: not_contains
    of: ["unbounded iterations", "iterate until correct", "keep trying candidates"]
