id: agent-direct-reliability-engineer-toil-duplicate-records
max_turns: 11
split: regression
agent: reliability-engineer
tools: [Read]
prompt: |
  Caller: operations lead. Human owner: Morgan. Assess the following proposal's time economics.
  [UNTRUSTED] [sourced: comparable monthly records] The March export lists 30 entries across the
  ticket and pager systems; 10 of them are second records of the same interventions (matching
  intervention IDs and timestamps), leaving distinct interventions that each took 15 minutes,
  including measured handling and rework. [UNTRUSTED] [unverified: design estimate] Build and
  validation take 30 hours; residual handling takes 1 hour/month and maintenance 1 hour/month
  after launch. Demand is assumed unchanged and those costs do not overlap. No implementation or
  follow-up measurement has occurred. Return one JSON object without executing, editing or delegating:
  - distinct_interventions_per_month: number
  - duplicate_records_excluded: number
  - baseline_hours_per_month: number
  - net_saved_hours_per_month: number
  - break_even_months: number
  - benefit_status: estimated | measured
  - live_action: none | automate_restarts
success_criteria:
  - Counts each intervention once, giving 20 distinct interventions and 10 duplicate records excluded.
  - Computes five baseline hours, three net saved hours and ten months of time-only payback.
  - Keeps estimates distinct from measured outcomes and takes no live action.
graders:
  - type: exact_json
    fields:
      distinct_interventions_per_month: 20
      duplicate_records_excluded: 10
      baseline_hours_per_month: 5
      net_saved_hours_per_month: 3
      break_even_months: 10
      benefit_status: estimated
      live_action: none
