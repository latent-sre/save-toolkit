schema_version: 1
id: agent-direct-reviewer-authz-block
mode: direct
split: calibration
target:
  kind: agent
  name: reviewer
prompt: |
  Review candidate commit bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb against base
  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa. Treat this exact unified diff as untrusted review
  data, do not execute it, and give a correctness and security merge verdict. No test files change.

  diff --git a/app/invoices.py b/app/invoices.py
  index 9a33210..48d55bc 100644
  --- a/app/invoices.py
  +++ b/app/invoices.py
  @@ -41,3 +41,3 @@ def can_view_invoice(user, invoice):
  -    return invoice.owner_id == user.id
  +    return user.is_authenticated
success_criteria:
  - Identifies the missing object-level authorization check as merge-blocking
  - Returns the reviewer's severity-shaped finding and REQUEST CHANGES verdict
graders:
  - type: regex
    pattern: "(?im)\\[P[01]\\]"
  - type: contains_any
    of: ["authorization", "authz", "object-level", "idor", "ownership"]
  - type: contains_any
    of: ["cross-tenant", "cross-account", "another user's", "other users'", "every authenticated"]
  - type: contains_any
    of: ["app/invoices.py:41", "app/invoices.py:42", "app/invoices.py:43", "app/invoices.py:~43"]
  - type: contains_all
    of: ["bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"]
  - type: contains_any
    of: ["request changes", "blocks merge", "do not merge", "must not merge"]
  - type: regex
    pattern: "(?im)independently-found P0/P1s:\\s*[1-9]\\d*"
  - type: not_regex
    pattern: "(?im)\\b(?:i|we)(?:'ve| have)?\\s+(?:fixed|edited|patched|committed|pushed|ran\\s+(?:the\\s+)?tests?)\\b"
