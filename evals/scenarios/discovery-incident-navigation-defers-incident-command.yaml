schema_version: 1
id: discovery-incident-navigation-defers-incident-command
mode: discovery
split: regression
target:
  kind: skill
  name: incident-navigation
prompt: |
  Checkout is unavailable for most customers and the impact is growing across regions. Use only the
  supplied evidence; do not search the repository or delegate evidence retrieval.

  Supplied coordination record:
  - First detected and declaration/cadence anchor: 18:04 UTC.
  - Incident commander: Morgan Lee.
  - Communications lead: Avery Chen.
  - Investigation: checkout on-call; Ops: human release owner.
  - Runbook: ops://checkout/major-incident.
  - No mitigation has been approved or performed.

  Declare `Checkout unavailable` as the incident, set an initial severity and fifteen-minute update
  cadence, bind the supplied roles, and start the authoritative timeline. Use the canonical
  status-block labels and their documented order. Keep mitigation pending and explicitly state that
  none has been approved or performed. Use the supplied runbook as the current coordination focus.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: incident-command
success_criteria:
  - Routes major-incident declaration and coordination directly to incident command
  - Does not delay declaration with responder orientation
graders:
  - type: incident_navigation_incident_command_contract
    required_incident_title: Checkout unavailable
    required_detected_at: "18:04 UTC"
    required_investigation: checkout on-call
    required_ops: human release owner
    required_comms: Avery Chen
    required_ic: Morgan Lee
    required_runbook: ops://checkout/major-incident
    required_next_update: "18:19 UTC"
