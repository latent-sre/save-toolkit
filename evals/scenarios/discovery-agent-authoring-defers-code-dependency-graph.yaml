schema_version: 1
id: discovery-agent-authoring-defers-code-dependency-graph
mode: discovery
split: regression
target:
  kind: skill
  name: agent-authoring
prompt: |
  Map this repository's Python and TypeScript import dependency graph, identify cycles, and cite the
  files that create each edge. This is source-code structure only: do not design prompts, agents,
  delegation, an LLM workflow, or GraphRAG. For this routing check, return the inspection approach
  inline without delegating or running it.
routing:
  expect: not_fire
  expected_alternative: inline
success_criteria:
  - Does not invoke agent-authoring for a code/import dependency graph
  - Treats the request as local repository investigation and does not fabricate missing files
graders:
  # Behavioral grader sets must reject a prompt echo and a keyword-rich incomplete response;
  # the adversarial fixtures for this scenario live in evals/test_graders.py.
  - type: contains_any
    of: ["local repository investigation", "repository-investigator", "source structure", "source-code structure"]
  - type: contains_any
    of: ["import graph", "dependency graph", "module graph", "call graph"]
  - type: contains_any
    of: ["parser", "AST", "static analysis", "import extraction", "statically"]
  - type: not_regex
    pattern: '(?i)design (?:a|an|the) (?:agent|delegation|prompt|workflow)'
