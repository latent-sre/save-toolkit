id: discovery-runbook-incident-update
split: regression
prompt: |
  The standard operating-guide structure is already selected. A resolved incident showed that one
  procedure step held, one was contradicted, and one required step was missing. Apply the
  check/recover/verify/roll-back/escalate structure, update incident history and evidence labels,
  and do not execute any procedure.
success_criteria:
- Loads the runbook structure for a resolved-incident update
- Preserves held, contradicted, and missing outcomes with evidence boundaries
target:
  kind: skill
  name: runbook
routing:
  expect: fire
