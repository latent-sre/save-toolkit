schema_version: 1
id: discovery-operational-learning-skill-defers-writing
mode: discovery
split: calibration
target:
  kind: skill
  name: operational-learning
prompt: |
  Route this approved documentation request to its owning fleet lane: write the catalog service
  card, alert cards, operations index links, and missing-runbook dispositions from supplied evidence.
  Do not inspect, edit, or run anything in this routing check. Return only the owning lane and a
  one-sentence reason that names one of those artifacts.
routing:
  expect: not_fire
  expected_alternative: inline
success_criteria:
  - Names scribe as the owner instead of firing operational-learning
  - Identifies an operational-knowledge artifact as that lane's work
graders:
  - type: contains_any
    of: ["scribe", "knowledge closeout", "operations KB"]
  - type: contains_any
    of: ["service card", "alert card", "runbook", "disposition"]
