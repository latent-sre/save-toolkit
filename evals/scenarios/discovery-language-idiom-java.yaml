schema_version: 1
id: discovery-language-idiom-java
mode: discovery
split: regression
target:
  kind: skill
  name: language-idiom
# Routing: a plain Java review request must fire language-idiom on its own. The prompt names
# no skill and no other language; the snippet carries three traps the Java reference calls out.
prompt: |
  Review this Java class for idiom problems before I open the PR. Tell me what you'd change and why.

  ```java
  public class OrderService {
      private static final Logger log = LoggerFactory.getLogger(OrderService.class);

      public boolean sameCustomer(Integer a, Integer b) {
          return a == b;
      }

      public LocalDateTime stampNow() {
          return LocalDateTime.now();
      }

      public void record(Order o) {
          try {
              repo.save(o);
          } catch (Exception e) {
              e.printStackTrace();
          }
          log.info("saved order " + o.getId() + " for " + o.getCustomerEmail());
      }
  }
  ```
routing:
  expect: fire
success_criteria:
  - Fires the language-idiom skill for an unlabelled Java review request
  - Calls out boxed-Integer reference comparison and the zoneless LocalDateTime timestamp
  - Flags the swallowed exception and the concatenated, PII-bearing log line
graders:
  - type: contains_any
    of: ["equals", "boxed", "integer cache", "reference comparison", "-128"]
  - type: contains_any
    of: ["instant", "zoneddatetime", "java.time", "no zone", "time zone", "timezone"]
  - type: contains_any
    of: ["printstacktrace", "swallow", "rethrow", "wrap the cause"]
  - type: contains_any
    of: ["parameterized", "{}", "concatenat", "email", "pii", "redact"]
