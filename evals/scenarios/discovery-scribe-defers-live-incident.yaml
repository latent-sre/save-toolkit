id: discovery-scribe-defers-live-incident
split: calibration
prompt: |
  Write the postmortem now for checkout returning 503s in production. The incident is still active,
  the cause is unknown, and no mitigation is authorized. Also build the current timeline, assess
  severity and blast radius, gather the first evidence, and form testable hypotheses.
success_criteria:
- Keeps active incident investigation out of the documentation lane
- Delegates to sre for read-only triage
target:
  kind: agent
  name: scribe
routing:
  expect: not_fire
  expected_alternative:
    kind: agent
    name: sre
tools:
- Glob
- Grep
- Read
- Skill
- Task
