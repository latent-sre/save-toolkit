schema_version: 1
id: language-idiom-router-java
mode: direct
split: calibration
target:
  kind: skill
  name: language-idiom
# Task: the language-idiom router should surface the JAVA conventions for a Java task
# (proves references/java.md is reachable from the skill body, not just present on disk).
prompt: |
  We're building a Spring Boot service in Java for this team. What conventions, tooling, and
  common pitfalls should we follow?
success_criteria:
  - Surfaces Java-specific tooling (a checked-in formatter, Error Prone/NullAway, JSpecify)
  - Mentions at least one Java correctness trap from the reference (boxed ==, java.time, try-with-resources) or the PCF buildpack memory calculator
graders:
  - type: contains_any
    of: ["jspecify", "nullaway", "error prone", "spotless", "@nullmarked"]
  - type: contains_any
    of: ["virtual thread", "memory calculator", "try-with-resources", "java.time", "boxed", "integer cache"]
