schema_version: 1
id: discovery-approved-service-knowledge
mode: discovery
split: held_out
target:
  kind: agent
  name: scribe
prompt: |
  Onboarding for the new catalog application/service is approved and complete. Using the supplied exact source
  revision, owner, dependency list, approved alert definitions, and evidence labels, update the
  repository operations knowledge base: prepare its service card, alert cards, index links, and an
  explicit disposition for each missing or stale runbook. Do not redesign the alerts or query a live
  target.
routing:
  expect: fire
success_criteria:
  - Routes approved service knowledge closeout to scribe
  - Produces evidence-bound KB artifacts and explicit runbook dispositions
graders:
  - type: contains_all
    of: ["service card", "alert card", "index", "runbook"]
  - type: contains_any
    of: ["disposition", "prepared", "proposed", "blocked"]
  - type: contains_any
    of: ["evidence", "source revision", "exact revision"]
