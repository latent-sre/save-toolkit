schema_version: 1
id: discovery-incident-command-active-response
mode: discovery
split: calibration
target:
  kind: skill
  name: incident-command
prompt: |
  Checkout is returning 503s for most customers and the error rate is still rising. Declare the
  incident, set a provisional severity, assign response roles, identify the next mitigation decision,
  and draft the first stakeholder update. No production change has been approved. Return exactly one
  JSON object with severity; roles for incident_commander, investigation, remediation, and
  communications; a mitigation object; and a stakeholder_update with message and next_update_utc.
  The mitigation fields must record status recommendation_only, executor human_release_owner,
  approval not_approved, execution not_started, and a non-empty recommendation. Use an explicit UTC
  timestamp such as 2026-08-19T14:30Z.
routing:
  expect: fire
success_criteria:
  - Autonomously invokes incident-command for active response coordination
  - Produces one typed record with severity, assigned roles, mitigation direction, and a timed update
  - Keeps the unapproved production effect recommendation-only and human-owned
graders:
  - type: json_incident_command_packet
