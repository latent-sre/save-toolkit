schema_version: 1
id: discovery-incident-command-active-response
mode: discovery
split: calibration
target:
  kind: skill
  name: incident-command
prompt: |
  Checkout is returning 503s for most customers and the error rate is still rising. Declare the
  incident, set a provisional severity, assign response roles, identify the next mitigation decision,
  and prepare the first stakeholder-update record. Available responders are Alex (incident
  commander), Priya (investigation), Jordan (human release owner), and Casey (communications). No
  production change has been approved.

  Return exactly one JSON object and no prose. Record severity as level SEV1, policy_source
  fleet_fallback, and evidence unverified. Assign the supplied responders under incident_commander,
  investigation, remediation, and communications. The mitigation must record status
  recommendation_only, executor human_release_owner, approval not_approved, execution not_started,
  and candidate_action evaluate_reversible_scale_out. The stakeholder_update must record status
  investigating, impact checkout_503s_for_most_customers_and_rising, cause unknown, mitigation_state
  awaiting_human_approval, and a real UTC next_update_utc such as 2026-08-19T14:30Z.
routing:
  expect: fire
success_criteria:
  - Autonomously invokes incident-command for active response coordination
  - Produces one typed record with provisional severity evidence, assigned roles, mitigation direction, and a timed update
  - Keeps the unapproved production effect recommendation-only and human-owned
graders:
  - type: json_incident_command_packet
