schema_version: 1
id: discovery-obs-alerting-defers-live-graph-outage
mode: discovery
split: calibration
target:
  kind: skill
  name: obs-alerting
prompt: |
  The checkout workflow graph is failing right now, orders are stuck, and one payment may have
  committed without a receipt. Take the live incident, find the cause, and get processing moving
  again. We can improve its alerts after recovery.
routing:
  expect: not_fire
  expected_alternative:
    kind: agent
    name: sre
  scope: root
success_criteria:
  - Keeps active unknown-cause graph impact with the sre incident lane
  - Does not select alert design as the owner of live diagnosis or effect reconciliation
graders:
  - type: contains_all
    of: ["Incident summary:", "Timeline (UTC):", "Hypotheses tested:"]
