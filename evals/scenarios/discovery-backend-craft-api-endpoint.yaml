schema_version: 1
id: discovery-backend-craft-api-endpoint
mode: discovery
split: calibration
target:
  kind: skill
  name: backend-craft
prompt: |
  Add an order-creation HTTP endpoint that calls billing. Billing can time out, clients repeat
  requests, and two duplicates may arrive concurrently. Before implementation, return exactly one
  JSON decision record and no prose. Choose exactly one listed value for every field:
  - contract: implicit_contract | explicit_request_response_schema
  - upstream_timeout: finite | unbounded
  - idempotency_scope: unscoped | principal_operation_request_fingerprint
  - concurrent_duplicate_test: required | omitted
  - implementation: started | not_started
routing:
  expect: fire
success_criteria:
  - Routes backend endpoint work to the backend implementation lane
  - Makes the response contract, finite timeout, and concurrent idempotency boundary explicit
  - Requires failure-path tests before implementation
graders:
  - type: json_exact_object
    expected:
      contract: explicit_request_response_schema
      upstream_timeout: finite
      idempotency_scope: principal_operation_request_fingerprint
      concurrent_duplicate_test: required
      implementation: not_started
