schema_version: 1
id: discovery-backend-craft-api-endpoint
mode: discovery
split: calibration
target:
  kind: skill
  name: backend-craft
prompt: |
  Add an order-creation HTTP endpoint that calls billing. Billing can time out, clients repeat
  requests, and two duplicates may arrive concurrently. Before implementation, return exactly one
  JSON decision record and no prose with fields contract_defined, finite_timeout_required,
  idempotency_scope, concurrent_duplicate_test_required, and implementation. Use JSON booleans where
  the field name asks whether something is required and concise snake_case state values elsewhere.
routing:
  expect: fire
success_criteria:
  - Routes backend endpoint work to the backend implementation lane
  - Makes the response contract, finite timeout, and concurrent idempotency boundary explicit
  - Requires failure-path tests before implementation
graders:
  - type: json_exact_object
    expected:
      contract_defined: true
      finite_timeout_required: true
      idempotency_scope: principal_operation_fingerprint
      concurrent_duplicate_test_required: true
      implementation: not_started
