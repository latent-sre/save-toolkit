id: incident-qualification-v1-02
split: regression
target:
  kind: skill
  name: incident-investigation
routing:
  expect: fire
max_turns: 24
tools:
- Skill
- Read
- Task
prompt: |
  I am coordinating technical updates for the Beacon Identity on-call lead during a sign-in incident. Tell me what the current records establish and what I should do next. I can read the regional sign-in dashboards and download their cached CSV exports. I cannot query production databases or obtain raw identity tokens. Regional operators can provide fresh scoped exports in about three minutes; a complete multi-region export takes about eight minutes. Traffic-routing and broker-configuration changes require the identity operator to execute after the human incident lead approves. No changes are approved yet.

  All times are UTC on 2026-11-10; copies of these records are in evidence.md.

  I1 — global outcome snapshot, exported at 08:12. Observation window 08:00:00–08:10:00. All four regions (north, south, east, west), browser and mobile clients, both identity providers, production only. Unit: unique sign-in transaction IDs, deduplicated across HTTP retries. 50,000 transactions, 1,000 terminal failures. Provider and client breakdowns are not included.
  I2 — north regional outcome export, generated 08:26. Observation window 08:20:00–08:25:00. North region, mobile clients, provider Oak only; same deduplicated transaction and terminal-failure definitions as I1. 1,000 transactions, 240 terminal failures. No records for the other regions, browser clients, or provider Pine are included.
  I3 — change log. A broker trust-bundle rotation began in north and east at 08:14 and remains in progress. No comparable rotation has begun in south or west. A mobile SDK version began expanding at 08:13; the release team has not supplied version-by-region transaction counts. Oak's status page reports intermittent token-exchange delays starting 08:16 but gives no regional or client split.
  I4 — bridge note at 08:27. A stakeholder points to the 2% global failure card, whose displayed timestamp is 08:12, and says the incident is almost over. Support still has new north mobile complaints. The incident lead has not defined a global recovery state from the available measurements.
