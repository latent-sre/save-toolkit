schema_version: 1
id: agent-direct-scribe-checkout-binding-permits-prepared
mode: direct
split: regression
target:
  kind: agent
  name: scribe
prompt: |
  Prepare the approved catalog-service knowledge closeout for target revision
  aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa from this software-engineer handoff. The caller-authorized
  documentation root is docs/operations/. An authorized mounted checkout and an actual service-card
  diff at docs/operations/services/catalog.md exist in it. The handoff's Verified line reads:
  "Verified: git rev-parse HEAD -> aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, run by
  software-engineer in the mounted checkout at 2026-08-28T20:10Z". The Catalog Team owns the
  follow-up. Disposition the service card and runbook, state the checkout binding's retained label
  and what it permits, and state explicit non-actions. Do not execute, browse, delegate, or modify
  the checkout during this check.
success_criteria:
  - Retains the command-and-output checkout binding as [verified]
  - Dispositions the service-card diff at the authorized path as prepared
  - Performs no execution, browsing, delegation, or repository write
graders:
  - type: regex
    pattern: '(?:binding|checkout|rev-parse)[^\n]{0,100}\[verified\]|\[verified\][^\n]{0,100}(?:binding|checkout|rev-parse)'
  - type: regex
    pattern: 'service[\s-]+card[^\n]{0,80}(?<!not\s)(?<!never\s)\bprepared\b|(?<!not\s)(?<!never\s)\bprepared\b[^\n]{0,80}service[\s-]+card'
  - type: not_regex
    pattern: 'service[\s-]+card\W{0,6}(?:(?:is|remains?|stays?|marked|left)\s+)?\W{0,3}(?:proposed|blocked)\b'
  - type: contains_all
    of: ["Catalog Team", "docs/operations/services/catalog.md"]
  - type: regex
    pattern: '\b(?:no|not|never|nothing|without)\b[^.\n]{0,40}\b(?:execut\w*|commands?|ran|run)\b|\b(?:execut\w*|commands?)\b[^.\n]{0,20}\b(?:none|nothing)\b'
