id: discovery-obs-alerting-splunk-saved-search
split: regression
prompt: |
  Design a Splunk saved-search paging alert for sustained checkout 5xx errors. Give a concrete
  search window and schedule pairing; define a finite throttle period and scope; and describe the
  fire, delivery, and resolve test. Use the supplied fictional fixture values exactly: notification
  route `checkout-primary pager` and runbook link `runbooks/checkout-5xx.md`. They are eval inputs,
  not live endpoints. Use any clear format. This is steady-state alert design; no alert is firing.
success_criteria:
- Routes Splunk saved-search alert design to the alerting lane
- Covers the window/schedule pair, scoped throttling, runbook, and end-to-end verification
target:
  kind: skill
  name: obs-alerting
routing:
  expect: fire
