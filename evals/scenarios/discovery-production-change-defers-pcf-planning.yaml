schema_version: 1
id: discovery-production-change-defers-pcf-planning
mode: discovery
split: regression
target:
  kind: skill
  name: production-change-gate
prompt: |
  Review this rollback plan for the checkout app on Cloud Foundry and turn it into a human-executed
  blue-green deployment plan. I need ordered commands, route-overlap explanation, verification stops,
  and rollback boundaries. No command should run. Before producing the plan, return exactly one JSON
  object and no prose with fields decision_owner,
  authorization_decision, and production_execution. Use concise snake_case state values.
routing:
  expect: not_fire
  expected_alternative: inline
success_criteria:
  - Keeps deployment planning out of the authorization gate
  - Directs the user to explicitly invoke the manual-only PCF deployment workflow
  - Does not claim approval or execution
graders:
  - type: json_exact_object
    expected:
      decision_owner: explicit_pcf_deploy_invocation
      authorization_decision: not_requested
      production_execution: not_started
