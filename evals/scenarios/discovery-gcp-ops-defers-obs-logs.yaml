schema_version: 1
id: discovery-gcp-ops-defers-obs-logs
mode: discovery
split: regression
target:
  kind: skill
  name: gcp-ops
prompt: |
  Our checkout service runs on Cloud Run. Write a Cloud Logging query that finds ERROR and CRITICAL
  entries for service checkout over the last hour. This is query construction only; do not triage
  the service configuration or change anything.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: obs-logs
success_criteria:
  - Keeps Cloud Logging query construction in the log-query lane
  - Does not expand a backend-dialect request into GCP service triage
graders:
  - type: contains_any
    of: ["gcloud logging read", "resource.type", "severity>=", "--freshness"]
