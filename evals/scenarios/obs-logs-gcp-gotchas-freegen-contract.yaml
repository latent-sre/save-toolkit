id: obs-logs-gcp-gotchas-freegen-contract
max_turns: 17
split: regression
skill: obs-analysis
tools: [Skill, Read]
references:
  - skills/obs-analysis/references/gcp-logging.md
prompt: |
  Read the Cloud Logging reference. Return one JSON object only. Do not run queries or edit files.
  Give the _Required and project _Default bucket default retention in days as integer fields
  required_retention_days and default_retention_days. Give the entries.list read quota as the integer
  calls_per_minute_per_project and whether it can be raised as the boolean quota_increasable.
  A reader cannot find an entry in the expected bucket. Identify a routing configuration that can
  exclude a generated entry (routing_reason) and a setting that can prevent a non-BigQuery Data
  Access audit entry from being generated (generation_reason). Use the applicable string codes
  from sink_includes_entry, data_access_disabled, data_access_enabled and sink_exclusion.
success_criteria:
  - Assigns the correct retention to each bucket, gives the fixed per-project read quota, and identifies both routing and audit-generation causes of absence.
graders:
  - type: exact_json
    fields:
      required_retention_days: 400
      default_retention_days: 30
      calls_per_minute_per_project: 60
      quota_increasable: false
      routing_reason: sink_exclusion
      generation_reason: data_access_disabled
