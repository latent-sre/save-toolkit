# This case grades discovery only; advice quality needs separate review.
prompt: |
  We're building a React ops dashboard and the styling is all Tailwind. We're considering
  `@mantine/core` for dialogs and form controls alongside our existing components. What should
  we consider when choosing between that and extending our current UI primitives, especially
  accessibility, theme consistency and maintenance? Just advise; don't change anything yet.
