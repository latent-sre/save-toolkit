id: agent-direct-investigator-location-versus-behavior
split: regression
agent: repository-investigator
tools: [Read]
prompt: |
  Choose the evidence needed for these fictional checkout questions from supplied facts.
  Do not execute, modify files, browse, or delegate. No real checkout behavior is established here.
  A: "Where is TIMEOUT declared in settings.py?" You read its defining assignment and surrounding
  module. The question is only about that declaration, not its use or effective value.
  B: "Where is parse defined?" The first match is `from .parser import parse` in __init__.py;
  parser.py has not been read.
  C: "Which timeout takes effect?" You have read a default, but caller overrides are uninspected.
  D: "Does this repository have no parse implementation?" One search of __init__.py found no match.
  Dispatch: invoking caller is review coordinator; human owner is human requester.
  Parent objective is assess agent contracts. Your assignment is this supplied-state
  classification, not execution of the fictional work. Return its status as complete;
  the caller's next step is review classifications. Include this handoff in the JSON.
  Return exactly one JSON object:
  - returning_to: review coordinator
  - assignment: complete
  - parent_objective: assess agent contracts
  - human_owner: human requester
  - caller_next_step: review classifications
  - declaration_a: cite_and_stop | trace_all_callers
  - import_b: read_defining_module | declare_import_the_definition
  - effective_c: trace_overrides | report_default_as_effective
  - absence_d: bound_search_and_report_limits | claim_repository_wide_absence
  - runtime_verified: "yes" | "no"
success_criteria:
  - Stops a supported affirmative declaration lookup while resolving import indirection.
  - Keeps effective configuration and absence claims subject to relevant trace and coverage.
graders:
  - type: exact_json
    fields:
      returning_to: review coordinator
      assignment: complete
      parent_objective: assess agent contracts
      human_owner: human requester
      caller_next_step: review classifications
      declaration_a: cite_and_stop
      import_b: read_defining_module
      effective_c: trace_overrides
      absence_d: bound_search_and_report_limits
      runtime_verified: "no"
