schema_version: 1
id: discovery-ci-actions-harden-workflow
mode: discovery
split: regression
target:
  kind: skill
  name: ci-actions
# Routing: an unlabelled "harden this workflow" request must fire ci-actions. Behaviour: the three
# always-on rules have to reach the YAML, not just the prose — an explicit permissions block, a
# full-SHA pin instead of a floating tag, and the PR title moved out of shell source into an env
# var. The snippet below trips all three deliberately.
prompt: |
  Can you tighten this up before I merge it? It works, I just don't love how it looks.

  ```yaml
  on: [pull_request]
  jobs:
    greet:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5
        - run: echo "Reviewing ${{ github.event.pull_request.title }}"
  ```
routing:
  expect: fire
success_criteria:
  - Fires ci-actions for an unlabelled workflow-hardening request
  - Adds an explicit least-privilege permissions block
  - Replaces the floating tag with a full commit SHA pin
  - Moves the attacker-controlled PR title out of shell source into an environment variable
graders:
  - type: contains_any
    of: ["permissions:", "contents: read"]
  - type: contains_any
    of: ["commit sha", "full sha", "pin", "40-character"]
  - type: contains_any
    of: ["env:", "environment variable", "$PR_TITLE", "PR_TITLE"]
  - type: contains_any
    of: ["injection", "untrusted", "attacker-controlled", "script injection"]
