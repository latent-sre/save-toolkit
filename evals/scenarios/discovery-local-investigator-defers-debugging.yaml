schema_version: 1
id: discovery-local-investigator-defers-debugging
mode: discovery
split: calibration
target:
  kind: agent
  name: repository-investigator
prompt: |
  The same integration test fails intermittently with an unexpected timeout. Reproduce it, gather
  evidence, determine the root cause before changing code, and explain why the failure occurs.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: root-cause
success_criteria:
  - Keeps reproduce-diagnose-fix work out of the static repository-investigation lane
  - Uses the root-cause method
graders:
  - type: contains_any
    of: ["reproduce", "reproduction"]
  - type: contains_any
    of: ["hypothesis", "root cause", "evidence"]
