id: discovery-local-checkout-investigation
split: calibration
prompt: |
  In this checkout, find where retry delay is calculated and which local configuration files can
  override it. Cite the defining files and lines, include uncommitted behavior, and change nothing.
success_criteria:
- Delegates the bounded local source question to repository-investigator
- Reports that the clean-room fixture lacks the named implementation instead of fabricating evidence
target:
  kind: agent
  name: repository-investigator
routing:
  expect: fire
tools:
- Glob
- Grep
- Read
- Skill
- Task
