schema_version: 1
id: discovery-merge-readiness
mode: discovery
split: calibration
target:
  kind: skill
  name: merge-gate
prompt: |
  A pull request changes authentication refresh logic. CI has not run and no regression test was
  added because the author calls it a tiny fix. Is it ready to merge? Give a decisive verdict and
  the next evidence required.
routing:
  expect: fire
success_criteria:
  - Autonomously invokes the merge readiness checklist
  - Blocks the change because CI and regression evidence are missing
graders:
  - type: contains_any
    of: ["blocked", "do not merge", "not ready", "cannot pass"]
  - type: contains_any
    of: ["regression test", "ci", "test suite", "tests"]
