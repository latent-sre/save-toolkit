schema_version: 1
id: incident-investigation-correlated-incidents-stay-separate
mode: direct
split: calibration
target:
  kind: skill
  name: incident-investigation
prompt: |
  At 04:10 UTC the payments API began returning TLS errors while the inventory worker stopped
  consuming. Both alerts began within the same two-minute window. Payments had a certificate reload
  immediately beforehand; inventory shows database lock waits, and no dependency or request path
  connects the services. Should we combine these into one incident and one causal differential?
success_criteria:
  - Keeps the incidents and their causal differentials separate without a connecting mechanism
  - Treats correlated timing as a hypothesis rather than evidence of one cause
  - Names the evidence required before combining the investigations
graders:
  - type: contains_any
    of: ["same window", "correlated timing", "shared cause", "timing alone", "close timing", "shared timing"]
  - type: contains_any
    of: ["mechanism", "connecting", "connection"]
  - type: regex
    pattern: '(?i)(?:\b(?:keep|track|investigat|maintain|handle|leave)\w*\b[^.\n]{0,80}\b(?:incidents?|them|differentials?)\b[^.\n]{0,80}\b(?:separate|independent\w*)\b|\b(?:keep|track|investigat|maintain|handle|leave)\w*\b[^.\n]{0,40}\b(?:separate|independent\w*)\b[^.\n]{0,80}\b(?:incidents?|them|differentials?)\b)'
  - type: regex
    pattern: '(?i)(?:\b(?:same window|(?:correlat\w*|close|shared)\s+tim\w*|tim\w*\s+(?:alone|correlat\w*\s+alone)|temporally?\s+correlat\w*)\b[^.\n]{0,140}\b(?:does not|doesn''t|is not|isn''t|cannot|can''t)\b[^.\n]{0,80}\b(?:prove|evidence|establish|show|demonstrate)\w*\b|\b(?:do not|don''t|cannot|can''t)\b[^.\n]{0,40}\b(?:merge|combine)\w*\b[^.\n]{0,120}\b(?:timing alone|began within\b[^.\n]{0,40}\bminutes?)\b)'
  - type: regex
    pattern: '(?i)(?:\b(?:unless|until|without|only if|require\w*|need\w*)\b[^.\n]{0,140}\b(?:mechanism|evidence)\b[^.\n]{0,140}\b(?:connect|link|shared cause)\w*|\b(?:merge|combine)\w*\b[^.\n]{0,80}\bonly if\b[^.\n]{0,140}\b(?:mechanism|evidence)\b)'
