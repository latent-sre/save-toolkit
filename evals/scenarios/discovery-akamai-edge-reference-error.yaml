id: discovery-akamai-edge-reference-error
split: regression
prompt: |
  No alert is active, but a browser intermittently gets an Akamai Reference #9 error. Determine
  whether the failure is at the CDN edge or the origin, name the Edge Diagnostics evidence to
  collect promptly, and do not change the property or WAF configuration.
success_criteria:
- Routes Akamai reference-error diagnosis to the edge lane
- Separates edge from origin and stays read-only
target:
  kind: skill
  name: akamai-edge
routing:
  expect: fire
