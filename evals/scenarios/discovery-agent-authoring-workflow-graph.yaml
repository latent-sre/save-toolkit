schema_version: 1
id: discovery-agent-authoring-workflow-graph
mode: discovery
# Calibration until a passing candidate result exists: the only measured trials for this exact
# case timed out without an attempted/completed target invocation, and evals/README.md defines
# that as unsuccessful routing; the regression split carries no known-failing case.
split: calibration
target:
  kind: skill
  name: agent-authoring
prompt: |
  Design the agent roster/delegation graph for change delivery: coordinator, implementation,
  research, read-only independent review, and human-owned effects. Give the nodes, allowed edges,
  handoff/join, authority boundaries, and termination. Do not map code dependencies or pick a runtime.
routing:
  expect: fire
success_criteria:
  - Invokes agent-authoring for an agent roster and delegation graph
  - Describes nodes, allowed edges, authority boundaries, joins, and termination
  - Does not turn the request into a code dependency graph or prematurely select a runtime
graders:
  # Behavioral grader sets must reject a prompt echo and a keyword-rich incomplete response;
  # the adversarial fixtures for this scenario live in evals/test_graders.py.
  - type: contains_all
    of: ["nodes", "edges", "authority", "termination"]
    # Grade the edge list structurally rather than by vocabulary: a real delegation-graph answer
    # DRAWS its edges ("Coordinator -> Review", "Human -> Coordinator"). The prompt asks for
    # "allowed edges" in prose and contains no arrow, so this also keeps the prompt echo failing
    # here - which matters, because the words a good answer uses for this behaviour ARE the
    # prompt's own words, so no vocabulary token can both match the answer and reject the echo.
  - type: regex
    pattern: '(?i)\b\w[\w\-]*\s*(?:\u2192|->|=>)\s*\w[\w\-]*'
    # Regex: measured answers wrote "**Review (read-only, independent)**" and "Independent,
    # read-only evaluation" - the same behaviour in the other word order.
  - type: regex
    pattern: '(?i)\bread[\s\-]?only\b[^.\n]{0,40}\breview\w*\b|\breview\w*\b[^.\n]{0,40}\bread[\s\-]?only\b'
    # Regex: the measured answer wrote "**Human (effects owner)** | Executes any
    # authority-changing, production-facing, destructive, or external action | Sole holder of
    # effect authority" - a better answer than the phrasing it was graded against.
  - type: regex
    pattern: '(?i)\bhuman\b[^.\n]{0,60}\beffects?\b|\beffects?\b[^.\n]{0,40}\bhuman\b'
  - type: not_regex
    pattern: '(?i)must (?:use|implement with) (?:langgraph|networkx)'
  - type: not_regex
    pattern: '(?i)\bimports?\b.*\b(?:cycle|cycles)\b|\b(?:cycle|cycles)\b.*\bimports?\b'
