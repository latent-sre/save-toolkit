id: discovery-production-change-gate-merge-readiness
split: regression
prompt: |
  Is PR #42 ready to merge? CI is green — build, lint, and the full suite all passed at the PR-head
  commit. There is one open P1 review finding that hasn't been fixed or rejected yet, and the changed
  behaviour still has no regression test covering it.
success_criteria:
- Applies the merge-readiness checklist and returns its verdict shape
- Blocks on the untested changed behaviour and the open P1 finding
target:
  kind: skill
  name: production-change-gate
routing:
  expect: fire
