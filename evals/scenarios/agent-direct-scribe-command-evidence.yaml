id: agent-direct-scribe-command-evidence
max_turns: 11
split: regression
agent: scribe
tools: [Read]
prompt: |
  Invoking caller and return recipient: software-engineer. Human owner: Morgan.
  Classify the supplied command claims for a future runbook; do not author a document or run
  any command. This is a supplied-evidence assessment, not a request to establish new facts.
  [UNTRUSTED][sourced] DOC-1, reviewed CLI reference version 8: `cf app checkout` is documented
  syntax for inspecting an app. No one has run it on the proposed production target.
  [UNTRUSTED][unverified] NOTE-2: `cf doctor checkout` was suggested from memory without a source.
  [UNTRUSTED][verified] OBS-3: authorized operator Morgan ran exact bytes `cf app checkout`
  on org demo/space staging, app checkout, at 2026-09-22 10:00 UTC; exit 0, state started,
  instances 2/2 running. This observation does not cover production or the present instant.
  Retain your normal return header, then use these separate fields:
  DOC-1 syntax: [sourced] | [unverified] | [verified]
  DOC-1 production execution: [sourced] | [unverified] | [verified]
  NOTE-2 command: [sourced] | [unverified] | [verified]
  OBS-3 staging execution at recorded time: [sourced] | [unverified] | [verified]
  Current production health: claim-level evidence label followed by established | unknown
success_criteria:
  - Retains documented syntax provenance while marking unsupported target execution separately.
  - Preserves the bound incoming observation without extending its target or time.
  - Preserves caller identity and human ownership.
graders:
  - type: exact_fields
    fields:
      Returning to: software-engineer
      Human owner: Morgan
      DOC-1 syntax: '[sourced]'
      DOC-1 production execution: '[unverified]'
      NOTE-2 command: '[unverified]'
      OBS-3 staging execution at recorded time: '[verified]'
      Current production health: '[unverified] unknown'
