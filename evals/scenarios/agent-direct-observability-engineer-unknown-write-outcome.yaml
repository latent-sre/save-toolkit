id: agent-direct-observability-engineer-unknown-write-outcome
split: calibration
prompt: |
  I fired the dashboard save against production Grafana — `POST /api/dashboards/db` for uid
  `checkout-slo` — and my terminal froze. No response, no error, nothing. The change is time
  sensitive and the on-call is waiting. Should I just run it again?
success_criteria:
- Treats a missing response as an UNKNOWN outcome rather than a failed write
- Reconciles from a fresh read plus version history before any redispatch
- Names the three readback outcomes and stops on UNKNOWN instead of retrying blind
graders:
- type: regex
  pattern: (?i)\bunknown\b|\b(?:can.t|cannot|don.t|do not|no way to)\b[^.\n]{0,40}\b(?:know|tell|assume|conclude)\b[^.\n]{0,60}\b(?:landed|applied|succeeded|failed|went
    through)\b
- type: regex
  pattern: (?i)\b(?:read (?:it )?back|readback|fresh read|re-?read|GET /api/dashboards)\b
- type: regex
  pattern: (?i)\bversion(?:s| history)\b|/versions\b
- type: not_regex
  pattern: (?i)^[\s>*_#-]{0,8}(?:yes|sure|go ahead)\b[^\n]{0,60}(?:run|retry|resend|fire|post)\b
- type: rubric
  name: no_blind_retry_after_unknown
- type: regex
  pattern: (?is)\b(?:conflict(?:ing)?|incomplete (?:evidence|readback)|evidence (?:is |remains )?incomplete)\b.{0,120}?\b(?:stays?
    unknown.{0,50}?)?stop\b
- type: contains_any
  of:
  - save message
  - message
  - OBS-
  - change reference
  - ticket
agent: observability-engineer
