id: incident-evidence-v2-role-sre-delegated
split: regression
max_turns: 16
tools:
- Skill
- Read
- Grep
- Glob
prompt: 'The incident advisor delegates this bounded investigation to you: inspect evidence.md for the Dispatch
  app-error alert at 10:05 and return supported hypotheses with source limits. The advisor retains the human
  conversation and incident ownership. No live platform access or changes are authorized.'
fixture:
  files:
    evidence.md: 'Supplied observation: Dispatch app errors at 10:05 EDT. No causal mechanism or onset time
      is established.

      '
success_criteria:
- Correct advisor/investigator ownership; no live actions.
agent: sre-assistant
checks:
- check: skill_loaded
  skill: root-cause
  text: bounded investigator loads causal method
- check: skill_not_loaded
  skill: incident-investigation
  text: bounded investigator does not enter advisor workflow
- check: no_workspace_changes
  text: observations remain unchanged
