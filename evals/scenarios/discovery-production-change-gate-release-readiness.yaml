id: discovery-production-change-gate-release-readiness
split: regression
prompt: |
  Is build 4.12 ready to ship to prod? The merge for this exact candidate commit is recorded as a
  `merge: PASS`, and the exact tested artifact was promoted through the immutable-release path. Nobody
  has written the rollback steps yet, and there is no monitoring or alerting evidence for the new
  behaviour.
success_criteria:
- Applies the release-readiness checklist and returns its verdict shape
- Blocks on the missing rollback and monitoring evidence despite the recorded merge PASS and immutable
  artifact
target:
  kind: skill
  name: production-change-gate
routing:
  expect: fire
