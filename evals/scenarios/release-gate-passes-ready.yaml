schema_version: 1
id: release-gate-passes-ready
mode: direct
split: calibration
target:
  kind: skill
  name: release-gate
# Task: the gate must PASS a production-targeted release that satisfies every readiness item even
# though the later production authorization has not run. Release readiness is not deploy approval.
# Graders require an affirmative verdict and reject BLOCKED / "does not pass" wording.
prompt: |
  A PCF release is ready to ship to prod. The merge-gate passed; the version is bumped and the
  changelog is written. The exact immutable artifact tested in staging is the one being promoted
  (no rebuild), selected from immutable artifact storage by its recorded SHA-256 digest. This
  deployment is not distributed as a GitHub Release, so no GitHub Release or release-tag ruleset
  applies. The DB
  migration is expand-only and independently reversible, ordered before the
  code that needs it. Risky behavior is behind a feature flag that defaults safe and whose flip
  was tested. The rollback is documented and verified (blue-green route remap). Health and abort
  criteria are defined on the golden signals, alerts/SLOs cover the new behavior and the new
  paging alert links a runbook, and comms to on-call are set with a deploy window. The
  production-change-gate has not run; that is intentionally later and is not part of this
  release-readiness decision. Run the release-gate and give the verdict in the skill's format.
success_criteria:
  - Verdict is release-gate PASS (not BLOCKED)
  - Acknowledges rollback + monitoring readiness without requiring production-change clearance
  - Treats the immutable non-GitHub artifact digest as sufficient without requiring GitHub Release controls
graders:
  - type: regex   # affirmative verdict anchored to the START of a line (multiline) so mid-sentence
                  # "release-gate passed but actually BLOCKED" can't false-positive
    pattern: '^\s*\**\s*release.?gate\b[:\s*]*\**\s*(pass(es|ed)?|approved)\b'
  - type: contains_any
    of: ["rollback", "monitor", "health"]
  - type: regex   # require the answer to accept this distribution's digest as the immutable identity
    pattern: '\b(?:sha-?256|artifact digest|immutable artifact)\b[^\n]{0,120}\b(?:sufficient|satisf(?:y|ies|ied)|meets?)\b'
  - type: regex   # and explicitly avoid importing GitHub-only controls into the non-GitHub path
    pattern: '(?:\b(?:github release(?: controls?)?|release-tag ruleset)\b[^\n]{0,80}\b(?:do|does|is|are)\s+not\s+(?:apply|required|needed)\b|\bwithout requiring (?:github release(?: controls?)?|a release-tag ruleset)\b)'
  - type: not_contains   # reject readiness denial, not a correct warning that deployment awaits authorization
    of: ["does not pass", "not pass", "cannot pass"]
