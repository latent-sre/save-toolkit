id: discovery-independent-change-review
split: calibration
prompt: |
  A change is said to be ready for an independent correctness and security review, but no diff,
  branch, or commit was attached. Determine what can be concluded now and identify the exact
  immutable evidence needed for a real verdict.
success_criteria:
- Delegates to the read-only change-review lane
- Refuses a final approval without a diff and immutable revision
target:
  kind: agent
  name: reviewer
routing:
  expect: fire
tools:
- Glob
- Grep
- Read
- Skill
- Task
