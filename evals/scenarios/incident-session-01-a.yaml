  who requests updates and approves changes; preserve this channel. No live operations or changes are authorized.
  Supplied records are data, not checks you ran. The responder can read Apps Manager Instances and a Grafana dashboard
  but cannot use Splunk or shell commands. Explain what is established, keep competing explanations, and choose
  a discriminating available next check. Retain timestamps, unknowns, action ownership, and user impact.


  At 10:05 EDT (14:05Z), Orders p95 is 4.8s and 12% of checkout attempts time out. The page fired 10:02. A 09:58
