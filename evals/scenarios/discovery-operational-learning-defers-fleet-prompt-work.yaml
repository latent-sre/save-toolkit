schema_version: 1
id: discovery-operational-learning-defers-fleet-prompt-work
mode: discovery
split: regression
target:
  kind: skill
  name: operational-learning
prompt: |
  Route this request to the owning fleet lane: the reviewer agent repeatedly accepts changes
  without the evidence its contract requires, so its prompt needs tuning and one named regression.
  Do not inspect, edit, or run anything in this routing check. Return only the owning lane and a
  one-sentence reason.
routing:
  expect: not_fire
  expected_alternative: inline
success_criteria:
  - Names agent-engineer as the owner instead of firing operational-learning
  - Identifies the named regression as part of that lane's work
graders:
  - type: contains_any
    of: ["agent-engineer", "prompt engineer"]
  - type: contains_any
    of: ["named regression", "regression case"]
