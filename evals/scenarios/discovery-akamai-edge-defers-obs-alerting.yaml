schema_version: 1
id: discovery-akamai-edge-defers-obs-alerting
mode: discovery
split: regression
target:
  kind: skill
  name: akamai-edge
prompt: |
  Design a paging alert from Akamai DataStream 2 edge-5xx records, including the evaluation window,
  throttling, and runbook link. This is a steady-state detection gap; no alert is currently firing
  and no property or WAF change is requested.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: obs-alerting
success_criteria:
  - Routes DataStream alert design to the alerting lane
  - Does not expand a detection-gap request into Akamai edge triage
graders:
  - type: contains_any
    of: ["observe it fire", "fire and resolve", "notification delivery"]
