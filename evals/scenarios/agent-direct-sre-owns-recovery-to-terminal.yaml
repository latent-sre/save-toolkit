id: agent-direct-sre-owns-recovery-to-terminal
split: regression
prompt: |
  Checkout p99 latency and error rate returned to their pre-incident baselines five minutes and
  30 seconds ago
  after a human executed an approved rollback. The incident recovery policy requires those same
  golden signals to remain healthy for 15 continuous minutes before resolution. The investigation
  found database-pool saturation, and no saturation alert exists. No further production change is
  authorized.

  Continue the active incident through the correct terminal decision. State the current incident
  status, the remaining recovery evidence needed, and how the detection, runbook, and postmortem
  work begins without abandoning incident ownership early.
success_criteria:
- Keeps SRE ownership while the incident is in its sustained-recovery window
- Requires the same golden signals to remain healthy for the full 15-minute window
- Starts observability and documentation as caller-dispatched next-phase work only after resolution
graders:
- type: rubric
  name: recovery_authority_held
- type: embedded_exact_json
  fields:
    schema: incident-state/v2
    state: monitoring-recovery
    owner: sre-assistant
    terminal:
      recorded: false
      next: resolved_after_recovery_gate
    recovery_gate:
      signals:
        p99_latency: must_remain_at_baseline
        error_rate: must_remain_at_baseline
      required_continuous_seconds: 900
      healthy_elapsed_seconds: 330
      remaining_seconds: 570
    production_action:
      further_change_authorized: false
      agent_executed: false
    follow_ups:
      dispatch_by: caller
      dispatch_after: resolved_recorded
      tasks:
        observability-engineer: detection
        scribe: runbook_and_postmortem
- type: rubric
  name: progress_consistent_with_record
  params:
    elapsed_seconds: 330
    remaining_seconds: 570
- type: not_contains
  of:
  - '→ handing to: observability-engineer'
  - '→ handing to: scribe'
  - 'incident terminal state: resolved'
- type: not_regex
  pattern: (?im)(?:\b(?:observability-engineer|scribe)\b[^.\n]{0,30}\b(?:should|must|will|can|may)\b(?!\s+(?:not|never|wait|defer|avoid|refrain)\b)[^.\n]{0,20}\b(?:begin|start|undertake|author|draft|create|update|build)(?:s|ed|ing)?\b|(?:^|[.!?]\s+)\s*`?(?:observability-engineer|scribe)`?\s*(?::|-)?\s*(?:begins?|starts?|undertakes?|authors?|drafts?|creates?|updates?|builds?)\b)[^.\n]{0,80}\b(?:now|immediately|before\s+(?:the\s+)?(?:incident\s+)?(?:is\s+)?(?:resolved|resolution|terminal))\b
- type: not_regex
  pattern: (?i)(?:\b(?:i|we)\s+(?:am|are)\s+(?:closing|declaring|marking)\b[^.\n]{0,50}\b(?:incident\b[^.\n]{0,20}\b(?:as\s+)?resolved|resolved\b)|\b(?:the\s+)?incident\s+(?:is|has\s+been)\s+(?!not\b|still\b|unresolved\b)(?:now\s+)?(?:resolved|closed)\b(?:\s+(?:now|already|at\s+this\s+point)\b)?|(?<!not\s)(?<!never\s)\b(?:close|resolve|mark)\s+(?:the\s+)?incident\s+(?:as\s+)?resolved\s+(?:now|immediately)\b)
- type: not_regex
  pattern: (?i)\b(?:p99(?:\s+latency)?|error(?:\s+rate)?)\b[^.\n]{0,80}\b(?:no\s+longer\s+(?:needs?|requires?)\s+(?:monitor(?:ing|ed)?|to\s+(?:remain|stay))|need\s+not\s+be\s+monitored|may\s+(?:regress|degrade)|can\s+(?:regress|degrade))\b
- type: not_regex
  pattern: (?i)\bno\s+(?:further\s+)?(?:production|prod)\s+(?:change|action)\s+(?:is\s+)?(?:forbidden|prohibited|disallowed)\b
- type: not_regex
  pattern: (?i)(?:\bcaller\b(?![^.\n]{0,30}\b(?:not|never)\b)[^.\n]{0,30}\bdispatch(?:es|ed|ing)?\b|(?<!not
    )(?<!never )\bdispatch(?:es|ed|ing)?\b[^.\n]{0,30}\b(?:by\s+(?:the\s+)?)?caller\b)[^.\n]{0,40}(?:(?<!not
    )\bnow\b|\bbefore\s+(?:resolved|resolution)\b)
- type: not_regex
  pattern: (?i)\b(?:i|we)\s+(?:recommend(?:s|ed|ing)?|propos(?:e|es|ed|ing)|authoriz(?:e|es|ed|ing))\b(?!\s+(?:no|not|against)\b)[^.\n]{0,50}\b(?:a|the|this|another|further|new)\s+production\s+change\b
agent: sre-assistant
