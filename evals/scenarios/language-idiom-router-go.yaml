schema_version: 1
id: language-idiom-router-go
mode: direct
split: calibration
target:
  kind: skill
  name: language-idiom
prompt: |
  We are building an MCP host in Go. Return exactly one JSON decision record and no prose with fields
  target_version_source, format, error_contract, concurrency_check, and version_sensitive. Set
  version_sensitive to a JSON object with exactly three boolean fields: loop_variables, timers, and
  vendor_mode. Use concise snake_case state values elsewhere. Derive the values from the repository's
  Go configuration and the language contracts rather than assuming the latest toolchain.
success_criteria:
  - Uses the module and toolchain directives for version-sensitive behavior
  - Preserves Go formatting and intentional wrapped-error contracts
  - Applies race checks proportionately and names version-sensitive loop/timer/vendor behavior
graders:
  - type: json_exact_object
    expected:
      target_version_source: go_mod_and_toolchain_directives
      format: gofmt
      error_contract: wrap_with_percent_w_when_exposed
      concurrency_check: race_on_relevant_packages
      version_sensitive:
        loop_variables: true
        timers: true
        vendor_mode: true
