id: obs-metrics-promql-freegen-contract
max_turns: 17
split: regression
skill: obs-analysis
tools: [Skill, Read]
references:
  - skills/obs-analysis/references/promql.md
prompt: |
  Read the PromQL reference. Start the two queries with "1." and "2.", with no explanation.
  Do not run queries or edit files. Mimir stores http_requests_total counters labelled
  app, env, instance and status, and classic http_request_duration_seconds_bucket series labelled
  app, env, instance and le. For env="prod", write (1) the five-minute fraction of all
  requests that returned a 5xx status, by app, and (2) the five-minute request p95 in
  seconds, by app. Instances can restart independently.
success_criteria:
  - Produces the expected ratio and p95 for each production app across counter resets, varied statuses and traffic from another environment.
graders:
  - type: obs_promql
