schema_version: 1
id: discovery-akamai-edge-defers-obs-traces
mode: discovery
split: regression
target:
  kind: skill
  name: akamai-edge
prompt: |
  Akamai has supplied the edge request ID and confirmed the edge leg is healthy. Use the matching
  Tempo trace to follow the origin request across services and identify the span that consumed the
  latency. This is trace interpretation only.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: obs-traces
success_criteria:
  - Routes the origin request path to the traces lane
  - Does not reopen edge triage after Akamai confirmed the edge leg is healthy
graders:
  - type: contains_any
    of: ["critical path", "TraceQL", "{ trace:id", "span duration"]
