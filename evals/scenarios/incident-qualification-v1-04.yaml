id: incident-qualification-v1-04
split: regression
target:
  kind: skill
  name: incident-investigation
routing:
  expect: fire
max_turns: 24
tools:
- Skill
- Read
- Task
prompt: |
  I am the support duty engineer on an incident bridge for Harbor Archive. Customers are waiting for archive restores. Please give me the current assessment and the next practical action using the records below. I can export the read-only restore outcome view and the queue dashboard. The archive operator owns worker and retrieval-cap changes; the human incident lead authorizes those changes and decides recovery. I cannot access storage control APIs or worker shells. No production change is authorized for the assistant.

  All times are UTC on 2026-11-10; the copied initial records are in evidence.md.

  A1 — restore-outcomes export, generated 15:08. Population: all production standard-tier restore jobs in zones cedar, elm, and fir, deduplicated by restore job ID; excludes premium-tier restores. Acceptance window 15:00:00–15:05:00. Success means every requested object in the job is readable within 120 seconds of acceptance. Exactly 1,000 jobs: 650 met the deadline, 350 missed it. All job deadlines elapsed before export; outcome coverage is complete for that cohort.
  A2 — queue gauge, sampled 15:07. Standard tier, all three zones: 1,800 waiting jobs; oldest waiting job age 420 seconds. Premium jobs use a separate queue and are not shown.
  A3 — archive operator timeline, entered 15:10. A bulk customer import stopped submitting restores at 15:07:30. With lead approval, the operator raised the standard-tier retrieval cap from 20 to 40 concurrent fetches at 15:09:00. At 15:09:20 the upstream archive provider's status page announced its retrieval slowdown had ended; its exact recovery time is not supplied.
  A4 — intake counter. Standard-tier restore jobs across all three zones: 200 jobs/minute during 15:00–15:05 and 100 jobs/minute during 15:10–15:12. No outcome cohort from after the cap change has fully matured yet in this packet.

  The lead's pre-agreed recovery condition is at most 1% of standard-tier restore jobs missing the 120-second objective in each of two consecutive fully observed five-minute acceptance cohorts across all three zones, plus a current oldest queued job age under 120 seconds in every zone. The lead asks if we can call the incident recovered now and say increasing the cap was the fix.
