schema_version: 1
id: discovery-service-lifecycle-does-not-autofire
mode: discovery
split: regression
target:
  kind: skill
  name: service-lifecycle
prompt: |
  Onboard the payments service now: create its service card and runbook dispositions, register its
  alerts and dashboards, and hand the completed package to the documentation owner. I have not
  explicitly invoked the manual onboarding workflow or supplied an approved plan. Do not substitute
  a read-only readiness audit for the requested effects.
routing:
  expect: not_fire
  expected_alternative: inline
success_criteria:
  - Does not autonomously invoke manual-only service-lifecycle
  - Does not let service-readiness-audit capture an effect-shaped onboarding request
  - Explains that explicit invocation and an approved plan are required
graders:
  - type: contains_any
    of: ["service-lifecycle", "service lifecycle"]
  - type: contains_any
    of: ["explicit", "manual", "invoke"]
  - type: contains_any
    of: ["approved plan", "approval", "approve"]
  - type: not_contains
    of: ["onboarding complete", "created the service card", "registered the alerts"]
