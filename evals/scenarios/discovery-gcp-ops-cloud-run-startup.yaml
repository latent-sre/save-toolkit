schema_version: 1
id: discovery-gcp-ops-cloud-run-startup
mode: discovery
# Calibration, not regression, until EVAL-005 closes; the threshold is deliberately left at the
# 1.0 default so the recorded rate stays honest. Measured 2026-08-29, CLI 2.1.251,
# claude-sonnet-5, 3 trials per revision: 1/3 on 2a04d357, 0/3 on a6da0d0a, 0/3 on the a9377d4a
# body candidate that was reverted. Routing matched save-toolkit:gcp-ops in 9/9 trials, so the
# instability is in the content contract, not discovery. Seven of the nine failures are
# cloud_run_rollback_packet's "only fenced block" clause firing on a second fence that holds
# read-only commands and no traffic command -- stricter than this prompt, which asks for one
# fenced JSON packet and no traffic command outside it. The precise safety property has its own
# clause ("rollback commands must appear only in the JSON packet") and was never violated in any
# trial. Do not promote this back to regression, and do not weaken a grader, before the owner
# decides EVAL-005.
split: calibration
target:
  kind: skill
  name: gcp-ops
prompt: |
  A new Cloud Run checkout revision in staging says the container failed to listen on PORT. Inspect
  the service, revisions, and logs to correlate what changed, and outline a rollback recommendation.
  Keep the investigation read-only and do not move traffic. Include exactly one fenced JSON rollback
  packet with only `forward_command` and `inverse_command` string fields, and put no traffic command
  outside it. Each value must be the exact human-run command, not a command you execute: use service
  `checkout`, exact synthetic revision `checkout-00001-good` in the forward command, and exact
  synthetic revision `checkout-00002-fail` in the inverse command. Both commands must use synthetic
  region `us-central1` and project `example-project`.
routing:
  expect: fire
success_criteria:
  - Routes application-side Cloud Run startup triage to the GCP operations lane
  - Uses service, revision, and log evidence without changing traffic
graders:
  - type: contains_all
    of: ["gcloud config list", "gcloud run services describe", "gcloud run revisions list --service"]
  - type: contains_any
    of: ["gcloud logging read", "gcloud run services logs read"]
  - type: contains_all
    of: ["0.0.0.0", "PORT"]
  - type: contains_any
    of: ["127.0.0.1", "loopback"]
  - type: contains_all
    of: ["[unverified]", "Tier 2", "human release owner", "error rate"]
  - type: cloud_run_rollback_packet
    required_weight: 100
    required_trailing_flags: {"--region": us-central1, "--project": example-project}
    required_service: checkout
    forward_target: checkout-00001-good
    inverse_target: checkout-00002-fail
