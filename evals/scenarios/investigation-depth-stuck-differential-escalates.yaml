schema_version: 1
id: investigation-depth-stuck-differential-escalates
mode: direct
split: calibration
target:
  kind: skill
  name: investigation-depth
prompt: |
  Confirmed symptom on the orders API, cause unknown. We built a differential of four candidates and
  have eliminated all four. The last two rounds of tests eliminated nothing new and did not change
  the ranking. The one observation that would separate what is left is a lock-contention read inside
  the primary database, and nobody on this call holds database access. It is the middle of the night
  and the DBA on-call is asleep. What do we do next?
success_criteria:
  - Names the investigation as stuck against an observed predicate, not a feeling
  - Escalates for the missing access or expertise rather than generating more hypotheses alone
  - Does not treat waking the expert as the costlier option
graders:
  - type: contains_any
    of: ["stuck", "not converging", "no longer converging", "exhausted", "eliminated"]
  - type: regex
    pattern: '(?i)\b(?:escalat\w*|page|wake|pull in|bring in|engage|involve|ask)\b[^.\n]{0,140}\b(?:dba|database|expert|owner|specialist|on-call)\b'
  - type: contains_any
    of: ["access", "expertise", "permission", "credential-free", "read-only access"]
  - type: regex
    pattern: '(?i)(?:record\w*|nam\w*|state\b|note\b)[\s\S]{0,360}(?:stuck|what is needed|what we need|blocked|missing|access needed|access gap)|(?:stuck|blocked)[\s\S]{0,360}(?:record\w*|nam\w*|state\b|note\b)'
  - type: not_regex
    pattern: '(?i)\b(?:generate|form|develop|test|try|investigat|continue)\w*\b[^.\n]{0,120}\b(?:alone|ourselves|more hypotheses)\b[^.\n]{0,160}\b(?:then|later|tomorrow|if)\b[^.\n]{0,100}\b(?:page|escalat|wake|engage)\w*|\b(?:page|escalat|wake|engage)\w*\b[^.\n]{0,100}\b(?:later|tomorrow|if\b[^.\n]{0,50}\bfail)\b'
