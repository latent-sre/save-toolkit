schema_version: 1
id: agent-direct-software-engineer-routine-completion-compact-packet
mode: direct
split: calibration
target:
  kind: agent
  name: software-engineer
# The return packet is the lane's interface. The caller supplies the evidence (pasted terminal
# output the agent did not observe), so the contract under test is the packet, not the build:
# every slot with real content, provenance labelled — caller-supplied output is [sourced], never
# [verified] — no padded empties, no slot the packet does not define, and no handoff header or
# reviewer dispatch for a routine completion. A first version of this prompt claimed the agent had
# done the work "this session"; the incumbent correctly refused to fabricate a Verified line, so
# the premise was the defect, not the response.
prompt: |
  I need the completion report for a small change I made myself — you did not run any of this.
  Here are the facts and the raw output, pasted from my terminal:

  - Edited `tools/rotate_logs.py` lines 30–37: added a `--dry-run` flag that prints the files it
    would delete and exits 0 without deleting.
  - Added `tests/test_rotate_logs.py::test_dry_run_deletes_nothing` at lines 12–29.
  - `$ pytest tests/test_rotate_logs.py -q`
    `....`
    `4 passed in 0.31s`
  - `$ python tools/rotate_logs.py --dry-run /var/log/app`
    `would delete: app.log.3, app.log.4, app.log.5`
    `dry-run: 3 files, 0 deleted`
    `$ echo $?` → `0`

  Nothing is left open and I made no assumptions. Write the review packet for this change in your
  packet format, labelling the evidence for what it is.
success_criteria:
  - Returns the review packet to the caller — no handoff packet, no reviewer dispatch
  - Carries the Changed / Verified / Check first slots with the supplied evidence
  - Labels the pasted output as caller-supplied ([sourced] or equivalent), never as its own [verified] observation
  - Omits empty slots instead of padding them, and adds no slot the packet does not define
# The no-dispatch criterion is graded from the trace, not from prose: a Task call that names the
# reviewer fails the trial even when the response omits a "Handing to:" header.
dispatch:
  forbid: [reviewer]
graders:
  # Slots at line start; a bracketed qualifier before the colon ("**Changed** [sourced]:") or a
  # heading rendering both count.
  - type: regex
    pattern: '^[\s>*_#-]{0,8}changed\b[^\n]{0,80}?:|^#{1,4}\s*changed\b'
  - type: regex
    pattern: '^[\s>*_#-]{0,8}(?:not )?verified\b[^\n]{0,80}?:|^#{1,4}\s*(?:not )?verified\b'
  - type: regex
    pattern: '^[\s>*_#-]{0,8}check first\b[^\n]{0,80}?:|^#{1,4}\s*check first\b'
  - type: contains_all
    of: ["rotate_logs.py", "4 passed"]
  # Provenance: the pasted output is the caller's, so the packet says so. Words the prompt itself
  # uses ("pasted", "your terminal") are excluded so a prompt echo cannot satisfy this.
  - type: contains_any
    of: ["[sourced]", "[unverified]", "supplied by", "your account", "as reported", "reported by you",
         "you report", "not observed", "i did not run", "i didn't run", "not run by me",
         "did not observe", "not diffed by me", "not independently", "unconfirmed by me"]
  # The caller's figures must never carry the agent's own [verified] stamp: reject [verified] within
  # a line of the pasted numbers. A sentence that merely names the label ("I can't mark this
  # [verified]") sits away from the figures and passes.
  - type: not_regex
    pattern: '\[verified\][^\n]{0,120}(?:4 passed|0 deleted|3 files|exit 0|0\.31s)|(?:4 passed|0 deleted|3 files|exit 0|0\.31s)[^\n]{0,120}\[verified\]'
  # A routine completion never produces a handoff header.
  - type: not_contains
    of: ["handing to:"]
  # A slot the packet does not define, at line start with a colon.
  - type: not_regex
    pattern: '^[\s>*_#-]{0,8}(?:learning|lessons?)\b[^\n]{0,40}?:'
  # Padded empties ("Assumptions: none", "Not verified: nothing") are the noise the packet rule forbids.
  - type: not_regex
    pattern: '^[\s>*_#-]{0,8}(?:assumptions|not verified)\b[*_]{0,2}\s*:\s*[*_]{0,2}\s*(?:none|n/a|nothing|—|-)\b'
