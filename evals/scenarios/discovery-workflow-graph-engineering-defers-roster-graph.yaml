schema_version: 1
id: discovery-workflow-graph-engineering-defers-roster-graph
mode: discovery
split: regression
target:
  kind: skill
  name: workflow-graph-engineering
prompt: |
  Design the agent workflow graph for our change-delivery fleet: which lanes exist (coordinator,
  implementation, research, read-only independent review, human-owned effects), which lane may hand
  work to which, where a task fans out and joins, the authority boundary of each lane, and where the
  fleet terminates. This is the roster and delegation topology, not a durable executable state
  machine with checkpoints or effect handlers, and not a code dependency graph.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: agent-authoring
success_criteria:
  - Does not invoke workflow-graph-engineering for a roster/delegation graph
  - Routes to agent-authoring, the roster/delegation-graph owner
# Routing-only (2026-08-25). The response graded here comes from the ALTERNATIVE lane, and
# agent-authoring's behavioral contract is not this skill's to grade; the one-sanity-grader shape follows the
# existing _ROUTING_ONLY_DISCOVERY_SCENARIOS precedent in evals/test_graders.py, not a rule in
# evals/README.md -- that file says the opposite for negative scenarios (:194, the expected
# alternative and response graders must also pass), so this shape rests on precedent and the
# reasoning below. Measured on Sonnet, 3 trials, runs
# 20260824T205218Z-0b59db4b and 20260824T220919Z-d783ef1e: routing was correct 3/3 on both
# candidates while the wider behavioral set went red on transcript vocabulary ("lanes",
# `Agent(...)` grants, "terminal node"). The retained sanity grader is the delegation-grant set
# already widened against those three transcripts and regraded 3/3 offline; the prompt echo does
# not satisfy it.
graders:
  - type: contains_any
    of: ["delegation edge", "handoff edge", "delegation grant", "agent(", "may delegate", "delegates to", "terminal node", "no agent tool", "no agent grant"]
