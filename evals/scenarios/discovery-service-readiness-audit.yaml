schema_version: 1
id: discovery-service-readiness-audit
mode: discovery
split: regression
target:
  kind: skill
  name: service-readiness-audit
prompt: |
  Audit whether the payments service is ready to enter our operating model. This must be read-only:
  inspect the repository evidence for ownership, health checks, dashboards, alerts, SLOs, runbooks,
  dependencies, rollback, and recovery, then report severity-ranked gaps with citations. Do not
  create cards, alerts, dashboards, tickets, or onboarding artifacts.
routing:
  expect: fire
success_criteria:
  - Invokes the discoverable read-only readiness audit rather than manual onboarding
  - Reports evidence-labelled, severity-ranked findings and explicit verification gaps
  - Makes no onboarding or live-system changes
graders:
  - type: contains_any
    of: ["P0", "P1", "P2", "P3"]
  - type: contains_any
    of: ["[verified]", "[sourced]", "[unverified]"]
  - type: contains_any
    of: ["read-only", "no changes", "did not change", "did not create"]
