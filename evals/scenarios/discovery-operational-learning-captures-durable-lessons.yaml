schema_version: 1
id: discovery-operational-learning-captures-durable-lessons
mode: discovery
split: regression
target:
  kind: skill
  name: operational-learning
prompt: |
  A completed restore drill found that one runbook step is contradicted by the supplied execution
  evidence and the service card has no restore owner. Capture durable operational lessons from this
  result. No target checkout is mounted and no file change is authorized, so return evidence-bound
  proposed or blocked dispositions with one owner and explicit non-actions. Do not execute anything.
routing:
  expect: fire
success_criteria:
  - Fires operational-learning for an explicit durable-lessons closeout request
  - Keeps unsupported documentation changes proposed or blocked with evidence and one owner
  - Performs no execution or repository write
graders:
  - type: contains_all
    of: ["runbook", "service card", "evidence", "owner"]
  - type: contains_any
    of: ["proposed", "blocked"]
  - type: contains_any
    of: ["no execution", "did not execute", "executed nothing", "no command"]
