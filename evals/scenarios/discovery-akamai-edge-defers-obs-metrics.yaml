schema_version: 1
id: discovery-akamai-edge-defers-obs-metrics
mode: discovery
split: regression
target:
  kind: skill
  name: akamai-edge
prompt: |
  Akamai Edge Diagnostics has ruled out the edge. Write PromQL over our origin-service metrics to
  graph five-minute error ratio and p95 latency by service. This is metric-query construction only,
  not another edge investigation.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: obs-metrics
success_criteria:
  - Routes origin-service metric queries to the metrics lane
  - Does not reopen Akamai triage after edge evidence ruled it out
graders:
  - type: contains_any
    of: ["rate(", "histogram_quantile(", "[5m]"]
