id: discovery-reliability-defers-accepted-implementation
split: regression
# The main session treats implementation as its own job: it keeps the work, or hands it to the
# builder once a trial refuses it write tools. Either is correct; the design lanes taking accepted
# work is not. Both design lanes are taken on the first call when their descriptions match, so a
# session that keeps the work still tests their boundaries (EVAL-013).
# The workspace holds the code the assignment names, so the session engages with deadline and
# cancellation work, the reliability lane's vocabulary. The fixture must not name the answer.
prompt: |
  The service owner has accepted the reviewed design and assigned this implementation: propagate
  the request deadline through the checkout worker, cancel the ledger call, add focused tests, and
  run the suite. Change the application code now; no further design assessment is requested.
target: {kind: agent, name: reliability-engineer}
routing:
  expect: not_fire
  expected_alternative: [main_session, {kind: agent, name: software-engineer}]
tools: [Glob, Grep, Read, Skill, Task]
fixture:
  files:
    README.md: |
      # checkout-worker

      Posts one ledger entry per checkout. Run the suite with
      `python -m unittest discover -s tests -t .`.
    checkout_worker/__init__.py: ""
    checkout_worker/ledger.py: |
      """Client for the ledger service."""


      class LedgerClient:
          """Posts ledger entries over a transport; a post waits for as long as the ledger takes."""

          def __init__(self, transport):
              self._transport = transport

          def post(self, entry: dict) -> dict:
              return self._transport.send("/ledger/entries", entry)
    checkout_worker/worker.py: |
      """The checkout worker: turns an accepted checkout into a ledger entry."""

      from dataclasses import dataclass

      from .ledger import LedgerClient


      @dataclass(frozen=True)
      class CheckoutRequest:
          order_id: str
          amount: int
          deadline: float | None = None


      def process_checkout(request: CheckoutRequest, ledger: LedgerClient) -> dict:
          receipt = ledger.post({"order_id": request.order_id, "amount": request.amount})
          return {"order_id": request.order_id, "ledger_ref": receipt["ref"]}
    tests/__init__.py: ""
    tests/test_worker.py: |
      import unittest

      from checkout_worker.ledger import LedgerClient
      from checkout_worker.worker import CheckoutRequest, process_checkout


      class RecordingTransport:
          def __init__(self):
              self.sent = []

          def send(self, path, body):
              self.sent.append((path, body))
              return {"ref": f"L-{len(self.sent)}"}


      class ProcessCheckoutTests(unittest.TestCase):
          def test_posts_one_ledger_entry_for_the_order(self):
              transport = RecordingTransport()
              process_checkout(CheckoutRequest("o-1", 250), LedgerClient(transport))
              self.assertEqual([("/ledger/entries", {"order_id": "o-1", "amount": 250})], transport.sent)

          def test_returns_the_ledger_reference(self):
              result = process_checkout(CheckoutRequest("o-2", 10), LedgerClient(RecordingTransport()))
              self.assertEqual({"order_id": "o-2", "ledger_ref": "L-1"}, result)
success_criteria:
  - Keeps accepted application implementation with the main session or software-engineer; neither design lane reopens it.
