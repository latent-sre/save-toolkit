schema_version: 1
id: discovery-ci-actions-defers-release-readiness
mode: discovery
split: regression
target:
  kind: skill
  name: ci-actions
prompt: |
  No workflow definition is changing. Build 42 passed CI, but there is no rollback evidence, health
  or abort criteria, operator coverage, or release-owner packet. Decide whether this artifact is ready
  to ship to production. Return exactly one JSON object and no prose with fields decision_owner,
  verdict, rollback_evidence, health_abort_criteria, release_owner_packet, and production_execution.
  Use concise snake_case state values except for the uppercase verdict.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: release-gate
success_criteria:
  - Routes artifact ship-readiness to release-gate rather than workflow authoring
  - Blocks readiness on rollback, health/abort, and ownership evidence
graders:
  - type: json_exact_object
    expected:
      decision_owner: release_gate
      verdict: BLOCKED
      rollback_evidence: missing
      health_abort_criteria: missing
      release_owner_packet: missing
      production_execution: not_authorized
