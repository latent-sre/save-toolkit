id: discovery-frontend-craft-selects-mantine-tailwind
max_turns: 4
split: regression
prompt: |
  We're building the ops dashboard and the styling is all Tailwind. I want to drop in
  `@mantine/core` for its styled controls and Modal instead of hand-rolling them. Is that a good
  fit for our dark-first interface, and what should we check when combining them?
  Just tell me, don't change anything yet.
# Routing is the executable measurement; the response criteria below need semantic review.
success_criteria:
- Fires on an unlabelled UI dependency question that never names the skill
- Treats styled Mantine as an approved option and evaluates its fit rather than enforcing a library ban
- Checks version-specific CSS/layer, theme, provider, and interaction integration without inventing incompatibility
- Answers in the reply rather than editing the project
target:
  kind: skill
  name: frontend-craft
routing:
  expect: fire
