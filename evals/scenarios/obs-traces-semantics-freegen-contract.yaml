id: obs-traces-semantics-freegen-contract
max_turns: 17
split: regression
skill: obs-traces
tools: [Skill, Read]
references:
  - skills/obs-traces/references/otel-semantics.md
prompt: |
  Read the OpenTelemetry-semantics reference. Answer with attribute name and maturity
  (Stable or Development), one per labelled line formatted exactly as
  "Label: <attribute> <maturity>" (space-separated, no extra punctuation or explanation);
  do not run queries or edit files. Using OpenTelemetry semantic conventions v1.44.0, identify: A: one
  concrete instance of a service, distinct from the service name; B: the downstream
  server address a client span called; C: the route template of an HTTP operation;
  D: the database collection or table a database span touched; E: the messaging
  destination of a messaging span.
success_criteria:
  - Names Stable instance, peer, route, and database-target attributes; labels messaging.destination.name Development.
graders:
  - type: regex
    pattern: '(?m)^A:[ \t]*service\.instance\.id[ \t]+Stable[ \t]*$'
  - type: regex
    pattern: '(?m)^B:[ \t]*server\.address[ \t]+Stable[ \t]*$'
  - type: regex
    pattern: '(?m)^C:[ \t]*http\.route[ \t]+Stable[ \t]*$'
  - type: regex
    pattern: '(?m)^D:[ \t]*db\.collection\.name[ \t]+Stable[ \t]*$'
  - type: regex
    pattern: '(?m)^E:[ \t]*messaging\.destination\.name[ \t]+Development[ \t]*$'
