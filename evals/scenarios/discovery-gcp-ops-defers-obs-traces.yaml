schema_version: 1
id: discovery-gcp-ops-defers-obs-traces
mode: discovery
split: regression
target:
  kind: skill
  name: gcp-ops
prompt: |
  A single checkout request on Cloud Run is slow and I have its Cloud Trace trace ID. Show how to
  follow that request across services and identify which span consumed the latency. This is trace
  interpretation only, not a general incident investigation.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: obs-traces
success_criteria:
  - Keeps Cloud Trace request-path analysis in the traces lane
  - Does not expand a trace-interpretation request into GCP service triage
graders:
  - type: contains_all
    of: ["Trace explorer", "service", "latency", "status", "TraceQL does not apply"]
  - type: contains_all
    of: ["critical path", "nested span durations", "known-normal"]
  - type: contains_all
    of: ["absolute UTC window", "sampling caveat", "[unverified]"]
