schema_version: 1
id: discovery-external-researcher-defers-live-incident
mode: discovery
split: regression
target:
  kind: agent
  name: researcher
prompt: |
  Production checkout latency jumped from 250 ms to 8 seconds after a deploy. Triage severity,
  establish blast radius and a timeline, test hypotheses from our live signals, and recommend the
  fastest safe mitigation without changing production.
routing:
  expect: not_fire
  expected_alternative:
    kind: agent
    name: sre
success_criteria:
  - Keeps live production triage out of the external documentation lane
  - Delegates to sre without claiming a live change
graders:
  - type: contains_any
    of: ["severity", "sev", "blast radius"]
  - type: contains_any
    of: ["timeline", "hypothesis", "signals"]
  - type: not_contains
    of: ["I rolled back", "I restarted", "mitigation applied"]
