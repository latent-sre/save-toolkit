id: discovery-service-lifecycle-audit
split: regression
prompt: |
  Is the payments service operationally ready? We want to catch anything that would bite us before
  it takes more traffic. It has an on-call runbook covering restart and escalation, but as far as I
  know nobody has ever defined a service-level objective for it, and I don't think anyone has ever
  actually tried restoring it from a backup to see whether that works.
success_criteria:
- Audits the named service read-only and returns severity-ranked findings with evidence
- Flags the missing SLO and the unproven restore/recovery path as findings, not assumptions
- Makes no claim that anything live was changed
target:
  kind: skill
  name: service-lifecycle
routing:
  expect: fire
