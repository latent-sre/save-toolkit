id: incident-qualification-v1-01
split: regression
target:
  kind: skill
  name: incident-investigation
routing:
  expect: fire
max_turns: 24
tools:
- Skill
- Read
- Task
prompt: |
  The on-call lead for Lumen Photos wants advice about an ongoing incident: people are waiting too long for large image previews. Assess the current situation and recommend the next practical steps from these records. I am the support engineer on the incident bridge. I can export the read-only job outcome view and preview gateway charts, and ask the media platform operator for another export. I have no worker shell or cache administration access. The incident lead owns severity and recovery decisions; the media operator can change worker capacity or cache settings only with the lead's approval. No change has been approved for me or for an assistant.

  All times below are UTC on 2026-11-10. The copied source records are also in evidence.md.

  M1 — preview-gateway chart, exported 13:14. Window 13:05:00–13:10:00; all preview sizes in both regions; 24,000 HTTP attempts, including retries; attempt-latency p95 420 ms; 480 HTTP 5xx attempts. It does not join attempts to jobs or people.
  M2 — job-outcomes export, produced 13:14. Cohort: exactly 160 distinct large-preview jobs accepted in both regions during 13:05:00–13:09:00. Outcome definition: preview available within 120 seconds of acceptance. Exactly 112 met the deadline and 48 missed it. Every job's deadline had elapsed before export; no duplicate job IDs and no missing outcomes. This view excludes small previews and counts jobs, not HTTP attempts.
  M3 — queue gauge, sampled 13:10:00. Both regions, large-preview queue only: 720 distinct jobs waiting; oldest waiting job age 310 seconds. This is a point-in-time inventory, not a count of jobs accepted during M1 or M2.
  M4 — platform incident notes, entered 13:13. A new image format became popular at 12:58. Media operator sees decoding time higher for that format, but has not exported a job-matched breakdown. Worker count is unchanged. The operator is investigating both per-job decode cost and queue pressure. A cache invalidation is proposed for 13:16; it has not run yet.
