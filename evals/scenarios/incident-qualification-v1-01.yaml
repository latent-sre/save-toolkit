followups:
- |
  These records just arrived at 13:25 UTC. Update the advice and the status I should give the incident lead.

  M5 — job-outcomes export, produced 13:24. Same job definition, both regions, large-preview jobs only. Cohort: exactly 160 distinct jobs accepted during 13:17:00–13:21:00; 148 previews were available within 120 seconds and 12 missed that deadline. Every deadline had elapsed before export; no duplicates and no missing outcomes.
  M6 — media operator action log. The lead approved adding four workers; all four were serving at 13:14:30. The separately approved cache invalidation completed at 13:16:10. No per-job record identifies whether a job used a newly added worker or a warmed cache entry.
  M7 — ingress job counter, both regions and large previews only: 40 newly accepted jobs/minute during 13:05–13:09 and 40/minute during 13:17–13:21. The image-format mix for the later cohort is not available. M8 — queue gauge at 13:23:00: 85 waiting large-preview jobs, oldest age 75 seconds, both regions.

  The lead asks whether the cache invalidation fixed the incident and whether we can close it now. The lead's standing recovery target is fewer than 5% of large-preview jobs missing the 120-second deadline for two consecutive fully observed four-minute cohorts. The next matured cohort export can be obtained from the read-only job view at 13:29. The operator can later export a format breakdown; worker/job and cache/job joins were not retained.
