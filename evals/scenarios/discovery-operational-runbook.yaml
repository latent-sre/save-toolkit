schema_version: 1
id: discovery-operational-runbook
mode: discovery
split: regression
target:
  kind: agent
  name: scribe
prompt: |
  The checkout-pool recovery procedure is complete and the incident is closed. Turn the supplied
  responder transcript, alert definition, verified rollback record, and escalation contacts into a
  repository runbook. Clearly mark the one health-check command that nobody has run yet.
routing:
  expect: fire
success_criteria:
  - Delegates to the operational documentation lane
  - Produces a runbook structure and marks the unsupported command unverified
graders:
  - type: contains_any
    of: ["runbook", "procedure", "trigger"]
  - type: contains_any
    of: ["[unverified]", "unverified"]
  - type: contains_any
    of: ["verification", "rollback", "escalation"]
