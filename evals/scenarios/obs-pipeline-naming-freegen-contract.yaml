id: obs-pipeline-naming-freegen-contract
max_turns: 17
split: regression
skill: obs-pipeline
tools: [Skill, Read]
references:
  - skills/obs-pipeline/references/otel-sdk.md
prompt: |
  Read the OTel SDK reference and use the pipeline skill's emitted naming contract.
  Answer with names only, one per labelled line, no explanation; do not edit files.
  A: the metric name and unit for HTTP server request duration under current
  OpenTelemetry conventions. B: how the HTTP method of a request is recorded.
  C: a custom unitless Counter counting discrete jobs, named jobs.processed or job.processed.
  D: a custom UpDownCounter counting active jobs, named jobs.active or job.active.
success_criteria:
  - Uses the current duration name and unit and records method as a dimension value.
  - Pluralizes discrete unitless Counter countables (jobs.processed), keeps unit-bearing names singular, and keeps UpDownCounter names singular (job.active).
graders:
  - type: regex
    pattern: 'http\.server\.request\.duration'
  - type: regex
    pattern: 'seconds|\bs\b'
  - type: regex
    pattern: '(?i)dimension|label|tag|attribute'
  - type: regex
    pattern: '(?m)^C:\s*jobs\.processed\s*$'
  - type: regex
    pattern: '(?m)^D:\s*job\.active\s*$'
