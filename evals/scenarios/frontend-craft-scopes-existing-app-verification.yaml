id: frontend-craft-scopes-existing-app-verification
max_turns: 12
split: regression
skill: frontend-craft
tools: [Skill, Read]
prompt: |
  Choose the verification scope for four independent UI requests. This is a supplied-state
  planning exercise: do not build, run commands, install tools, or edit files. Each repository
  has working typecheck, lint, component tests, a production build, a real backend and production
  serving checks. Host Playwright MCP is available.

  A. An existing Vue app supports light theme at desktop and tablet widths (768 px and wider).
  Change one Orders form's validation message and inline retry control. Its loading, success,
  validation-error and retry states can be affected. Nothing shared with another view changes.
  The caller requests only that form change and has not asked for another theme or framework.

  B. In the same app, change a shared async-status component used in Orders and Exports. The
  component owns loading, stale and error displays; unrelated views do not consume it.

  C. In the same app, change global typography, focus styles and layout rules used by all views.

  D. Build a new app with Orders and Exports workflows, light and dark themes, desktop and mobile
  use. Every required workflow and its loading, empty, success, error and stale states must work.

  Return one line per field as <field>: <choice>, with no extra prose. Select from each pair:
  - a_deliverable: REQUESTED_FORM_CHANGE | REBUILD_COMPLETE_APPLICATION
  - a_workflows: ORDERS_AND_AFFECTED_STATES | ALL_VIEWS_AND_STATES
  - a_presentations: LIGHT_DESKTOP_AND_TABLET | ADD_DARK_AND_320PX_SUPPORT
  - a_framework: KEEP_VUE | MIGRATE_TO_REACT
  - b_workflows: ORDERS_EXPORTS_AND_AFFECTED_STATES | ORDERS_ONLY
  - c_workflows: APPLICATION_WIDE | ONE_SAMPLE_VIEW
  - d_workflows: EVERY_REQUIRED_WORKFLOW_VIEW_AND_STATE | ONE_HAPPY_PATH
  - d_presentations: LIGHT_DARK_DESKTOP_AND_320PX | DESKTOP_LIGHT_ONLY
  - backend_checks: RUNNING_BACKEND_FOR_SCOPED_WORKFLOWS | MOCKS_SUFFICE
  - serving_checks: SERVED_PRODUCTION_BUILD | DEV_SERVER_ONLY
  - accessibility_checks: AXE_KEYBOARD_FOCUS_AND_CONSOLE | SCREENSHOTS_ONLY
success_criteria:
  - A small existing-app change stays within the requested deliverable and verifies affected workflows, states and supported presentations.
  - Shared-component changes cover their consuming workflows and global changes expand across the app.
  - New apps retain full workflow, state, theme and viewport verification.
  - Scoping preserves real-backend integration, production serving, accessibility and console checks without migrating the existing app.
graders:
  - type: exact_fields
    fields:
      a_deliverable: REQUESTED_FORM_CHANGE
      a_workflows: ORDERS_AND_AFFECTED_STATES
      a_presentations: LIGHT_DESKTOP_AND_TABLET
      a_framework: KEEP_VUE
      b_workflows: ORDERS_EXPORTS_AND_AFFECTED_STATES
      c_workflows: APPLICATION_WIDE
      d_workflows: EVERY_REQUIRED_WORKFLOW_VIEW_AND_STATE
      d_presentations: LIGHT_DARK_DESKTOP_AND_320PX
      backend_checks: RUNNING_BACKEND_FOR_SCOPED_WORKFLOWS
      serving_checks: SERVED_PRODUCTION_BUILD
      accessibility_checks: AXE_KEYBOARD_FOCUS_AND_CONSOLE
