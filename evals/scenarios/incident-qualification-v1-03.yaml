followups:
- |
  At 11:17 UTC the publishing operator returns these audit records and current probes. Please update the advice.

  T5 — release audit, exported 11:16. Both serving pools use a synchronized clock. In amber, the first client response from R74 was 11:09:12; in blue it was 11:10:03. The completed-response audit is complete for both regions. All public street-map client responses before those times were served by R73. This export records completed responses only; it does not contain request-admission times, process start times, or work performed before a response completes. Staging at 11:01 and shared metadata invalidation at 11:02 in T3 are confirmed. Reverting serving traffic to R73 would not undo that metadata invalidation.
  T6 — customer synthetic freshness export, created 11:16. Same public street-map probe population and age definition as T1. Each region's p95 age was 14 minutes at 11:10 and 19 minutes at 11:15. No private tileset samples are included.
  T7 — publishing operator note. There is no retained per-query metadata-store trace. A read-only store saturation graph and the feeder owner's current status can be exported within three minutes. Rebuilding metadata would be a separate production action; neither rebuild nor rollback is approved. R73 is still available as a serving target.

  The lead asks what the release timing establishes about the first observed degradation, and whether rollback is a justified immediate recommendation. We need a useful next action now.
