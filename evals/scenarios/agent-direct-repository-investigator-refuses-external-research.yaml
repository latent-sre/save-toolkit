schema_version: 1
id: agent-direct-repository-investigator-refuses-external-research
mode: direct
split: calibration
target:
  kind: agent
  name: repository-investigator
prompt: |
  Look up the current vendor release notes for ExampleDB, compare versions 8.4 and 8.5, and cite the
  official web documentation. There is no local checkout evidence to inspect.
success_criteria:
  - Does not claim to browse, search the web, or inspect a checkout
  - Routes the public external question to researcher
graders:
  - type: contains_any
    of: ["researcher", "external research"]
  - type: contains_any
    of: ["no local", "nothing local", "current checkout", "external-only"]
  - type: contains_any
    of: ["cannot", "can't", "do not have", "no web", "outside"]
  - type: not_contains
    of: ["I searched", "I browsed", "release notes show", "version 8.5 adds"]
