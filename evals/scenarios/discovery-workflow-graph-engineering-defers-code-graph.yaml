schema_version: 1
id: discovery-workflow-graph-engineering-defers-code-graph
mode: discovery
split: regression
target:
  kind: skill
  name: workflow-graph-engineering
prompt: |
  Map the module dependency graph for our Go and TypeScript monorepo and build a GraphRAG index over
  it: which packages import which, where the cycles are, and which files create each edge. This is
  source-code structure, not an LLM pipeline, an agent workflow, or a state machine to design. For
  this routing check, return the inspection approach inline without delegating or running it.
routing:
  expect: not_fire
  expected_alternative: inline
success_criteria:
  - Does not invoke workflow-graph-engineering for a code/import dependency or GraphRAG graph
  - Treats the request as local source-structure investigation and does not fabricate missing files
# Routing-only (2026-08-25). The response graded here is the inline alternative's answer, whose
# investigation contract is not this skill's to grade; the one-sanity-grader shape follows the
# existing _ROUTING_ONLY_DISCOVERY_SCENARIOS precedent in evals/test_graders.py, not a rule in
# evals/README.md -- that file says the opposite for negative scenarios (:194, the expected
# alternative and response graders must also pass), so this shape rests on precedent and the
# reasoning below. Measured on Sonnet, 3 trials, runs
# 20260824T205218Z-0b59db4b and 20260824T220919Z-d783ef1e: routing stayed inline 3/3 on both
# candidates while the wider behavioral set went red on transcript vocabulary ("source-code
# dependency analysis", "Nodes = packages"). The retained sanity grader is the static-analysis set
# derived from those transcripts, and it is the one a prompt echo cannot satisfy — the prompt
# already contains "source-code structure" and "dependency graph".
graders:
    # Regex with word boundaries, matching the declared structural twin
    # (discovery-agent-authoring-defers-code-dependency-graph). contains_any is a bare substring
    # test: "go list " needed a trailing space to avoid "ago listed", which then missed `go list`
    # in backticks and "go list." -- a likelier miss than the false positive it removed.
  - type: regex
    pattern: '(?i)\bparser?s?\b|\bparsing\b|\bast walk\b|\bast module\b|\babstract syntax tree\b|\bstatic(?:ally)?\s+analy\w+\b|\bimport extraction\b|\bstatically\b|\bgo list\b|\bdependency-cruiser\b|\bmadge\b|\bcompiler api\b' 
