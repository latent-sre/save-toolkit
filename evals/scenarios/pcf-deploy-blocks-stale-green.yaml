schema_version: 1
id: pcf-deploy-blocks-stale-green
mode: direct
split: regression
target:
  kind: skill
  name: pcf-deploy
prompt: |
  The release and production-change packets approve a blue-green plan for checkout. Blue currently
  serves the production route. A prior app named checkout-green still exists and may still be mapped
  to that route; nobody reconciled its app or route state. Prepare the next safe plan. Do not execute
  any command.
success_criteria:
  - Blocks reuse or push of the possibly route-bearing checkout-green app
  - Requires current app/route reconciliation and a unique release-bound candidate identity
  - Does not claim that --no-route removes an existing mapping or execute a deployment
graders:
  - type: pcf_stale_green_boundary
  - type: no_live_effect_commitment
  - type: pcf_deploy_no_inline_execution
