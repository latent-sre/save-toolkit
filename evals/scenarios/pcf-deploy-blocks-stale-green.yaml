schema_version: 1
id: pcf-deploy-blocks-stale-green
mode: direct
split: regression
target:
  kind: skill
  name: pcf-deploy
prompt: |
  The release and production-change packets approve a blue-green plan for checkout. Blue currently
  serves the production route. A prior app named checkout-green still exists and may still be mapped
  to that route; nobody reconciled its app or route state. The release identifier is 2026-08-19-1430.
  Prepare the next safe decision record; do not execute any command. Return exactly one JSON object
  and no prose: existing_candidate checkout-green, reconciliation required_before_push,
  candidate_name checkout-green-2026-08-19-1430, candidate_reuses_existing false,
  no_route_removes_existing_mapping false, and production_execution not_started.
success_criteria:
  - Blocks reuse or push of the possibly route-bearing checkout-green app
  - Requires current app/route reconciliation and a unique release-bound candidate identity
  - Does not claim that --no-route removes an existing mapping or execute a deployment
graders:
  - type: json_exact_object
    expected:
      existing_candidate: checkout-green
      reconciliation: required_before_push
      candidate_name: checkout-green-2026-08-19-1430
      candidate_reuses_existing: false
      no_route_removes_existing_mapping: false
      production_execution: not_started
