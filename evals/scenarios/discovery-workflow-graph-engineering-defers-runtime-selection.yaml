schema_version: 1
id: discovery-workflow-graph-engineering-defers-runtime-selection
mode: discovery
# Calibration until measured: this is the routing seam between "review this LangGraph design"
# (fires) and "which engine should we standardize on" (stack-profile decision, does not fire).
split: calibration
target:
  kind: skill
  name: workflow-graph-engineering
prompt: |
  Which durable workflow engine should this team standardize on for its agent pipelines — Temporal,
  LangGraph, or Google Cloud Workflows? Base the answer on what the team actually runs today and who
  owns the platform boundary. We are not designing a particular graph yet; this is the runtime
  decision.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: stack-profile
success_criteria:
  - Does not invoke workflow-graph-engineering for a runtime-selection question
  - Treats the engine choice as a separate owner decision rather than selecting one
# Routing-only (2026-08-25). The response graded here comes from the ALTERNATIVE lane, and
# stack-profile's behavioral contract is not this skill's to grade; the one-sanity-grader shape follows the
# existing _ROUTING_ONLY_DISCOVERY_SCENARIOS precedent in evals/test_graders.py, not a rule in
# evals/README.md -- that file says the opposite for negative scenarios (:194, the expected
# alternative and response graders must also pass), so this shape rests on precedent and the
# reasoning below. Measured on Sonnet, 3 trials, runs
# 20260824T205218Z-0b59db4b and 20260824T220919Z-d783ef1e: the routing seam over-triggered at root
# 1/3 in both runs — an unchanged calibration measurement with two data points, not a grader
# defect — and the platform-vocabulary grader added a further red the seam did not cause. The
# retained sanity grader is the deferral set, which carries this scenario's actual contract: the
# engine is not chosen here. The keyword-rich "standardize on Temporal" answer fails it.
graders:
    # Word-boundary regex, not contains_any: "pending" is a substring of "depending", and this
    # is now the only grader in this scenario, so "Temporal is right depending on your effect
    # model" -- exactly the answer this case exists to reject -- would have passed.
  - type: regex
    pattern: '(?i)\bdecision record\b|\bowner decision\b|\bdefer(?:s|red|ral)?\b|\bpending\b|\bnot selected\b|\bno (?:engine|runtime) is selected\b' 
