schema_version: 1
id: discovery-workflow-graph-engineering-defers-runtime-implementation
mode: discovery
# Calibration: the expected alternative is an agent, and agent-target discovery is model-dependent
# calibration only (evals/README.md, EVAL-002). A red here is "not dispatched", not "misrouted".
split: calibration
target:
  kind: skill
  name: workflow-graph-engineering
prompt: |
  Implement the already-approved fulfilment workflow graph in this repo: write
  services/fulfilment/graph.py against the design contract in docs/design/fulfilment-graph.md, wire
  the checkpoint store the contract names, and add pytest coverage for the retry and cancel paths.
  The design is done and accepted; this is a code change, not a design question, a review, or a
  runtime selection.
routing:
  expect: not_fire
  expected_alternative:
    kind: agent
    name: sde
  # Root scope: this contract is about which lane OWNS the request. A routed sde may legitimately
  # load workflow-graph-engineering to read the accepted contract while implementing it; the
  # forbidden target must stay absent from the ROOT session and sde must be dispatched there.
  # Measured 2026-08-24 on Sonnet (3 trials): root dispatched sde 3/3 and loaded the skill 0/3;
  # the nested sde loaded it 2/3.
  scope: root
success_criteria:
  - Does not invoke workflow-graph-engineering to implement an accepted design
  - Dispatches the build lane at the root session and names the artifact it owns
# Routing-only (2026-08-25). The response graded here comes from the routed `sde`, whose
# evidence-disclosure contract belongs to discovery-sde-build-cli-with-tests, not to this skill;
# evals/README.md reserves the one-sanity-grader shape for exactly that case. Measured on Sonnet,
# 3 trials, runs 20260824T205218Z-0b59db4b and 20260824T220919Z-d783ef1e: root routing was correct
# 3/3 on both candidates while the borrowed disclosure grader went red 1/3 each time. The retained
# sanity grader is the artifact/lane set, which passed 3/3 in both runs. It is deliberately
# satisfiable by the prompt's own nouns: for an agent-target calibration case the routing verdict
# comes from the invocation trace, and this grader only keeps a tool-less routed answer gradable.
graders:
  - type: contains_any
    of: ["sde", "build lane", "implementation lane", "graph.py", "fulfilment", "fulfillment"]
