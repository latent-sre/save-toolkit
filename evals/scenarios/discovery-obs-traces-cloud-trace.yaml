id: discovery-obs-traces-cloud-trace
split: regression
prompt: |
  A single checkout request on Cloud Run is slow and I have its Cloud Trace trace ID. Show how to
  follow that request across services and identify the latency-controlling span without
  double-counting nested spans. Include a known-normal comparison, sampling limits, and the UTC
  window that bounds the evidence. This is trace interpretation only, not a general incident
  investigation.
success_criteria:
- Routes Cloud Trace request-path analysis to the traces lane
- Uses the critical path without double-counting and bounds the comparison and sampling claims
target:
  kind: skill
  name: obs-traces
routing:
  expect: fire
