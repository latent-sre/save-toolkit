id: discovery-runtime-boundary
split: regression
prompt: |
  For an application we need to ship next week, should this team standardize its deployment and
  alerting around EKS and the Prometheus Operator? Base the answer on what the team actually runs
  today and call out ownership boundaries.
success_criteria:
- Loads the team's current stack definition before recommending a runtime
- Rejects Kubernetes as the current target and identifies PCF/TAS and the platform boundary
target:
  kind: skill
  name: stack-profile
routing:
  expect: fire
