schema_version: 1
id: discovery-local-investigator-defers-review
mode: discovery
split: calibration
target:
  kind: agent
  name: repository-investigator
prompt: |
  Review the authorization changes in this pull request for correctness and security, assign
  severities, and give a merge verdict. Do not edit the change.
routing:
  expect: not_fire
  expected_alternative:
    kind: agent
    name: reviewer
success_criteria:
  - Keeps change review and merge verdicts out of the repository-investigation lane
  - Delegates to reviewer
graders:
  - type: contains_any
    of: ["reviewer", "review"]
  - type: contains_any
    of: ["authorization", "correctness", "security"]
  - type: contains_any
    of: ["verdict", "merge", "request changes", "approve"]
