checks:
- check: no_workspace_changes
  text: recorded evidence is unchanged
- check: no_new_commits
  text: no commits are created
- check: command_exit_zero
  command: python -c "raise SystemExit(2)"
  inconclusive_exit_code: 2
  failure_exit_code: 10
  text: interpretation requires separate source-bound manual review
