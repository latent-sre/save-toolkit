id: discovery-obs-dashboard-design
split: regression
prompt: |
  Design a service-health dashboard for the checkout on-call engineer. Which panels and drill-downs
  should it contain, and how should missing telemetry appear? We are deciding the layout and
  information hierarchy only; do not connect to an instance or create resources.
target:
  kind: skill
  name: obs-dashboards
routing:
  expect: fire
success_criteria:
- Selects dashboard design for panel and information-hierarchy decisions without starting live operations
