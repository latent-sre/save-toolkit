id: discovery-frontend-craft-weighs-mantine-in-tailwind-app
max_turns: 4
split: regression
prompt: |
  We're building the ops dashboard and the styling is all Tailwind. I want to drop in
  `@mantine/core` for its DataTable and Modal instead of hand-rolling them — saves me most of a
  week. Any reason not to? Just tell me, don't change anything yet.
success_criteria:
- Fires on an unlabelled UI dependency question that never names the skill
- "Says Mantine may join the Tailwind app as a second kit, with no house ban and no one-kit rule, under the mixing rules: a declared CSS layer order with Mantine's layered stylesheet, MantineProvider, the app's theme tokens bridged into Mantine's theme, and one dialog system for the app"
- "Names the costs honestly (a second styling system and provider, bundle growth to measure, two sources of dialog behaviour) without claiming Mantine and Tailwind are technically incompatible, and offers the lighter alternative for the table and modal on the app's existing kit"
- Answers in the reply rather than editing the project
target:
  kind: skill
  name: frontend-craft
routing:
  expect: fire
