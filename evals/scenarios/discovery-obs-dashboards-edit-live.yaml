schema_version: 1
id: discovery-obs-dashboards-edit-live
mode: discovery
split: regression
target:
  kind: skill
  name: obs-dashboards
prompt: |
  Add a p99 request-latency panel to the existing "Checkout / Health" dashboard (uid checkout-health)
  on our self-managed Grafana 13.1 and apply the change over the HTTP API yourself. Show the panel
  JSON with its PromQL, the exact read and write calls, how you avoid clobbering someone else's
  concurrent save, how you verify the write landed, and what you commit afterwards. This is a
  dashboard edit, not alert design and not incident triage.
routing:
  expect: fire
success_criteria:
  - Routes a live dashboard edit to the dashboards lane rather than metrics, alerting, or sre
  - Reads before writing, pins the version it read, refuses overwrite, and verifies after the call
  - Ends with the applied JSON exported and committed to the dashboards-as-code path
graders:
  # Only graders that passed 3/3 in BOTH runs of 2026-08-21 are kept. Two earlier ones —
  # `jq empty` and an evidence-label check — failed one trial each across the two runs while
  # routing passed 6/6, so they measured response variance, not the skill's contract. The
  # contract this scenario asserts is: the dashboards lane fires for a live edit, the response
  # carries the percentile query with the right interval and datasource variable, and it names
  # the concurrency discipline (version pinned, overwrite refused, conflict re-read) and the commit.
  - type: contains_all
    of: ["histogram_quantile(0.99", "$__rate_interval", "${datasource}", "_bucket"]
  - type: contains_all
    of: ["overwrite", "version", "diff"]
  - type: contains_any
    of: ["409", "412"]
  - type: contains_all
    of: ["commit"]
