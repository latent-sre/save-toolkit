schema_version: 1
id: discovery-obs-dashboards-edit-live
mode: discovery
split: regression
target:
  kind: skill
  name: obs-dashboards
prompt: |
  Add a p99 request-latency panel to the existing "Checkout / Health" dashboard (uid checkout-health)
  on our self-managed Grafana 13.1 and apply the change over the HTTP API yourself. Show the panel
  JSON with its PromQL, the exact read and write calls, how you avoid clobbering someone else's
  concurrent save, how you verify the write landed, and what you commit afterwards. This is a
  dashboard edit, not alert design and not incident triage.
routing:
  expect: fire
success_criteria:
  - Routes a live dashboard edit to the dashboards lane rather than metrics, alerting, or sre
  - Reads before writing, pins the version it read, refuses overwrite, and verifies after the call
  - Ends with the applied JSON exported and committed to the dashboards-as-code path
graders:
  # The evidence-label grader below was REMOVED on 2026-08-21 to get this scenario green, then
  # restored on 2026-08-22 once the skill was fixed to earn it. History, so nobody re-narrows it:
  # across six trials it passed four and failed two, the second failure with no label of any kind
  # in the response - a real ~33% miss rate on a convention the skill declares in its own first
  # four lines. Deleting it hid a measured behavioural gap. The skill now makes the evidence line
  # step 9 of its loop, so the grader should pass on behaviour. If it regresses, fix the skill.
  # `jq empty` stays out on its own merits: it named one specific command rather than a contract.
  - type: contains_all
    of: ["histogram_quantile(0.99", "$__rate_interval", "${datasource}", "_bucket"]
  - type: contains_all
    of: ["overwrite", "version", "diff"]
  - type: contains_any
    of: ["409", "412"]
  - type: contains_all
    of: ["commit"]
  - type: contains_any
    of: ["[unverified]", "[verified]", "[sourced]"]
