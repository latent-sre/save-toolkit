schema_version: 1
id: discovery-obs-dashboards-edit-live
mode: discovery
split: regression
target:
  kind: skill
  name: obs-dashboards
prompt: |
  Prepare the exact execution procedure for adding a p99 request-latency panel to the existing
  "Checkout / Health" dashboard (uid checkout-health) on self-managed Grafana 13.1. This discovery
  case has no HTTP or file tools, so do not claim the live change was applied. Mark the procedure
  [unverified] and show the panel JSON with its PromQL, the exact read and write calls, how an
  operator avoids clobbering someone else's concurrent save, how they verify the write landed, and
  what record survives afterwards. This is a dashboard edit, not alert design or incident triage.
routing:
  expect: fire
success_criteria:
  - Routes a dashboard-edit procedure to the dashboards lane rather than metrics, alerting, or sre
  - Reads before writing, pins the version it read, refuses overwrite, and verifies after the call
  - Records the change in the save message, the only durable trace of an instance-only write
graders:
  # Grader history, recorded as fact rather than instruction:
  # The evidence-label grader below was removed on 2026-08-21 to make this scenario green, then
  # restored on 2026-08-22 after the skill was changed to earn it. Across six trials it had passed
  # four and failed two, the second failure with no evidence label of any kind in the response - a
  # measured ~33% miss rate on a convention the skill states in its own opening lines.
  # The `commit` grader was replaced on 2026-08-22: the owner recorded that dashboards are managed
  # in Grafana only, with no repository copy, so a committed artefact is not something the skill can
  # produce. The save message and version history are the durable record it asserts instead.
  - type: contains_all
    of: ["histogram_quantile(0.99", "$__rate_interval", "${datasource}", "_bucket"]
  # Tightened 2026-08-22 after an adversarial review showed the previous substring set green-lit a
  # wrong answer: `contains_all: [overwrite, version, diff]` passed on "overwrite: true", "diff
  # omitted"; `contains_any: [409, 412]` passed on "ignore the 409"; `contains_any: [message,
  # version history]` passed on "no save message/version history". Presence of a word is not the
  # posture. The replacements below name the concurrency token and use ADJACENCY - the conflict code
  # and the next read must land within ~160 chars of each other - which a "just ignore it" answer
  # cannot produce. Re-read, re-fetch, re-GET, and "GET ... again" are equivalent spellings.
  # Measured against three fixtures: the wrong answer above goes red on five of
  # these, a correct answer green, and a correct answer that *names* the anti-pattern ("never set
  # overwrite: true") also green.
  # A `not_regex` on `overwrite: true` was designed and REJECTED: it false-reds that third fixture,
  # failing a response for correctly warning against the thing. Grader 2 catches the same case
  # positively and cannot be gamed by anti-pattern prose.
  - type: regex
    pattern: '(metadata\.)?resourceVersion|dashboard\.version|overwrite["'' ]*[:=]["'' ]*false'
  - type: regex
    pattern: '(409|conflict)[\s\S]{0,160}?(?:re-?(?:read|fetch|get)|get\b[^\n]{0,80}\bagain)|(?:re-?(?:read|fetch|get)|get\b[^\n]{0,80}\bagain)[\s\S]{0,160}?(409|conflict)'
  - type: not_regex
    pattern: 'diff (is )?(omitted|skipped|not shown)|diff omitted'
  - type: regex
    pattern: 'read .{0,12}back|re-?read after|after\.json|(?:verify|confirm)[\s\S]{0,100}?(?:fresh read|re-?read|get\b[^\n]{0,100}?(?:dashboard|checkout-health))|(?:get|fetch)\b[^\n]{0,140}\bagain[^\n]{0,80}\b(?:confirm|verify)'
  - type: regex
    pattern: '(grafana\.app/message|save message|message)[\s\S]{0,200}?(version history|/versions)'
  - type: not_regex
    pattern: 'no (save )?message|without a (save )?message|no version history|no save message/version history'
  - type: contains_any
    of: ["[unverified]", "[verified]", "[sourced]"]
