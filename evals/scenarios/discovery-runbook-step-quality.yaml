schema_version: 1
id: discovery-runbook-step-quality
mode: discovery
split: regression
target:
  kind: skill
  name: runbook
# GRADER SURFACE (learned from the 2026-08-26 sonnet run, $2.31, 2 trials/scenario):
# graders run against the MAIN SESSION'S FINAL TEXT only. In trial 1 this skill correctly delegated
# the build to save-toolkit:software-engineer; the code landed in files and the session returned a
# summary, so five content graders failed while the skill behaved perfectly. Trial 2 kept the work
# inline and four of the same five passed. Same prompt, near-opposite grades -- the graders were
# measuring where the work happened, not whether it was right.
# The fix is prompt shape, not grader wording: ask for a JUDGMENT, which must be spoken, instead of
# an ARTIFACT, which may be written to disk. Routing was the one signal stable across both trials
# and is kept.
# Reviewing a draft rather than authoring one. The three defects are the ones step-craft names:
# an expected-output line that only describes success, an unbounded retry, and a missing rollback.
prompt: |
  Would you hand this to someone at 3 a.m.? Tell me what's missing — don't rewrite it.

  > **Trigger**: `queue-depth-critical` — the invoices worker queue is over 5000 messages.
  >
  > 1. Restart the workers:
  >    `cf restart invoices-worker`
  >    Expected: `OK`
  > 2. If the queue is still growing, scale up:
  >    `cf scale invoices-worker -i 12`
  > 3. Escalate to the billing team if it doesn't clear.

  Context we already know: restarting clears a transient backlog but does nothing for a poison
  message, and we lost 40 minutes to that last time.
routing:
  expect: fire
success_criteria:
  - Fires the runbook skill on an unlabelled draft review that never names the structure
  - Names the success-only expected output and what a partial or failed result looks like
  - Names the unbounded restart as needing a stop condition
  - Names the missing rollback for the scale-up
  - Names that the draft never branches between the transient backlog and the poison message
graders:
  - type: contains_any
    of: ["expected", "only says ok", "what failure looks like", "partial", "how do i know", "what if it"]
  - type: contains_any
    of: ["how many times", "stop condition", "unbounded", "keep restarting", "repeat", "how long"]
  - type: contains_any
    of: ["rollback", "roll back", "scale back", "undo", "return to"]
  - type: contains_any
    of: ["poison", "which cause", "branch", "decision", "distinguish"]
