schema_version: 1
id: discovery-incident-navigation-defers-approved-change
mode: discovery
split: regression
target:
  kind: skill
  name: incident-navigation
prompt: |
  Review this complete production-change record. Use only the supplied evidence; do not search the
  repository or delegate evidence retrieval.

  Tier: 2
  Target: checkout in prod
  Actor: human release owner
  Change: approved scale from 4 to 6 instances using `cf scale checkout -i 6`
  Approved by: release owner
  When: 2026-08-20T18:00:00Z
  Blast radius: one application; existing instances are not restarted.
  Verification: observe six healthy instances and checkout errors for five minutes.
  Backout: restore the prior instance count using `cf scale checkout -i 4`.
  Watching: checkout on-call, six healthy instances and checkout errors for five minutes
  Abort if: errors rise for five minutes
  Branch protection evidence: enforce_admins=true; required_reviews=2; dismiss_stale=true [verified]
  Timing: maintenance window; no freeze in effect [verified]
  Comms: checkout stakeholders and checkout on-call notified [verified]

  Tell the human release owner whether to proceed; do not investigate the incident and do not run
  the command. Return only the ten-line production-change-gate verdict packet.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: production-change-gate
success_criteria:
  - Routes an explicitly authorized production effect to the production change gate
  - Does not treat an approved mitigation as responder orientation or agent execution authority
graders:
  - type: incident_navigation_production_change_contract
    verdict: APPROVED
    tier: 2
    target: checkout in prod
    actor: human release owner
    required_change: scale from 4 to 6 instances
    required_command: cf scale checkout -i 6
    approved_by: release owner
    required_when: "2026-08-20T18:00:00Z"
    required_blast_radius: one application; existing instances are not restarted.
    required_verification: observe six healthy instances and checkout errors for five minutes.
    required_backout: restore the prior instance count
    required_backout_command: cf scale checkout -i 4
    required_timing: maintenance window; no freeze in effect [verified]
    required_watcher: checkout on-call
    required_watching_signals: six healthy instances and checkout errors for five minutes
    required_abort_if: errors rise for five minutes
    required_comms: checkout stakeholders and checkout on-call notified [verified]
    required_branch_evidence: enforce_admins=true; required_reviews=2; dismiss_stale=true [verified]
  - type: contains_all
    of: ["Tier:", "Target:", "Actor:", "Blast radius:", "Verification:", "Backout:", "Timing/freeze:", "Watching:", "Abort if:", "Comms:", "Branch protection evidence:"]
