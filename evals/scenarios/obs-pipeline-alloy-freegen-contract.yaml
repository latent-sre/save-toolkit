id: obs-pipeline-alloy-freegen-contract
max_turns: 17
split: regression
skill: obs-pipeline
tools: [Skill, Read]
references:
  - skills/obs-pipeline/references/alloy.md
prompt: |
  Read the Alloy reference. Write Alloy configuration only, plus the two short answers
  labelled A and B; do not edit files. Configure: (1) application log files under
  /var/log/app/*.log processed and written to Loki at http://loki:3100; (2) a
  Prometheus scrape forwarded to Mimir remote_write at http://mimir:9009/api/v1/push;
  (3) an OTLP receiver on the standard ports, batched, exported to an OTLP backend.
  A: what is the upstream default max_keepalive_time for prometheus.remote_write,
  and does that guarantee outage retention? Use `A: default=<duration>;
  guaranteed_outage_retention=<yes|no>` followed by a brief reason.
  B: what does loki.write do once its retries are exhausted?
success_criteria:
  - Wires loki/prometheus components with forward_to and otelcol components with output blocks.
  - Distinguishes the default max_keepalive_time from a guaranteed outage duration; actual retention depends on deployed settings, WAL truncation and send lag.
  - States the loki.write drop behaviour after retries are exhausted.
graders:
  - type: regex
    pattern: 'forward_to'
  - type: regex
    pattern: 'otelcol\.receiver\.otlp'
  - type: regex
    pattern: 'prometheus\.remote_write'
  - type: regex
    pattern: '^A:\s*default\s*=\s*(?:8h|8 hours|eight hours);\s*guaranteed_outage_retention\s*=\s*no\b'
  - type: regex
    pattern: 'drop'
