id: discovery-gcp-ops-defers-pcf
split: regression
prompt: |
  Checkout has not migrated to GCP; it still runs on PCF/TAS. The app is 502-ing with
  X-Cf-RouterError and recent exit code 137 events. Inspect cf app, events, logs, and routes without
  changing the foundation.
success_criteria:
- Keeps a PCF application failure in the PCF operations lane
- Does not route the coexistence-era request to GCP operations
target:
  kind: skill
  name: gcp-ops
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: pcf-ops
