schema_version: 1
id: discovery-production-change-defers-release-readiness
mode: discovery
split: regression
target:
  kind: skill
  name: production-change-gate
prompt: |
  Build 43 passed CI and staging. Assess whether the immutable artifact is ready to ship: the
  rollback rehearsal and operator coverage are still missing. This is a release-readiness decision,
  not a request to authorize or execute a live command. Return exactly one JSON object and no prose:
  decision_owner release_gate, verdict BLOCKED, rollback_evidence missing, operator_coverage missing,
  and production_execution not_authorized.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: release-gate
success_criteria:
  - Keeps artifact readiness with the release gate rather than production authorization
  - Blocks readiness on the missing rollback and operator evidence
graders:
  - type: json_exact_object
    expected:
      decision_owner: release_gate
      verdict: BLOCKED
      rollback_evidence: missing
      operator_coverage: missing
      production_execution: not_authorized
