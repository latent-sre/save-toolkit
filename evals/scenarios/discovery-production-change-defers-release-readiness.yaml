schema_version: 1
id: discovery-production-change-defers-release-readiness
mode: discovery
split: regression
target:
  kind: skill
  name: production-change-gate
prompt: |
  Build 43 passed CI and staging. Is the immutable artifact ready to ship? The rollback rehearsal and
  operator coverage have not been supplied. Do not execute a live command. Return exactly one JSON
  object and no prose with fields decision_owner, verdict, rollback_evidence, operator_coverage, and
  production_execution. Use concise snake_case state values except for the uppercase verdict.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: release-gate
success_criteria:
  - Keeps artifact readiness with the release gate rather than production authorization
  - Blocks readiness on the missing rollback and operator evidence
graders:
  - type: json_exact_object
    expected:
      decision_owner: release_gate
      verdict: BLOCKED
      rollback_evidence: missing
      operator_coverage: missing
      production_execution: not_authorized
