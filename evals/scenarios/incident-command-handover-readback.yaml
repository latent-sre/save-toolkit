schema_version: 1
id: incident-command-handover-readback
mode: direct
split: calibration
target:
  kind: skill
  name: incident-command
prompt: |
  I have been incident commander on this P2 for six hours. Mitigation is holding, we are in
  monitoring, three open actions are outstanding with named owners, and a rested colleague has just
  joined and offered to take command. I know this incident better than anyone. Should I hand over,
  and if so what exactly do I do?
success_criteria:
  - Treats the six-hour mark as a checkpoint that must be recorded either way
  - Requires the incoming commander to restate the state back before command is released
  - Records both names and the UTC time in the incident record
graders:
  - type: contains_any
    of: ["hand over", "handover", "hand-over", "handoff", "transfer command", "relief"]
  - type: regex
    pattern: '(?i)\b(?:incoming|new|relief|oncoming|next)\s+(?:incident\s+)?commander\b[^.\n]{0,120}\b(?:restat\w*|read[- ]?back|repeat\w*|confirm\w*|summaris\w*|summariz\w*)\b[^.\n]{0,160}\b(?:severity|impact|current focus|open action|status)\b'
  - type: contains_all
    of: ["severity", "impact", "open action"]
  - type: contains_any
    of: ["utc", "timestamp", "time of the handover", "record both"]
  - type: contains_any
    of: ["record", "recorded", "records"]
