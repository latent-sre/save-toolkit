schema_version: 1
id: discovery-incident-investigation-what-is-this-telling-me
mode: discovery
split: regression
target:
  kind: skill
  name: incident-investigation
prompt: |
  We're mid-incident on the orders service (INC-4471, ongoing since 09:05 UTC). I pulled the
  connection pool metrics for the last five minutes and got this back:
  pool.active=50 pool.max=50 pool.waiting=37 db.p99=41ms. What is this telling me, and what should
  I check next?
routing:
  expect: fire
success_criteria:
  - Routes a responder's "what is this telling me" paste to the human-facing incident-investigation skill
  - Interprets the paste in plain terms (an exhausted pool with a fast database points at the holders, not the database) and re-ranks from it
  - Names the one next check and keeps the board
# Discovery denies Read, so the knowledge repository is unreadable here; the graders check the
# turn shape the skill contracts (an interpretation, a next check, a board), not knowledge-repo content.
graders:
  - type: contains_any
    of: ["exhaust", "saturat", "waiting"]
  - type: contains_any
    of: ["next check"]
  - type: contains_any   # the board's first line; "board" alone would match "dashboard"
    of: ["ruled out"]
