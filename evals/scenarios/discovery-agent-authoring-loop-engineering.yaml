schema_version: 1
id: discovery-agent-authoring-loop-engineering
mode: discovery
split: regression
target:
  kind: skill
  name: agent-authoring
prompt: |
  Design a bounded Loop Engineering contract for improving an LLM-facing artifact. Name the entry
  and mutable state, independent verifier, hard iteration/candidate/time/cost budgets, success,
  no-progress and safety/authority stops, promotion authority, and durable evidence. Keep operations
  knowledge closeout and executable graph cycles outside this contract.
routing:
  expect: fire
success_criteria:
  - Invokes agent-authoring when Loop Engineering is the distinguishing user request
  - Names state, verifier, hard budgets, termination, promotion, and durable evidence
  - Keeps operations knowledge closeout and executable graph cycles as separate capabilities
graders:
  # Behavioral grader sets must reject a prompt echo and a keyword-rich incomplete response;
  # the adversarial fixtures for this scenario live in evals/test_graders.py.
  - type: contains_all
    of: ["verifier", "budget"]
    # Regex: measured answers write "**Iterations:** a fixed max number of edit-verify cycles"
    # and "**Iterations:** fixed integer cap", putting a markdown label between the two words a
    # contains_any token needs adjacent. "budget" and "bound" are deliberately absent from the
    # noun set so the prompt's own "iteration/candidate/time/cost budgets" cannot satisfy it -
    # this grader is what keeps the prompt echo failing for this scenario. Verified 3/3.
  - type: regex
    pattern: '(?i)\biterations?\b[^.\n]{0,60}\b(?:cap|ceiling|limit|max(?:imum)?|fixed)\b|\b(?:cap|ceiling|limit|max(?:imum)?|fixed)\b[^.\n]{0,40}\biterations?\b'
    # Regex for the same reason: all three measured answers stated the bound as "**Cost:** a
    # token/call ceiling", "**Cost:** token/dollar ceiling", "**Cost:** a cap on verifier
    # reruns" - correct behaviour no adjacent-word token can see. Verified 3/3, echo rejected.
  - type: regex
    pattern: '(?i)\b(?:cost|token|spend|dollar)s?\b[^.\n]{0,60}\b(?:ceiling|cap|caps|limit|budget|bound|quota)\b|\b(?:ceiling|cap|caps|limit|budget|bound|quota)\b[^.\n]{0,40}\b(?:cost|token|spend|dollar)s?\b'
  - type: contains_any
    of: ["no-progress", "no progress"]
  - type: contains_any
    of: ["safety stop", "authority stop", "safety/authority"]
  - type: contains_any
    # The prompt asks for "promotion authority" and none of the first four phrasings accepted
    # that exact term — one of the reds the SKILLS-003 incumbent baseline recorded.
    of: ["human acceptance", "human approves", "human promotion", "human release owner", "promotion authority"]
  - type: contains_any
    of: ["durable evidence", "recorded evidence"]
  - type: not_contains
    of: ["unbounded iterations", "iterate until correct", "retry until it passes"]
