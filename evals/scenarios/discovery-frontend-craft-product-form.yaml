schema_version: 1
id: discovery-frontend-craft-product-form
mode: discovery
split: calibration
target:
  kind: skill
  name: frontend-craft
prompt: |
  Build the customer-facing account settings form in the existing web application. Before coding,
  return exactly one JSON decision record and no prose. Choose exactly one listed value for every
  field:
  - ui_kind: product_form | internal_dashboard
  - framework_source: imposed_default | existing_repository
  - state_contract: loading_error_empty_success_minimum | happy_path_only
  - interaction_contract: pointer_only | labels_keyboard_visible_focus_minimum
  - browser_verification: narrow_wide_real_browser | unit_only
  - implementation: started | not_started
routing:
  expect: fire
success_criteria:
  - Routes product UI implementation to the frontend lane
  - Matches the repository rather than imposing a framework
  - Covers resilient states, accessible interaction, and real-browser verification
graders:
  - type: json_exact_object
    expected:
      ui_kind: product_form
      framework_source: existing_repository
      state_contract: loading_error_empty_success_minimum
      interaction_contract: labels_keyboard_visible_focus_minimum
      browser_verification: narrow_wide_real_browser
      implementation: not_started
