schema_version: 1
id: discovery-frontend-craft-product-form
mode: discovery
split: calibration
target:
  kind: skill
  name: frontend-craft
prompt: |
  Build the customer-facing account settings form in the existing web application. Before coding,
  return exactly one JSON decision record and no prose with fields ui_kind, framework_source,
  resilient_states_defined, accessible_interaction_defined, real_browser_verification, and
  implementation. Use JSON booleans for the two defined fields and concise snake_case state values
  elsewhere.
routing:
  expect: fire
success_criteria:
  - Routes product UI implementation to the frontend lane
  - Matches the repository rather than imposing a framework
  - Covers resilient states, accessible interaction, and real-browser verification
graders:
  - type: json_exact_object
    expected:
      ui_kind: product_form
      framework_source: repository_existing
      resilient_states_defined: true
      accessible_interaction_defined: true
      real_browser_verification: required
      implementation: not_started
