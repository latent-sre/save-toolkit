schema_version: 1
id: discovery-incident-investigation-defers-incident-command
mode: discovery
split: regression
target:
  kind: skill
  name: incident-investigation
prompt: |
  Checkout is down for most customers and it is spreading to payments. I'm on call. Walk me
  through declaring this: the severity, who is incident commander, who owns communications, and
  when the next update goes out. Engineering already owns the technical investigation, so do not
  investigate the cause and do not suggest a fix.
routing:
  expect: not_fire
  expected_alternative:
    kind: skill
    name: incident-command
success_criteria:
  - Keeps declaration, severity, roles, and communications with incident-command even when the responder says "walk me through"
  - Does not invoke the troubleshooting advisor for a request that excludes diagnosis
# A trigger phrase shared with the advisor ("walk me through") appears deliberately: the request is
# command and comms, which the advisor's description hands to incident-command.
graders:
  - type: contains_all
    of: ["incident-command", "P1"]
  - type: regex
    pattern: '(?i)\bincident commander\s*:\s*[A-Za-z][A-Za-z .''-]{1,60}'
  - type: regex
    pattern: '(?i)\b(?:communications|comms)(?:/timeline)? owner\s*:\s*[A-Za-z][A-Za-z .''-]{1,60}'
  - type: regex
    pattern: '(?i)\bnext update\s*:\s*(?:[01]?\d|2[0-3]):[0-5]\d\s*UTC\b'
