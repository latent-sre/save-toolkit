schema_version: 1
id: discovery-agent-authoring-trigger-and-shape
mode: discovery
split: regression
threshold: 0.67
target:
  kind: skill
  name: agent-authoring
prompt: |
  A release-notes skill fires for unrelated documentation requests and returns prose instead of its
  required JSON. Design the bounded Loop Engineering fix: test activation separately from output
  shape, allow one candidate, use the same focused cases, and name the adoption and stop conditions.
routing:
  expect: fire
success_criteria:
  - Invokes agent-authoring for a skill that fires too often and returns the wrong output shape
  - Separates activation or routing evidence from output-behavior evidence
  - Defines a bounded loop with a baseline, one candidate, comparable cases, and explicit termination
graders:
  # GRADER-003, options 1 and 2. The full behavioural contract moved to the direct-mode scenario
  # named below, where the component is pinned and can emit a determinate artifact. What stays
  # here is the routing floor: one grader proving the request reached this lane, one the prompt
  # echo fails, and the anti-pattern guard. Four batches measured the old 8-grader conjunction at
  # a ~0.53 ceiling over 3 trials regardless of grader quality, so the shape was the defect, not
  # the words. threshold is below 1 because discovery measures a propensity (evals/README.md), not
  # a contract.
  # Full contract: evals/scenarios/agent-authoring-trigger-and-shape-contract.yaml
  # Identity: the answer is about activation, not output quality.
  - type: contains_any
    of: ["activation", "routing"]
  # Echo-rejector: the prompt says 'the adoption and stop conditions' and matches none of these.
  - type: contains_any
    of: ["human acceptance", "human approves", "human promotion", "adoption authority", "adoption condition", "adoption criteria", "adoption gate", "adopted when"]
  # Anti-pattern guard.
  - type: not_contains
    of: ["unbounded iterations", "iterate until correct", "keep trying candidates"]
