schema_version: 1
id: discovery-backend-craft-endpoint-contract
mode: discovery
split: regression
target:
  kind: skill
  name: backend-craft
# GRADER SURFACE (learned from the 2026-08-26 sonnet run, $2.31, 2 trials/scenario):
# graders run against the MAIN SESSION'S FINAL TEXT only. In trial 1 this skill correctly delegated
# the build to save-toolkit:software-engineer; the code landed in files and the session returned a
# summary, so five content graders failed while the skill behaved perfectly. Trial 2 kept the work
# inline and four of the same five passed. Same prompt, near-opposite grades -- the graders were
# measuring where the work happened, not whether it was right.
# The fix is prompt shape, not grader wording: ask for a JUDGMENT, which must be spoken, instead of
# an ARTIFACT, which may be written to disk. Routing was the one signal stable across both trials
# and is kept.
# This asks the skill to review a design before it is built, so every finding has to be stated.
prompt: |
  Before I build this, tell me what's wrong with it. Don't write any code or files — just tell me
  what you'd change and why.

  Two endpoints on our incidents service:
    GET  /incidents            -> returns every incident, filtered by ?status=
    GET  /incidents/{id}       -> the incident, plus the current on-call owner, which we fetch
                                  from the paging vendor's HTTP API inside the handler
  Errors come back as 200 with {"ok": false, "msg": "..."} because the frontend already parses that.
  We were going to skip tests on the detail one since it's mostly a passthrough.
routing:
  expect: fire
success_criteria:
  - Fires backend-craft on an unlabelled design-review request that never names the skill
  - Names the unbounded listing and requires pagination before it ships
  - Rejects `200` with an error body and names the one problem+json shape
  - Names the in-handler vendor call as needing an explicit timeout
  - Refuses the "skip tests, it's a passthrough" premise and names the failure paths owed
graders:
  - type: contains_any
    of: ["paginat", "cursor", "unbounded", "every incident", "page size", "limit"]
  - type: contains_any
    of: ["problem+json", "rfc 9457", "problem details", "status code", "200 with", "http status"]
  - type: contains_any
    of: ["timeout", "hang", "unbounded", "budget"]
  - type: contains_any
    of: ["401", "403", "422", "failure", "error path", "not just the happy"]
