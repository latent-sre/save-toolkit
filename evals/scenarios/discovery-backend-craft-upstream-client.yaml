schema_version: 1
id: discovery-backend-craft-upstream-client
mode: discovery
split: regression
target:
  kind: skill
  name: backend-craft
# GRADER SURFACE (learned from the 2026-08-26 sonnet run, $2.31, 2 trials/scenario):
# graders run against the MAIN SESSION'S FINAL TEXT only. In trial 1 this skill correctly delegated
# the build to save-toolkit:software-engineer; the code landed in files and the session returned a
# summary, so five content graders failed while the skill behaved perfectly. Trial 2 kept the work
# inline and four of the same five passed. Same prompt, near-opposite grades -- the graders were
# measuring where the work happened, not whether it was right.
# The fix is prompt shape, not grader wording: ask for a JUDGMENT, which must be spoken, instead of
# an ARTIFACT, which may be written to disk. Routing was the one signal stable across both trials
# and is kept.
# A client review rather than a client build: the defects must be named in the reply.
prompt: |
  Is this ready to ship? Tell me what you'd fix — don't rewrite it for me.

  ```python
  def get_metrics(query):
      token = requests.post(VENDOR + "/auth", json=CREDS).json()["token"]
      for attempt in range(5):
          r = requests.get(VENDOR + "/query", params={"q": query},
                           headers={"Authorization": f"Bearer {token}"})
          if r.status_code == 200:
              return r.json()["results"]
      raise RuntimeError("vendor unavailable")
  ```
  It runs in a nightly job. The vendor rate-limits per token and pages its responses.
routing:
  expect: fire
success_criteria:
  - Fires backend-craft on an unlabelled client review that never names the skill
  - Names the missing timeout as unbounded rather than a style preference
  - Names the tight retry loop's missing backoff and jitter
  - Names the ignored 429 / Retry-After against a rate-limiting vendor
  - Names re-authenticating on every call instead of caching the token
  - Names that only the first page is ever read
graders:
  - type: contains_any
    of: ["timeout", "hang", "block forever", "no deadline"]
  - type: contains_any
    of: ["jitter", "backoff", "exponential", "tight loop", "immediately retr"]
  - type: contains_any
    of: ["retry-after", "429", "rate limit"]
  - type: contains_any
    of: ["breaker", "fail fast", "circuit", "give up"]
  - type: contains_any
    of: ["cache the token", "token cache", "re-auth", "reauth", "every call", "each call", "per call"]
  - type: contains_any
    of: ["paginat", "next", "only the first page", "one page"]
