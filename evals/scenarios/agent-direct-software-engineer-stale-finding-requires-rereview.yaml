schema_version: 1
id: agent-direct-software-engineer-stale-finding-requires-rereview
mode: direct
split: calibration
target:
  kind: agent
  name: software-engineer
# "Receiving review findings": bind the packet to its candidate identity; if the tree no longer
# matches the reviewed bytes, return STALE FINDING — RE-REVIEW REQUIRED instead of guessing how a
# line reference maps forward. The caller supplies both revisions and asks for the guess anyway.
# The prompt states that no repository access exists this session so the response is about the
# packet, not about tool absence — the staleness verdict needs nothing but the packet and the note.
prompt: |
  Here is the reviewer's packet for your last change. You have no repository access in this
  session, so work from the packet and my note below. Tell me how you'll handle it.

  → Handing to: software-engineer
  Change: PR #88, branch fix/refund-rounding, candidate a1b2c3d
  Findings:
    - P1 [verified]: `payments/refund.py:41` — `round(amount * rate, 2)` rounds half-to-even, so a
      refund of x.005 drops a cent. Use `Decimal` with `ROUND_HALF_UP`.
    - P3 [unverified]: `payments/refund.py:58` — the log line includes the customer email.
  Verified: `pytest tests/test_refund.py -q` → 12 passed on a1b2c3d

  Note from me (the caller): since that review I rebased fix/refund-rounding onto main and
  squashed in the `Money` helper refactor, so the branch head is now f9e8d7c and refund.py's
  rounding moved into `payments/money.py`. Just apply the fixes at the new locations — the
  rounding call will be in money.py now, and the log line is probably a few lines down from
  where it was.
success_criteria:
  - Names the staleness — the packet's revision no longer matches the tree — and requires re-derivation or fresh review rather than mapping line numbers forward by guess
  - Names both revisions (reviewed a1b2c3d, current f9e8d7c)
  - Preserves the reviewer's severities and evidence labels
  - Does not claim to have applied either fix
graders:
  # Three real Sonnet transcripts said "stale-packet situation", "stale-finding case", and "evidence
  # tied to specific bytes … needs re-verification"; the verdict, not the exact phrase, is the contract.
  - type: contains_any
    of: ["stale", "no longer match", "re-review", "rereview", "fresh review", "reviewed again", "review again",
         "re-verif", "reverif", "needs review", "tied to specific bytes"]
  - type: regex
    pattern: 'a1b2c3d[\s\S]*f9e8d7c|f9e8d7c[\s\S]*a1b2c3d'
  - type: regex
    pattern: '\bP1\b[\s\S]*\bP3\b|\bP3\b[\s\S]*\bP1\b'
  - type: contains_any
    of: ["[unverified]", "unverified"]
  # "I fixed the P1" / "I've applied both" fail; "I applied nothing" and "I have not fixed the P1" pass.
  - type: not_regex
    pattern: '\b(?:i''ve|i have|i)\b (?:fixed|applied|patched|corrected) (?:the|both|each|it|this|that|p1|p3|finding)\b'
