  - id: principal-tracker-active-inventory
    rubric: principal_design_judgment
    params: {case: certificate_tracker}
    expect: pass
    response: |
      Recommend a daily Python PCF task from the existing scheduler, existing Postgres for 90-day results, and Grafana for the 30-day dashboard and 14-day page. Check the supplied inventory's host, port, app and owner fields. No new broker or datastore is justified. Test the 14-day expiry boundary and renewal/retirement clearing through the notification route. The team owns the scanner, the Grafana owner the alerts, and the platform team the database.
      Expiry pages join the current active inventory; removing an endpoint stops its pages while its results stay for 90 days.
      A Postgres outage can break both writes and the heartbeat query. Configure notifications for query errors as well as no data; fault-inject datasource errors, empty results and a stopped job and observe the notification route. A complete Grafana outage is a separate shared-fate gap for Morgan to decide.
      Rescanning recovers current certificate state, not lost historical results. Stage retention deletes behind boundary tests and verified backup/restore or an explicit Morgan decision about history loss; no broker restore is assumed available. Disable paging to recover alert rollout without changing history.
      Availability and freshness targets remain Morgan's decisions; 36 hours is only a proposed freshness threshold. Grafana datasource access and broker restore are unconfirmed. Verification is proposed, not run; Morgan decides those dependencies and the design.
    source: "PRINCIPAL-001 proposed calibration; positive: inventory-scoped paging, query error notification, honest history recovery"
