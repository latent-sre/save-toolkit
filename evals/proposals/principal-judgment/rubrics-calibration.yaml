    rubric: principal_design_judgment
    params: {case: maintenance_window_contract}
    expect: pass
    response: |
      Recommend an additive UTC representation beside the unchanged local start/end fields. Known readers are cli/mw.py, spa/src/windows.ts and grafana/dashboards/maintenance.json; ITO's sync remains unknown.
      Request logs locate callers, not the fields they parse. Remove old fields only after each reader owner confirms migration with compatibility tests, and Morgan decides a retirement policy for any unseen reader.
      Test each reader with old and expanded shapes and daylight-saving ambiguity; Morgan must settle ambiguous stored local times before conversion. Producer schema tests are additional checks, not evidence that readers moved.
      Expansion recovery removes only the new representation; reader-stage recovery reverts that reader while old fields remain; after removal, restore the old fields from current data before reverting a reader. Keep accepted writes and original time evidence. Morgan decides the plan and retirement gate; all verification is proposed.
