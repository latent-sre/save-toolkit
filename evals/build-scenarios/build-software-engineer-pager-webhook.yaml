id: build-software-engineer-pager-webhook
agent: software-engineer
# backend-craft's background-work rules with real tools. The prompt asks only for a webhook that
# turns pager events into incidents; the README states the vendor's contract (an HMAC signature,
# a 3 s wait for a 2xx, then redelivery of the same event) and the runbook lookup is slow, without
# saying how the receiver should work. The probe-owned oracle (probe_checks.py, never seen by the
# agent) runs the app as a uvicorn subprocess against its own SQLite file and a runbook stub that
# answers in 8 s, and grades: a forged or missing signature is refused, and nothing is stored or
# processed even after the runbook delay; a valid event is acknowledged within 3 s, with 202; an
# open incident appears with its runbook link; three deliveries of one event make one incident
# while a different event id with the same summary makes its own; and when the app is killed right
# after acknowledging, the event is already stored and a restarted app finishes it, runbook link
# included. The fixture is stdlib plus fastapi/httpx/uvicorn, which requirements-dev.txt pins.
prompt: |
  Add `POST /v1/webhooks/pager` to this FastAPI service: each pager event becomes an incident (title
  from the event's summary, status `open`) carrying the runbook link that `app/runbooks.py` looks up
  for the event's service. The README describes the pager vendor's webhook contract. Build it end
  to end in this repo, and tell me what you ran to verify it.

  Tests go in `tests/`; this repo uses pytest (see the README). This is a code change, not a design
  question, not a review, and not an incident.
  After your last edit or helper return, run `python -m pytest -q` as a standalone foreground
  shell command; use read tools for any final inspection.
  Use separate Changed and Verified headings in your final response, explaining the changes and verification results.
fixture:
  files:
    README.md: |
      # opsapi

      Small FastAPI service behind the on-call tooling. `app/main.py` builds the app in
      `create_app()`; settings come from the environment via `app/config.py`. Incidents live in the
      SQLite database at `DB_PATH` (`app/db.py`, `app/store.py`). Every error is an RFC 9457
      `application/problem+json` body, installed by `app/errors.py`.

      ## Pager webhooks

      The pager vendor POSTs a JSON event `{"event_id": "...", "service": "...", "summary": "..."}`.
      It signs the raw body: `X-Pager-Signature: sha256=<hex HMAC-SHA256 of the body, keyed with
      PAGER_WEBHOOK_SECRET>`. It waits 3 seconds for a 2xx; without one it redelivers the same event
      (same `event_id`) up to 5 times, a few seconds apart.

      The runbook service (`RUNBOOK_BASE_URL`, client in `app/runbooks.py`) is slow: a lookup can
      take up to 10 seconds.

      Dependencies (fastapi, httpx, pytest) are already installed on this machine. Run the tests
      from the repo root:

          python -m pytest -q
    pyproject.toml: |
      [project]
      name = "opsapi"
      version = "0.1.0"
      requires-python = ">=3.12"

      [tool.pytest.ini_options]
      testpaths = ["tests"]
      pythonpath = ["."]
    app/__init__.py: ""
    app/config.py: |
      """Runtime settings, read from the environment."""
      from __future__ import annotations

      import os
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Settings:
          db_path: str
          runbook_base_url: str
          pager_webhook_secret: str


      def get_settings() -> Settings:
          return Settings(
              db_path=os.environ.get("DB_PATH", "opsapi.db"),
              runbook_base_url=os.environ.get("RUNBOOK_BASE_URL", "http://runbooks.internal.invalid"),
              pager_webhook_secret=os.environ.get("PAGER_WEBHOOK_SECRET", ""),
          )
    app/db.py: |
      """SQLite access: one connection per use; the schema is created at startup."""
      from __future__ import annotations

      import sqlite3
      from collections.abc import Iterator
      from contextlib import contextmanager

      from app.config import get_settings

      SCHEMA = """
      CREATE TABLE IF NOT EXISTS incidents (
          id TEXT PRIMARY KEY,
          title TEXT NOT NULL,
          service TEXT NOT NULL,
          status TEXT NOT NULL,
          runbook_url TEXT,
          created_at TEXT NOT NULL
      );
      """


      @contextmanager
      def connect() -> Iterator[sqlite3.Connection]:
          conn = sqlite3.connect(get_settings().db_path, timeout=10)
          conn.row_factory = sqlite3.Row
          try:
              yield conn
          finally:
              conn.close()


      def init_schema() -> None:
          with connect() as conn:
              conn.executescript(SCHEMA)
    app/store.py: |
      """Incident persistence."""
      from __future__ import annotations

      import sqlite3
      import uuid
      from datetime import datetime, timezone


      def get_incident(conn: sqlite3.Connection, incident_id: str) -> dict | None:
          row = conn.execute("SELECT * FROM incidents WHERE id = ?", (incident_id,)).fetchone()
          return dict(row) if row else None


      def create_incident(conn: sqlite3.Connection, title: str, service: str,
                          runbook_url: str | None) -> dict:
          row = {
              "id": f"inc-{uuid.uuid4().hex[:12]}",
              "title": title,
              "service": service,
              "status": "open",
              "runbook_url": runbook_url,
              "created_at": datetime.now(timezone.utc).isoformat(),
          }
          conn.execute(
              "INSERT INTO incidents (id, title, service, status, runbook_url, created_at)"
              " VALUES (:id, :title, :service, :status, :runbook_url, :created_at)",
              row,
          )
          conn.commit()
          return row
    app/runbooks.py: |
      """Runbook service client. Lookups are slow: allow up to 10 seconds."""
      from __future__ import annotations

      import httpx

      from app.config import get_settings


      def runbook_url(service: str) -> str:
          response = httpx.get(f"{get_settings().runbook_base_url}/runbooks",
                               params={"service": service}, timeout=12)
          response.raise_for_status()
          return response.json()["url"]
    app/errors.py: |
      """RFC 9457 problem+json for every error this service returns."""
      from __future__ import annotations

      import uuid
      from http import HTTPStatus

      from fastapi import FastAPI, Request
      from fastapi.exceptions import RequestValidationError
      from fastapi.responses import JSONResponse
      from starlette.exceptions import HTTPException as StarletteHTTPException


      def problem(request: Request, status: int, detail: str, **extensions) -> JSONResponse:
          body = {
              "type": "about:blank",
              "title": HTTPStatus(status).phrase,
              "status": status,
              "detail": detail,
              # Only state a trusted middleware validated; never a raw client header.
              "request_id": getattr(request.state, "request_id", None) or str(uuid.uuid4()),
              **extensions,
          }
          return JSONResponse(body, status_code=status, media_type="application/problem+json")


      def install_problem_handlers(app: FastAPI) -> None:
          @app.exception_handler(StarletteHTTPException)
          async def http_error(request: Request, exc: StarletteHTTPException) -> JSONResponse:
              response = problem(request, exc.status_code, str(exc.detail))
              response.headers.update(exc.headers or {})
              return response

          @app.exception_handler(RequestValidationError)
          async def invalid(request: Request, exc: RequestValidationError) -> JSONResponse:
              errors = [{"loc": [str(p) for p in e["loc"]], "msg": e["msg"]} for e in exc.errors()]
              return problem(request, 422, "The request failed validation.", errors=errors)

          @app.exception_handler(Exception)
          async def unexpected(request: Request, exc: Exception) -> JSONResponse:
              return problem(request, 500, "An unexpected error occurred.")
    app/main.py: |
      """opsapi application factory."""
      from __future__ import annotations

      from contextlib import asynccontextmanager

      from fastapi import FastAPI, HTTPException

      from app import store
      from app.db import connect, init_schema
      from app.errors import install_problem_handlers


      def create_app() -> FastAPI:
          @asynccontextmanager
          async def lifespan(app: FastAPI):
              init_schema()
              yield

          app = FastAPI(title="opsapi", lifespan=lifespan)
          install_problem_handlers(app)

          @app.get("/healthz")
          def healthz() -> dict:
              return {"status": "ok"}

          @app.get("/v1/incidents/{incident_id}")
          def get_incident(incident_id: str) -> dict:
              with connect() as conn:
                  row = store.get_incident(conn, incident_id)
              if row is None:
                  raise HTTPException(status_code=404, detail="unknown incident")
              return row

          return app
    tests/__init__.py: ""
    tests/conftest.py: |
      import pytest
      from fastapi.testclient import TestClient

      from app.main import create_app


      @pytest.fixture
      def client(tmp_path, monkeypatch):
          monkeypatch.setenv("DB_PATH", str(tmp_path / "test.db"))
          monkeypatch.setenv("PAGER_WEBHOOK_SECRET", "test-secret")
          with TestClient(create_app()) as c:
              yield c
    tests/test_incidents.py: |
      def test_unknown_incident_is_404(client):
          r = client.get("/v1/incidents/inc-missing")
          assert r.status_code == 404
          assert r.headers["content-type"].startswith("application/problem+json")
