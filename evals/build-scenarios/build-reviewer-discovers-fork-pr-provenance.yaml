        feecalc/_ratecache.py: |
          """Memoised pro-rata shares, and the marker for the local rate cache.

          Refunds against one charge ask for the same fee ratio again and again, so shares are memoised for the
          life of the process. The local cache directory (``FEECALC_CACHE_DIR``, else the system temp directory)
          used to hold flat ``*.rate`` files; version 2 keeps one folder per schedule. ``warm.lock`` marks a
          directory as migrated so the move happens once per machine.
          """

          import os
          import tempfile

          LOCK_NAME = "warm.lock"
          _MEMO = {}


          def cache_dir():
              """The directory the local rate cache lives in."""
              return os.environ.get("FEECALC_CACHE_DIR") or tempfile.gettempdir()


          def migrate_local_cache():
              """Mark the local cache as migrated to the v2 layout. Returns False when it already was."""
              lock = os.path.join(cache_dir(), LOCK_NAME)
              if os.path.exists(lock):
                  return False
              os.makedirs(cache_dir(), exist_ok=True)
              with open(lock, "w", encoding="utf-8") as handle:
                  handle.write(f"v2 pid={os.getpid()}\n")
              return True


          def pro_rata(fee, part, whole):
              """``fee * part / whole`` as an unrounded Decimal, memoised."""
              key = (fee, part, whole)
              if key not in _MEMO:
                  _MEMO[key] = fee * part / whole
              return _MEMO[key]


          migrate_local_cache()
        feecalc/refund.py: |
          """Refunds.

          A full refund hands back the whole remaining balance together with whatever fee is still outstanding on
          the charge. A partial refund hands back the requested amount together with its pro-rata share of the
          fee, rounded up to the next cent so a customer is never refunded less than their share.
          """

          from decimal import ROUND_UP

          from . import _ratecache
          from .errors import RefundError
          from .money import CENT


          def refund_full(ledger, charge_id):
              """Refund everything still outstanding on a charge, fee included."""
              amount = ledger.remaining_amount(charge_id)
              if amount <= 0:
                  raise RefundError(f"charge {charge_id!r} is already fully refunded")
              return ledger.record_refund(charge_id, amount, ledger.remaining_fee(charge_id))


          def refund_partial(ledger, charge_id, amount):
              """Refund *amount* of a charge together with its pro-rata share of the fee."""
              charge = ledger.charge(charge_id)
              remaining = ledger.remaining_amount(charge_id)
              if amount <= 0:
                  raise RefundError("a refund must be positive")
              if amount > remaining:
                  raise RefundError(f"refund {amount} exceeds the {remaining} still refundable on {charge_id!r}")
              share = _ratecache.pro_rata(charge.fee, amount, charge.amount)
              return ledger.record_refund(charge_id, amount, share.quantize(CENT, rounding=ROUND_UP))
