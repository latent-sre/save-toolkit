      message: |
        Round partial-refund fee shares up to the next cent

        A partial refund now returns ceil(fee * refunded / charged) to the cent, so a customer is never
        refunded less than their pro-rata share of the fee. The share comes from _ratecache.pro_rata, which
        memoises it per charge, and _ratecache migrates the old flat local rate cache to the v2 layout the
        first time it is imported. conftest.py warms the cache once per pytest session. Tests cover the
        rounded share, a full refund after a partial one, the CLI receipt and the cache.
