      """Charges.

      A charge records what was collected and the fee that was taken for it, fixed at the moment it is made.
      Later rate-table changes never rewrite an existing charge.
      """

      from dataclasses import dataclass
      from decimal import Decimal


      @dataclass(frozen=True)
      class Charge:
          """An immutable charge: identifier, amount collected, fee taken, and the schedule that priced it."""

          charge_id: str
          amount: Decimal
          fee: Decimal
          schedule: str

          @property
          def net(self):
              """What the merchant keeps once the fee is taken."""
              return self.amount - self.fee


      def make_charge(charge_id, amount, schedule):
          """Price *amount* under *schedule* (a FeeSchedule) and return the resulting Charge."""
          if not charge_id:
              raise ValueError("a charge needs an identifier")
          return Charge(charge_id, amount, schedule.fee_for(amount), schedule.name)
    feecalc/cli.py: |
      """Command line front end: ``python -m feecalc <command>``.

      Commands:

      * ``quote AMOUNT``: the fee a charge of AMOUNT would pay.
      * ``refund AMOUNT STEP [STEP ...]``: charge AMOUNT, then replay the refunds. Each STEP is an amount
        for a partial refund or the word ``full`` for a full refund of what is left.
      * ``rates``: list the schedules in the rate table.
      """

      import argparse
      import sys

      from .charge import make_charge
      from .errors import FeeCalcError
      from .ledger import Ledger
      from .money import format_amount, parse_amount
      from .rates import DEFAULT_TABLE, get_schedule, load_rate_table
      from .receipt import refund_report
      from .refund import refund_full, refund_partial


      def build_parser():
          parser = argparse.ArgumentParser(prog="feecalc", description="Fee schedules, charges and refunds.")
          parser.add_argument("--table", default=str(DEFAULT_TABLE), help="rate table CSV (default: bundled)")
          parser.add_argument("--schedule", default="standard", help="schedule name (default: standard)")
          commands = parser.add_subparsers(dest="command", required=True)
          quote = commands.add_parser("quote", help="print the fee for a charge amount")
          quote.add_argument("amount")
          refund = commands.add_parser("refund", help="charge an amount and replay a series of refunds")
          refund.add_argument("amount")
          refund.add_argument("steps", nargs="+", help="partial refund amounts, or 'full'")
          commands.add_parser("rates", help="list the schedules in the rate table")
          return parser


      def _quote(args, table, out):
          schedule = get_schedule(table, args.schedule)
          print(format_amount(schedule.fee_for(parse_amount(args.amount))), file=out)


      def _refund(args, table, out):
          schedule = get_schedule(table, args.schedule)
          ledger = Ledger()
          charge = ledger.add(make_charge("cli-1", parse_amount(args.amount), schedule))
          for step in args.steps:
              if step.lower() == "full":
                  refund_full(ledger, charge.charge_id)
              else:
                  refund_partial(ledger, charge.charge_id, parse_amount(step))
          print(refund_report(charge, ledger.refunds(charge.charge_id)), file=out)


      def _rates(args, table, out):
          for name, schedule in table.items():
              print(f"{name}: {len(schedule.tiers)} tier(s)", file=out)


      COMMANDS = {"quote": _quote, "refund": _refund, "rates": _rates}


      def main(argv=None, out=None):
          """Run the CLI and return the process exit status (0 ok, 2 for a bad request)."""
          out = out or sys.stdout
          args = build_parser().parse_args(argv)
          try:
              COMMANDS[args.command](args, load_rate_table(args.table), out)
          except (FeeCalcError, ValueError) as error:
              print(f"feecalc: {error}", file=sys.stderr)
              return 2
          return 0
    feecalc/errors.py: |
      """Exceptions raised by feecalc.

      Every error the library raises on purpose derives from FeeCalcError, so callers can catch the whole
      family with one clause and let genuine bugs propagate.
      """


      class FeeCalcError(Exception):
          """Base class for every error feecalc raises deliberately."""


      class RateTableError(FeeCalcError):
          """A rate table is malformed: a bad header, a bad number, tiers out of order, or no open tier."""


      class UnknownScheduleError(FeeCalcError):
          """No fee schedule with the requested name exists in the loaded rate table."""


      class LedgerError(FeeCalcError):
          """The ledger was asked to do something inconsistent, such as recording a charge twice."""


      class UnknownChargeError(LedgerError):
          """The ledger holds no charge with the requested identifier."""


      class RefundError(FeeCalcError):
          """A refund request cannot be honoured: non-positive, larger than the balance, or already settled."""
    feecalc/ledger.py: |
      """An in-memory ledger of charges and the refunds taken against them.

      The ledger only records and totals; it never decides how much fee a refund returns. That policy lives
      in ``feecalc.refund``, which hands the ledger finished numbers.
      """

      from dataclasses import dataclass
      from decimal import Decimal

      from .errors import LedgerError, UnknownChargeError
      from .money import ZERO


      @dataclass(frozen=True)
      class Refund:
          """One refund against a charge: the amount handed back and the fee returned with it."""

          charge_id: str
          amount: Decimal
          fee: Decimal


      class Ledger:
          """Charges by identifier plus the refund history, in the order the refunds were recorded."""

          def __init__(self):
              self._charges = {}
              self._refunds = []

          def add(self, charge):
              """Record *charge*; an identifier may be used once."""
              if charge.charge_id in self._charges:
                  raise LedgerError(f"charge {charge.charge_id!r} is already recorded")
              self._charges[charge.charge_id] = charge
              return charge

          def charge(self, charge_id):
              try:
                  return self._charges[charge_id]
              except KeyError:
                  raise UnknownChargeError(f"no charge {charge_id!r}") from None

          def charges(self):
              return list(self._charges.values())

          def record_refund(self, charge_id, amount, fee):
              """Append a refund for an existing charge and return it."""
              self.charge(charge_id)
              refund = Refund(charge_id, amount, fee)
              self._refunds.append(refund)
              return refund

          def refunds(self, charge_id=None):
              """All refunds, or only those against *charge_id*, oldest first."""
              if charge_id is None:
                  return list(self._refunds)
              return [refund for refund in self._refunds if refund.charge_id == charge_id]

          def refunded_amount(self, charge_id):
              return sum((r.amount for r in self.refunds(charge_id)), ZERO)

          def refunded_fee(self, charge_id):
              return sum((r.fee for r in self.refunds(charge_id)), ZERO)

          def remaining_amount(self, charge_id):
              return self.charge(charge_id).amount - self.refunded_amount(charge_id)

          def remaining_fee(self, charge_id):
              return self.charge(charge_id).fee - self.refunded_fee(charge_id)

          def net_fees(self):
              """Fees kept across every charge once refunded fees are given back."""
              return sum((c.fee for c in self._charges.values()), ZERO) - sum((r.fee for r in self._refunds), ZERO)
    feecalc/money.py: |
      """Money helpers.

      Every amount in feecalc is a ``decimal.Decimal`` holding a whole number of cents. Floats never enter
      the library: they are rejected at the edge by ``parse_amount`` and never produced inside it.
      """

      from decimal import ROUND_HALF_UP, Decimal, InvalidOperation

      CENT = Decimal("0.01")
      ZERO = Decimal("0.00")


      def to_cents(value):
          """Round *value* half up to a whole number of cents and return it as a Decimal."""
          return Decimal(value).quantize(CENT, rounding=ROUND_HALF_UP)


      def parse_amount(text):
          """Parse user input such as ``"12.5"`` into a positive Decimal with at most two decimal places.

          Raises ValueError for text that is not a finite number, for zero or negative amounts, and for
          amounts that carry fractions of a cent.
          """
          try:
              value = Decimal(str(text).strip())
              if not value.is_finite():
                  raise InvalidOperation
              whole_cents = value == to_cents(value)
          except InvalidOperation as exc:
              raise ValueError(f"not an amount: {text!r}") from exc
          if value <= 0:
              raise ValueError(f"amount must be positive: {text!r}")
          if not whole_cents:
              raise ValueError(f"amount has fractions of a cent: {text!r}")
          return to_cents(value)


      def format_amount(value):
          """Render a Decimal amount with a thousands separator and exactly two decimal places."""
          return f"{to_cents(value):,.2f}"
    feecalc/rates.py: |
      """Rate table loader.

      A rate table is a CSV file with the header ``schedule,up_to,percent,fixed``. Rows of one schedule
      must be adjacent, in ascending ``up_to`` order, and end with a row whose ``up_to`` is empty (the open
      tier). ``percent`` and ``fixed`` may not be negative. Blank lines and lines starting with ``#`` are
      ignored.
      """

      import csv
      import io
      from decimal import Decimal, InvalidOperation
      from pathlib import Path

      from .errors import RateTableError, UnknownScheduleError
      from .schedule import FeeSchedule, Tier

      HEADER = ["schedule", "up_to", "percent", "fixed"]
      DEFAULT_TABLE = Path(__file__).resolve().parent.parent / "data" / "rates.csv"


      def _decimal(text, field, line):
          try:
              value = Decimal(text.strip())
          except InvalidOperation as exc:
              raise RateTableError(f"line {line}: {field} is not a number: {text!r}") from exc
          if not value.is_finite() or value < 0:
              raise RateTableError(f"line {line}: {field} must be a non-negative number: {text!r}")
          return value


      def parse_rate_table(text):
          """Parse CSV *text* into ``{name: FeeSchedule}``; raise RateTableError for anything malformed."""
          lines = [row for row in text.splitlines() if row.strip() and not row.lstrip().startswith("#")]
          reader = csv.reader(io.StringIO("\n".join(lines)))
          rows = list(reader)
          if not rows or [cell.strip() for cell in rows[0]] != HEADER:
              raise RateTableError(f"header must be {','.join(HEADER)}")
          tiers = {}
          order = []
          for number, row in enumerate(rows[1:], start=2):
              if len(row) != len(HEADER):
                  raise RateTableError(f"row {number}: expected {len(HEADER)} columns, got {len(row)}")
              name = row[0].strip()
              if not name:
                  raise RateTableError(f"row {number}: schedule name is empty")
              if name in tiers and order[-1] != name:
                  raise RateTableError(f"row {number}: rows of schedule {name!r} are not adjacent")
              up_to = _decimal(row[1], "up_to", number) if row[1].strip() else None
              tier = Tier(up_to, _decimal(row[2], "percent", number), _decimal(row[3], "fixed", number))
              previous = tiers.setdefault(name, [])
              if not previous:
                  order.append(name)
              if previous and previous[-1].up_to is None:
                  raise RateTableError(f"row {number}: schedule {name!r} continues after its open tier")
              if previous and tier.up_to is not None and tier.up_to <= previous[-1].up_to:
                  raise RateTableError(f"row {number}: up_to must increase within schedule {name!r}")
              previous.append(tier)
          for name, rows_of in tiers.items():
              if rows_of[-1].up_to is not None:
                  raise RateTableError(f"schedule {name!r} has no open last tier")
          return {name: FeeSchedule(name, tuple(tiers[name])) for name in order}


      def load_rate_table(path=DEFAULT_TABLE):
          """Read and parse the rate table at *path* (the bundled table by default)."""
          return parse_rate_table(Path(path).read_text(encoding="utf-8"))


      def get_schedule(table, name):
          """Look *name* up in a loaded table, raising UnknownScheduleError with the known names."""
          try:
              return table[name]
          except KeyError:
              known = ", ".join(sorted(table)) or "none"
              raise UnknownScheduleError(f"unknown schedule {name!r}; known: {known}") from None
    feecalc/receipt.py: |
      """Plain-text receipts for charges and refunds."""

      from .money import ZERO, format_amount


      def charge_receipt(charge):
          """Four lines: the charge, the amount, the fee taken, and the net."""
          return "\n".join(
              [
                  f"charge {charge.charge_id} ({charge.schedule})",
                  f"  amount  {format_amount(charge.amount):>12}",
                  f"  fee     {format_amount(charge.fee):>12}",
                  f"  net     {format_amount(charge.net):>12}",
              ]
          )


      def refund_line(number, refund):
          """One line for refund *number* (1-based): amount handed back and fee returned."""
          return f"  refund {number}: {format_amount(refund.amount):>10}  fee returned {format_amount(refund.fee):>8}"


      def refund_report(charge, refunds):
          """A charge receipt, one line per refund, and a closing line totalling the fee returned."""
          lines = [charge_receipt(charge)]
          for number, refund in enumerate(refunds, start=1):
              lines.append(refund_line(number, refund))
          total = sum((r.fee for r in refunds), ZERO)
          lines.append(f"  fee returned in total {format_amount(total)} of {format_amount(charge.fee)} charged")
          return "\n".join(lines)
    feecalc/refund.py: |
      """Refunds.

      A full refund hands back the whole remaining balance together with whatever fee is still outstanding on
      the charge. A partial refund hands back the requested amount together with its pro-rata share of the
      fee. The share is worked out from the running total refunded so far, so the cents lost to rounding on
      one refund are made up on the next and a series of partial refunds returns exactly the fee that was
      charged.
      """

      from .errors import RefundError
      from .money import to_cents


      def refund_full(ledger, charge_id):
          """Refund everything still outstanding on a charge, fee included."""
          amount = ledger.remaining_amount(charge_id)
          if amount <= 0:
              raise RefundError(f"charge {charge_id!r} is already fully refunded")
          return ledger.record_refund(charge_id, amount, ledger.remaining_fee(charge_id))


      def refund_partial(ledger, charge_id, amount):
          """Refund *amount* of a charge together with its pro-rata share of the fee."""
          charge = ledger.charge(charge_id)
          remaining = ledger.remaining_amount(charge_id)
          if amount <= 0:
              raise RefundError("a refund must be positive")
          if amount > remaining:
              raise RefundError(f"refund {amount} exceeds the {remaining} still refundable on {charge_id!r}")
          refunded_after = charge.amount - remaining + amount
          due = to_cents(charge.fee * refunded_after / charge.amount)
          return ledger.record_refund(charge_id, amount, due - ledger.refunded_fee(charge_id))
    feecalc/schedule.py: |
      """Fee schedules.

      A schedule is an ordered list of tiers. The tier that covers the whole charge amount decides the
      fee: ``percent`` of the amount plus a ``fixed`` fee per charge, rounded half up to the cent. Tiers are
      not marginal; a charge of 150.00 pays the 100-1000 rate on all 150.00.
      """

      from dataclasses import dataclass
      from decimal import Decimal

      from .money import to_cents


      @dataclass(frozen=True)
      class Tier:
          """One band of a schedule. ``up_to`` is the inclusive upper bound, or None for the open last tier."""

          up_to: Decimal | None
          percent: Decimal
          fixed: Decimal

          def covers(self, amount):
              return self.up_to is None or amount <= self.up_to

          def fee(self, amount):
              return to_cents(amount * self.percent / 100 + self.fixed)


      @dataclass(frozen=True)
      class FeeSchedule:
          """A named, ordered tier list whose last tier is open-ended."""

          name: str
          tiers: tuple

          def tier_for(self, amount):
              for tier in self.tiers:
                  if tier.covers(amount):
                      return tier
              raise ValueError(f"schedule {self.name!r} has no open tier for {amount}")

          def fee_for(self, amount):
              """The fee charged on *amount* under this schedule, in whole cents."""
              return self.tier_for(amount).fee(amount)
