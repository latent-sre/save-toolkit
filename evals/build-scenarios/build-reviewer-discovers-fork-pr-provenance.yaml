              ("schedule,up_to,percent,fixed\na,5,1,0\n", "no open last tier"),
              ("schedule,up_to,percent,fixed\na,5,1,0\na,5,1,0\na,,1,0\n", "must increase"),
              ("schedule,up_to,percent,fixed\na,,1,0\na,9,1,0\n", "continues after its open tier"),
              ("schedule,up_to,percent,fixed\na,5,1,0\nb,,1,0\na,,1,0\n", "not adjacent"),
          ],
      )
      def test_malformed_tables_are_rejected(text, message):
