    README.md: |
      # feecalc

      Fee schedules, charges and refunds for the settlement tools. Pure standard library; money is always
      `decimal.Decimal`, held as a whole number of cents.

      ## Install and test

      ```
      python -m pytest -q
      ```

      The suite needs nothing but Python 3.12 or newer and `pytest`. It runs in well under a second.

      ## Fee schedules

      A schedule is a list of tiers. The tier that covers the whole charge amount prices the whole charge:
      `percent` of the amount plus a `fixed` fee, rounded half up to the cent. Tiers are not marginal.

      | Schedule | Up to | Percent | Fixed |
      |---|---|---|---|
      | standard | 100.00 | 2.90 | 0.30 |
      | standard | 1000.00 | 2.50 | 0.30 |
      | standard | no limit | 2.20 | 0.30 |
      | marketplace | 50.00 | 3.50 | 0.20 |
      | marketplace | no limit | 3.00 | 0.20 |

      The bundled table lives in `data/rates.csv`. Pass `--table PATH` to the CLI, or `load_rate_table(path)`
      in code, to use another one.

      ### Rate table format

      CSV with the header `schedule,up_to,percent,fixed`. Rows of one schedule are adjacent, `up_to`
      ascends within a schedule, and the last row of every schedule leaves `up_to` empty. Percent and fixed
      may not be negative. Blank lines and lines starting with `#` are ignored. A malformed table raises
      `RateTableError` and is never half-loaded.

      ## Charges

      `make_charge(charge_id, amount, schedule)` prices an amount and returns an immutable `Charge`. The fee
      is fixed when the charge is made; changing the rate table later does not rewrite existing charges.

      ## Refunds

      A **full refund** returns everything still outstanding on a charge: the remaining amount and the
      remaining fee.

      A **partial refund** returns the requested amount and its pro-rata share of the fee, rounded half up
      to the cent. Rounding is worked out from the total refunded so far, not refund by refund, so the cent
      lost to rounding on one refund is made up on the next.

      A refund never returns more fee than was charged: the fees returned by a series of partial refunds add
      up to exactly the original fee.

      A refund may not be zero, negative, or larger than what is still refundable on the charge.

      ## Command line

      ```
      python -m feecalc quote 24.00
      python -m feecalc --schedule marketplace quote 18.50
      python -m feecalc refund 24.00 8.00 8.00 8.00
      python -m feecalc refund 24.00 8.00 full
      python -m feecalc rates
      ```

      `refund AMOUNT STEP...` charges AMOUNT and replays the steps: an amount for a partial refund, or
      `full` for a full refund of what is left. It prints a receipt with the fee returned by each refund and
      the total returned against the fee charged. The exit status is 0 on success and 2 for a bad request.

      ## Layout

      | Path | Purpose |
      |---|---|
      | `feecalc/money.py` | cents helpers: rounding, parsing, formatting |
      | `feecalc/schedule.py` | tiers and fee schedules |
      | `feecalc/rates.py` | rate table loader |
      | `feecalc/charge.py` | charges |
      | `feecalc/ledger.py` | in-memory ledger of charges and refunds |
      | `feecalc/refund.py` | full and partial refunds |
      | `feecalc/receipt.py` | text receipts |
      | `feecalc/cli.py` | command line |
    tests/test_charge.py: |
      from decimal import Decimal

      import pytest

      from feecalc.charge import Charge, make_charge


      def test_charge_takes_the_scheduled_fee(standard):
          charge = make_charge("c-1", Decimal("10.00"), standard)
          assert charge == Charge("c-1", Decimal("10.00"), Decimal("0.59"), "standard")


      def test_net_is_amount_less_fee(standard):
          assert make_charge("c-1", Decimal("10.00"), standard).net == Decimal("9.41")


      def test_a_charge_needs_an_identifier(standard):
          with pytest.raises(ValueError, match="identifier"):
              make_charge("", Decimal("10.00"), standard)


      def test_charges_are_immutable(standard):
          charge = make_charge("c-1", Decimal("10.00"), standard)
          with pytest.raises(AttributeError):
              charge.fee = Decimal("0")


      def test_fee_is_fixed_when_the_charge_is_made(standard, flat):
          first = make_charge("c-1", Decimal("25.00"), standard)
          second = make_charge("c-2", Decimal("25.00"), flat)
          assert first.fee == Decimal("1.03")
          assert second.fee == Decimal("1.00")
          assert first.schedule == "standard" and second.schedule == "flat"
    tests/test_cli.py: |
      import io

      import pytest

      from feecalc.cli import main


      def run(*argv):
          out = io.StringIO()
          status = main(list(argv), out)
          return status, out.getvalue()


      def test_quote_prints_the_fee():
          assert run("quote", "10.00") == (0, "0.59\n")


      def test_quote_uses_the_chosen_schedule():
          assert run("--schedule", "marketplace", "quote", "40.00") == (0, "1.60\n")


      def test_rates_lists_the_bundled_schedules():
          status, text = run("rates")
          assert status == 0
          assert text.splitlines() == ["standard: 3 tier(s)", "marketplace: 2 tier(s)"]


      def test_refund_replays_partial_refunds_exactly():
          status, text = run("refund", "20.00", "10.00", "10.00")
          assert status == 0
          lines = text.splitlines()
          assert lines[0] == "charge cli-1 (standard)"
          assert lines[-1].strip() == "fee returned in total 0.88 of 0.88 charged"


      def test_refund_accepts_full_as_a_step():
          status, text = run("refund", "24.00", "12.00", "full")
          assert status == 0
          assert text.splitlines()[-1].strip() == "fee returned in total 1.00 of 1.00 charged"


      def test_refund_reports_an_overdraw(capsys):
          status, text = run("refund", "10.00", "6.00", "6.00")
          assert status == 2
          assert text == ""
          assert "exceeds" in capsys.readouterr().err


      @pytest.mark.parametrize(
          "argv, message",
          [
              (("quote", "abc"), "not an amount"),
              (("quote", "0"), "positive"),
              (("--schedule", "nope", "quote", "1.00"), "unknown schedule"),
              (("refund", "10.00", "oops"), "not an amount"),
          ],
      )
      def test_bad_requests_exit_two(argv, message, capsys):
          status, _ = run(*argv)
          assert status == 2
          assert message in capsys.readouterr().err


      def test_a_missing_table_file_is_not_swallowed(tmp_path):
          with pytest.raises(FileNotFoundError):
              run("--table", str(tmp_path / "missing.csv"), "rates")


      def test_a_custom_table_is_used(tmp_path):
          table = tmp_path / "t.csv"
          table.write_text("schedule,up_to,percent,fixed\nstandard,,10.00,0.00\n", encoding="utf-8")
          assert run("--table", str(table), "quote", "20.00") == (0, "2.00\n")
