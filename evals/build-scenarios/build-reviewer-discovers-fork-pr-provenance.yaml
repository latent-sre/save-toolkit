          "text, message",
          [
              ("", "header"),
              ("schedule,up_to,percent\na,,1,0\n", "header"),
              ("schedule,up_to,percent,fixed\na,,1\n", "columns"),
              ("schedule,up_to,percent,fixed\n,,1,0\n", "name is empty"),
              ("schedule,up_to,percent,fixed\na,x,1,0\na,,1,0\n", "up_to is not a number"),
              ("schedule,up_to,percent,fixed\na,,-1,0\n", "non-negative"),
