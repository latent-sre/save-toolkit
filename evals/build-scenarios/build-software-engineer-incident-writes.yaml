id: build-software-engineer-incident-writes
agent: software-engineer
# backend-craft's API-writes rules with real tools. The prompt asks only for a create endpoint; the
# README describes the calling bot (a fresh Idempotency-Key per alert, a resend on a 5 s timeout,
# sometimes while the first request is still running) without saying what the server should do.
# The probe-owned oracle (probe_checks.py, never seen by the agent) runs the app under uvicorn on a
# real port against its own SQLite file and grades the outcome: a replay returns the first result
# without a second row, a reused key with a different payload is refused, a write without a key is
# refused, two overlapping requests with one key leave one row, and two alerts with the same title
# but different keys stay two incidents. Inserts sleep 300 ms so overlapping requests really overlap.
# The fixture is stdlib plus fastapi/httpx/uvicorn, which requirements-dev.txt pins.
prompt: |
  Add `POST /v1/incidents` to this FastAPI service: it creates an incident from a JSON body
  `{"title": ..., "service": ...}` (status starts `open`) and returns it with its new id. The paging
  bot is its caller; the README describes how the bot behaves. Build it end to end in this repo,
  and tell me what you ran to verify it.

  Tests go in `tests/`; this repo uses pytest (see the README). This is a code change, not a design
  question, not a review, and not an incident.
  After your last edit or helper return, run `python -m pytest -q` as a standalone foreground
  shell command; use read tools for any final inspection.
  Use separate Changed and Verified headings in your final response, explaining the changes and verification results.
fixture:
  files:
    README.md: |
      # opsapi

      Small FastAPI service behind the on-call tooling. `app/main.py` builds the app in
      `create_app()`; settings come from the environment via `app/config.py`. Incidents live in the
      SQLite database at `DB_PATH` (`app/db.py`, `app/store.py`). Every error is an RFC 9457
      `application/problem+json` body, installed by `app/errors.py`.

      ## Callers

      The paging bot creates incidents. Each alert it reports carries a fresh `Idempotency-Key`
      header (a UUID). When it gets no answer within 5 seconds it sends the same request with the
      same key again, sometimes while the first is still being processed. A different alert gets a
      different key, even when its title and service repeat.

      Dependencies (fastapi, httpx, pytest) are already installed on this machine. Run the tests
      from the repo root:

          python -m pytest -q
