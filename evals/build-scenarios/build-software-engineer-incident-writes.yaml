    app/__init__.py: ""
    app/config.py: |
      """Runtime settings, read from the environment."""
      from __future__ import annotations

      import os
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Settings:
          db_path: str


      def get_settings() -> Settings:
          return Settings(db_path=os.environ.get("DB_PATH", "opsapi.db"))
    app/db.py: |
      """SQLite access: one connection per use; the schema is created at startup."""
      from __future__ import annotations

      import sqlite3
      from collections.abc import Iterator
      from contextlib import contextmanager

      from app.config import get_settings

      SCHEMA = """
      CREATE TABLE IF NOT EXISTS incidents (
          id TEXT PRIMARY KEY,
          title TEXT NOT NULL,
          service TEXT NOT NULL,
          status TEXT NOT NULL,
          created_at TEXT NOT NULL
      );
      """


      @contextmanager
      def connect() -> Iterator[sqlite3.Connection]:
          conn = sqlite3.connect(get_settings().db_path, timeout=10)
          conn.row_factory = sqlite3.Row
          try:
              yield conn
          finally:
              conn.close()


      def init_schema() -> None:
          with connect() as conn:
              conn.executescript(SCHEMA)
    app/store.py: |
      """Incident persistence."""
      from __future__ import annotations

      import sqlite3
      import time
      import uuid
      from datetime import datetime, timezone

      # The production database is remote: a write takes about 300 ms. Tests keep the delay.
      WRITE_LATENCY_S = 0.3


      def get_incident(conn: sqlite3.Connection, incident_id: str) -> dict | None:
          row = conn.execute("SELECT * FROM incidents WHERE id = ?", (incident_id,)).fetchone()
          return dict(row) if row else None


      def create_incident(conn: sqlite3.Connection, title: str, service: str) -> dict:
          row = {
              "id": f"inc-{uuid.uuid4().hex[:12]}",
              "title": title,
              "service": service,
              "status": "open",
              "created_at": datetime.now(timezone.utc).isoformat(),
          }
          time.sleep(WRITE_LATENCY_S)
          conn.execute(
              "INSERT INTO incidents (id, title, service, status, created_at)"
              " VALUES (:id, :title, :service, :status, :created_at)",
              row,
          )
          conn.commit()
          return row
    app/schemas.py: |
      from __future__ import annotations

      from pydantic import BaseModel


      class IncidentOut(BaseModel):
          id: str
          title: str
          service: str
          status: str
          created_at: str
    app/errors.py: |
      """RFC 9457 problem+json for every error this service returns."""
      from __future__ import annotations

      import uuid
      from http import HTTPStatus

      from fastapi import FastAPI, Request
      from fastapi.exceptions import RequestValidationError
      from fastapi.responses import JSONResponse
      from starlette.exceptions import HTTPException as StarletteHTTPException


      def problem(request: Request, status: int, detail: str, **extensions) -> JSONResponse:
          body = {
              "type": "about:blank",
              "title": HTTPStatus(status).phrase,
              "status": status,
              "detail": detail,
              "request_id": request.headers.get("x-request-id") or str(uuid.uuid4()),
              **extensions,
          }
          return JSONResponse(body, status_code=status, media_type="application/problem+json")


      def install_problem_handlers(app: FastAPI) -> None:
          @app.exception_handler(StarletteHTTPException)
          async def http_error(request: Request, exc: StarletteHTTPException) -> JSONResponse:
              response = problem(request, exc.status_code, str(exc.detail))
              response.headers.update(exc.headers or {})
              return response

          @app.exception_handler(RequestValidationError)
          async def invalid(request: Request, exc: RequestValidationError) -> JSONResponse:
              errors = [{"loc": [str(p) for p in e["loc"]], "msg": e["msg"]} for e in exc.errors()]
              return problem(request, 422, "The request failed validation.", errors=errors)

          @app.exception_handler(Exception)
          async def unexpected(request: Request, exc: Exception) -> JSONResponse:
              return problem(request, 500, "An unexpected error occurred.")
    app/main.py: |
      """opsapi application factory."""
      from __future__ import annotations

      from contextlib import asynccontextmanager

      from fastapi import FastAPI, HTTPException

      from app import store
      from app.db import connect, init_schema
      from app.errors import install_problem_handlers
      from app.schemas import IncidentOut


      def create_app() -> FastAPI:
          @asynccontextmanager
          async def lifespan(app: FastAPI):
              init_schema()
              yield

          app = FastAPI(title="opsapi", lifespan=lifespan)
          install_problem_handlers(app)

          @app.get("/healthz")
          def healthz() -> dict:
              return {"status": "ok"}

          @app.get("/v1/incidents/{incident_id}", response_model=IncidentOut)
          def get_incident(incident_id: str) -> IncidentOut:
              with connect() as conn:
                  row = store.get_incident(conn, incident_id)
              if row is None:
                  raise HTTPException(status_code=404, detail="unknown incident")
              return IncidentOut(**row)

          return app
