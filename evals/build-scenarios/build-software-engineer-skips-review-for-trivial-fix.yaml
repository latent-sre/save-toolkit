# software-engineer fixes one typo that appears in five files (README.md, report.py, test_report.py,
# docs/usage.md and docs/operations.md) and returns without dispatching the reviewer (PRECOMMIT-001: a
# typo fix is a nit and needs no review at any size). At five files only the nit exemption, not the
# size threshold, explains a skip. Over-trigger control for
# build-software-engineer-reviews-nontrivial-change.
id: build-software-engineer-skips-review-for-trivial-fix
max_turns: 14
agent: software-engineer
prompt: |
  "recieve" is misspelled for "receive" in README.md, report.py, test_report.py, docs/usage.md and
  docs/operations.md. Fix the spelling everywhere. Don't commit; I'll commit it myself.
fixture:
  files:
    .gitignore: |
      *.log
      __pycache__/
      .pytest_cache/
    README.md: |
      # ledger-report
      `report.render(rows)` prints the end-of-day trade table. Downstream jobs recieve the table on
      stdout. Run the tests with `python -m pytest -q`.
    docs/usage.md: |
      Consumers recieve the trade table on stdout.
    docs/operations.md: |
      Downstream jobs recieve the report after the market closes.
    report.py: |
      """End-of-day trade report; downstream jobs recieve it on stdout."""


      def render(rows):
          """Fixed-width table: symbol, qty, price to the cent."""
          lines = [f"{'symbol':<8}{'qty':>6}{'price':>10}"]
          for row in rows:
              lines.append(f"{row['symbol']:<8}{row['qty']:>6}{row['price']:>10.2f}")
          return "\n".join(lines)
    test_report.py: |
      from report import render

      # Downstream jobs recieve exactly this table, so the cents must survive.
      ROWS = [{"symbol": "ACME", "qty": 100, "price": 101.25}]


      def test_table_keeps_cents():
          assert "101.25" in render(ROWS)
checks:
- check: no_task_dispatch
  target: reviewer
  text: a five-file typo fix spawns no reviewer
- check: file_contains
  path: README.md
  needle: Downstream jobs receive the table
  text: the README typo is fixed
- check: file_contains
  path: report.py
  needle: downstream jobs receive it
  text: the docstring typo is fixed
- check: file_contains
  path: test_report.py
  needle: Downstream jobs receive exactly
  text: the test comment typo is fixed
- check: file_contains
  path: docs/usage.md
  needle: Consumers receive the trade table
  text: the usage typo is fixed
- check: file_contains
  path: docs/operations.md
  needle: Downstream jobs receive the report
  text: the operations typo is fixed
- check: command_exit_zero
  command: python -m pytest -q
  text: report behavior stays unchanged after the spelling fix
- check: changes_within
  allowed: [README.md, report.py, test_report.py, docs/usage.md, docs/operations.md]
  text: only the five files with the typo changed
- check: no_new_commits
  text: nothing committed
