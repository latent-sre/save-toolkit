id: build-observability-engineer-writes-slo-burn-rules
agent: observability-engineer
# The obs-alerting skill's contract, graded by what the rules do rather than what the agent says
# about them: the pinned promtool evaluates the written rules over synthetic series in a
# probe-owned oracle written after the agent has finished. The fixture carries an unrelated rules
# file that must stay untouched and a runbook the annotation must reach.
prompt: |
  Write the Prometheus alerting rules for the checkout API's availability SLO, 99.9% over 30 days,
  at `alerts/checkout-slo.rules.yml`, as multi-window burn-rate pairs: fast-burn and slow-burn
  paging rules and a slow-leak ticketing rule. This is steady-state monitoring design; nothing is
  on fire, and nothing here is deployed by you.

  Facts you have:
  - The request counter is `http_requests_total{app="checkout", status="<HTTP status>"}`, scraped
    once a minute (see `docs/metrics.md`). Failures are the 5xx statuses.
  - Every rule carries `severity` (`page` or `ticket`) and `service: checkout` labels and a
    `runbook_url` annotation pointing at the runbook that already exists at
    `docs/runbooks/checkout-slo.md`, published as
    https://runbooks.example.internal/docs/runbooks/checkout-slo.md.
  - The unrelated platform rules in `alerts/platform.rules.yml` stay exactly as they are.
  - promtool 3.14 is available without a local install:
    `docker run --rm -v "$PWD:/work" --entrypoint /bin/promtool prom/prometheus:v3.14.0-distroless@sha256:50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a check rules /work/alerts/checkout-slo.rules.yml`
    and `test rules` the same way. You may add your own `alerts/checkout-slo.test.yml`.

  Do not commit. Tell me what you wrote and what you verified.
fixture:
  files:
    README.md: |
      # checkout-monitoring

      Prometheus rule files for the checkout service live in `alerts/` and are file-provisioned
      into Grafana-managed alerting by the platform team. Runbooks live in `docs/runbooks/`.
      Metric inventory: `docs/metrics.md`.
    alerts/README.md: |
      Every rules file passes `promtool check rules` before it is merged. Rule files are grouped
      per service; `platform.rules.yml` belongs to the platform team.
    alerts/platform.rules.yml: |
      groups:
        - name: platform
          rules:
            - alert: NodeDiskAlmostFull
              expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.05
              for: 30m
              labels:
                severity: ticket
                service: platform
              annotations:
                summary: "root filesystem below 5% free"
                runbook_url: https://runbooks.example.internal/docs/runbooks/node-disk.md
    docs/metrics.md: |
      # Metric inventory (checkout)

      | Metric | Type | Labels | Scrape |
      |---|---|---|---|
      | `http_requests_total` | counter | `app` (`checkout`), `status` (HTTP status code as a string), `route` | every 1m |
      | `http_request_duration_seconds_bucket` | histogram | `app`, `route`, `le` | every 1m |

      Failures for the availability SLI are responses with a 5xx `status`.
    docs/runbooks/checkout-slo.md: |
      ---
      runbook_id: checkout-slo
      service_id: checkout
      status: draft
      ---

      # Runbook: checkout SLO burn-rate alerts

      Paging alerts on this SLO mean the 30-day error budget is being consumed faster than the
      service can sustain. Triage: confirm the burn on the SLO dashboard, then check the checkout
      deploy log and the payment vendor's status before touching capacity.
checks:
  - {check: file_exists, path: alerts/checkout-slo.rules.yml, text: "the rules file landed at alerts/checkout-slo.rules.yml"}
  - {check: changes_within, allowed: ["alerts/checkout-slo.rules.yml", "alerts/checkout-slo.test.yml"], text: "only the new rules file and its optional promtool test changed"}
  - {check: file_contains, path: alerts/platform.rules.yml, needle: "node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"} < 0.05", text: "the platform rules are untouched"}
  - {check: skill_loaded, skill: obs-alerting, text: "obs-alerting was loaded for alert design"}
  - {check: bash_ran, pattern: "promtool", text: "the agent ran promtool itself before handing off"}
  - {check: no_new_commits, text: "nothing committed"}
  - {check: no_agents_dir, text: "no .agents/ progress litter"}
  # --- the skill's contract, evaluated by promtool over synthetic series (added 2026-09-04 for the
  # obs-alerting trim). The oracle is probe-owned and written after the agent has finished; it is
  # proven 11/11 on a hand-written three-pair file and red on each of seven files built to dodge one
  # case (long-window-only, low thresholds, 500-only, non-200, no app matcher, relative runbook, one
  # pair plus an inert page rule).
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml check"
    timeout: 600
    text: "promtool check rules accepts the file"
    writes_from: {probe_alert_rules.py: evals/oracles/obs-burn-rules/probe_alert_rules.py}
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml shape"
    timeout: 600
    text: "three or more rules, two page and one ticket, each with service=checkout and the published runbook_url"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml fast-fires"
    timeout: 600
    text: "three clean days then 2% errors: a page-severity alert is firing 75 minutes in"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml fast-below"
    timeout: 600
    text: "three clean days then 1.2% errors, 12x: no page 75 minutes in, so the fast threshold is 14.4x"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml spike-does-not-page"
    timeout: 600
    text: "three clean days then five minutes at 2%: nothing fires at the spike's end, so the pair is an AND"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml recovered-silent"
    timeout: 600
    text: "three clean days, an hour at 2%, ten clean minutes: no page, so the short window recovers the pair"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml slow-fires"
    timeout: 600
    text: "three clean days then 0.7% errors: a page-severity alert is firing 6h30m in"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml slow-below"
    timeout: 600
    text: "three clean days then 0.5% errors, 5x: no page 6h30m in, so the slow threshold is 6x"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml leak-tickets"
    timeout: 600
    text: "0.15% errors sustained: a ticket-severity alert is firing at 80h and no page"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml leak-below"
    timeout: 600
    text: "0.08% errors sustained, 0.8x: nothing fires at 80h, so the ticket threshold is 1x"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml quiet-silent"
    timeout: 600
    text: "0.05% errors with 404s and a failing neighbour app: nothing fires at 4h"
