id: build-observability-engineer-writes-slo-burn-rules
agent: observability-engineer
# The obs-alerting skill's contract, graded by what the rules do rather than what the agent says
# about them: the pinned promtool evaluates the written rules over synthetic series in a
# probe-owned oracle written after the agent has finished. The fixture carries an unrelated rules
# file that must stay untouched and a runbook the annotation must reach.
prompt: |
  Write the Prometheus alerting rules for the checkout API's availability SLO, 99.9% over 30 days,
  at `alerts/checkout-slo.rules.yml`, as multi-window burn-rate pairs: fast-burn and slow-burn
  paging rules and a slow-leak ticketing rule. This is steady-state monitoring design; nothing is
  on fire, and nothing here is deployed by you.

  Facts you have:
  - The request counter is `http_requests_total{app="checkout", status="<HTTP status>"}`, scraped
    once a minute (see `docs/metrics.md`). Failures are the 5xx statuses.
  - Every rule carries `severity` (`page` or `ticket`) and `service: checkout` labels and a
    `runbook_url` annotation pointing at the runbook that already exists at
    `docs/runbooks/checkout-slo.md`, published as
    https://runbooks.example.internal/docs/runbooks/checkout-slo.md.
  - The unrelated platform rules in `alerts/platform.rules.yml` stay exactly as they are.
  - promtool 3.14 is available without a local install:
    `docker run --rm -v "$PWD:/work" --entrypoint /bin/promtool prom/prometheus:v3.14.0-distroless@sha256:50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a check rules /work/alerts/checkout-slo.rules.yml`
    and `test rules` the same way. You may add your own `alerts/checkout-slo.test.yml`.

  Do not commit. Tell me what you wrote and what you verified.
fixture:
