  # --- the skill's contract, evaluated by promtool over synthetic series (added 2026-09-04 for the
  # obs-alerting trim). The oracle is probe-owned and written after the agent has finished; it is
  # proven 11/11 on a hand-written three-pair file and red on each of seven files built to dodge one
  # case (long-window-only, low thresholds, 500-only, non-200, no app matcher, relative runbook, one
  # pair plus an inert page rule).
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml check"
    timeout: 600
    text: "promtool check rules accepts the file"
    writes:
      probe_alert_rules.py: |
        """Probe-owned oracle for Prometheus burn-rate alerting rules written with the obs-alerting skill.

        Usage: python probe_alert_rules.py <rules.yml> <case>
        Exit 0 when the case holds, 1 with a reason when it does not. The rules are evaluated by the pinned
        promtool over synthetic series, so the verdicts are about what the rules do, not what they say.
        Unless noted, a case opens with three days at 0.05% errors so every window carries real history:

          check                 promtool check rules passes
          shape                 three or more alert rules, at least two page and one ticket; each has
                                severity page or ticket, service=checkout, and the published runbook_url
          fast-fires            then 2% errors: a page-severity alert is firing 75 minutes in
          fast-below            then 1.2% errors (12x, under 14.4x): no page 75 minutes in
          spike-does-not-page   then five minutes at 2%, then clean: nothing fires at the spike's end
          recovered-silent      then an hour at 2%, then ten clean minutes: no page, so the short window
                                must have recovered the pair (a long-window-only rule is still firing)
          slow-fires            then 0.7% errors: a page-severity alert is firing 6h30m in
          slow-below            then 0.5% errors (5x, under 6x): no page 6h30m in
          leak-tickets          0.15% errors from the start: a ticket at 80h and no page
          leak-below            0.08% errors from the start (0.8x, under 1x): nothing at 80h
          quiet-silent          0.05% errors from the start: nothing at 4h

        Series, one sample a minute: http_requests_total{app="checkout"} with status 200, 500, 503 (the
        failures are split across both 5xx codes) and a constant 404 stream that is valid traffic and not a
        failure; and http_requests_total{app="search"} at a constant 10% error rate, which a rule missing
        the app matcher folds into checkout's ratio.
        """
        import os
        import re
        import subprocess
        import sys

        IMAGE = "prom/prometheus:v3.14.0-distroless@sha256:50c707e96da5ade383cb1707790576480485e93de06aa60ad8802cb5f744bd0a"
        STATUSES = ("200", "500", "503")   # checkout per-minute rates in each segment, in this order
        NOT_FOUND_PER_MIN = 20              # checkout 404s, constant
        SEARCH_PER_MIN = (2000, 200)        # the search app's 200s and 500s, constant
        SERIES = {
            "200": 'http_requests_total{app="checkout", status="200"}',
            "500": 'http_requests_total{app="checkout", status="500"}',
            "503": 'http_requests_total{app="checkout", status="503"}',
            "404": 'http_requests_total{app="checkout", status="404"}',
            "search200": 'http_requests_total{app="search", status="200"}',
            "search500": 'http_requests_total{app="search", status="500"}',
        }
        RUNBOOK_URL = "https://runbooks.example.internal/docs/runbooks/checkout-slo.md"
        LEAD = ((2000, 1, 0), 4320)         # three days at 0.05%


        def piece(rates: list[int], minutes: list[int]) -> str:
            """Piecewise cumulative counter, one sample a minute. promtool's 'a+bxN' expands to N+1 samples,
            so every later segment starts one step past the previous one's last value and expands N-1 times."""
            parts, cur = [], 0
            for i, (r, m) in enumerate(zip(rates, minutes)):
                if i == 0:
                    parts.append(f"{cur}+{r}x{m}")
                    cur += r * m
                else:
                    start = cur + r
                    parts.append(f"{start}+{r}x{m - 1}")
                    cur = start + r * (m - 1)
            return " ".join(parts)


        def concat(*segments: tuple[tuple[int, int, int], int]) -> dict[str, str]:
            """Each segment is ((200/min, 500/min, 503/min), minutes); the 404 and search streams are constant."""
            minutes = [m for _, m in segments]
            values = {status: piece([r[i] for r, _ in segments], minutes) for i, status in enumerate(STATUSES)}
            total = sum(minutes)
            values["404"] = f"0+{NOT_FOUND_PER_MIN}x{total}"
            values["search200"] = f"0+{SEARCH_PER_MIN[0]}x{total}"
            values["search500"] = f"0+{SEARCH_PER_MIN[1]}x{total}"
            return values


        CASES = {
            # name: (series values, eval_time, wants); ("page", True) a page alert must fire, ("page", False) none may
            "fast-fires": (concat(LEAD, ((2000, 20, 20), 100)), "4395m", [("page", True)]),
            "fast-below": (concat(LEAD, ((2000, 12, 12), 100)), "4395m", [("page", False)]),
            "spike-does-not-page": (concat(LEAD, ((2000, 20, 20), 5), ((2000, 0, 0), 25)), "4325m", [("page", False), ("ticket", False)]),
            "recovered-silent": (concat(LEAD, ((2000, 20, 20), 60), ((2000, 0, 0), 10)), "4390m", [("page", False), ("ticket", False)]),
            "slow-fires": (concat(LEAD, ((2000, 7, 7), 420)), "4710m", [("page", True)]),
            "slow-below": (concat(LEAD, ((2000, 5, 5), 420)), "4710m", [("page", False)]),
            "leak-tickets": (concat(((2000, 1, 2), 4900)), "4800m", [("ticket", True), ("page", False)]),
            "leak-below": (concat(((2500, 1, 1), 4900)), "4800m", [("ticket", False), ("page", False)]),
            "quiet-silent": (concat(((2000, 1, 0), 260)), "240m", [("page", False), ("ticket", False)]),
        }


        def load_rules(path: str) -> list[dict]:
            import yaml
            with open(path, encoding="utf-8") as fh:
                doc = yaml.safe_load(fh) or {}
            rules = []
            for group in doc.get("groups") or []:
                for rule in group.get("rules") or []:
                    if "alert" in rule:
                        rules.append(rule)
            return rules


        def promtool(args: list[str], workspace: str) -> subprocess.CompletedProcess:
            mount = f"{os.path.abspath(workspace)}:/work:ro"
            cmd = ["docker", "run", "--rm", "--network", "none", "-v", mount, "--entrypoint", "/bin/promtool", IMAGE, *args]
            env = dict(os.environ, MSYS_NO_PATHCONV="1")
            return subprocess.run(cmd, capture_output=True, text=True, timeout=600, env=env)


        def case_check(rules_path: str) -> str | None:
            result = promtool(["check", "rules", "/work/" + rules_path.replace(os.sep, "/")], ".")
            return None if result.returncode == 0 else "promtool check rules failed: " + (result.stdout + result.stderr).strip()[-400:]


        def fired(rules_path: str, values: dict[str, str], eval_time: str, alert_names: list[str]) -> tuple[dict[str, list[str]], str]:
            """Run one promtool unit test expecting nothing to fire; read what did fire from the report."""
            lines = ["rule_files:", f"  - /work/{rules_path.replace(os.sep, '/')}", "evaluation_interval: 1m", "tests:",
                     "  - interval: 1m", "    input_series:"]
            for key, selector in SERIES.items():
                lines += [f"      - series: '{selector}'", f"        values: '{values[key]}'"]
            lines.append("    alert_rule_test:")
            for name in alert_names:
                lines += [f"      - eval_time: {eval_time}", f"        alertname: {name}", "        exp_alerts: []"]
            os.makedirs(".probe", exist_ok=True)
            test_path = os.path.join(".probe", "burn.test.yml")
            with open(test_path, "w", encoding="utf-8", newline="\n") as fh:
                fh.write("\n".join(lines) + "\n")
            result = promtool(["test", "rules", "/work/.probe/burn.test.yml"], ".")
            out = result.stdout + result.stderr
            # promtool reports each mismatch as "alertname: X, time: T," then "exp:[...]," then a
            # multi-line "got:[ ... ]" block; every expectation here is empty, so what it got is what fired.
            got: dict[str, list[str]] = {}
            for chunk in re.split(r"\n\s*alertname:\s*", out)[1:]:
                name = chunk.split(",", 1)[0].strip()
                got_text = chunk.split("got:", 1)[1] if "got:" in chunk else ""
                got[name] = re.findall(r'severity="([a-z]+)"', got_text)
            if result.returncode != 0 and not got:
                return {}, "promtool test rules failed without a readable report: " + out.strip()[-400:]
            return got, ""


        def case_behaviour(rules_path: str, case: str) -> str | None:
            values, eval_time, wants = CASES[case]
            names = [r["alert"] for r in load_rules(rules_path)]
            if not names:
                return "no alerting rules found in the file"
            got, error = fired(rules_path, values, eval_time, names)
            if error:
                return error
            firing = {sev for sevs in got.values() for sev in sevs}
            unlabelled = [name for name, sevs in got.items() if not sevs]
            problems = []
            for severity, must in wants:
                if must and severity not in firing:
                    problems.append(f"no {severity}-severity alert is firing at {eval_time} (firing: {sorted(got) or 'none'})")
                if not must and severity in firing:
                    problems.append(f"a {severity}-severity alert is firing at {eval_time}: " + ", ".join(n for n, s in got.items() if severity in s))
            if unlabelled:
                problems.append("alerts firing without a severity label: " + ", ".join(unlabelled))
            return "; ".join(problems) if problems else None


        def case_shape(rules_path: str) -> str | None:
            rules = load_rules(rules_path)
            if len(rules) < 3:
                return f"{len(rules)} alerting rule(s); three burn-rate pairs need at least three"
            problems = []
            severities = []
            for rule in rules:
                labels = rule.get("labels") or {}
                annotations = rule.get("annotations") or {}
                name = rule.get("alert")
                if labels.get("severity") not in ("page", "ticket"):
                    problems.append(f"{name}: severity is {labels.get('severity')!r}, not page or ticket")
                if labels.get("service") != "checkout":
                    problems.append(f"{name}: service label is {labels.get('service')!r}")
                url = str(annotations.get("runbook_url") or "")
                if url != RUNBOOK_URL:
                    problems.append(f"{name}: runbook_url is {url!r}, not the published runbook")
                severities.append(labels.get("severity"))
            if severities.count("page") < 2 or "ticket" not in severities:
                problems.append("expected two page-severity pairs and one ticket-severity pair")
            return "; ".join(problems) if problems else None


        def main() -> int:
            sys.stdout.reconfigure(encoding="utf-8", errors="replace")
            rules_path, case = sys.argv[1], sys.argv[2]
            if not os.path.isfile(rules_path):
                print(f"FAIL {case}: {rules_path} does not exist")
                return 1
            if case == "check":
                problem = case_check(rules_path)
            elif case == "shape":
                problem = case_shape(rules_path)
            elif case in CASES:
                problem = case_behaviour(rules_path, case)
            else:
                print(f"FAIL {case}: unknown case; known: check, shape, {', '.join(CASES)}")
                return 1
            print(f"{'PASS' if problem is None else 'FAIL'} {case}" + (f": {problem}" if problem else ""))
            return 0 if problem is None else 1


        if __name__ == "__main__":
            raise SystemExit(main())
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml shape"
    timeout: 600
    text: "three or more rules, two page and one ticket, each with service=checkout and the published runbook_url"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml fast-fires"
    timeout: 600
    text: "three clean days then 2% errors: a page-severity alert is firing 75 minutes in"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml fast-below"
    timeout: 600
    text: "three clean days then 1.2% errors, 12x: no page 75 minutes in, so the fast threshold is 14.4x"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml spike-does-not-page"
    timeout: 600
    text: "three clean days then five minutes at 2%: nothing fires at the spike's end, so the pair is an AND"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml recovered-silent"
    timeout: 600
    text: "three clean days, an hour at 2%, ten clean minutes: no page, so the short window recovers the pair"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml slow-fires"
    timeout: 600
    text: "three clean days then 0.7% errors: a page-severity alert is firing 6h30m in"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml slow-below"
    timeout: 600
    text: "three clean days then 0.5% errors, 5x: no page 6h30m in, so the slow threshold is 6x"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml leak-tickets"
    timeout: 600
    text: "0.15% errors sustained: a ticket-severity alert is firing at 80h and no page"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml leak-below"
    timeout: 600
    text: "0.08% errors sustained, 0.8x: nothing fires at 80h, so the ticket threshold is 1x"
  - check: command_exit_zero
    command: "python probe_alert_rules.py alerts/checkout-slo.rules.yml quiet-silent"
    timeout: 600
    text: "0.05% errors with 404s and a failing neighbour app: nothing fires at 4h"
