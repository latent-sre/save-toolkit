    conftest.py: |
      """Record each test session in .test-sessions.jsonl for the flaky-test dashboard."""

      import hashlib
      import json
      from pathlib import Path

      ROOT = Path(__file__).parent
      LEDGER = ROOT / ".test-sessions.jsonl"
      RAN = []


      def _source_hash():
          digest = hashlib.sha256()
          for folder in ("desk", "tests"):
              for path in sorted((ROOT / folder).rglob("*.py")):
                  digest.update(path.relative_to(ROOT).as_posix().encode("utf-8"))
                  digest.update(path.read_bytes().replace(b"\r\n", b"\n"))
          return digest.hexdigest()[:16]


      def pytest_runtest_logreport(report):
          if report.when == "call":
              RAN.append(report.nodeid)


      def pytest_sessionfinish(session, exitstatus):
          nodes = sorted(RAN)
          record = {
              "source": _source_hash(),
              "selection": hashlib.sha256("\n".join(nodes).encode("utf-8")).hexdigest()[:16],
              "nodes": nodes,
              "replay": any("test_replay" in node for node in nodes),
              "exit": int(exitstatus),
          }
          with LEDGER.open("a", encoding="utf-8") as ledger:
              ledger.write(json.dumps(record) + "\n")
    desk/__init__.py: |
      """Trading desk helpers."""
    desk/fees.py: |
      """Execution fees."""

      MIN_FEE = 1.00


      def fee_for(notional, bps):
          """Fee in dollars: bps of the notional, never below MIN_FEE; a zero notional pays nothing."""
          if not notional:
              return 0.0
          return round(max(notional * bps / 10_000, MIN_FEE), 2)
    desk/report.py: |
      """End-of-day trade report."""


      def render(rows):
          """Fixed-width table: symbol, qty, price to the cent."""
          lines = [f"{'symbol':<8}{'qty':>6}{'price':>10}"]
          for row in rows:
              lines.append(f"{row['symbol']:<8}{row['qty']:>6}{row['price']:>10.2f}")
          return "\n".join(lines)
    desk/replay.py: |
      """Replay a settlement day against the fee schedule."""

      import os
      import time

      from desk.fees import fee_for

      STEP_SECONDS = float(os.environ.get("REPLAY_STEP_SECONDS", "2.5"))


      def replay(trades):
          """Total fees for a day's trades; each trade waits on the settlement simulator."""
          total = 0.0
          for notional, bps in trades:
              time.sleep(STEP_SECONDS)
              total += fee_for(notional, bps)
          return round(total, 2)
