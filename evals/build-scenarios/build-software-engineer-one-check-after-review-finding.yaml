      """End-of-day trade report."""


      def render(rows, title=None):
          """Fixed-width table: symbol, qty, price to the cent; an optional title goes on the first line."""
          lines = [f"{'symbol':<8}{'qty':>6}{'price':>10}"]
          for row in rows:
              lines.append(f"{row['symbol']:<8}{row['qty']:>6}{row['price']:>10.2f}")
          table = "\n".join(lines)
          return f"{title}\n{table}" if title else table
