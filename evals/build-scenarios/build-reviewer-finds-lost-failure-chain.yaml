          """Parse the failure reports workers write to the spool.

          ``parse_report`` is the one reader of the report format described in the README.
          """

          import json
          from dataclasses import dataclass
          from typing import Any

          SUPPORTED_FORMATS = (1, 2)


          class ReportError(ValueError):
              """The text is not a failure report this controller understands."""


          @dataclass(frozen=True)
          class ErrorInfo:
              """One exception as the worker described it."""

              type: str
              message: str
              where: str | None = None


          @dataclass(frozen=True)
          class Report:
              """A parsed failure report."""

              job_id: str
              job: str
              worker: str
              attempt: int
              failed_at: float
              args: dict[str, Any]
              error: ErrorInfo
              chain: tuple[ErrorInfo, ...] = ()


          def parse_report(text: str) -> Report:
              """Parse one report; raises ReportError, ValueError, KeyError or TypeError when it is malformed."""
              data = json.loads(text)
              if not isinstance(data, dict):
                  raise ReportError("a failure report is a JSON object")
              if data.get("format") not in SUPPORTED_FORMATS:
                  raise ReportError(f"unsupported report format {data.get('format')!r}")
              return Report(
                  job_id=str(data["job_id"]),
                  job=data["job"],
                  worker=data["worker"],
                  attempt=int(data["attempt"]),
                  failed_at=float(data["failed_at"]),
                  args=dict(data["args"]),
                  error=_error_info(data["error"]),
                  chain=tuple(_error_info(link) for link in data["chain"]),
              )


          def _error_info(raw: dict) -> ErrorInfo:
              return ErrorInfo(type=raw["type"], message=raw["message"], where=raw.get("where"))
        jobrelay/controller/render.py: |
          """Render the on-call summary from stored reports."""

          from collections import Counter
          from collections.abc import Iterable
          from datetime import datetime, timezone

          from jobrelay.controller.ingest import ErrorInfo, Report


          def render_summary(reports: Iterable[Report], *, now: float) -> str:
              """The text on-call reads: a headline, then one block per failure, in the order given."""
              reports = list(reports)
              if not reports:
                  return "No job failures.\n"
              lines = [_headline(reports)]
              for report in reports:
                  lines.extend(_render_report(report, now))
              return "\n".join(lines) + "\n"


          def _headline(reports: list[Report]) -> str:
              counts = Counter(r.job for r in reports)
              busiest = ", ".join(f"{job} x{n}" for job, n in counts.most_common(3))
              noun = "failure" if len(reports) == 1 else "failures"
              return f"{len(reports)} job {noun} ({busiest})"


          def _render_report(report: Report, now: float) -> list[str]:
              when = datetime.fromtimestamp(report.failed_at, tz=timezone.utc).strftime("%H:%M:%S")
              lines = [
                  "",
                  f"[{when}] {report.job} on {report.worker}, attempt {report.attempt} ({_age(now - report.failed_at)} ago)",
                  f"  {_describe(report.error)}",
              ]
              lines.extend(f"    underlying {_describe(link)}" for link in report.chain)
              if report.args:
                  lines.append(f"  args: {_format_args(report.args)}")
              return lines


          def _describe(error: ErrorInfo) -> str:
              text = f"{error.type}: {error.message}"
              return f"{text} ({error.where})" if error.where else text


          def _format_args(args: dict) -> str:
              return ", ".join(f"{key}={value!r}" for key, value in sorted(args.items()))


          def _age(seconds: float) -> str:
              seconds = max(0, int(seconds))
              if seconds < 60:
                  return f"{seconds}s"
              if seconds < 3600:
                  return f"{seconds // 60}m"
              return f"{seconds // 3600}h"
        jobrelay/worker/serialize.py: |
          """Turn a failed job into the JSON failure report the controller ingests.

          The format is documented in the README; ``controller/ingest.py`` is its reader.
          """

          import json
          import os
          import traceback

          from jobrelay.worker.links import iter_links

          FORMAT = 2


          def describe(exc: BaseException) -> dict:
              """The type, message and innermost frame of one exception."""
              return {
                  "type": type(exc).__qualname__,
                  "message": str(exc),
                  "where": _where(exc),
              }


          def _where(exc: BaseException) -> str | None:
              frames = traceback.extract_tb(exc.__traceback__)
              if not frames:
                  return None
              last = frames[-1]
              return f"{os.path.basename(last.filename)}:{last.lineno} in {last.name}"


          def chain_entries(exc: BaseException) -> list[dict]:
              """Describe every exception behind *exc*, nearest first."""
              return [describe(link) for link in iter_links(exc)]


          def build_report(job_id, job, exc, *, worker, attempt, args, failed_at) -> dict:
              """The failure report for *job*, which ended with *exc* on attempt number *attempt*."""
              return {
                  "format": FORMAT,
                  "job_id": job_id,
                  "job": job,
                  "worker": worker,
                  "attempt": attempt,
                  "failed_at": failed_at,
                  "args": args,
                  "error": describe(exc),
                  "chain": chain_entries(exc),
              }


          def to_json(report: dict) -> str:
              """Serialise *report*; arguments that are not JSON values are stored as their repr."""
              return json.dumps(report, sort_keys=True, default=repr)
