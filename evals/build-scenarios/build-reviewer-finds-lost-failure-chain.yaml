# serializer reuses iter_links, which follows __cause__ only, so the commonest failure (a raise inside
# an except block) still shows one error; and the parser reads `chain` of every report, so a format 1
# report from a not-yet-upgraded worker is rejected by the unchanged consumer and never reaches on-call.
# Decoys: the unguarded chain walk (iter_links keeps the cycle guard) and json.dumps(default=repr)
