      import json

      from jobrelay.config import Config
      from jobrelay.controller.consumer import Consumer
      from jobrelay.controller.store import ReportStore
      from jobrelay.transport import DONE, REJECTED, Spool
      from jobrelay.worker import serialize


      def queue_failure(spool, job="export", message="export failed"):
          try:
              raise RuntimeError(message)
          except RuntimeError as exc:
              report = serialize.build_report(
                  "j1", job, exc, worker="w1", attempt=3, args={"bucket": "daily"}, failed_at=1_700_000_000.0
              )
          return spool.put(serialize.to_json(report))


      def make_consumer(tmp_path, capacity=10):
          config = Config(spool_dir=tmp_path, store_capacity=capacity)
          return Consumer(config)


      def test_stores_a_report_and_moves_it_to_done(tmp_path):
          consumer = make_consumer(tmp_path)
          queue_failure(consumer.spool)
