      """Parse the failure reports workers write to the spool.

      ``parse_report`` is the one reader of the report format described in the README.
      """

      import json
      from dataclasses import dataclass
      from typing import Any

      SUPPORTED_FORMATS = (1,)


      class ReportError(ValueError):
          """The text is not a failure report this controller understands."""


      @dataclass(frozen=True)
      class ErrorInfo:
          """One exception as the worker described it."""

          type: str
          message: str
          where: str | None = None


      @dataclass(frozen=True)
      class Report:
          """A parsed failure report."""

          job_id: str
          job: str
          worker: str
          attempt: int
          failed_at: float
          args: dict[str, Any]
          error: ErrorInfo


      def parse_report(text: str) -> Report:
          """Parse one report; raises ReportError, ValueError, KeyError or TypeError when it is malformed."""
          data = json.loads(text)
          if not isinstance(data, dict):
              raise ReportError("a failure report is a JSON object")
          if data.get("format") not in SUPPORTED_FORMATS:
              raise ReportError(f"unsupported report format {data.get('format')!r}")
          return Report(
              job_id=str(data["job_id"]),
              job=data["job"],
              worker=data["worker"],
              attempt=int(data["attempt"]),
              failed_at=float(data["failed_at"]),
              args=dict(data["args"]),
              error=_error_info(data["error"]),
          )


      def _error_info(raw: dict) -> ErrorInfo:
          return ErrorInfo(type=raw["type"], message=raw["message"], where=raw.get("where"))
