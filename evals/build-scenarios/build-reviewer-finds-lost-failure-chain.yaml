    jobrelay/controller/consumer.py: |
      """The controller's loop: read the spool, parse each report and store it.

      A report that cannot be parsed is logged and moved to ``rejected/`` without being stored, so
      on-call never sees it. Every parsed report is stored and moved to ``done/``.
      """

      import time
      from dataclasses import dataclass

      from jobrelay.config import Config
      from jobrelay.controller import ingest
      from jobrelay.controller.store import ReportStore
      from jobrelay.logging_util import get_logger
      from jobrelay.transport import Spool

      UNPARSEABLE = (ValueError, KeyError, TypeError)


      @dataclass
      class Tally:
          """What one pass over the spool did."""

          stored: int = 0
          rejected: int = 0


      class Consumer:
          """Moves reports from the spool into the store."""

          def __init__(self, config: Config, spool: Spool | None = None, store: ReportStore | None = None):
              self.spool = spool if spool is not None else Spool(config.spool_dir)
              self.store = store if store is not None else ReportStore(config.store_capacity)
              self.log = get_logger("controller", config.log_dir)

          def run_once(self) -> Tally:
              """Process every report currently pending, oldest first."""
              tally = Tally()
              for path in self.spool.pending():
                  try:
                      report = ingest.parse_report(self.spool.read(path))
                  except UNPARSEABLE as exc:
                      self.log.warning("rejected %s: %s: %s", path.name, type(exc).__name__, exc)
                      self.spool.reject(path)
                      tally.rejected += 1
                      continue
                  self.store.add(report)
                  self.spool.ack(path)
                  tally.stored += 1
              return tally

          def run_forever(self, interval: float = 2.0, *, should_stop=lambda: False, sleep=time.sleep) -> None:
              """Poll the spool every *interval* seconds until *should_stop* returns true."""
              while not should_stop():
                  self.run_once()
                  sleep(interval)
