      """Logger setup shared by the worker and the controller."""

      import logging
      from pathlib import Path

      FORMAT = "%(asctime)s %(levelname)s %(name)s: %(message)s"


      def get_logger(name: str, log_dir: Path | None = None) -> logging.Logger:
          """Return the logger ``jobrelay.<name>``; with *log_dir* it also writes ``jobrelay.log`` there."""
          logger = logging.getLogger(f"jobrelay.{name}")
          logger.setLevel(logging.INFO)
          if log_dir is not None and not any(isinstance(h, logging.FileHandler) for h in logger.handlers):
              Path(log_dir).mkdir(parents=True, exist_ok=True)
              handler = logging.FileHandler(Path(log_dir) / "jobrelay.log", encoding="utf-8")
              handler.setFormatter(logging.Formatter(FORMAT))
              logger.addHandler(handler)
          return logger
    jobrelay/transport.py: |
      """File-based queue between workers and the controller.

      Workers write each failure report into ``pending/`` through a file in ``tmp/`` and an atomic
      rename, so the controller never reads a half-written report. The controller moves a report to
      ``done/`` once it is stored, or to ``rejected/`` when it cannot be parsed.
      """

      import os
      import time
      import uuid
      from pathlib import Path

      PENDING, DONE, REJECTED, TMP = "pending", "done", "rejected", "tmp"


      class Spool:
          """One spool directory shared by every worker and the controller."""

          def __init__(self, root: Path | str):
              self.root = Path(root)
              for name in (PENDING, DONE, REJECTED, TMP):
                  (self.root / name).mkdir(parents=True, exist_ok=True)

          def put(self, text: str) -> Path:
              """Queue *text* as one report and return its path in ``pending/``."""
              name = f"{time.time_ns():020d}-{uuid.uuid4().hex[:8]}.json"
              staged = self.root / TMP / name
              staged.write_text(text, encoding="utf-8")
              target = self.root / PENDING / name
              os.replace(staged, target)
              return target

          def pending(self) -> list[Path]:
              """Queued reports, oldest first."""
              return sorted((self.root / PENDING).glob("*.json"))

          def read(self, path: Path) -> str:
              return path.read_text(encoding="utf-8")

          def ack(self, path: Path) -> Path:
              """Move a stored report to ``done/``."""
              return self._move(path, DONE)

          def reject(self, path: Path) -> Path:
              """Move an unparseable report to ``rejected/``."""
              return self._move(path, REJECTED)

          def count(self, folder: str) -> int:
              """How many reports sit in *folder*."""
              return sum(1 for _ in (self.root / folder).glob("*.json"))

          def _move(self, path: Path, folder: str) -> Path:
              target = self.root / folder / path.name
              os.replace(path, target)
              return target
