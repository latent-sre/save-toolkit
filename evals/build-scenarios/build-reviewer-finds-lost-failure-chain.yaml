      """Command line entry point: ``python -m jobrelay.cli {run,summary}``."""

      import argparse
      import json
      import sys
      import time
      import uuid

      from jobrelay.config import Config
      from jobrelay.controller.consumer import Consumer
      from jobrelay.controller.render import render_summary
      from jobrelay.worker.runner import JOBS, Runner


      def build_parser() -> argparse.ArgumentParser:
          parser = argparse.ArgumentParser(prog="jobrelay")
          commands = parser.add_subparsers(dest="command", required=True)
          run = commands.add_parser("run", help="run a job on this worker")
          run.add_argument("job", help="name of a registered job")
          run.add_argument("--arg", action="append", default=[], metavar="KEY=VALUE", help="a job argument; VALUE is JSON")
          commands.add_parser("summary", help="ingest the spool and print the on-call summary")
          return parser


      def parse_arg(text: str) -> tuple[str, object]:
          """Split ``KEY=VALUE``; a VALUE that is not JSON is kept as a string."""
          key, sep, raw = text.partition("=")
          if not sep or not key:
              raise ValueError(f"expected KEY=VALUE, got {text!r}")
          try:
              return key, json.loads(raw)
          except ValueError:
              return key, raw


      def main(argv=None, *, environ=None, out=None, clock=time.time) -> int:
          """Run one command; the exit status is 0, 1 when a job failed for good, or 2 for bad usage."""
          args = build_parser().parse_args(argv)
          out = out or sys.stdout
          try:
              config = Config.from_env(environ)
          except ValueError as exc:
              print(f"jobrelay: {exc}", file=sys.stderr)
              return 2
          if args.command == "run":
              return _run(args, config, clock)
          return _summary(config, out, clock)


      def _run(args, config: Config, clock) -> int:
          if args.job not in JOBS:
              print(f"jobrelay: unknown job {args.job!r}", file=sys.stderr)
              return 2
          try:
              job_args = dict(parse_arg(text) for text in args.arg)
          except ValueError as exc:
              print(f"jobrelay: {exc}", file=sys.stderr)
              return 2
          ok = Runner(config, clock=clock).run(uuid.uuid4().hex[:8], args.job, job_args)
          return 0 if ok else 1


      def _summary(config: Config, out, clock) -> int:
          consumer = Consumer(config)
          consumer.run_once()
          out.write(render_summary(consumer.store.recent(), now=clock()))
          return 0


      if __name__ == "__main__":
          sys.exit(main())
