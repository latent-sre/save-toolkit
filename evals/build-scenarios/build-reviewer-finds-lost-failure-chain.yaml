          import json

          import pytest

          from jobrelay.controller.ingest import ReportError, parse_report
          from jobrelay.worker import serialize


          def failure(message="export failed"):
              try:
                  raise RuntimeError(message)
              except RuntimeError as exc:
                  return exc


          def explicit_chain():
              """RuntimeError caused by ValueError caused by KeyError, all raised for real."""
              try:
                  try:
                      raise KeyError("bucket")
                  except KeyError as first:
                      raise ValueError("bad bucket") from first
              except ValueError as second:
                  try:
                      raise RuntimeError("export failed") from second
                  except RuntimeError as third:
                      return third


          def report_text(exc=None, **overrides):
              report = serialize.build_report(
                  "j1", "export", exc or failure(), worker="w1", attempt=2, args={"bucket": "daily"}, failed_at=1_700_000_000.0
              )
              return json.dumps(report | overrides)


          def test_parses_every_field():
              report = parse_report(report_text())
              assert (report.job_id, report.job, report.worker, report.attempt) == ("j1", "export", "w1", 2)
              assert report.failed_at == 1_700_000_000.0
              assert report.args == {"bucket": "daily"}
              assert (report.error.type, report.error.message) == ("RuntimeError", "export failed")
              assert report.error.where.endswith("in failure")


          def test_unsupported_format_is_a_report_error():
              with pytest.raises(ReportError, match="unsupported report format 99"):
                  parse_report(report_text(format=99))


          def test_report_must_be_a_json_object():
              with pytest.raises(ReportError):
                  parse_report("[1, 2]")


          def test_text_that_is_not_json_is_a_value_error():
              with pytest.raises(ValueError):
                  parse_report("not json")


          def test_missing_field_is_a_key_error():
              data = json.loads(report_text())
              del data["job"]
              with pytest.raises(KeyError):
                  parse_report(json.dumps(data))


          def test_parses_the_chain_nearest_first():
              report = parse_report(report_text(explicit_chain()))
              assert [(link.type, link.message) for link in report.chain] == [
                  ("ValueError", "bad bucket"),
                  ("KeyError", "'bucket'"),
              ]
              assert all(link.where.endswith("in explicit_chain") for link in report.chain)


          def test_chain_is_empty_when_the_error_has_no_cause():
              assert parse_report(report_text()).chain == ()


          def test_chain_entry_without_a_message_is_a_key_error():
              data = json.loads(report_text(explicit_chain()))
              del data["chain"][0]["message"]
              with pytest.raises(KeyError):
                  parse_report(json.dumps(data))
