    feature/relay-exception-chains:
      message: |
        Carry the whole exception chain in failure reports

        Failure reports are now format 2: they keep every field of format 1 and add
        `chain`, the exceptions behind the final error, nearest first, each described
        like `error`. The serializer builds it with worker.links.iter_links, the helper
        the worker log already uses for its "caused by" lines, so a failure shows the
        same lineage in the log and in the report. The controller parses format 2, the
        on-call summary prints each chain entry under the error as an "underlying"
        line, and the README documents the new format and the summary contract.

        Tests cover the serializer, the parser and the renderer.
      files:
        README.md: |
          # jobrelay

          jobrelay runs jobs on worker processes and relays every job failure to a controller, which keeps
          the on-call summary. It uses only the standard library and needs Python 3.12 or later.

          ## Layout

          | Path | Role |
          |---|---|
          | `jobrelay/worker/runner.py` | Runs a job, retries it, and queues a failure report when attempts run out |
          | `jobrelay/worker/serialize.py` | Builds the JSON failure report |
          | `jobrelay/transport.py` | The spool: a file-based queue between workers and the controller |
          | `jobrelay/controller/consumer.py` | Reads the spool, parses and stores each report |
          | `jobrelay/controller/render.py` | Renders the on-call summary |
          | `jobrelay/cli.py` | `run` and `summary` commands |

          ## Running

          Set `JOBRELAY_SPOOL` to a directory shared by the workers and the controller, then:

          ```
          python -m jobrelay.cli run divide --arg a=1 --arg b=0
          python -m jobrelay.cli summary
          ```

          Other settings: `JOBRELAY_WORKER` (the worker's name in reports), `JOBRELAY_ATTEMPTS`
          (attempts per job, default 3), `JOBRELAY_CAPACITY` (reports the controller keeps, default 200) and
          `JOBRELAY_LOG_DIR` (where `jobrelay.log` is written; unset logs nowhere). Run the tests with
          `python -m pytest -q`.

          ## Failure reports

          When a job fails on its last attempt the worker writes one JSON failure report into
          `$JOBRELAY_SPOOL/pending/`. Reports are written through `tmp/` and renamed into place, so the
          controller never reads a partial file. The controller moves a stored report to `done/`.

          ### Format 1

          ```json
          {
            "format": 1,
            "job_id": "7f3a",
            "job": "export",
            "worker": "worker-2",
            "attempt": 3,
            "failed_at": 1700000000.0,
            "args": {"bucket": "daily"},
            "error": {"type": "RuntimeError", "message": "export failed", "where": "export.py:41 in run"}
          }
          ```

          `error.where` is the innermost frame of the exception and is null when the exception was never
          raised.

          ### Format 2

          Format 2 is format 1 plus one field, `chain`, which lists the exceptions behind `error`, nearest
          first. Each entry is described like `error`.

          ```json
          {
            "format": 2,
            "job_id": "7f3a",
            "job": "export",
            "worker": "worker-2",
            "attempt": 3,
            "failed_at": 1700000000.0,
            "args": {"bucket": "daily"},
            "error": {"type": "RuntimeError", "message": "export failed", "where": "export.py:41 in run"},
            "chain": [
              {"type": "ValueError", "message": "bad bucket", "where": "export.py:30 in load"},
              {"type": "KeyError", "message": "'bucket'", "where": "export.py:27 in load"}
            ]
          }
          ```

          `chain` is empty when the error has nothing behind it. The summary prints each entry under the
          error as an `underlying` line.

          ### Contracts

          - **Independent releases.** Workers and the controller are released independently, and the
            controller goes first. The controller must ingest every report format produced by the previous
            worker release, so workers can be upgraded one at a time without losing a failure.
          - **Rejected reports.** A report the controller cannot parse is moved to `rejected/`, logged, and is
            not shown to on-call.
          - **Arguments.** Job arguments that are not JSON values (sets, datetimes, arbitrary objects) are
            stored as their `repr`.
          - **On-call summary.** The summary shows each failed job with its worker, attempt number and the
            error that ended it, newest first. It shows the same chain the worker's own traceback shows:
            explicit causes (`raise ... from err`), implicit contexts (an exception raised while another was
            being handled), and nothing below a `raise ... from None`.
