          from jobrelay.controller.ingest import ErrorInfo, Report
          from jobrelay.controller.render import render_summary

          NOW = 1_700_000_300.0


          def make_report(job="export", worker="w1", attempt=3, age=90, args=None, error=None, chain=()):
              return Report(
                  job_id="j1",
                  job=job,
                  worker=worker,
                  attempt=attempt,
                  failed_at=NOW - age,
                  args={"bucket": "daily"} if args is None else args,
                  error=error or ErrorInfo("RuntimeError", "export failed", "export.py:41 in run"),
                  chain=chain,
              )


          def test_no_reports_say_so():
              assert render_summary([], now=NOW) == "No job failures.\n"


          def test_block_names_job_worker_attempt_and_error():
              text = render_summary([make_report()], now=NOW)
              assert text.splitlines()[0] == "1 job failure (export x1)"
              assert "[22:16:50] export on w1, attempt 3 (1m ago)" in text
              assert "  RuntimeError: export failed (export.py:41 in run)" in text


          def test_args_are_listed_sorted():
              text = render_summary([make_report(args={"b": 2, "a": "x"})], now=NOW)
              assert "  args: a='x', b=2" in text


          def test_report_without_args_has_no_args_line():
              assert "args:" not in render_summary([make_report(args={})], now=NOW)


          def test_blocks_follow_the_order_given_and_headline_counts_jobs():
              reports = [make_report(job="export"), make_report(job="sync"), make_report(job="export")]
              text = render_summary(reports, now=NOW)
              assert text.splitlines()[0] == "3 job failures (export x2, sync x1)"
              assert [line.split()[1] for line in text.splitlines() if line.startswith("[")] == ["export", "sync", "export"]


          def test_ages_use_the_largest_whole_unit():
              ages = {30: "30s", 90: "1m", 7300: "2h", -5: "0s"}
              for age, expected in ages.items():
                  assert f"({expected} ago)" in render_summary([make_report(age=age)], now=NOW)


          def test_chain_is_listed_under_the_error_nearest_first():
              chain = (ErrorInfo("ValueError", "bad bucket", "export.py:30 in load"), ErrorInfo("KeyError", "'bucket'"))
              lines = render_summary([make_report(chain=chain)], now=NOW).splitlines()
              start = lines.index("  RuntimeError: export failed (export.py:41 in run)")
              assert lines[start + 1 : start + 4] == [
                  "    underlying ValueError: bad bucket (export.py:30 in load)",
                  "    underlying KeyError: 'bucket'",
                  "  args: bucket='daily'",
              ]


          def test_report_without_a_chain_has_no_underlying_lines():
              assert "underlying" not in render_summary([make_report()], now=NOW)
        tests/test_serialize.py: |
          import json

          from jobrelay.worker import serialize


          def failure(message="export failed"):
              try:
                  raise RuntimeError(message)
              except RuntimeError as exc:
                  return exc


          def explicit_chain():
              """RuntimeError caused by ValueError caused by KeyError, all raised for real."""
              try:
                  try:
                      raise KeyError("bucket")
                  except KeyError as first:
                      raise ValueError("bad bucket") from first
              except ValueError as second:
                  try:
                      raise RuntimeError("export failed") from second
                  except RuntimeError as third:
                      return third


          def report_for(exc, **overrides):
              fields = {"worker": "w1", "attempt": 3, "args": {"bucket": "daily"}, "failed_at": 1_700_000_000.0}
              return serialize.build_report("j1", "export", exc, **(fields | overrides))


          def test_report_carries_the_job_and_the_final_error():
              report = report_for(failure())
              assert report["format"] == 2
              assert (report["job_id"], report["job"], report["worker"]) == ("j1", "export", "w1")
              assert (report["attempt"], report["failed_at"]) == (3, 1_700_000_000.0)
              assert report["error"]["type"] == "RuntimeError"
              assert report["error"]["message"] == "export failed"


          def test_error_names_the_innermost_frame():
              where = report_for(failure())["error"]["where"]
              assert where.startswith("test_serialize.py:") and where.endswith("in failure")


          def test_error_that_was_never_raised_has_no_frame():
              assert serialize.describe(ValueError("fresh"))["where"] is None


          def test_report_round_trips_through_json():
              report = report_for(failure())
              assert json.loads(serialize.to_json(report)) == report


          def test_arguments_that_are_not_json_values_are_stored_as_repr():
              report = report_for(failure(), args={"ids": {7}, "path": b"x"})
              stored = json.loads(serialize.to_json(report))["args"]
              assert stored == {"ids": "{7}", "path": "b'x'"}


          def test_chain_lists_explicit_causes_nearest_first():
              chain = report_for(explicit_chain())["chain"]
              assert [(entry["type"], entry["message"]) for entry in chain] == [
                  ("ValueError", "bad bucket"),
                  ("KeyError", "'bucket'"),
              ]
              assert all(entry["where"].endswith("in explicit_chain") for entry in chain)


          def test_chain_is_empty_when_nothing_is_behind_the_error():
              assert report_for(failure())["chain"] == []


          def test_raise_from_none_leaves_the_chain_empty():
              try:
                  try:
                      raise KeyError("hidden")
                  except KeyError:
                      raise RuntimeError("clean") from None
              except RuntimeError as exc:
                  assert report_for(exc)["chain"] == []


          def test_chain_survives_the_json_round_trip():
              report = report_for(explicit_chain())
              assert json.loads(serialize.to_json(report))["chain"] == report["chain"]
