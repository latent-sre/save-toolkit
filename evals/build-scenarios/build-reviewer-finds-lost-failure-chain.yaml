      import io

      import pytest

      from jobrelay import cli
      from jobrelay.config import Config

      NOW = 1_700_000_100.0


      def env(tmp_path, **extra):
          return {"JOBRELAY_SPOOL": str(tmp_path), "JOBRELAY_ATTEMPTS": "1", "JOBRELAY_WORKER": "w3"} | extra


      def run_cli(argv, tmp_path, **extra):
          out = io.StringIO()
          status = cli.main(argv, environ=env(tmp_path, **extra), out=out, clock=lambda: NOW)
          return status, out.getvalue()


      def test_failed_job_shows_up_in_the_summary(tmp_path):
          status, _ = run_cli(["run", "divide", "--arg", "a=1", "--arg", "b=0"], tmp_path)
          assert status == 1
          status, summary = run_cli(["summary"], tmp_path)
          assert status == 0
          assert summary.splitlines()[0] == "1 job failure (divide x1)"
          assert "divide on w3, attempt 1" in summary
          assert "ZeroDivisionError: division by zero" in summary
          assert "args: a=1, b=0" in summary


      def test_successful_job_leaves_an_empty_summary(tmp_path):
          assert run_cli(["run", "echo", "--arg", "x=1"], tmp_path)[0] == 0
          assert run_cli(["summary"], tmp_path)[1] == "No job failures.\n"


      def test_parse_arg_reads_json_and_falls_back_to_text():
          assert cli.parse_arg("n=3") == ("n", 3)
          assert cli.parse_arg("name=bob") == ("name", "bob")
          assert cli.parse_arg("flag=true") == ("flag", True)
          with pytest.raises(ValueError):
              cli.parse_arg("novalue")


      def test_missing_spool_setting_is_a_usage_error(capsys):
          assert cli.main(["summary"], environ={}) == 2
          assert "JOBRELAY_SPOOL is not set" in capsys.readouterr().err


      def test_unknown_job_is_a_usage_error(tmp_path, capsys):
          assert run_cli(["run", "nope"], tmp_path)[0] == 2
          assert "unknown job 'nope'" in capsys.readouterr().err


      def test_config_reads_every_setting(tmp_path):
          config = Config.from_env(env(tmp_path, JOBRELAY_CAPACITY="7", JOBRELAY_LOG_DIR=str(tmp_path / "logs")))
          assert (config.worker_id, config.max_attempts, config.store_capacity) == ("w3", 1, 7)
          assert config.log_dir == tmp_path / "logs"
          with pytest.raises(ValueError):
              Config(spool_dir=tmp_path, max_attempts=0)
