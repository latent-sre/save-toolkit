      """In-memory store of the failures the controller has ingested."""

      from collections import Counter, deque

      from jobrelay.controller.ingest import Report


      class ReportStore:
          """Keeps the most recent *capacity* reports; older ones fall off."""

          def __init__(self, capacity: int):
              self._reports: deque[Report] = deque(maxlen=capacity)

          def add(self, report: Report) -> None:
              self._reports.append(report)

          def recent(self, limit: int | None = None) -> list[Report]:
              """The stored reports, newest first, at most *limit* of them."""
              newest_first = list(reversed(self._reports))
              return newest_first if limit is None else newest_first[:limit]

          def for_job(self, job: str) -> list[Report]:
              """Every stored report of one job, newest first."""
              return [r for r in self.recent() if r.job == job]

          def counts_by_job(self) -> Counter:
              return Counter(r.job for r in self._reports)

          def __len__(self) -> int:
              return len(self._reports)
