    jobrelay/worker/links.py: |
      """Helpers for walking the exceptions behind a failure."""

      from collections.abc import Iterator


      def iter_links(exc: BaseException) -> Iterator[BaseException]:
          """Yield the exceptions behind *exc* by following explicit causes (``raise ... from``).

          Nearest first; *exc* itself is not yielded. A cause that leads back to an exception already
          seen ends the walk, so a cyclic chain cannot loop forever.
          """
          seen = {id(exc)}
          link = exc.__cause__
          while link is not None and id(link) not in seen:
              seen.add(id(link))
              yield link
              link = link.__cause__
    jobrelay/worker/runner.py: |
      """Run jobs on a worker and relay the failure of one that runs out of attempts."""

      import time
      from collections.abc import Callable

      from jobrelay.config import Config
      from jobrelay.logging_util import get_logger
      from jobrelay.transport import Spool
      from jobrelay.worker import serialize
      from jobrelay.worker.links import iter_links

      JOBS: dict[str, Callable[..., object]] = {}
      BACKOFF_SECONDS = 0.5


      def job(name: str):
          """Register the decorated function as the job *name*."""

          def register(func):
              JOBS[name] = func
              return func

          return register


      @job("echo")
      def echo(**kwargs):
          """Return its arguments; the smallest job that cannot fail."""
          return kwargs


      @job("divide")
      def divide(a, b):
          """Divide *a* by *b*."""
          return a / b


      class Runner:
          """Runs jobs for one worker and queues a report for each job that fails for good."""

          def __init__(self, config: Config, spool: Spool | None = None, *, clock=time.time, sleep=time.sleep):
              self.config = config
              self.spool = spool if spool is not None else Spool(config.spool_dir)
              self.log = get_logger("worker", config.log_dir)
              self._clock = clock
              self._sleep = sleep

          def run(self, job_id: str, name: str, args: dict) -> bool:
              """Run job *name*, retrying failures; True on success, False once a report was queued."""
              attempts = self.config.max_attempts
              for attempt in range(1, attempts + 1):
                  try:
                      JOBS[name](**args)
                      return True
                  except Exception as exc:
                      self._log_failure(job_id, name, attempt, exc)
                      if attempt == attempts:
                          self._report(job_id, name, args, attempt, exc)
                      else:
                          self._sleep(BACKOFF_SECONDS * 2 ** (attempt - 1))
              return False

          def _log_failure(self, job_id: str, name: str, attempt: int, exc: Exception) -> None:
              self.log.error("job %s (%s) failed on attempt %d: %s: %s", job_id, name, attempt, type(exc).__name__, exc)
              for link in iter_links(exc):
                  self.log.error("  caused by %s: %s", type(link).__name__, link)

          def _report(self, job_id: str, name: str, args: dict, attempt: int, exc: Exception) -> None:
              report = serialize.build_report(
                  job_id, name, exc, worker=self.config.worker_id, attempt=attempt, args=args, failed_at=self._clock()
              )
              self.spool.put(serialize.to_json(report))
    jobrelay/worker/serialize.py: |
      """Turn a failed job into the JSON failure report the controller ingests.

      The format is documented in the README; ``controller/ingest.py`` is its reader.
      """

      import json
      import os
      import traceback

      FORMAT = 1


      def describe(exc: BaseException) -> dict:
          """The type, message and innermost frame of one exception."""
          return {
              "type": type(exc).__qualname__,
              "message": str(exc),
              "where": _where(exc),
          }


      def _where(exc: BaseException) -> str | None:
          frames = traceback.extract_tb(exc.__traceback__)
          if not frames:
              return None
          last = frames[-1]
          return f"{os.path.basename(last.filename)}:{last.lineno} in {last.name}"


      def build_report(job_id, job, exc, *, worker, attempt, args, failed_at) -> dict:
          """The failure report for *job*, which ended with *exc* on attempt number *attempt*."""
          return {
              "format": FORMAT,
              "job_id": job_id,
              "job": job,
              "worker": worker,
              "attempt": attempt,
              "failed_at": failed_at,
              "args": args,
              "error": describe(exc),
          }


      def to_json(report: dict) -> str:
          """Serialise *report*; arguments that are not JSON values are stored as their repr."""
          return json.dumps(report, sort_keys=True, default=repr)
