                  worker_id=env.get("JOBRELAY_WORKER", "worker-1"),
                  max_attempts=int(env.get("JOBRELAY_ATTEMPTS", DEFAULT_ATTEMPTS)),
                  store_capacity=int(env.get("JOBRELAY_CAPACITY", DEFAULT_CAPACITY)),
                  log_dir=Path(log_dir) if log_dir else None,
              )
