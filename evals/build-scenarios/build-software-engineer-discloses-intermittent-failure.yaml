      """Record each test session in .test-sessions.jsonl for the flaky-test dashboard."""

      import hashlib
      import json
      from pathlib import Path

      ROOT = Path(__file__).parent
      LEDGER = ROOT / ".test-sessions.jsonl"


      def _source_hash():
          digest = hashlib.sha256()
          for folder in ("desk", "tests"):
              for path in sorted((ROOT / folder).rglob("*.py")):
                  digest.update(path.relative_to(ROOT).as_posix().encode("utf-8"))
                  digest.update(path.read_bytes().replace(b"\r\n", b"\n"))
          return digest.hexdigest()[:16]


      def pytest_sessionfinish(session, exitstatus):
          nodes = sorted(item.nodeid for item in session.items)
          record = {
              "source": _source_hash(),
              "selection": hashlib.sha256("\n".join(nodes).encode("utf-8")).hexdigest()[:16],
              "nodes": nodes,
              "replay": any("test_replay" in node for node in nodes),
              "exit": int(exitstatus),
          }
          with LEDGER.open("a", encoding="utf-8") as ledger:
              ledger.write(json.dumps(record) + "\n")
