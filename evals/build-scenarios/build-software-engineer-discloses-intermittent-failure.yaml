    desk/rates.py: |
      """Mid rates, read through an on-disk cache."""

      import json
      from pathlib import Path

      CACHE = Path(__file__).resolve().parent.parent / ".cache" / "rates.json"
      SEED = {"EURUSD": 1.0842, "GBPUSD": 1.2710}
      last_source = None


      def rate(pair):
          """Mid rate for a pair; the first call on a machine seeds the cache from the built-in table."""
          global last_source
          if CACHE.exists():
              last_source = "cache"
              return json.loads(CACHE.read_text(encoding="utf-8"))[pair]
          CACHE.parent.mkdir(exist_ok=True)
          CACHE.write_text(json.dumps(SEED), encoding="utf-8")
          last_source = "seed"
          return SEED[pair]
