# software-engineer makes a nit-level code change that touches three files (renaming a helper in
# prices.py and its uses in report.py and test_prices.py, behavior unchanged) and returns without
# dispatching the reviewer (PRECOMMIT-001: nits need no review at any size). At three files only the
# nit exemption, not the size threshold, explains a skip. Code-side over-trigger control for
# build-software-engineer-reviews-nontrivial-change.
id: build-software-engineer-skips-review-for-code-nit
max_turns: 28
agent: software-engineer
prompt: |
  Rename the helper `cents` in prices.py to `format_price` so it reads like the rest of the ledger
  code, and update every use of it (report.py and test_prices.py). Behavior stays the same. Don't
  commit; I'll commit it myself.
fixture:
  files:
    .gitignore: |
      *.log
      __pycache__/
    README.md: |
      # ledger-report
      `report.render(rows)` prints the end-of-day trade table. Run the tests with
      `python -m pytest -q`.
    prices.py: |
      """Price formatting shared by the ledger reports."""


      def cents(value):
          """A price to the cent, as text."""
          return f"{value:.2f}"
    report.py: |
      """End-of-day trade report."""

      from prices import cents


      def render(rows):
          """Fixed-width table: symbol, qty, price to the cent."""
          lines = [f"{'symbol':<8}{'qty':>6}{'price':>10}"]
          for row in rows:
              lines.append(f"{row['symbol']:<8}{row['qty']:>6}{cents(row['price']):>10}")
          return "\n".join(lines)
    test_prices.py: |
      from prices import cents


      def test_rounds_to_the_cent():
          assert cents(101.254) == "101.25"
    test_report.py: |
      from report import render

      ROWS = [{"symbol": "ACME", "qty": 100, "price": 101.25}]


      def test_table_keeps_cents():
          assert "101.25" in render(ROWS)
checks:
- check: no_task_dispatch
  target: reviewer
  text: a three-file rename spawns no reviewer
- check: file_contains
  path: prices.py
  needle: def format_price
  text: the helper is renamed
- check: file_contains
  path: report.py
  needle: format_price
  text: report.py uses the new name
- check: file_contains
  path: test_prices.py
  needle: format_price
  text: test_prices.py uses the new name
- check: changes_within
  allowed: [prices.py, report.py, test_prices.py]
  text: only the helper and its two uses changed
- check: no_new_commits
  text: nothing committed
