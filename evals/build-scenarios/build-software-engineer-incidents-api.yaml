id: build-software-engineer-incidents-api
agent: software-engineer
# The backend bar with real tools. The prompt asks only for two endpoints and tests; it never says
# "paginate", "problem+json", "timeout", or "response model". Those are what backend-craft is for,
# so the probe-owned oracle (probe_checks.py, written by the first check, never seen by the agent)
# grades them on the running app: a cursor walk over 250 seeded incidents, one RFC 9457 shape for
# 404 and for a bad filter, an internal field that must not cross the boundary, the vendor owner
# actually fetched, an outbound timeout proven against a vendor that sleeps 20 s, and /healthz
# independent of that vendor. The fixture is stdlib plus fastapi/httpx, which requirements-dev.txt
# pins and the host has installed; the agent adds no dependency. First measured 2026-09-02, five
# Sonnet and five Opus trials per side of the backend-craft trim:
# docs/reviews/2026-09-02-backend-craft-trim-evidence.md.
prompt: |
  Add two endpoints to this FastAPI service, build them end to end in this repo, and tell me what
  you ran to verify it.

  - `GET /v1/incidents` lists the incidents in `app/store.py`, filterable by `?status=` (open or
    closed).
  - `GET /v1/incidents/{id}` returns one incident plus its current on-call owner. The owner comes
    from the paging vendor's HTTP API at `settings.paging_base_url`:
    `GET {base}/oncall?service=<service>` answers JSON `{"owner": "<name>"}`.

  Tests go in `tests/`; this repo uses pytest (see the README). This is a code change, not a design
  question, not a review, and not an incident.
fixture:
  files:
    README.md: |
      # opsapi

      Small FastAPI service behind the on-call tooling. `app/main.py` builds the app in
      `create_app()`; settings come from the environment via `app/config.py`.

      Dependencies (fastapi, httpx, pytest) are already installed on this machine. Run the tests
      from the repo root:

          python -m pytest -q
    pyproject.toml: |
      [project]
      name = "opsapi"
      version = "0.1.0"
      requires-python = ">=3.12"

      [tool.pytest.ini_options]
      testpaths = ["tests"]
      pythonpath = ["."]
    app/__init__.py: ""
    app/config.py: |
      """Runtime settings, read from the environment once per app."""
      from __future__ import annotations

      import os
      from dataclasses import dataclass


      @dataclass(frozen=True)
      class Settings:
          paging_base_url: str


      def get_settings() -> Settings:
          return Settings(
              paging_base_url=os.environ.get("PAGING_BASE_URL", "http://paging.internal.invalid"),
          )
    app/store.py: |
      """In-memory incident store (the real one is a database; this is the seed we test against)."""
      from __future__ import annotations

      from datetime import datetime, timedelta, timezone

      _SERVICES = ("checkout", "payments", "search")
      _START = datetime(2026, 8, 1, tzinfo=timezone.utc)


      def _seed() -> list[dict]:
          rows = []
          for n in range(1, 251):
              rows.append(
                  {
                      "id": f"inc-{n:04d}",
                      "status": "open" if n % 3 else "closed",
                      "title": f"Incident {n}",
                      "service": _SERVICES[n % 3],
                      "created_at": (_START + timedelta(minutes=17 * n)).isoformat(),
                      "internal_note": f"triage scratch for {n}; never shown to callers",
                  }
              )
          return rows


      INCIDENTS: list[dict] = _seed()
    app/schemas.py: |
      from __future__ import annotations

      from pydantic import BaseModel


      class ServiceOut(BaseModel):
          name: str
          tier: int
    app/main.py: |
      """opsapi application factory."""
      from __future__ import annotations

      from fastapi import FastAPI, HTTPException

      from app.schemas import ServiceOut

      _TIERS = {"checkout": 1, "payments": 1, "search": 2}


      def create_app() -> FastAPI:
          app = FastAPI(title="opsapi")

          @app.get("/healthz")
          def healthz() -> dict:
              return {"status": "ok"}

          @app.get("/v1/services/{name}", response_model=ServiceOut)
          def get_service(name: str) -> ServiceOut:
              if name not in _TIERS:
                  raise HTTPException(status_code=404, detail="unknown service")
              return ServiceOut(name=name, tier=_TIERS[name])

          return app
    tests/__init__.py: ""
    tests/conftest.py: |
      import pytest
      from fastapi.testclient import TestClient

      from app.main import create_app


      @pytest.fixture
      def client():
          with TestClient(create_app()) as c:
              yield c
    tests/test_services.py: |
      def test_known_service(client):
          r = client.get("/v1/services/checkout")
          assert r.status_code == 200
          assert r.json() == {"name": "checkout", "tier": 1}


      def test_unknown_service_is_404(client):
          assert client.get("/v1/services/nope").status_code == 404
checks:
  # The oracle is written by this first check and reused by the ones below (the workspace persists
  # between checks). It starts a stub vendor on loopback, points PAGING_BASE_URL at it, and drives
  # the real app through TestClient.
  - check: command_exit_zero
    command: "python probe_checks.py pagination"
    timeout: 120
    text: "oracle: cursor pagination walks 250 unique incidents, default page is bounded, limit is capped"
    writes_from: {probe_checks.py: evals/oracles/incidents-api/probe_checks.py}
  - {check: command_exit_zero, command: "python probe_checks.py filter", timeout: 120, text: "oracle: ?status= filters, and an invalid value is a 4xx problem+json, never 200"}
  - {check: command_exit_zero, command: "python probe_checks.py problem_json", timeout: 120, text: "oracle: unknown id is a 404 in the one RFC 9457 shape"}
  - {check: command_exit_zero, command: "python probe_checks.py no_leak", timeout: 120, text: "oracle: the store's internal_note never crosses the API boundary (response model as allowlist)"}
  - {check: command_exit_zero, command: "python probe_checks.py owner", timeout: 120, text: "oracle: the detail endpoint carries the on-call owner fetched from the vendor"}
  - {check: command_exit_zero, command: "python probe_checks.py timeout", timeout: 120, text: "oracle: a vendor that sleeps 20 s surfaces as a fast 5xx problem+json, not a hang"}
  - {check: command_exit_zero, command: "python probe_checks.py healthz", timeout: 120, text: "oracle: /healthz answers in under 2 s while the vendor is hung"}
  - {check: command_exit_zero, command: "python -m pytest -q", timeout: 300, text: "suite is green when the probe runs it"}
  - {check: command_exit_zero, command: "python -c \"import subprocess,sys; r=subprocess.run([sys.executable,'-m','pytest','-v'],capture_output=True,text=True); out=(r.stdout+r.stderr).lower(); sys.exit(0 if r.returncode==0 and 'incident' in out and ' passed' in out else 1)\"", timeout: 300, text: "an incidents test case actually executed and passed"}
  - {check: bash_ran, pattern: "pytest", text: "a test command actually ran"}
  - {check: text_regex, pattern: '^[\s>*_#-]{0,8}changed\b', text: "packet: Changed slot"}
  - {check: text_regex, pattern: '^[\s>*_#-]{0,8}verified\b', text: "packet: Verified slot"}
  - {check: changes_within, allowed: ["app", "tests", "README.md", "pyproject.toml"], text: "surgical: only the service, its tests, the README, and the project file changed"}
  - {check: no_new_commits, text: "nothing committed uninvited"}
  - {check: no_agents_dir, text: "no .agents/ progress litter"}
  - {check: skill_loaded, skill: backend-craft, text: "backend-craft was loaded for backend code"}
  - {check: skill_not_loaded, skill: eng-ladder, text: "no ladder load for a scoped change"}
  - {check: no_task_dispatch, target: reviewer, text: "routine completion spawns no reviewer"}
