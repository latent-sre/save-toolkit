    app/store.py: |
      """In-memory incident store (the real one is a database; this is the seed we test against)."""
      from __future__ import annotations

      from datetime import datetime, timedelta, timezone

      _SERVICES = ("checkout", "payments", "search")
      _START = datetime(2026, 8, 1, tzinfo=timezone.utc)


      def _seed() -> list[dict]:
          rows = []
          for n in range(1, 251):
              rows.append(
                  {
                      "id": f"inc-{n:04d}",
                      "status": "open" if n % 3 else "closed",
                      "title": f"Incident {n}",
                      "service": _SERVICES[n % 3],
                      "created_at": (_START + timedelta(minutes=17 * n)).isoformat(),
                      "internal_note": f"triage scratch for {n}; never shown to callers",
                  }
              )
          return rows


      INCIDENTS: list[dict] = _seed()
    app/schemas.py: |
      from __future__ import annotations

      from pydantic import BaseModel


      class ServiceOut(BaseModel):
          name: str
          tier: int
    app/main.py: |
      """opsapi application factory."""
      from __future__ import annotations

      from fastapi import FastAPI, HTTPException

      from app.schemas import ServiceOut

      _TIERS = {"checkout": 1, "payments": 1, "search": 2}


      def create_app() -> FastAPI:
          app = FastAPI(title="opsapi")

          @app.get("/healthz")
          def healthz() -> dict:
              return {"status": "ok"}

          @app.get("/v1/services/{name}", response_model=ServiceOut)
          def get_service(name: str) -> ServiceOut:
              if name not in _TIERS:
                  raise HTTPException(status_code=404, detail="unknown service")
              return ServiceOut(name=name, tier=_TIERS[name])

          return app
