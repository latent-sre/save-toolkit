id: build-software-engineer-incidents-api
agent: software-engineer
# The backend bar with real tools. The prompt asks only for two endpoints and tests; it never says
# "paginate", "problem+json", "timeout", or "response model". Those are what backend-craft is for,
# so the probe-owned oracle (probe_checks.py, written by the first check, never seen by the agent)
# grades them on the running app: a cursor walk over 250 seeded incidents, one RFC 9457 shape for
# 404 and for a bad filter, an internal field that must not cross the boundary, the vendor owner
# actually fetched, an outbound timeout proven against a vendor that sleeps 20 s, and /healthz
# independent of that vendor. The fixture is stdlib plus fastapi/httpx, which requirements-dev.txt
# pins and the host has installed; the agent adds no dependency.
prompt: |
  Add two endpoints to this FastAPI service, build them end to end in this repo, and tell me what
  you ran to verify it.

  - `GET /v1/incidents` lists the incidents in `app/store.py`, filterable by `?status=` (open or
    closed).
  - `GET /v1/incidents/{id}` returns one incident plus its current on-call owner. The owner comes
    from the paging vendor's HTTP API at `settings.paging_base_url`:
    `GET {base}/oncall?service=<service>` answers JSON `{"owner": "<name>"}`.

  Tests go in `tests/`; this repo uses pytest (see the README). This is a code change, not a design
  question, not a review, and not an incident.
