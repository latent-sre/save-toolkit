      	if err != nil {
      		t.Fatal(err)
      	}
      	if got != Default() {
      		t.Fatalf("FromEnv(empty) = %+v, want %+v", got, Default())
      	}
      }

      func TestFromEnvOverrides(t *testing.T) {
      	got, err := FromEnv(env(map[string]string{
      		"POLLER_BATCH_SIZE":    "25",
      		"POLLER_POLL_INTERVAL": "250ms",
