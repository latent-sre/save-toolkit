# Go service whose branch parallelises each batch with a per-job timeout. The candidate's tests pass;
# the per-job context is rooted in context.Background() so Shutdown no longer cancels in-flight
# handlers, and the fan-out helper returns on the first error and strands the other goroutines on an
# unbuffered send. Capturing the loop variable in the fan-out closure is correct on go 1.24.
id: build-reviewer-finds-go-shutdown-leak
max_turns: 30
agent: reviewer
prompt: |
  Review feature/parallel-fanout against main before we merge. It should process each batch in parallel with a per-job timeout; shutdown behaviour and delivery guarantees must stay as documented.
fixture:
  files:
    .gitignore: |
      *.log
    README.md: |
      # queuepoller

      A small service that drains a job queue. It fetches a batch of jobs from a `queue.Queue`, hands each
      job to a `Handler`, and acknowledges the job when the handler succeeds or returns it to the queue
      when the handler fails.

      ## Layout

      | Path | Purpose |
      |---|---|
      | `cmd/poller` | The service binary: reads config, runs the poller, handles SIGTERM. |
      | `internal/poller` | `Poller`, `Handler`, and the fetch/process/settle loop. |
      | `internal/queue` | The `Queue` interface and an in-memory implementation. |
      | `internal/config` | Settings read from `POLLER_*` environment variables. |
      | `internal/backoff` | Exponential retry delays. |
      | `internal/metrics` | Operational counters. |

      ## Running

      ```
      go run ./cmd/poller
      go test ./...
      ```

      The binary uses the in-memory queue; a deployment replaces it with its own `queue.Queue`.

      ## Configuration

      | Variable | Default | Meaning |
      |---|---|---|
      | `POLLER_BATCH_SIZE` | `10` | Most jobs fetched at once. |
      | `POLLER_POLL_INTERVAL` | `1s` | Pause after a fetch that returned no jobs. |
      | `POLLER_BACKOFF_BASE` | `500ms` | First pause after a failed fetch or batch; doubles on each repeat. |
      | `POLLER_BACKOFF_MAX` | `30s` | Longest pause between retries. |
      | `POLLER_ACK_TIMEOUT` | `5s` | Bound on each ack or nack call. |

      ## Delivery and shutdown

      The service sends SIGTERM to `Poller.Shutdown` with a 10 second grace period and then exits.

      Shutdown returns within the grace period. In-flight jobs are cancelled through their context and
      nacked for redelivery; no job is left neither acked nor nacked.

      A job is acked only after its handler returns nil. A handler error, including one caused by
      cancellation, nacks the job, and the queue delivers it again with a higher `Attempt`. Delivery is
      therefore at least once; handlers should be idempotent.

      ## Resource use

      The poller's memory use is bounded by the batch size; a failing upstream must not grow it. A failed
      batch is retried after an exponential backoff, and a failed fetch is retried the same way.
    cmd/poller/main.go: |
      // Command poller runs the queue poller as a service. It stops on SIGTERM or SIGINT by calling
      // Poller.Shutdown with a ten second grace period and then exiting.
      package main

      import (
      	"context"
      	"log"
      	"os"
      	"os/signal"
      	"syscall"
      	"time"

      	"example.com/queuepoller/internal/config"
      	"example.com/queuepoller/internal/metrics"
      	"example.com/queuepoller/internal/poller"
      	"example.com/queuepoller/internal/queue"
      )

      // shutdownGrace is how long Shutdown may take before the process exits regardless.
      const shutdownGrace = 10 * time.Second

      func main() {
      	os.Exit(run())
      }

      func run() int {
      	cfg, err := config.FromEnv(os.Getenv)
      	if err != nil {
      		log.Printf("poller: %v", err)
      		return 2
      	}

      	// The in-memory queue keeps the binary runnable on a laptop; a deployment swaps in its own
      	// queue.Queue here.
      	q := queue.NewMemory()
      	counters := &metrics.Counters{}
      	p := poller.New(q, poller.HandlerFunc(logJob), cfg, counters)

      	runDone := make(chan error, 1)
      	go func() { runDone <- p.Run(context.Background()) }()

      	signals := make(chan os.Signal, 1)
      	signal.Notify(signals, syscall.SIGTERM, os.Interrupt)

      	select {
      	case sig := <-signals:
      		log.Printf("poller: received %v, shutting down", sig)
      	case err := <-runDone:
      		log.Printf("poller: stopped unexpectedly: %v", err)
      		return 1
      	}

      	ctx, cancel := context.WithTimeout(context.Background(), shutdownGrace)
      	defer cancel()
      	if err := p.Shutdown(ctx); err != nil {
      		log.Printf("poller: shutdown did not finish within %v: %v", shutdownGrace, err)
      		return 1
      	}
      	log.Printf("poller: stopped cleanly (%v)", counters.Snapshot())
      	return 0
      }

      // logJob is the placeholder handler for the local build.
      func logJob(ctx context.Context, job queue.Job) error {
      	if err := ctx.Err(); err != nil {
      		return err
      	}
      	log.Printf("poller: handled job %s (attempt %d)", job.ID, job.Attempt)
      	return nil
      }
