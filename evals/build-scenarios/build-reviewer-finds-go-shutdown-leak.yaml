    internal/poller/poller.go: |
      // Package poller drains a queue.Queue: it fetches a batch, hands each job to a Handler, and acks or
      // nacks the job according to the outcome.
      package poller

      import (
      	"context"
      	"errors"
      	"fmt"
      	"sync"
      	"time"

      	"example.com/queuepoller/internal/backoff"
      	"example.com/queuepoller/internal/config"
      	"example.com/queuepoller/internal/metrics"
      	"example.com/queuepoller/internal/queue"
      )

      // ErrAlreadyRunning is returned by Run when the poller has been started before.
      var ErrAlreadyRunning = errors.New("poller: already running")

      // Handler processes one job. A nil return acks the job; any error nacks it for redelivery. The
      // context is cancelled when the poller shuts down, and handlers are expected to return promptly then.
      type Handler interface {
      	Handle(ctx context.Context, job queue.Job) error
      }

      // HandlerFunc adapts a function to Handler.
      type HandlerFunc func(ctx context.Context, job queue.Job) error

      // Handle calls f.
      func (f HandlerFunc) Handle(ctx context.Context, job queue.Job) error { return f(ctx, job) }

      // Poller fetches and processes batches until it is shut down.
      type Poller struct {
      	queue   queue.Queue
      	handler Handler
      	cfg     config.Config
      	metrics *metrics.Counters

      	mu     sync.Mutex
      	cancel context.CancelFunc
      	done   chan struct{}
      }

      // New returns a Poller. A nil m gets a fresh set of counters.
      func New(q queue.Queue, h Handler, cfg config.Config, m *metrics.Counters) *Poller {
      	if m == nil {
      		m = &metrics.Counters{}
      	}
      	return &Poller{queue: q, handler: h, cfg: cfg, metrics: m}
      }

      // Run polls until ctx is cancelled or Shutdown is called, then returns nil. It can be called once.
      func (p *Poller) Run(ctx context.Context) error {
      	runCtx, cancel := context.WithCancel(ctx)
      	defer cancel()

      	p.mu.Lock()
      	if p.cancel != nil {
      		p.mu.Unlock()
      		return ErrAlreadyRunning
      	}
      	p.cancel = cancel
      	done := make(chan struct{})
      	p.done = done
      	p.mu.Unlock()
      	defer close(done)

      	failures := 0
      	for runCtx.Err() == nil {
      		jobs, err := p.queue.Fetch(runCtx, p.cfg.BatchSize)
      		switch {
      		case err != nil:
      			if runCtx.Err() != nil {
      				return nil
      			}
      			p.metrics.FetchError()
      			failures++
      			sleep(runCtx, backoff.Delay(failures, p.cfg.BackoffBase, p.cfg.BackoffMax))
      		case len(jobs) == 0:
      			failures = 0
      			sleep(runCtx, p.cfg.PollInterval)
      		default:
      			p.metrics.Fetched(len(jobs))
      			if err := p.processBatch(runCtx, jobs); err != nil {
      				p.metrics.BatchError()
      				failures++
      				sleep(runCtx, backoff.Delay(failures, p.cfg.BackoffBase, p.cfg.BackoffMax))
      			} else {
      				failures = 0
      			}
      		}
      	}
      	return nil
      }

      // Shutdown stops the poller and waits for Run to return or ctx to expire, whichever is first. It
      // returns ctx.Err() when the wait was cut short.
      func (p *Poller) Shutdown(ctx context.Context) error {
      	p.mu.Lock()
      	cancel, done := p.cancel, p.done
      	p.mu.Unlock()
      	if cancel == nil {
      		return nil
      	}
      	cancel()
      	select {
      	case <-done:
      		return nil
      	case <-ctx.Done():
      		return ctx.Err()
      	}
      }

      // processBatch handles the jobs one after another and returns the first failure.
      func (p *Poller) processBatch(ctx context.Context, jobs []queue.Job) error {
      	var first error
      	for _, job := range jobs {
      		if err := p.processJob(ctx, job); err != nil && first == nil {
      			first = err
      		}
      	}
      	return first
      }

      // processJob runs the handler and settles the job. Settling uses a context detached from
      // cancellation, so a job interrupted by shutdown is still nacked rather than abandoned.
      func (p *Poller) processJob(ctx context.Context, job queue.Job) error {
      	herr := p.handler.Handle(ctx, job)

      	settle, cancel := context.WithTimeout(context.WithoutCancel(ctx), p.cfg.AckTimeout)
      	defer cancel()
      	if herr != nil {
      		p.metrics.Failed()
      		if err := p.queue.Nack(settle, job.ID); err != nil {
      			return fmt.Errorf("nack %s: %w", job.ID, err)
      		}
      		p.metrics.Nacked()
      		return fmt.Errorf("handle %s: %w", job.ID, herr)
      	}
      	if err := p.queue.Ack(settle, job.ID); err != nil {
      		return fmt.Errorf("ack %s: %w", job.ID, err)
      	}
      	p.metrics.Acked()
      	return nil
      }

      // sleep waits for d or for ctx to end, and reports whether the full wait elapsed.
      func sleep(ctx context.Context, d time.Duration) bool {
      	t := time.NewTimer(d)
      	defer t.Stop()
      	select {
      	case <-t.C:
      		return true
      	case <-ctx.Done():
      		return false
      	}
      }
    internal/poller/poller_test.go: |
      package poller

      import (
      	"context"
      	"errors"
      	"testing"
      	"time"

      	"example.com/queuepoller/internal/queue"
      )

      func TestProcessesABatchAndAcksEveryJob(t *testing.T) {
      	q := seeded(5)
      	h := &recorder{}
      	m := counters()
      	start(t, New(q, h, testConfig(10), m))

      	waitFor(t, "all jobs acked", settled(q, 5))
      	if got := m.Snapshot(); got.Fetched != 5 || got.Acked != 5 || got.Nacked != 0 {
      		t.Fatalf("metrics = %v", got)
      	}
      }

      func TestFetchesAtMostOneBatchAtATime(t *testing.T) {
      	q := seeded(7)
      	release := make(chan struct{})
      	h := &recorder{fn: func(ctx context.Context, job queue.Job) error {
      		<-release
      		return nil
      	}}
      	start(t, New(q, h, testConfig(3), counters()))

      	waitFor(t, "first batch in flight", func() bool { return q.Stats().InFlight > 0 })
      	if got := q.Stats(); got.InFlight > 3 {
      		t.Fatalf("in flight = %d, want at most the batch size 3", got.InFlight)
      	}
      	close(release)
      	waitFor(t, "queue drained", settled(q, 7))
      }

      func TestFailedJobIsNackedAndRedelivered(t *testing.T) {
      	q := seeded(3)
      	h := &recorder{fn: func(ctx context.Context, job queue.Job) error {
      		if job.ID == "job-1" && job.Attempt == 1 {
      			return errors.New("upstream returned 503")
      		}
      		return nil
      	}}
      	m := counters()
      	start(t, New(q, h, testConfig(10), m))

      	waitFor(t, "all jobs acked after redelivery", settled(q, 3))
      	got := m.Snapshot()
      	if got.Failed != 1 || got.Nacked != 1 || got.Acked != 3 {
      		t.Fatalf("metrics = %v", got)
      	}
      	if got.BatchErrors < 1 {
      		t.Fatalf("a batch with a failed job should be counted: %v", got)
      	}
      }

      func TestFetchErrorBacksOffAndRecovers(t *testing.T) {
      	q := seeded(2)
      	q.FailFetch(errors.New("queue unavailable"))
      	m := counters()
      	start(t, New(q, &recorder{}, testConfig(10), m))

      	waitFor(t, "fetch errors counted", func() bool { return m.Snapshot().FetchErrors >= 3 })
      	q.FailFetch(nil)
      	waitFor(t, "jobs acked after recovery", settled(q, 2))
      }

      func TestShutdownStopsAnIdlePoller(t *testing.T) {
      	r := start(t, New(queue.NewMemory(), &recorder{}, testConfig(10), counters()))
      	time.Sleep(20 * time.Millisecond)

      	ctx, cancel := context.WithTimeout(context.Background(), time.Second)
      	defer cancel()
      	if err := r.p.Shutdown(ctx); err != nil {
      		t.Fatalf("Shutdown = %v", err)
      	}
      	select {
      	case err := <-r.done:
      		if err != nil {
      			t.Fatalf("Run = %v", err)
      		}
      	case <-time.After(time.Second):
      		t.Fatal("Run did not return after Shutdown")
      	}
      }

      func TestShutdownWaitsForTheBatchInHand(t *testing.T) {
      	q := seeded(4)
      	entered := make(chan struct{}, 4)
      	h := &recorder{fn: func(ctx context.Context, job queue.Job) error {
      		entered <- struct{}{}
      		time.Sleep(40 * time.Millisecond)
      		return nil
      	}}
      	r := start(t, New(q, h, testConfig(4), counters()))
      	<-entered

      	ctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)
      	defer cancel()
      	if err := r.p.Shutdown(ctx); err != nil {
      		t.Fatalf("Shutdown = %v", err)
      	}
      	if s := q.Stats(); s.InFlight != 0 {
      		t.Fatalf("jobs still in flight after Shutdown returned: %+v", s)
      	}
      }

      func TestShutdownGivesUpWhenTheGraceExpires(t *testing.T) {
      	q := seeded(1)
      	block := make(chan struct{})
      	entered := make(chan struct{}, 1)
      	h := &recorder{fn: func(ctx context.Context, job queue.Job) error {
      		entered <- struct{}{}
      		<-block
      		return nil
      	}}
      	r := start(t, New(q, h, testConfig(1), counters()))
      	<-entered

      	ctx, cancel := context.WithTimeout(context.Background(), 30*time.Millisecond)
      	defer cancel()
      	if err := r.p.Shutdown(ctx); !errors.Is(err, context.DeadlineExceeded) {
      		t.Fatalf("Shutdown = %v, want context.DeadlineExceeded", err)
      	}
      	close(block)
      }

      func TestShutdownBeforeRunIsANoOp(t *testing.T) {
      	p := New(queue.NewMemory(), &recorder{}, testConfig(1), nil)
      	if err := p.Shutdown(context.Background()); err != nil {
      		t.Fatalf("Shutdown = %v", err)
      	}
      }

      func TestRunCannotStartTwice(t *testing.T) {
      	r := start(t, New(queue.NewMemory(), &recorder{}, testConfig(1), counters()))
      	waitFor(t, "first Run to register", func() bool {
      		r.p.mu.Lock()
      		defer r.p.mu.Unlock()
      		return r.p.cancel != nil
      	})
      	if err := r.p.Run(context.Background()); !errors.Is(err, ErrAlreadyRunning) {
      		t.Fatalf("second Run = %v, want ErrAlreadyRunning", err)
      	}
      }

      func TestParentContextCancellationStopsRun(t *testing.T) {
      	ctx, cancel := context.WithCancel(context.Background())
      	p := New(queue.NewMemory(), &recorder{}, testConfig(1), nil)
      	done := make(chan error, 1)
      	go func() { done <- p.Run(ctx) }()
      	time.Sleep(10 * time.Millisecond)
      	cancel()
      	select {
      	case err := <-done:
      		if err != nil {
      			t.Fatalf("Run = %v", err)
      		}
      	case <-time.After(time.Second):
      		t.Fatal("Run did not stop after its context was cancelled")
      	}
      }
