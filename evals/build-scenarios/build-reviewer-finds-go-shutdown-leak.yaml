    internal/metrics/metrics.go: |
      // Package metrics holds the poller's operational counters.
      package metrics

      import (
      	"fmt"
      	"sync/atomic"
      )

      // Counters are updated by the poller and read by whatever exports them. The zero value is ready.
      type Counters struct {
      	fetched     atomic.Int64
      	acked       atomic.Int64
      	nacked      atomic.Int64
      	failed      atomic.Int64
      	fetchErrors atomic.Int64
      	batchErrors atomic.Int64
      }

      // Snapshot is a consistent-enough copy of the counters for logging and assertions.
      type Snapshot struct {
      	Fetched     int64
      	Acked       int64
      	Nacked      int64
      	Failed      int64
      	FetchErrors int64
      	BatchErrors int64
      }

      // Fetched records n jobs received from the queue.
      func (c *Counters) Fetched(n int) { c.fetched.Add(int64(n)) }

      // Acked records one job acknowledged.
      func (c *Counters) Acked() { c.acked.Add(1) }

      // Nacked records one job handed back for redelivery.
      func (c *Counters) Nacked() { c.nacked.Add(1) }

      // Failed records one handler failure.
      func (c *Counters) Failed() { c.failed.Add(1) }

      // FetchError records one failed Fetch call.
      func (c *Counters) FetchError() { c.fetchErrors.Add(1) }

      // BatchError records one batch in which at least one job did not complete cleanly.
      func (c *Counters) BatchError() { c.batchErrors.Add(1) }

      // Snapshot reads every counter.
      func (c *Counters) Snapshot() Snapshot {
      	return Snapshot{
      		Fetched:     c.fetched.Load(),
      		Acked:       c.acked.Load(),
      		Nacked:      c.nacked.Load(),
      		Failed:      c.failed.Load(),
      		FetchErrors: c.fetchErrors.Load(),
      		BatchErrors: c.batchErrors.Load(),
      	}
      }

      // String renders the snapshot as one log line.
      func (s Snapshot) String() string {
      	return fmt.Sprintf("fetched=%d acked=%d nacked=%d failed=%d fetch_errors=%d batch_errors=%d",
      		s.Fetched, s.Acked, s.Nacked, s.Failed, s.FetchErrors, s.BatchErrors)
      }
