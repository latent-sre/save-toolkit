          """Per-tenant limiter settings.

          Tenants without explicit configuration get the defaults.
          """

          import json
          from dataclasses import asdict, dataclass, replace

          class ConfigError(ValueError):
              """The configuration document is malformed or holds an unusable value."""


          @dataclass(frozen=True)
          class TenantConfig:
              rate: float = 5.0
              burst: int = 0
              state_ttl: int = 60

              def __post_init__(self):
                  if isinstance(self.rate, bool) or not isinstance(self.rate, (int, float)) or self.rate <= 0:
                      raise ConfigError(f"rate must be a positive number, got {self.rate!r}")
                  if isinstance(self.burst, bool) or not isinstance(self.burst, int) or self.burst < 0:
                      raise ConfigError(f"burst must be a non-negative integer, got {self.burst!r}")
                  if isinstance(self.state_ttl, bool) or not isinstance(self.state_ttl, int) or self.state_ttl < 1:
                      raise ConfigError(f"state_ttl must be an integer number of seconds, got {self.state_ttl!r}")


          class Configs:
              """Looks up a tenant's settings, falling back to the defaults."""

              def __init__(self, tenants=None, default=None):
                  self._tenants = dict(tenants or {})
                  self._default = default if default is not None else TenantConfig()

              @property
              def default(self):
                  return self._default

              @property
              def tenants(self):
                  """A copy of the explicitly configured tenants, by name."""
                  return dict(self._tenants)

              def for_tenant(self, tenant):
                  return self._tenants.get(tenant, self._default)


          def dump(configs):
              """The JSON document `load` reads back into equal settings, for logging and support bundles."""
              document = {
                  "defaults": asdict(configs.default),
                  "tenants": {name: asdict(config) for name, config in sorted(configs.tenants.items())},
              }
              return json.dumps(document, indent=2, sort_keys=True)


          def load(text):
              """Build `Configs` from a JSON document with optional `defaults` and `tenants` objects."""
              try:
                  document = json.loads(text)
              except json.JSONDecodeError as error:
                  raise ConfigError(f"not valid JSON: {error}") from None
              if not isinstance(document, dict):
                  raise ConfigError("the document must be a JSON object")
              default = _build(TenantConfig(), document.get("defaults", {}), "defaults")
              tenants = {
                  name: _build(default, settings, f"tenants.{name}")
                  for name, settings in document.get("tenants", {}).items()
              }
              return Configs(tenants, default)


          def _build(base, settings, where):
              if not isinstance(settings, dict):
                  raise ConfigError(f"{where} must be an object")
              unknown = set(settings) - {"rate", "burst", "state_ttl"}
              if unknown:
                  raise ConfigError(f"{where} has unknown settings: {', '.join(sorted(unknown))}")
              return replace(base, **settings)
        ratelimit/store.py: |
          """Bucket state in a key-value store with expiry.

          `InMemoryKV` mirrors the parts of Redis the limiter uses (`get`, `set`, `delete`, `expire`, `pexpire`,
          `pttl`) so the same `BucketStore` runs against it in tests and single-node deployments and against
          the shared cache in production.
          """

          import json
          import time
          from typing import NamedTuple


          class InMemoryKV:
              """Dict-backed key-value store. `set` clears any expiry, as in Redis."""

              def __init__(self, clock=time.time):
                  self._clock = clock
                  self._values = {}
                  self._deadlines = {}

              def _live(self, key):
                  deadline = self._deadlines.get(key)
                  if deadline is not None and self._clock() >= deadline:
                      self.delete(key)
                  return key in self._values

              def get(self, key):
                  return self._values[key] if self._live(key) else None

              def set(self, key, value):
                  self._values[key] = value
                  self._deadlines.pop(key, None)

              def delete(self, key):
                  self._values.pop(key, None)
                  self._deadlines.pop(key, None)

              def expire(self, key, seconds):
                  """Forget *key* *seconds* from now. Returns False when the key does not exist."""
                  return self.pexpire(key, seconds * 1000)

              def pexpire(self, key, milliseconds):
                  """Forget *key* *milliseconds* from now. Returns False when the key does not exist."""
                  if not self._live(key):
                      return False
                  self._deadlines[key] = self._clock() + milliseconds / 1000
                  return True

              def pttl(self, key):
                  """Milliseconds left, -1 when the key never expires, -2 when it does not exist."""
                  if not self._live(key):
                      return -2
                  deadline = self._deadlines.get(key)
                  if deadline is None:
                      return -1
                  return max(0, int((deadline - self._clock()) * 1000))


          class BucketState(NamedTuple):
              tokens: float
              updated: float


          class BucketStore:
              """Reads and writes one tenant's bucket state under a versioned key.

              Version 2 keeps the refill time as integer milliseconds, so state written by several nodes compares
              exactly. Version 1 keys are not read; they age out on their own.
              """

              PREFIX = "rl:v2:"

              def __init__(self, kv):
                  self._kv = kv

              def load(self, key):
                  """The stored state, or None when there is none or it cannot be read."""
                  raw = self._kv.get(self.PREFIX + key)
                  if raw is None:
                      return None
                  try:
                      payload = json.loads(raw)
                      return BucketState(float(payload["tokens"]), payload["updated_ms"] / 1000)
                  except (ValueError, KeyError, TypeError):
                      return None

              def save(self, key, bucket, ttl):
                  """Store *bucket*'s state and keep it for *ttl* seconds."""
                  full = self.PREFIX + key
                  payload = {"tokens": round(bucket.tokens, 6), "updated_ms": int(round(bucket.updated * 1000))}
                  self._kv.set(full, json.dumps(payload, separators=(",", ":")))
                  self._kv.pexpire(full, ttl)

              def forget(self, key):
                  """Drop the stored state for *key*; the tenant's next request starts from a full bucket."""
                  self._kv.delete(self.PREFIX + key)
        README.md: |
          # edge-ratelimit

          Per-tenant request rate limiting for the edge API. Each tenant owns a token bucket: it holds up to
          `burst` tokens and earns `rate` tokens per second, and every admitted request spends one.

          ## Layout

          | Path | Role |
          |---|---|
          | `ratelimit/bucket.py` | Bucket arithmetic: refill, take, retry-after |
          | `ratelimit/limiter.py` | `Limiter.allow(tenant)`, the admission decision |
          | `ratelimit/store.py` | Bucket state in a key-value store with expiry |
          | `ratelimit/config.py` | Per-tenant settings and their defaults |
          | `ratelimit/metrics.py` | Allowed and rejected counters per tenant |
          | `api/` | Request handlers, routing and tenant identity |

          ## Contracts

          - Tenants without explicit configuration get the defaults.
          - The tenant is taken from the authenticated principal.
          - Every endpoint except `GET /healthz` is limited per tenant; a rejected request answers `429`, with a
            `Retry-After` header when the bucket will refill.
          - Bucket state is kept for `state_ttl` seconds after its last update, then forgotten; a tenant with no
            stored state starts with a full bucket.

          ## Bucket state

          State lives in the key-value store as JSON under `rl:v2:tenant:<id>`, holding the token balance and the
          refill time in integer milliseconds. Keys written by the previous format (`rl:v1:`) are not read and
          expire on their own.

          ## Endpoints

          | Method and path | Handler |
          |---|---|
          | `GET /healthz` | `Handlers.health` |
          | `GET /items/{id}` | `Handlers.get_item` |
          | `GET /items?q=` | `Handlers.search_items` |
          | `POST /items/bulk` | `Handlers.bulk_get_items` |

          ## Configuration

          `ratelimit.config.load` reads JSON:

          ```json
          {
            "defaults": {"rate": 5, "burst": 10},
            "tenants": {"acme": {"rate": 50, "burst": 100, "state_ttl": 120}}
          }
          ```

          ## Development

          ```
          python -m pytest -q
          ```

          The suite uses only the standard library and a fake clock; nothing waits on real time.
