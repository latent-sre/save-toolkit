      """Routing and error mapping for the edge API."""

      import math

      from api.http import BadRequest, NotFound, Response, TooManyRequests
      from api.identity import Unauthenticated


      class App:
          def __init__(self, handlers):
              self._handlers = handlers
              self._routes = {
                  ("GET", "/healthz"): handlers.health,
                  ("GET", "/items"): handlers.search_items,
                  ("POST", "/items/bulk"): handlers.bulk_get_items,
              }

          def dispatch(self, request):
              """Run the matching handler and turn its errors into responses."""
              try:
                  handler = self._route(request)
                  return handler(request)
              except Unauthenticated as error:
                  return Response(401, {"error": str(error)})
              except TooManyRequests as error:
                  headers = {}
                  if math.isfinite(error.retry_after):
                      headers["Retry-After"] = str(max(1, math.ceil(error.retry_after)))
                  return Response(429, {"error": str(error)}, headers)
              except BadRequest as error:
                  return Response(400, {"error": str(error)})
              except NotFound as error:
                  return Response(404, {"error": str(error)})

          def _route(self, request):
              method = request.method.upper()
              handler = self._routes.get((method, request.path))
              if handler is not None:
                  return handler
              prefix = "/items/"
              if method == "GET" and request.path.startswith(prefix):
                  item_id = request.path[len(prefix):]
                  if item_id and "/" not in item_id:
                      request.params["id"] = item_id
                      return self._handlers.get_item
              raise NotFound(f"no route for {method} {request.path}")
