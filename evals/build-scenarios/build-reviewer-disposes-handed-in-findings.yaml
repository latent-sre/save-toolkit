          # Changelog

          ## Unreleased

          - Limiter state moves to store v2: JSON values under `rl:v2:` keys, refill time in integer milliseconds,
            expiry set with `pexpire`. Version 1 keys are ignored and expire on their own.
          - `BucketStore.forget(key)` drops a tenant's stored state.
          - Config defaults are plain dataclass fields; `ratelimit.config.dump` writes the settings back out as
            the JSON that `load` reads.
