          limiter = Limiter(MemoryStore(), configs, clock=FakeClock())
          assert sum(limiter.allow("acme").allowed for _ in range(8)) == 5
          assert sum(limiter.allow("other").allowed for _ in range(8)) == 1


      def test_outcomes_are_counted_per_tenant():
          limiter, _ = make_limiter(burst=1)
          limiter.allow("acme")
          limiter.allow("acme")
          assert limiter.metrics.get("allowed", "acme") == 1
          assert limiter.metrics.get("rejected", "acme") == 1


      def test_concurrent_callers_cannot_exceed_the_burst():
          limiter, _ = make_limiter(burst=10, rate=0.001)
          results = []
          start = threading.Barrier(40)

          def worker():
              start.wait()
              results.append(limiter.allow("acme").allowed)

          threads = [threading.Thread(target=worker) for _ in range(40)]
          for thread in threads:
              thread.start()
          for thread in threads:
              thread.join()
          assert sum(results) == 10
