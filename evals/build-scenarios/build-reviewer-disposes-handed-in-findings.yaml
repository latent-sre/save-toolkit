      """Request handlers for the edge API."""

      from api import identity
      from api.http import BadRequest, Response, TooManyRequests

      MAX_BULK_IDS = 100


      class Handlers:
          def __init__(self, limiter, catalog, metrics=None):
              self._limiter = limiter
              self._catalog = catalog
              self._metrics = metrics if metrics is not None else limiter.metrics

          def _admit(self, request):
              """Resolve the caller's tenant and spend one token from its bucket, or refuse the request."""
              tenant = identity.tenant_for(request)
              decision = self._limiter.allow(tenant)
              if not decision.allowed:
                  raise TooManyRequests(decision.retry_after)
              return tenant

          def health(self, request):
              return Response(200, {"status": "ok"})

          def get_item(self, request):
              tenant = self._admit(request)
              self._metrics.count("items_read", tenant)
              return Response(200, self._catalog.get(request.params["id"]))

          def search_items(self, request):
              tenant = self._admit(request)
              query = request.params.get("q", "")
              items = self._catalog.search(query)
              self._metrics.count("items_read", tenant, len(items))
              return Response(200, {"items": items})

          def bulk_get_items(self, request):
              """Fetch up to MAX_BULK_IDS items by id in one request."""
              tenant = identity.tenant_for(request)
              ids = (request.body or {}).get("ids")
              if not isinstance(ids, list) or not ids or not all(isinstance(i, str) for i in ids):
                  raise BadRequest("body must be {'ids': [<item id>, ...]}")
              if len(ids) > MAX_BULK_IDS:
                  raise BadRequest(f"at most {MAX_BULK_IDS} ids per request")
              items = self._catalog.get_many(ids)
              self._metrics.count("items_read", tenant, len(items))
              return Response(200, {"items": items})
