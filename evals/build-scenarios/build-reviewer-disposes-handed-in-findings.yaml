          assert configs.for_tenant("acme") == TenantConfig(rate=2, burst=8)
          assert configs.for_tenant("globex") == TenantConfig(rate=2, burst=4)


      def test_load_of_an_empty_document_keeps_the_built_in_defaults():
          assert load("{}").default == TenantConfig()


      @pytest.mark.parametrize("settings", [
          {"rate": 0}, {"rate": -1}, {"rate": "fast"}, {"burst": -1}, {"burst": 2.5}, {"state_ttl": 0},
          {"state_ttl": True},
      ])
      def test_unusable_values_are_rejected(settings):
          with pytest.raises(ConfigError):
              load(json.dumps({"tenants": {"acme": settings}}))


