      """Token-bucket arithmetic.

      A bucket holds at most `capacity` tokens (the tenant's burst) and earns `rate` tokens per second.
      The methods here do no locking: the caller holds the limiter lock around refill and take.
      """

      import math


      class Bucket:
          """One tenant's tokens and the time they were last brought up to date."""

          __slots__ = ("capacity", "rate", "tokens", "updated")

          def __init__(self, capacity, rate, tokens, updated):
              self.capacity = capacity
              self.rate = rate
              self.tokens = float(tokens)
              self.updated = updated

          @classmethod
          def full(cls, capacity, rate, now):
              """A bucket holding its whole capacity, as of *now*."""
              return cls(capacity, rate, capacity, now)

          def refill(self, now):
              """Add the tokens earned since the last update, never beyond capacity.

              The caller holds the limiter lock.
              """
              elapsed = max(0.0, now - self.updated)
              self.tokens = min(float(self.capacity), self.tokens + elapsed * self.rate)
              self.updated = now

          def take(self, cost=1):
              """Spend *cost* tokens if the bucket holds them; report whether it did.

              The caller holds the limiter lock.
              """
              if self.tokens >= cost:
                  self.tokens -= cost
                  return True
              return False

          def retry_after(self, cost=1):
              """Seconds until *cost* tokens are available, or infinity when they never will be."""
              if cost > self.capacity or self.rate <= 0:
                  return math.inf
              return max(0.0, (cost - self.tokens) / self.rate)
