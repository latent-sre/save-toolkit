      """Test doubles: a manual clock, an expiry-free bucket store and request builders."""

      from api.http import Headers, Principal, Request
      from ratelimit.store import BucketState


      class FakeClock:
          def __init__(self, start=1_000.0):
              self.now = start

          def __call__(self):
              return self.now

          def advance(self, seconds):
              self.now += seconds


      class MemoryStore:
          """Holds bucket state in a dict and never expires it, so limiter tests control time alone."""

          def __init__(self):
              self.saved = {}

          def load(self, key):
              return self.saved.get(key)

          def save(self, key, bucket, ttl):
              self.saved[key] = BucketState(bucket.tokens, bucket.updated)


      def request(method="GET", path="/items/a100", tenant="acme", headers=None, body=None, authenticated=True):
          principal = Principal(id=f"{tenant}-user", tenant=tenant) if authenticated else None
          return Request(method, path, Headers(headers), principal, {}, body)
    tests/test_app.py: |
      from api.app import App
      from api.catalog import Catalog
      from api.handlers import Handlers
      from ratelimit.config import Configs, TenantConfig
      from ratelimit.limiter import Limiter
      from tests.helpers import FakeClock, MemoryStore, request


      def make_app(burst=2, rate=1.0):
          configs = Configs(default=TenantConfig(rate=rate, burst=burst))
          limiter = Limiter(MemoryStore(), configs, clock=FakeClock())
          return App(Handlers(limiter, Catalog()))


      def test_routes_an_item_lookup():
          response = make_app().dispatch(request(path="/items/a103"))
          assert (response.status, response.body["name"]) == (200, "lantern")


      def test_routes_a_search():
          req = request(path="/items")
          req.params["q"] = "rope"
          assert make_app().dispatch(req).body == {"items": [{"id": "a101", "name": "rope", "price": 650}]}


      def test_unknown_paths_and_methods_are_404():
          app = make_app()
          assert app.dispatch(request(path="/nope")).status == 404
          assert app.dispatch(request("DELETE", "/items/a100")).status == 404
          assert app.dispatch(request(path="/items/a100/extra")).status == 404


      def test_unknown_items_are_404():
          assert make_app().dispatch(request(path="/items/zzz")).status == 404


      def test_anonymous_requests_are_401():
          assert make_app().dispatch(request(path="/items/a100", authenticated=False)).status == 401


      def test_a_malformed_bulk_body_is_400():
          assert make_app().dispatch(request("POST", "/items/bulk", body={"ids": []})).status == 400


      def test_a_rejected_request_is_429_with_retry_after():
          app = make_app(burst=1, rate=0.25)
          assert app.dispatch(request()).status == 200
          response = app.dispatch(request())
          assert (response.status, response.headers["Retry-After"]) == (429, "4")


      def test_health_is_not_limited():
          app = make_app(burst=1)
          assert [app.dispatch(request("GET", "/healthz")).status for _ in range(5)] == [200] * 5
    tests/test_bucket.py: |
      import math

      from ratelimit.bucket import Bucket


      def test_a_new_bucket_is_full():
          bucket = Bucket.full(capacity=4, rate=1.0, now=10.0)
          assert (bucket.tokens, bucket.updated) == (4.0, 10.0)


      def test_take_spends_tokens_until_none_are_left():
          bucket = Bucket.full(capacity=2, rate=1.0, now=0.0)
          assert [bucket.take(), bucket.take(), bucket.take()] == [True, True, False]
          assert bucket.tokens == 0.0


      def test_take_refuses_a_cost_above_the_balance_without_spending():
          bucket = Bucket.full(capacity=3, rate=1.0, now=0.0)
          assert bucket.take(cost=4) is False
          assert bucket.tokens == 3.0


      def test_refill_earns_rate_per_second():
          bucket = Bucket.full(capacity=10, rate=2.0, now=0.0)
          bucket.take(cost=10)
          bucket.refill(1.5)
          assert bucket.tokens == 3.0
          assert bucket.updated == 1.5


      def test_refill_never_exceeds_capacity():
          bucket = Bucket.full(capacity=5, rate=10.0, now=0.0)
          bucket.take(cost=2)
          bucket.refill(60.0)
          assert bucket.tokens == 5.0


      def test_refill_ignores_a_clock_that_went_backwards():
          bucket = Bucket(capacity=5, rate=1.0, tokens=2, updated=100.0)
          bucket.refill(90.0)
          assert bucket.tokens == 2.0


      def test_retry_after_counts_the_missing_tokens():
          bucket = Bucket(capacity=5, rate=2.0, tokens=0.0, updated=0.0)
          assert bucket.retry_after() == 0.5
          assert bucket.retry_after(cost=3) == 1.5


      def test_retry_after_is_zero_when_tokens_are_available():
          assert Bucket.full(capacity=3, rate=1.0, now=0.0).retry_after() == 0.0


      def test_retry_after_is_infinite_for_a_cost_the_bucket_cannot_hold():
          assert Bucket.full(capacity=2, rate=1.0, now=0.0).retry_after(cost=3) == math.inf
