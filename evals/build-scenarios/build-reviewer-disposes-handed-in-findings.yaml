        api/identity.py: |
          """Work out which tenant a request belongs to."""

          import re

          from api.http import BadRequest

          TENANT_HEADER = "X-Tenant"
          _TENANT_ID = re.compile(r"[a-z0-9][a-z0-9_-]{0,62}")


          class Unauthenticated(Exception):
              """The request carries no authenticated principal; answered with 401."""


          def parse_tenant_header(value):
              """The tenant id named by an `X-Tenant` header value, or None when it is absent or blank."""
              if value is None:
                  return None
              value = value.strip().lower()
              if not value:
                  return None
              if not _TENANT_ID.fullmatch(value):
                  raise BadRequest(f"invalid {TENANT_HEADER} header")
              return value


          def tenant_for(request):
              """Return the tenant the request is made for: the one the edge proxy forwards, else the principal's."""
              principal = request.principal
              if principal is None:
                  raise Unauthenticated("authentication required")
              forwarded = parse_tenant_header(request.headers.get(TENANT_HEADER))
              return forwarded or principal.tenant
