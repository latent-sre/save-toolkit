    settle/errors.py: |
      """Errors raised by settle. Everything derives from SettleError so the CLI can report one family."""


      class SettleError(Exception):
          """Base class for every error settle raises on purpose."""


      class ConfigError(SettleError):
          """An environment variable holds a value settle cannot use."""


      class InvalidEntry(SettleError):
          """An entry or a batch file row violates the entry rules."""


      class JournalError(SettleError):
          """The journal file is unreadable or disagrees with the batch being sent."""


      class LedgerUnavailable(SettleError):
          """The ledger refused a write; nothing was recorded."""


      class AckLost(SettleError):
          """The ledger recorded a write but its acknowledgement never arrived."""


      class PartialFailure(SettleError):
          """Some entries of a batch could not be written; the rest were."""

          def __init__(self, batch_id, failed):
              super().__init__(f"batch {batch_id}: {len(failed)} entries not acknowledged")
              self.batch_id = batch_id
              self.failed = tuple(failed)
    settle/journal.py: |
      """The resume journal: which entries of each batch the ledger acknowledged.

      The journal is one JSON document, `{batch_id: {"entries": [...], "acked": [...], "closed": bool}}`.
      `entries` keeps the batch exactly as submitted, in submission order, so a later run can rebuild the
      batch for reconciliation. Every change is written to a temporary file and moved into place, so a
      crash leaves either the old document or the new one.
      """

      from __future__ import annotations

      import json
      from pathlib import Path

      from .errors import JournalError
      from .model import Batch, Entry


      class Journal:
          def __init__(self, path=None):
              """A journal backed by *path*, or an in-memory one when *path* is None."""
              self.path = Path(path) if path is not None else None
              self._state = self._load()

          def _load(self):
              if self.path is None or not self.path.exists():
                  return {}
              try:
                  state = json.loads(self.path.read_text(encoding="utf-8"))
              except ValueError as exc:
                  raise JournalError(f"journal {self.path} is not valid JSON: {exc}") from exc
              if not isinstance(state, dict):
                  raise JournalError(f"journal {self.path} must hold a JSON object")
              return state

          def _save(self):
              if self.path is None:
                  return
              self.path.parent.mkdir(parents=True, exist_ok=True)
              staging = self.path.with_suffix(".tmp")
              staging.write_text(json.dumps(self._state, indent=2, sort_keys=True), encoding="utf-8", newline="\n")
              staging.replace(self.path)

          def _batch(self, batch_id):
              try:
                  return self._state[batch_id]
              except KeyError:
                  raise JournalError(f"batch {batch_id} is not in the journal") from None

          def open(self, batch):
              """Record *batch* the first time it is sent; refuse a different batch under the same id."""
              rows = [entry.to_row() for entry in batch.entries]
              known = self._state.get(batch.batch_id)
              if known is None:
                  self._state[batch.batch_id] = {"entries": rows, "acked": [], "closed": False}
                  self._save()
              elif known["entries"] != rows:
                  raise JournalError(f"batch {batch.batch_id} was journalled with different entries")

          def is_acked(self, batch_id, entry_id):
              return entry_id in self._batch(batch_id)["acked"]

          def acked(self, batch_id):
              return list(self._batch(batch_id)["acked"])

          def record_ack(self, batch_id, entry_id):
              acked = self._batch(batch_id)["acked"]
              if entry_id not in acked:
                  acked.append(entry_id)
                  self._save()

          def close(self, batch_id):
              self._batch(batch_id)["closed"] = True
              self._save()

          def is_closed(self, batch_id):
              return self._batch(batch_id)["closed"]

          def closed_batch_ids(self):
              return sorted(batch_id for batch_id, state in self._state.items() if state["closed"])

          def load_batch(self, batch_id):
              rows = self._batch(batch_id)["entries"]
              return Batch(batch_id, tuple(Entry.from_row(batch_id, row) for row in rows))
    settle/ledger.py: |
      """Ledger client.

      `LedgerClient` is the only way settle writes to the ledger. In a deployment the book behind it is
      the ledger service; this module keeps the book in process so the batch writer, reconciliation and
      the tests all exercise one implementation.

      A write that carries an idempotency key is checked against the `IdempotencyStore` first. A key the
      ledger has already seen is acknowledged and skipped; nothing is posted. A write without a key is
      always posted.
      """

      from __future__ import annotations

      from dataclasses import dataclass, field
      from decimal import Decimal

      from .errors import AckLost, LedgerUnavailable
      from .model import Ack, Posting


      @dataclass
      class Faults:
          """Failures to inject, each fired once per entry id (dry runs and tests)."""

          before_write: set = field(default_factory=set)
          lose_ack: set = field(default_factory=set)


      class IdempotencyStore:
          """The keys the ledger has seen, each with the entry it first carried."""

          def __init__(self):
              self._seen = {}

          def seen(self, key):
              return key in self._seen

          def remember(self, key, entry_id):
              self._seen.setdefault(key, entry_id)

          def first_entry(self, key):
              return self._seen.get(key)

          def __len__(self):
              return len(self._seen)


      class LedgerClient:
          def __init__(self, store=None, faults=None):
              self.store = store if store is not None else IdempotencyStore()
              self.faults = faults if faults is not None else Faults()
              self._postings = []
              self._totals = {}
              self._balances = {}

          def post(self, entry, key=None):
              """Write *entry*; return the acknowledgement or raise a ledger error."""
              if key is not None and self.store.seen(key):
                  return Ack(entry.entry_id, key, skipped=True)
              if entry.entry_id in self.faults.before_write:
                  self.faults.before_write.discard(entry.entry_id)
                  raise LedgerUnavailable(f"ledger refused entry {entry.entry_id}")
              total = self._totals.get(entry.batch_id, Decimal("0")) + entry.amount
              self._totals[entry.batch_id] = total
              self._balances[entry.account] = self._balances.get(entry.account, Decimal("0")) + entry.amount
              self._postings.append(Posting(entry, len(self._postings) + 1, total))
              if key is not None:
                  self.store.remember(key, entry.entry_id)
              if entry.entry_id in self.faults.lose_ack:
                  self.faults.lose_ack.discard(entry.entry_id)
                  raise AckLost(f"no acknowledgement for entry {entry.entry_id}")
              return Ack(entry.entry_id, key)

          def postings(self, batch_id=None):
              """Postings in arrival order, for one batch or for all of them."""
              return [p for p in self._postings if batch_id is None or p.entry.batch_id == batch_id]

          def balance(self, account):
              return self._balances.get(account, Decimal("0"))
    settle/model.py: |
      """Entry, batch and result types shared by every settle module."""

      from __future__ import annotations

      from dataclasses import dataclass, field
      from decimal import Decimal

      from .errors import InvalidEntry


      @dataclass(frozen=True)
      class Entry:
          """One signed amount against one account; credits are positive, debits negative."""

          entry_id: str
          batch_id: str
          account: str
          amount: Decimal
          memo: str = ""

          def __post_init__(self):
              for name in ("entry_id", "batch_id", "account"):
                  if not getattr(self, name).strip():
                      raise InvalidEntry(f"{name} must not be empty")
              if not isinstance(self.amount, Decimal) or not self.amount.is_finite():
                  raise InvalidEntry(f"entry {self.entry_id}: amount must be a finite Decimal")
              if self.amount == 0:
                  raise InvalidEntry(f"entry {self.entry_id}: amount must not be zero")

          def to_row(self):
              """The JSON row the journal stores; amounts are strings so no precision is lost."""
              return {"id": self.entry_id, "account": self.account, "amount": str(self.amount), "memo": self.memo}

          @classmethod
          def from_row(cls, batch_id, row):
              return cls(
                  entry_id=row["id"],
                  batch_id=batch_id,
                  account=row["account"],
                  amount=Decimal(row["amount"]),
                  memo=row.get("memo", ""),
              )


      @dataclass(frozen=True)
      class Batch:
          """Entries submitted together. `entries` is in submission order."""

          batch_id: str
          entries: tuple[Entry, ...]

          def __post_init__(self):
              if not self.batch_id.strip():
                  raise InvalidEntry("batch_id must not be empty")
              if not self.entries:
                  raise InvalidEntry(f"batch {self.batch_id} has no entries")
              ids = [entry.entry_id for entry in self.entries]
              if len(set(ids)) != len(ids):
                  raise InvalidEntry(f"batch {self.batch_id} repeats an entry id")
              for entry in self.entries:
                  if entry.batch_id != self.batch_id:
                      raise InvalidEntry(f"entry {entry.entry_id} belongs to batch {entry.batch_id}")

          @property
          def entry_ids(self):
              return [entry.entry_id for entry in self.entries]

          @property
          def total(self):
              return sum((entry.amount for entry in self.entries), Decimal("0"))


      @dataclass(frozen=True)
      class Ack:
          """The ledger's answer to a write. `skipped` means the key was already seen."""

          entry_id: str
          key: str | None = None
          skipped: bool = False


      @dataclass(frozen=True)
      class Posting:
          """An entry as the ledger recorded it: arrival number and the batch's running total after it."""

          entry: Entry
          seq: int
          running_total: Decimal


      @dataclass
      class BatchResult:
          """What one send of a batch did, by entry id."""

          batch_id: str
          posted: list[str] = field(default_factory=list)
          skipped: list[str] = field(default_factory=list)
          failed: list[str] = field(default_factory=list)
