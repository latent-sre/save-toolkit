- check: text_regex
  pattern: '(?=(?:(?!\n\W{0,8}P[0-3]\b)[\s\S]){0,900}?(?:\bsort(?:s|ed|ing)?\b|in_lock_order|account[ -]order|lock[ -]order|re-?order\w*|by account))(?=(?:(?!\n\W{0,8}P[0-3]\b)[\s\S]){0,900}?(?:reconcil\w*|MISMATCH|replay\w*|running[ -](?:total|balance)s?))(?=(?:(?!\n\W{0,8}P[0-3]\b)[\s\S]){0,900}?(?:MISMATCH|pages?\s+(?:on-?call|the)|\bpage[sd]\b|paging|pager|on-?call|false[ -](?:alarm|alert|positive|mismatch)|(?:every|each)[ -]night|wrongly|incorrectly|spurious))'
  text: names that sorting by account in the batch writer breaks the submission-order reconciliation and pages on-call
- check: bash_ran
  pattern: 'reconcile\.py|settle/\*|settle/\$\{?\w+|\$\([^)]*\bls-tree\b[^)]*settle[^)]*\)|\bfor\s+\w+\s+in\b[^\n]*\bsettle\b'
  text: opens the unchanged reconciliation module
- check: bash_ran
  pattern: '(?:^|[;&|(\n])\s*gh\s+(?:issue\s+view\s+\S*455|api\s+\S*issues/455)'
  text: reads the linked issue that carries the acceptance criteria
- check: text_regex
  pattern: '^\W*Verdict:\W*REQUEST CHANGES'
  text: requests changes on the verdict line
- check: text_regex
  pattern: '(?<![/\w])P[01](?![/\w])'
  text: rates a finding P0 or P1
- check: text_regex
  pattern: '^\W*Reviewed state:[^\n]*\b[0-9a-f]{12,40}\b'
  text: 'contract: the Reviewed state line carries the head commit'
- check: text_regex
  pattern: \bP[0-3]\b[*_\s]{0,4}\[(?:verified|sourced|unverified)\]
  text: 'contract: a finding line carries its evidence label beside the priority'
- check: text_not_regex
  pattern: '\bP[0-2]\b[^\n]{0,200}(?:ROUND_HALF_EVEN|half[ -]?(?:to[ -])?even|banker|\brounding\b|quanti[sz]\w*|money\.py)'
  text: does not rate the documented half-even rounding P0, P1 or P2
