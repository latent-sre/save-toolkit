      """Paging for the nightly reconciliation.

      A batch marked MISMATCH pages the on-call target. OK and MISSING batches do not page; MISSING is
      reported on the run's output only.
      """

      from __future__ import annotations

      import sys

      from ..reconcile import MISMATCH, reconcile_all


      class StdoutPager:
          """The default pager: prints the page. A deployment swaps in its paging service."""

          def __init__(self, out=None):
              self.out = out if out is not None else sys.stdout

          def page(self, target, message):
              print(f"PAGE {target}: {message}", file=self.out)


      class RecordingPager:
          """Keeps pages in a list; used by tests."""

          def __init__(self):
              self.pages = []

          def page(self, target, message):
              self.pages.append((target, message))


      def page_on_mismatch(reports, pager, target):
          """Page once per MISMATCH report and return how many pages went out."""
          sent = 0
          for report in reports:
              if report.status == MISMATCH:
                  pager.page(target, f"batch {report.batch_id} MISMATCH: {report.detail}")
                  sent += 1
          return sent


      def nightly(journal, client, pager, target):
          """Reconcile every closed batch in the journal and page for each MISMATCH."""
          batches = [journal.load_batch(batch_id) for batch_id in journal.closed_batch_ids()]
          reports = reconcile_all(batches, client)
          page_on_mismatch(reports, pager, target)
          return reports
    settle/reconcile.py: |
      """Nightly reconciliation of closed batches against the ledger.

      A batch is replayed in submission order, keeping a running total of its amounts. The ledger records
      the same running total as each entry arrives. The two sequences must agree entry for entry; the
      first difference marks the batch MISMATCH.
      """

      from __future__ import annotations

      from dataclasses import dataclass
      from decimal import Decimal
      from itertools import zip_longest

      OK = "OK"
      MISMATCH = "MISMATCH"
      MISSING = "MISSING"


      @dataclass(frozen=True)
      class Report:
          batch_id: str
          status: str
          detail: str = ""


      def replay(batch):
          """(entry id, running total) for each entry of *batch*, in submission order."""
          total = Decimal("0")
          steps = []
          for entry in batch.entries:
              total += entry.amount
              steps.append((entry.entry_id, total))
          return steps


      def reconcile(batch, client):
          postings = client.postings(batch.batch_id)
          if not postings:
              return Report(batch.batch_id, MISSING, "the ledger holds no postings for this batch")
          recorded = [(posting.entry.entry_id, posting.running_total) for posting in postings]
          for index, (want, got) in enumerate(zip_longest(replay(batch), recorded), start=1):
              if want != got:
                  return Report(batch.batch_id, MISMATCH, f"step {index}: replay has {want}, ledger has {got}")
          return Report(batch.batch_id, OK)


      def reconcile_all(batches, client):
          return [reconcile(batch, client) for batch in batches]
    tests/test_alerts.py: |
      import io

      from settle.ops.alerts import RecordingPager, StdoutPager, nightly, page_on_mismatch
      from settle.reconcile import MISMATCH, MISSING, OK, Report


      def test_only_mismatches_page():
          reports = [Report("B1", OK), Report("B2", MISMATCH, "step 1"), Report("B3", MISSING, "none")]
          pager = RecordingPager()
          assert page_on_mismatch(reports, pager, "ledger-oncall") == 1
          assert pager.pages == [("ledger-oncall", "batch B2 MISMATCH: step 1")]


      def test_stdout_pager_prints_the_target_and_message():
          out = io.StringIO()
          StdoutPager(out).page("ledger-oncall", "batch B2 MISMATCH")
          assert out.getvalue() == "PAGE ledger-oncall: batch B2 MISMATCH\n"


      def test_nightly_checks_only_closed_batches(client, journal, make_batch):
          closed, open_batch = make_batch("B1"), make_batch("B2")
          journal.open(closed)
          journal.close("B1")
          journal.open(open_batch)
          for entry in closed.entries:
              client.post(entry)
          pager = RecordingPager()
          reports = nightly(journal, client, pager, "ledger-oncall")
          assert [(r.batch_id, r.status) for r in reports] == [("B1", OK)]
          assert pager.pages == []


      def test_nightly_pages_for_a_batch_that_landed_out_of_order(client, journal, make_batch):
          batch = make_batch()
          journal.open(batch)
          journal.close("B1")
          for index in (1, 0, 2, 3, 4, 5):
              client.post(batch.entries[index])
          pager = RecordingPager()
          reports = nightly(journal, client, pager, "payments")
          assert [r.status for r in reports] == [MISMATCH]
          assert pager.pages[0][0] == "payments"
    tests/test_batch.py: |
      import pytest

      from settle.batch import send_batch
      from settle.errors import PartialFailure


      def posted_ids(client, batch_id="B1"):
          return [posting.entry.entry_id for posting in client.postings(batch_id)]


      def test_send_posts_every_entry_and_closes_the_batch(client, journal, make_batch):
          batch = make_batch()
          result = send_batch(client, batch, journal)
          assert result.posted == batch.entry_ids
          assert result.skipped == [] and result.failed == []
          assert posted_ids(client) == batch.entry_ids
          assert journal.acked("B1") == batch.entry_ids
          assert journal.is_closed("B1")


