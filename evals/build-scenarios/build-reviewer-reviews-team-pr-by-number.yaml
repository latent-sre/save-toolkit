      """Money helpers. Amounts are Decimal and carry two places."""

      from __future__ import annotations

      from decimal import Decimal, InvalidOperation

      from .errors import InvalidEntry

      CENT = Decimal("0.01")


      def parse_amount(raw):
          """Parse a JSON amount (string or number) into a finite Decimal without going through float."""
          try:
              value = Decimal(str(raw).strip())
          except InvalidOperation as exc:
              raise InvalidEntry(f"not an amount: {raw!r}") from exc
          if not value.is_finite():
              raise InvalidEntry(f"not an amount: {raw!r}")
          return value


      def quantise(value, rounding):
          """Round *value* to whole cents with the given `decimal` rounding mode."""
          return value.quantize(CENT, rounding=rounding)


      def format_amount(value):
          return f"{value:.2f}"
