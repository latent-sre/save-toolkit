    README.md: |
      # ledger-settle

      Nightly settlement for the payments ledger. `settle` builds settlement batches from entry files,
      posts them to the ledger, and checks every closed batch the same night.

      ## Concepts

      - **Entry**: one signed amount against one account. Credits are positive, debits negative. An entry
        id is unique within its batch.
      - **Batch**: an ordered list of entries submitted together. Submission order is the order of the
        `entries` array in the batch file.
      - **Journal**: a JSON file with one object per batch: the submitted entries, the ids of the entries
        the ledger acknowledged, and whether the batch is closed. A batch is closed once every entry is
        acknowledged.

      ## Ledger contracts

      - The ledger deduplicates writes by idempotency key. A write whose key it has already seen is
        acknowledged and skipped; nothing is posted a second time.
      - Amounts are rounded half-to-even (banker's rounding); this is the ledger's accounting policy.
      - The ledger records a running total for each batch as its entries arrive.

      ## Reconciliation

      `settle reconcile` replays every closed batch in the journal in submission order, keeping a running
      total, and compares each step with the running total the ledger recorded for the batch. The first
      difference marks the batch `MISMATCH`; a batch the ledger holds no postings for is `MISSING`. A
      `MISMATCH` pages the target named by `SETTLE_PAGE_TARGET`.

      ## Commands

          python -m settle send batch.json        # post a batch file
          python -m settle resume BATCH_ID        # send a journalled batch again
          python -m settle reconcile              # check every closed batch

      A batch file is JSON: `{"batch_id": "2026-11-19", "entries": [{"id": "e1", "account": "acct-001",
      "amount": "10.00", "memo": "optional"}]}`. `send` exits 2 when some entries could not be written.

      ## Configuration

      | Variable | Default | Meaning |
      |---|---|---|
      | `SETTLE_JOURNAL` | `settle-journal.json` | Path of the journal file |
      | `SETTLE_PAGE_TARGET` | `ledger-oncall` | Who `reconcile` pages on a `MISMATCH` |

      ## Tests

          python -m pytest -q
