                  target = env.get("SETTLE_PAGE_TARGET", DEFAULT_PAGE_TARGET).strip()
                  if not journal:
                      raise ConfigError("SETTLE_JOURNAL must not be empty")
                  if not target:
                      raise ConfigError("SETTLE_PAGE_TARGET must not be empty")
                  raw_size = env.get("SETTLE_CHUNK_SIZE", str(DEFAULT_CHUNK_SIZE)).strip()
                  try:
