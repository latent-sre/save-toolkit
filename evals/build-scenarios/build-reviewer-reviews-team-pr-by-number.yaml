          """Command line: send a batch file, send a journalled batch again, reconcile closed batches."""

          from __future__ import annotations

          import argparse
          import json
          import os
          import sys
          from pathlib import Path

          from .batch import build_batch, send_batch
          from .config import Config
          from .errors import InvalidEntry, PartialFailure, SettleError
          from .journal import Journal
          from .ledger import LedgerClient
          from .ops.alerts import StdoutPager, nightly
          from .reconcile import OK


          def load_batch(path):
              """Read a batch file. Amounts are rounded to cents; rows keep their order."""
              try:
                  data = json.loads(Path(path).read_text(encoding="utf-8"))
                  batch_id = data["batch_id"]
                  rows = data["entries"]
              except (OSError, ValueError, KeyError, TypeError) as exc:
                  raise InvalidEntry(f"cannot read batch file {path}: {exc}") from exc
              return build_batch(batch_id, rows)


          def _parser():
              parser = argparse.ArgumentParser(prog="settle")
              commands = parser.add_subparsers(dest="command", required=True)
              commands.add_parser("send", help="post a batch file").add_argument("file")
              commands.add_parser("resume", help="send a journalled batch again").add_argument("batch_id")
              commands.add_parser("reconcile", help="check every closed batch")
              return parser


          def _send(client, batch, journal, chunk_size, out):
              try:
                  result = send_batch(client, batch, journal, chunk_size)
              except PartialFailure as failure:
                  print(f"{failure.batch_id}: {len(failure.failed)} not acknowledged: {', '.join(failure.failed)}", file=out)
                  return 2
              print(f"{batch.batch_id}: posted {len(result.posted)}, skipped {len(result.skipped)}", file=out)
              return 0


          def main(argv=None, *, client=None, pager=None, out=None, env=None):
              out = out if out is not None else sys.stdout
              args = _parser().parse_args(argv)
              try:
                  config = Config.from_env(env if env is not None else os.environ)
                  journal = Journal(config.journal_path)
                  client = client if client is not None else LedgerClient()
                  if args.command == "send":
