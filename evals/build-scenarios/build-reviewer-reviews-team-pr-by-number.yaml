          """Build settlement batches and send them to the ledger in chunks."""

          from __future__ import annotations

          from decimal import ROUND_HALF_EVEN

          from .errors import AckLost, LedgerUnavailable, PartialFailure
          from .model import Batch, BatchResult, Entry
          from .money import parse_amount, quantise

          DEFAULT_CHUNK_SIZE = 50
          WRITE_ERRORS = (LedgerUnavailable, AckLost)


          def build_batch(batch_id, rows):
              """Turn the rows of a batch file into a Batch. Amounts are rounded to cents; rows keep their order."""
              entries = tuple(
                  Entry(
                      entry_id=str(row["id"]),
                      batch_id=batch_id,
                      account=row["account"],
                      amount=quantise(parse_amount(row["amount"]), ROUND_HALF_EVEN),
                      memo=row.get("memo", ""),
                  )
                  for row in rows
              )
              return Batch(batch_id, entries)


          def in_lock_order(entries):
              """Entries ordered by account.

              The ledger holds an account's lock for the duration of each write, so writing in account order
              keeps two batches that touch the same accounts from taking those locks in opposite orders.
              """
              return sorted(entries, key=lambda entry: entry.account)


          def chunked(entries, size):
              """Consecutive slices of *entries* of at most *size* items."""
              for start in range(0, len(entries), size):
                  yield entries[start : start + size]


          def idempotency_key(batch_id, chunk_no, position):
              """The key a write carries: its batch, the chunk it is sent in, and its place in that chunk."""
              return f"{batch_id}:{chunk_no}:{position}"


          def send_batch(client, batch, journal, chunk_size=DEFAULT_CHUNK_SIZE):
              """Post every entry of *batch* that the journal does not record as acknowledged.

              The remaining entries are written in account order, in chunks of *chunk_size*, each write under
              an idempotency key. Acknowledgements are journalled once per chunk. One failed write does not
              hold up the rest: failures are collected and raised together as a PartialFailure once the batch
              has been walked. A batch with no failures is closed in the journal.
              """
              journal.open(batch)
              pending = [
                  entry for entry in in_lock_order(batch.entries) if not journal.is_acked(batch.batch_id, entry.entry_id)
              ]
              result = BatchResult(batch.batch_id)
              for chunk_no, chunk in enumerate(chunked(pending, chunk_size)):
                  acknowledged = []
                  for position, entry in enumerate(chunk):
                      key = idempotency_key(batch.batch_id, chunk_no, position)
                      try:
                          ack = client.post(entry, key)
                      except WRITE_ERRORS:
                          result.failed.append(entry.entry_id)
                          continue
                      acknowledged.append(entry.entry_id)
                      (result.skipped if ack.skipped else result.posted).append(entry.entry_id)
                  journal.record_acks(batch.batch_id, acknowledged)
              if result.failed:
                  raise PartialFailure(batch.batch_id, tuple(result.failed))
              journal.close(batch.batch_id)
              return result
