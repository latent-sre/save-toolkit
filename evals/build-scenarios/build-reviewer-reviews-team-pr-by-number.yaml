      """Send settlement batches to the ledger."""

      from __future__ import annotations

      from .errors import AckLost, LedgerUnavailable, PartialFailure
      from .model import BatchResult

      WRITE_ERRORS = (LedgerUnavailable, AckLost)


      def send_batch(client, batch, journal):
          """Post every entry of *batch* that the journal does not record as acknowledged.

          One failed write does not hold up the rest: failures are collected and raised together as a
          PartialFailure once the batch has been walked. A batch with no failures is closed in the journal.
          """
          journal.open(batch)
          result = BatchResult(batch.batch_id)
          for entry in batch.entries:
              if journal.is_acked(batch.batch_id, entry.entry_id):
                  continue
              try:
                  ack = client.post(entry)
              except WRITE_ERRORS:
                  result.failed.append(entry.entry_id)
                  continue
              journal.record_ack(batch.batch_id, entry.entry_id)
              (result.skipped if ack.skipped else result.posted).append(entry.entry_id)
          if result.failed:
              raise PartialFailure(batch.batch_id, tuple(result.failed))
          journal.close(batch.batch_id)
          return result
