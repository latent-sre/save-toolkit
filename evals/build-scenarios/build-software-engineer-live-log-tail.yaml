    src/main.tsx: |
      import { StrictMode } from 'react';
      import { createRoot } from 'react-dom/client';
      import { BrowserRouter } from 'react-router-dom';

      import App from './App';

      createRoot(document.getElementById('root')!).render(
        <StrictMode>
          <BrowserRouter>
            <App />
          </BrowserRouter>
        </StrictMode>,
      );
    src/App.tsx: |
      import { Link, Route, Routes } from 'react-router-dom';

      import Home from './pages/Home';
      import Services from './pages/Services';

      export default function App() {
        return (
          <div className="app">
            <nav aria-label="Primary">
              <ul>
                <li>
                  <Link to="/">Overview</Link>
                </li>
                <li>
                  <Link to="/services">Services</Link>
                </li>
              </ul>
            </nav>
            <main>
              <Routes>
                <Route path="/" element={<Home />} />
                <Route path="/services" element={<Services />} />
              </Routes>
            </main>
          </div>
        );
      }
    src/api/client.ts: |
      export async function apiGet<T>(path: string): Promise<T> {
        const response = await fetch(path, { headers: { Accept: 'application/json' } });
        if (!response.ok) {
          throw new Error(`GET ${path} failed with ${response.status}`);
        }
        return (await response.json()) as T;
      }
    src/pages/Home.tsx: |
      export default function Home() {
        return (
          <section>
            <h1>Operations overview</h1>
            <p>Pick a view from the navigation to see what the platform is doing right now.</p>
          </section>
        );
      }
    src/pages/Services.tsx: |
      import { useEffect, useState } from 'react';

      export type Service = {
        name: string;
        tier: number;
        owner: string;
      };

      export default function Services() {
        const [services, setServices] = useState<Service[]>([]);
        const [tier, setTier] = useState('all');

        useEffect(() => {
          fetch('/api/services')
            .then((response) => response.json())
            .then((data) => setServices(data as Service[]));
        }, []);

        const rows = tier === 'all' ? services : services.filter((s) => String(s.tier) === tier);

        return (
          <section>
            <h1>Services</h1>
            <select value={tier} onChange={(event) => setTier(event.target.value)}>
              <option value="all">All tiers</option>
              <option value="1">Tier 1</option>
              <option value="2">Tier 2</option>
            </select>
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Tier</th>
                  <th>Owner</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((service) => (
                  <tr key={service.name}>
                    <td>{service.name}</td>
                    <td>{service.tier}</td>
                    <td>{service.owner}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </section>
        );
      }
    src/pages/Services.test.tsx: |
      import { render, screen } from '@testing-library/react';
      import { MemoryRouter } from 'react-router-dom';
      import { expect, test } from 'vitest';

      import Services from './Services';

      test('renders a row for each service the API returns', async () => {
        render(
          <MemoryRouter>
            <Services />
          </MemoryRouter>,
        );
        expect(await screen.findByText('checkout')).toBeInTheDocument();
      });
    src/test/server.ts: |
      import { http, HttpResponse } from 'msw';
      import { setupServer } from 'msw/node';

      const LINES = [
        { id: '1', ts: '2026-08-04T10:00:00.000Z', level: 'info', msg: 'rollout started: checkout v2.14.0' },
        { id: '2', ts: '2026-08-04T10:00:00.250Z', level: 'debug', msg: 'instance 0 draining' },
        { id: '3', ts: '2026-08-04T10:00:01.100Z', level: 'warn', msg: 'instance 1 readiness probe slow (1.9s)' },
        { id: '4', ts: '2026-08-04T10:00:02.000Z', level: 'error', msg: 'instance 1 failed readiness: dependency ledger timed out' },
      ];

      export const handlers = [
        http.get('*/api/services', () =>
          HttpResponse.json([
            { name: 'checkout', tier: 1, owner: 'payments-team' },
            { name: 'search', tier: 2, owner: 'discovery-team' },
          ]),
        ),
        // A short text/event-stream: one `log` event per line, then the stream ends.
        http.get('*/v1/services/:id/logs/stream', () => {
          const encoder = new TextEncoder();
          const stream = new ReadableStream({
            start(controller) {
              for (const line of LINES) {
                controller.enqueue(encoder.encode(`id: ${line.id}\nevent: log\ndata: ${JSON.stringify(line)}\n\n`));
              }
              controller.close();
            },
          });
          return new HttpResponse(stream, {
            headers: { 'Content-Type': 'text/event-stream', 'Cache-Control': 'no-cache', 'X-Request-ID': 'req-fixture' },
          });
        }),
      ];

      export const server = setupServer(...handlers);
    src/test/setup.ts: |
      import '@testing-library/jest-dom/vitest';
      import { afterAll, afterEach, beforeAll } from 'vitest';

      import { server } from './server';

      beforeAll(() => server.listen({ onUnhandledRequest: 'bypass' }));
      afterEach(() => server.resetHandlers());
      afterAll(() => server.close());
