id: build-software-engineer-live-log-tail
max_turns: 64
agent: software-engineer
# The live-data and dense-data bar. The prompt asks for a log tail with pause/resume, a level
# filter, jump-to-newest, a visible dropped/reconnecting state, smoothness at hundreds of lines a
# second, and keyboard shortcuts; it never says "SSE reader", "virtualize", "Last-Event-ID",
# "one reconnect owner" or "aria-live". There is no rendered-page oracle here: jsdom has no
# EventSource and no layout, so smoothness and stream handling are judged by a human in the
# review viewer from the shipped code and the agent's own tests. The structural checks keep the
# comparison honest: the suite must be green, a logs test must have run, and the skill loaded.
# The fixture is the opsconsole app with the stream documented in docs/openapi.yaml and an MSW
# handler that serves a short text/event-stream, so a test can exercise the reader.
prompt: |
  Add a page at `/services/:id/logs` to this React app that tails the service's log stream from
  `GET /v1/services/{id}/logs/stream` (server-sent events; see `docs/openapi.yaml`). Operators
  watch this during a rollout: they need to pause and resume, filter by level, jump to the
  newest line, and see when the stream has dropped and is reconnecting. Lines can arrive at
  hundreds per second, so the list has to stay smooth. Keyboard shortcuts for pause and jump.
  Build it end to end in this repo and tell me what you ran to verify it.
  Tests go next to the code as `*.test.tsx`; this repo uses Vitest, Testing Library, and MSW (see
  the README). This is a code change, not a design question, not a review, and not an incident.
  After your last edit or helper return, run `npx vitest run src` as a standalone foreground
  shell command; use read tools for any final inspection.
  Use separate Changed and Verified headings in your final response, explaining the changes and verification results.
fixture:
  files:
    .gitignore: |
      node_modules/
      dist/
      coverage/
      .vite/
    README.md: |
      # opsconsole

      The internal operations console: a Vite + React + TypeScript single-page app served behind
      the ops gateway. Routes live in `src/App.tsx`; `src/api/client.ts` wraps `fetch` for the
      JSON API the gateway proxies at the same origin. The API contract is `docs/openapi.yaml`;
      the legacy `/api/services` endpoint predates it.

      Install dependencies once, then work from the repo root:

          npm install

      Typecheck and test:

          npm run typecheck     # tsc --noEmit
          npm test              # vitest run

      Component tests sit next to the component as `*.test.tsx` and mock the API at the network
      layer with MSW (`src/test/server.ts`); `src/test/setup.ts` starts the server for every test
      file. `npm run dev` serves the app locally.
    docs/openapi.yaml: |
      openapi: 3.1.0
      info: { title: Ops Console API, version: 1.0.0 }
      servers:
        - url: /
      paths:
        /v1/services/{id}/logs/stream:
          get:
            operationId: streamServiceLogs
            summary: Tail a service's log lines as server-sent events.
            description: >-
              One `log` event per line, each with an `id` the client sends back as `Last-Event-ID`
              on reconnect; a keep-alive comment about every 15 s. Cookie-authenticated.
            parameters:
              - { name: id, in: path, required: true, schema: { type: string } }
              - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] }, description: Minimum level to send. }
            responses:
              "200":
                description: An event stream of LogLine objects.
                headers:
                  X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
                content:
                  text/event-stream:
                    schema: { $ref: "#/components/schemas/LogLine" }
              "404": { $ref: "#/components/responses/Problem" }
              "429": { $ref: "#/components/responses/RateLimited" }
              "500": { $ref: "#/components/responses/Problem" }
      components:
        headers:
          X-Request-ID:
            description: Correlates this response with the request log line; equals the problem body's request_id.
            schema: { type: string, minLength: 1 }
        responses:
          Problem:
            description: RFC 9457 problem+json. `type` and codes are part of the contract.
            headers:
              X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            content:
              application/problem+json:
                schema: { $ref: "#/components/schemas/Problem" }
          RateLimited:
            description: Rate limited; Retry-After is required.
            headers:
              Retry-After: { required: true, schema: { type: integer }, description: Seconds to wait. }
              X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            content:
              application/problem+json:
                schema: { $ref: "#/components/schemas/Problem" }
        schemas:
          Problem:
            type: object
            properties:
              type: { type: string, format: uri }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
              request_id: { type: string, minLength: 1 }
            required: [type, title, status, request_id]
          LogLine:
            type: object
            properties:
              id: { type: string, description: Event id; send back as Last-Event-ID on reconnect. }
              ts: { type: string, format: date-time }
              level: { type: string, enum: [debug, info, warn, error] }
              msg: { type: string }
            required: [id, ts, level, msg]
