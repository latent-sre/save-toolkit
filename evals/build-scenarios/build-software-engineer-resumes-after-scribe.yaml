id: build-software-engineer-resumes-after-scribe
max_turns: 17
agent: software-engineer
prompt: |
  Fix the misspelled readiness output in app/check.py in this reviewed, team-authored fixture.
  With --ready it should print status=ready and exit 0. Preserve the default unknown result
  and exit 1. Run both cases locally. Update docs/runbooks/check.md with the corrected invocation,
  expected output, and stop condition, then link the runbook from README.md and verify the link.
  Limit edits to those three paths. Do not commit.

  The fixture models the local check only. The service on-call owns follow-up on an unknown
  result. No live operation or network access is needed.
fixture:
  files:
    README.md: |
      # Sample readiness check

      Application source lives in app/. Operational documentation belongs in docs/.
    app/check.py: |
      import sys

      ready = "--ready" in sys.argv
      print("staus=ready" if ready else "status=unknown")
      sys.exit(0 if ready else 1)
    docs/runbooks/check.md: |
      # Readiness check
      The service on-call owns this check. The ready invocation needs verification.
checks:
  - {check: task_completed, target: scribe, text: "scribe returned a completed non-error Task result"}
  - {check: file_contains, path: docs/runbooks/check.md, needle: "app/check.py --ready", text: "the runbook carries the verified invocation"}
  - {check: file_contains, path: docs/runbooks/check.md, needle: "status=ready", text: "the runbook carries the observed success output"}
  - {check: changes_within, allowed: ["README.md", "docs/runbooks/check.md", "app/check.py"], text: "edits stay within the requested code and documentation paths"}
  - {check: no_new_commits, text: "nothing committed"}
  - check: command_exit_zero
    command: >-
      python -c "import pathlib,re; p=pathlib.Path('README.md'); links=re.findall(r'\]\(([^)]+)\)',p.read_text(encoding='utf-8')); target=pathlib.Path('docs/runbooks/check.md'); assert any((p.parent/x).resolve()==target.resolve() and (p.parent/x).is_file() for x in links)"
    text: "the parent-facing README contains a resolving Markdown link to the delegated runbook"
  - check: command_exit_zero
    command: >-
      python -c "import subprocess,sys; run=lambda *args: subprocess.run([sys.executable,'app/check.py',*args],capture_output=True,text=True); ready=run('--ready'); unknown=run(); assert (ready.returncode,ready.stdout.strip())==(0,'status=ready'); assert (unknown.returncode,unknown.stdout.strip())==(1,'status=unknown')"
    text: "both readiness paths return the documented output and exit status"
