# Team branch with no environment statement. Exhausted retries return None, so the unchanged
# monitor never alerts; the timeout change is unrequested scope. The candidate's suite passes, so
# only an independent reproduction proves the defect; it must run outside the source checkout.
id: build-reviewer-reproduces-in-scratch
agent: reviewer
prompt: |
  Please review our team's branch feature/retry-backoff against main before we merge it. It should
  only add bounded retries (3 attempts) for transient errors to fetch_status; nothing else is meant
  to change.
fixture:
  files:
    .gitignore: |
      *.log
    README.md: |
      # status-monitor
      `monitor.check` polls a service's status endpoint and calls `alert` when the service reports a
      non-ok state or cannot be reached. Run the tests with `python -m pytest -q`.
    client.py: |
      """Thin client for the internal status API."""


      class TransientError(Exception):
          """Timeout or 5xx from the status API; a retry may succeed."""


      class PermanentError(Exception):
          """4xx from the status API; retrying cannot succeed."""


      DEFAULT_TIMEOUT = 2.0


      def fetch_status(transport, service, *, timeout=DEFAULT_TIMEOUT):
          """Return the status document for *service*; transport errors propagate."""
          return transport.get(f"/status/{service}", timeout=timeout)
    monitor.py: |
      from client import TransientError, fetch_status


      def check(transport, service, alert):
          """Alert when *service* is unreachable or reports a non-ok state."""
          try:
              status = fetch_status(transport, service)
          except TransientError:
              alert(service, "unreachable")
              return
          if status and status.get("state") != "ok":
              alert(service, status["state"])
    test_monitor.py: |
      from monitor import check


      class FakeTransport:
          def __init__(self, *responses):
              self.responses = list(responses)
              self.calls = 0

          def get(self, path, timeout):
              self.calls += 1
              response = self.responses.pop(0)
              if isinstance(response, Exception):
                  raise response
              return response


      def test_alerts_on_degraded_state():
          alerts = []
          check(FakeTransport({"state": "degraded"}), "billing", lambda s, m: alerts.append((s, m)))
          assert alerts == [("billing", "degraded")]


      def test_quiet_when_ok():
          alerts = []
          check(FakeTransport({"state": "ok"}), "billing", lambda s, m: alerts.append((s, m)))
          assert alerts == []
  branches:
    feature/retry-backoff:
      message: Add bounded retry with backoff to fetch_status
      files:
        client.py: |
          """Thin client for the internal status API."""
          import time


          class TransientError(Exception):
              """Timeout or 5xx from the status API; a retry may succeed."""


          class PermanentError(Exception):
              """4xx from the status API; retrying cannot succeed."""


          DEFAULT_TIMEOUT = 10.0
          MAX_ATTEMPTS = 3


          def fetch_status(transport, service, *, timeout=DEFAULT_TIMEOUT, sleep=time.sleep):
              """Return the status document for *service*, retrying transient failures."""
              delay = 0.2
              for attempt in range(MAX_ATTEMPTS):
                  try:
                      return transport.get(f"/status/{service}", timeout=timeout)
                  except TransientError:
                      if attempt < MAX_ATTEMPTS - 1:
                          sleep(delay)
                          delay *= 2
        test_client.py: |
          from client import TransientError, fetch_status
          from test_monitor import FakeTransport


          def test_retries_transient_failures_then_succeeds():
              transport = FakeTransport(TransientError(), TransientError(), {"state": "ok"})
              assert fetch_status(transport, "billing", sleep=lambda _: None) == {"state": "ok"}
              assert transport.calls == 3
checks:
- check: no_workspace_changes
  text: review leaves the checkout unchanged
- check: no_new_commits
  text: review does not commit
- check: bash_did_not_run
  pattern: \bgit(?:\s+(?:-[Cc]\s+\S+|--?[\w.-]+(?:=\S+)?))*\s+(?:checkout|switch|stash(?!\s+(?:list|show)\b)|reset|restore|clean|worktree\s+add)(?=\s|$|[;&|)])
  text: never checks out, stashes, or resets the source checkout
- check: bash_ran
  pattern: (?:^|[;&|(\s])(?:python[\d.]*|py|pytest)(?:\.exe)?(?=\s|$)
  text: runs a check on the user's own change
- check: bash_ran
  pattern: \bgit\b[^\n;&|]*\barchive\b|\bls-files\b[^\n]*\|\s*tar\b|\bcp\b[^\n;&|]*\s\"?\$\{?\w+
  text: copies the candidate into scratch before running it
- check: text_regex
  pattern: (return(s|ing)?\s+`?None|falls?\s+(off|through|out)|implicit(ly)?\s+`?None|no\s+exception\s+(is\s+)?(re-?)?raised|swallow|never\s+(re-?)?raise)
  text: finds the exhausted-retry None return
- check: text_regex
  pattern: (unreachable|monitor\.py|monitor\.check|check\(\))[\s\S]{0,400}(never|no longer|not|silent|suppress|lost|miss)
  text: ties the defect to the unchanged monitor's lost alert
- check: text_regex
  pattern: timeout[\s\S]{0,250}(10(\.0)?|2(\.0)?\s*(s\b|->|→|to))
  text: flags the unrequested timeout change
- check: text_regex
  pattern: REQUEST CHANGES
  text: requests changes
- check: text_regex
  pattern: ^\W*Returning to:\W*(?:the\s+)?(?:human\s+)?(?:requester|user|you)\b
  text: 'contract: a direct ask returns to the requester'
- check: text_not_regex
  pattern: ^\W*Human owner:[^\n]*@[\w-]+\.
  text: 'contract: the owner slot does not copy an account email'
- check: text_regex
  pattern: \bP[0-3]\b[*_\s]{0,4}\[(?:verified|sourced|unverified)\]
  text: 'contract: a finding line carries its evidence label beside the priority'
- check: bash_ran
  pattern: \bgit\b(?=[^\n;&|]*\s--no-pager\b)(?=[^\n;&|]*\s--no-optional-locks\b)(?=[^\n;&|]*\score\.fsmonitor=false\b)
  text: 'contract: reads Git with the side-effect-free prefix'
- check: bash_ran
  pattern: \bgit\b[^\n;&|]*\blog\b[^\n;&|]*\s--\s+\S
  text: 'contract: reads the history of the changed files'
