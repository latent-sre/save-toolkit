      def test_promote_runs_the_command_and_records_it(tmp_path):
          seen = []
          config, promoter = make(tmp_path, command=lambda address: seen.append(address) or (0, ""))
          record = promoter.promote("drill")
          assert seen == [config.replica]
          assert record == {"promoted": True, "new_primary": config.replica, "reason": "drill", "at": 1234}
          assert json.loads((tmp_path / "state" / "state.json").read_text(encoding="utf-8")) == record
          assert promoter.state() == record


      def test_nothing_is_recorded_before_a_promotion(tmp_path):
          _, promoter = make(tmp_path)
          assert promoter.state() == {}


      def test_a_second_promotion_is_refused(tmp_path):
          calls = []
          config, promoter = make(tmp_path, command=lambda address: calls.append(address) or (0, ""))
          promoter.promote("first")
          with pytest.raises(AlreadyPromoted, match="has already been promoted"):
              promoter.promote("second")
          assert len(calls) == 1


      def test_a_failed_command_records_nothing(tmp_path):
          config, promoter = make(tmp_path, command=lambda address: (1, "pg_ctl: no server running"))
          with pytest.raises(PromotionFailed, match="no server running"):
              promoter.promote("drill")
          assert promoter.state() == {}


      def test_the_state_file_is_written_in_one_step(tmp_path):
          _, promoter = make(tmp_path)
          promoter.promote("drill")
          assert [path.name for path in (tmp_path / "state").iterdir()] == ["state.json"]
