      import io

      from dbfailover.config import Config
      from dbfailover.health import HealthChecker, Status, tcp_probe
      from dbfailover.monitor import watch
      from dbfailover.promote import Promoter


      class Clock:
          def __init__(self):
              self.now = 0.0

          def __call__(self):
              return self.now

          def advance(self, seconds):
              self.now += seconds


      def checker_for(answers, clock, **overrides):
          config = Config(**overrides)
          return HealthChecker(config, probe=lambda address, timeout: answers["up"], clock=clock)


      def test_an_answering_primary_is_healthy():
          clock = Clock()
          checker = checker_for({"up": True}, clock)
          assert checker.check() is Status.HEALTHY
          assert checker.silent_for() == 0


      def test_a_silent_primary_is_degraded_before_the_timeout():
          clock = Clock()
          checker = checker_for({"up": False}, clock)
          clock.advance(10)
          assert checker.check() is Status.DEGRADED
          assert checker.silent_for() == 10


      def test_a_silent_primary_is_dead_after_the_default_timeout():
          clock = Clock()
          checker = checker_for({"up": False}, clock)
          clock.advance(31)
          assert checker.check() is Status.DEAD


      def test_an_answer_resets_the_silence():
          clock = Clock()
          answers = {"up": False}
          checker = checker_for(answers, clock)
          clock.advance(20)
          answers["up"] = True
          assert checker.check() is Status.HEALTHY
          answers["up"] = False
          clock.advance(5)
          assert checker.check() is Status.DEGRADED
          assert checker.silent_for() == 5


      def test_an_explicit_timeout_overrides_the_default():
          clock = Clock()
          checker = checker_for({"up": False}, clock, health_timeout=20)
          clock.advance(20)
          assert checker.check() is Status.DEAD


      def test_tcp_probe_is_false_for_an_unusable_address():
          assert tcp_probe("localhost:not-a-port", 0.1) is False


      def test_watch_promotes_once_the_primary_has_been_silent_long_enough(tmp_path):
          clock = Clock()
          config = Config(state_file=str(tmp_path / "state.json"))
          checker = HealthChecker(config, probe=lambda address, timeout: False, clock=clock)
          promoter = Promoter(config, command=lambda address: (0, ""), clock=lambda: 1000)
          out = io.StringIO()
          record = watch(config, checker, promoter, sleep=clock.advance, out=out)
          assert record["new_primary"] == config.replica
          assert clock.now == config.health_timeout
          lines = out.getvalue().splitlines()
          assert lines[0] == "primary degraded"
          assert lines[-2:] == ["primary dead", f"promoted {config.replica}"]


      def test_watch_stops_after_max_checks_without_promoting(tmp_path):
          clock = Clock()
          config = Config(state_file=str(tmp_path / "state.json"))
          checker = HealthChecker(config, probe=lambda address, timeout: True, clock=clock)
          promoter = Promoter(config, command=lambda address: (0, ""))
          assert watch(config, checker, promoter, sleep=clock.advance, max_checks=3, out=io.StringIO()) is None
          assert not (tmp_path / "state.json").exists()
