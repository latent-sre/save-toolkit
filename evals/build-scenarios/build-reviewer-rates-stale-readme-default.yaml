      from pathlib import Path

      import pytest

      from dbfailover.config import Config, load
      from dbfailover.errors import ConfigError

      EXAMPLE = Path(__file__).resolve().parent.parent / "config" / "dbfailover.example.ini"


      def write(tmp_path, body):
          path = tmp_path / "dbfailover.ini"
          path.write_text(body, encoding="utf-8")
          return path


      def test_defaults():
          config = Config()
          assert config.health_timeout == 30
          assert config.check_interval == 5
          assert config.probe_timeout == 2
          assert config.primary != config.replica


      def test_load_without_a_file_uses_the_defaults():
          assert load(env={}) == Config()


      def test_the_example_file_matches_the_defaults():
          assert load(EXAMPLE, env={}) == Config()


      def test_the_environment_beats_the_file(tmp_path):
          path = write(tmp_path, "[dbfailover]\nhealth_timeout = 40\n")
          assert load(path, env={}).health_timeout == 40
          assert load(path, env={"DBFAILOVER_HEALTH_TIMEOUT": "50"}).health_timeout == 50


      def test_text_settings_are_taken_as_written(tmp_path):
          path = write(tmp_path, "[dbfailover]\nprimary = a.example:6000\nreplica = b.example:6000\n")
          config = load(path, env={})
          assert (config.primary, config.replica) == ("a.example:6000", "b.example:6000")


      @pytest.mark.parametrize(
          "body, message",
          [
              ("health_timeout = 5", "health_timeout must be between 10 and 600 seconds, not 5"),
              ("health_timeout = 601", "must be between 10 and 600"),
              ("health_timeout = soon", "health_timeout must be a whole number, not 'soon'"),
              ("check_interval = 0", "check_interval must be at least 1 second"),
              ("probe_timeout = 9", "probe_timeout must not exceed check_interval"),
              ("check_interval = 40\nhealth_timeout = 40", "check_interval must be shorter than health_timeout"),
              ("primary = x:1\nreplica = x:1", "primary and replica must be different"),
              ("colour = red", "unknown settings: colour"),
          ],
      )
      def test_bad_settings_are_rejected(tmp_path, body, message):
          with pytest.raises(ConfigError, match=message):
              load(write(tmp_path, f"[dbfailover]\n{body}\n"), env={})


      def test_a_missing_file_or_section_is_rejected(tmp_path):
          with pytest.raises(ConfigError, match="cannot read config file"):
              load(tmp_path / "absent.ini", env={})
          with pytest.raises(ConfigError, match=r"missing \[dbfailover\] section"):
              load(write(tmp_path, "[other]\nx = 1\n"), env={})
