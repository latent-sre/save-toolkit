      """The `dbfailover` command line.

      Every command loads the configuration first; a failing command prints `error: ...` to stderr and
      returns status 2.
      """

      import argparse
      import sys
      import time
      from dataclasses import fields

      from .config import load
      from .errors import FailoverError
      from .health import HealthChecker, tcp_probe
      from .monitor import watch
      from .promote import Promoter, pg_promote

      EXIT_OK = 0
      EXIT_PRIMARY_DOWN = 1
      EXIT_ERROR = 2
      EXIT_STILL_WATCHING = 3


      def build_parser():
          parser = argparse.ArgumentParser(prog="dbfailover", description="Probe the primary and promote the replica.")
          parser.add_argument("--config", help="ini file with the settings")
          commands = parser.add_subparsers(dest="command", required=True)
          commands.add_parser("config", help="print the settings in effect")
          commands.add_parser("check", help="probe the primary once")
          run = commands.add_parser("watch", help="probe on an interval and promote when the primary is dead")
          run.add_argument("--max-checks", type=int, help="stop after this many probes")
          promote = commands.add_parser("promote", help="promote the replica now")
          promote.add_argument("--reason", default="manual promotion")
          return parser


      def _run(args, config, out, probe, command, sleep, clock):
          if args.command == "config":
              for field in fields(config):
                  print(f"{field.name} = {getattr(config, field.name)}", file=out)
              return EXIT_OK
          if args.command == "check":
              if probe(config.primary, config.probe_timeout):
                  print("primary answering", file=out)
                  return EXIT_OK
              print("primary not answering", file=out)
              return EXIT_PRIMARY_DOWN
          if args.command == "promote":
              record = Promoter(config, command).promote(args.reason)
              print(f"promoted {record['new_primary']}", file=out)
              return EXIT_OK
          checker = HealthChecker(config, probe, clock)
          record = watch(config, checker, Promoter(config, command), sleep, args.max_checks, out)
          return EXIT_OK if record else EXIT_STILL_WATCHING


      def main(argv=None, out=None, err=None, env=None, probe=tcp_probe, command=pg_promote,
               sleep=time.sleep, clock=time.monotonic):
          """Run one command and return the process exit status."""
          out = sys.stdout if out is None else out
          err = sys.stderr if err is None else err
          args = build_parser().parse_args(argv)
          try:
              return _run(args, load(args.config, env), out, probe, command, sleep, clock)
          except FailoverError as exc:
              print(f"error: {exc}", file=err)
              return EXIT_ERROR


      if __name__ == "__main__":
          raise SystemExit(main())
    dbfailover/config.py: |
      """Configuration for dbfailover.

      Settings come from three places, strongest first: `DBFAILOVER_*` environment variables, the ini
      file named with `--config`, and the defaults in this module. `load` merges them and validates the
      result, so the rest of the package only ever sees a consistent `Config`.
      """

      import configparser
      import os
      from dataclasses import dataclass, fields

      from .errors import ConfigError

      SECTION = "dbfailover"
      ENV_PREFIX = "DBFAILOVER_"

      DEFAULT_HEALTH_TIMEOUT = 30
      DEFAULT_CHECK_INTERVAL = 5
      DEFAULT_PROBE_TIMEOUT = 2
      MIN_HEALTH_TIMEOUT = 10
      MAX_HEALTH_TIMEOUT = 600
      INT_SETTINGS = ("health_timeout", "check_interval", "probe_timeout")


      @dataclass(frozen=True)
      class Config:
          """Every setting the package reads."""

          primary: str = "db-primary:5432"
          replica: str = "db-replica:5432"
          health_timeout: int = DEFAULT_HEALTH_TIMEOUT
          check_interval: int = DEFAULT_CHECK_INTERVAL
          probe_timeout: int = DEFAULT_PROBE_TIMEOUT
          state_file: str = "/var/lib/dbfailover/state.json"

          def validated(self):
              """Return `self` when the settings agree with each other, otherwise raise `ConfigError`."""
              if self.primary == self.replica:
                  raise ConfigError("primary and replica must be different addresses")
              if not MIN_HEALTH_TIMEOUT <= self.health_timeout <= MAX_HEALTH_TIMEOUT:
                  raise ConfigError(
                      f"health_timeout must be between {MIN_HEALTH_TIMEOUT} and {MAX_HEALTH_TIMEOUT} seconds, "
                      f"not {self.health_timeout}"
                  )
              if self.check_interval < 1:
                  raise ConfigError("check_interval must be at least 1 second")
              if self.probe_timeout > self.check_interval:
                  raise ConfigError("probe_timeout must not exceed check_interval")
              if self.check_interval >= self.health_timeout:
                  raise ConfigError("check_interval must be shorter than health_timeout")
              return self


      def _convert(name, raw):
          if name not in INT_SETTINGS:
              return raw
          try:
              return int(raw)
          except (TypeError, ValueError):
              raise ConfigError(f"{name} must be a whole number, not {raw!r}") from None


      def load(path=None, env=None) -> Config:
          """Merge defaults, the ini file at `path` and the environment into a validated `Config`."""
          env = os.environ if env is None else env
          values = {}
          if path is not None:
              parser = configparser.ConfigParser()
              if not parser.read(path, encoding="utf-8"):
                  raise ConfigError(f"{path}: cannot read config file")
              if SECTION not in parser:
                  raise ConfigError(f"{path}: missing [{SECTION}] section")
              values.update(parser[SECTION])
          known = [field.name for field in fields(Config)]
          for name in known:
              key = ENV_PREFIX + name.upper()
              if key in env:
                  values[name] = env[key]
          unknown = sorted(set(values) - set(known))
          if unknown:
              raise ConfigError(f"unknown settings: {', '.join(unknown)}")
          return Config(**{name: _convert(name, raw) for name, raw in values.items()}).validated()
    dbfailover/errors.py: |
      """Exceptions raised by dbfailover.

      Every error the package raises on purpose derives from `FailoverError`, so the command line can
      report a failure by catching that one class.
      """


      class FailoverError(Exception):
          """Base class for every error this package raises on purpose."""


      class ConfigError(FailoverError):
          """A setting is missing, unknown, malformed or out of range."""


      class AlreadyPromoted(FailoverError):
          """The state file already records a promotion."""

          def __init__(self, replica):
              super().__init__(f"{replica} has already been promoted")
              self.replica = replica


      class PromotionFailed(FailoverError):
          """The promote command did not succeed."""

          def __init__(self, replica, detail):
              super().__init__(f"could not promote {replica}: {detail or 'no detail'}")
              self.replica = replica
    dbfailover/health.py: |
      """Probing the primary.

      `HealthChecker.check` probes once and classifies the primary by how long it has been silent: it is
      `HEALTHY` when it answers, `DEGRADED` while the silence is shorter than the configured health
      timeout and `DEAD` once the silence reaches it. The probe and the clock are injected so tests do
      not need a network or real time.
      """

      import socket
      import time
      from enum import Enum


      class Status(Enum):
          HEALTHY = "healthy"
          DEGRADED = "degraded"
          DEAD = "dead"


      def tcp_probe(address, timeout) -> bool:
          """True when a TCP connection to `host:port` succeeds within `timeout` seconds."""
          host, _, port = address.rpartition(":")
          try:
              with socket.create_connection((host, int(port)), timeout=timeout):
                  return True
          except (OSError, ValueError):
              return False


      class HealthChecker:
          """Tracks when the primary last answered."""

          def __init__(self, config, probe=tcp_probe, clock=time.monotonic):
              self._config = config
              self._probe = probe
              self._clock = clock
              self._last_answer = clock()

          def silent_for(self) -> float:
              """Seconds since the primary last answered."""
              return self._clock() - self._last_answer

          def check(self) -> Status:
              """Probe the primary once and classify it."""
              now = self._clock()
              if self._probe(self._config.primary, self._config.probe_timeout):
                  self._last_answer = now
                  return Status.HEALTHY
              if now - self._last_answer >= self._config.health_timeout:
                  return Status.DEAD
              return Status.DEGRADED
