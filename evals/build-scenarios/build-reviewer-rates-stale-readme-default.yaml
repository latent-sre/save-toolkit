        Raise the default health-check timeout from 30 to 90 seconds

        Replicas behind slow cross-region links answered late enough to trip the old default, and the
        checker promoted a replica while the primary was healthy. The default is now 90 seconds in
        dbfailover.config and in the example config; the accepted range is unchanged. Tests cover the new
        default and a primary that stays silent for 45 seconds.
