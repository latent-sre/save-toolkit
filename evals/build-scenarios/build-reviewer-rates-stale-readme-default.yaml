          """Configuration for dbfailover.

          Settings come from three places, strongest first: `DBFAILOVER_*` environment variables, the ini
          file named with `--config`, and the defaults in this module. `load` merges them and validates the
          result, so the rest of the package only ever sees a consistent `Config`.
          """

          import configparser
          import os
          from dataclasses import dataclass, fields

          from .errors import ConfigError

          SECTION = "dbfailover"
          ENV_PREFIX = "DBFAILOVER_"

          DEFAULT_HEALTH_TIMEOUT = 90
          DEFAULT_CHECK_INTERVAL = 5
          DEFAULT_PROBE_TIMEOUT = 2
          MIN_HEALTH_TIMEOUT = 10
          MAX_HEALTH_TIMEOUT = 600
          INT_SETTINGS = ("health_timeout", "check_interval", "probe_timeout")


          @dataclass(frozen=True)
          class Config:
              """Every setting the package reads."""

              primary: str = "db-primary:5432"
              replica: str = "db-replica:5432"
              health_timeout: int = DEFAULT_HEALTH_TIMEOUT
              check_interval: int = DEFAULT_CHECK_INTERVAL
              probe_timeout: int = DEFAULT_PROBE_TIMEOUT
              state_file: str = "/var/lib/dbfailover/state.json"

              def validated(self):
                  """Return `self` when the settings agree with each other, otherwise raise `ConfigError`."""
                  if self.primary == self.replica:
                      raise ConfigError("primary and replica must be different addresses")
                  if not MIN_HEALTH_TIMEOUT <= self.health_timeout <= MAX_HEALTH_TIMEOUT:
                      raise ConfigError(
                          f"health_timeout must be between {MIN_HEALTH_TIMEOUT} and {MAX_HEALTH_TIMEOUT} seconds, "
                          f"not {self.health_timeout}"
                      )
                  if self.check_interval < 1:
                      raise ConfigError("check_interval must be at least 1 second")
                  if self.probe_timeout > self.check_interval:
                      raise ConfigError("probe_timeout must not exceed check_interval")
                  if self.check_interval >= self.health_timeout:
                      raise ConfigError("check_interval must be shorter than health_timeout")
                  return self


          def _convert(name, raw):
              if name not in INT_SETTINGS:
                  return raw
              try:
                  return int(raw)
              except (TypeError, ValueError):
                  raise ConfigError(f"{name} must be a whole number, not {raw!r}") from None


          def load(path=None, env=None) -> Config:
              """Merge defaults, the ini file at `path` and the environment into a validated `Config`."""
              env = os.environ if env is None else env
              values = {}
              if path is not None:
                  parser = configparser.ConfigParser()
                  if not parser.read(path, encoding="utf-8"):
                      raise ConfigError(f"{path}: cannot read config file")
                  if SECTION not in parser:
                      raise ConfigError(f"{path}: missing [{SECTION}] section")
                  values.update(parser[SECTION])
              known = [field.name for field in fields(Config)]
              for name in known:
                  key = ENV_PREFIX + name.upper()
                  if key in env:
                      values[name] = env[key]
              unknown = sorted(set(values) - set(known))
              if unknown:
                  raise ConfigError(f"unknown settings: {', '.join(unknown)}")
              return Config(**{name: _convert(name, raw) for name, raw in values.items()}).validated()
        docs/runbooks/primary-failover.md: |
          # Runbook: primary database failover

          For the on-call responder. Use it when the page says the primary database is not answering.

          ## Before you start

          - You need a shell on a host that can reach both database addresses and `ssh` to the replica.
          - Keep the config file the checker uses at hand; the commands below take `--config /etc/dbfailover.ini`.

          ## Procedure

          1. Run `python -m dbfailover.cli --config /etc/dbfailover.ini check`. Exit status 0 means the
             primary answers: stop and look at the application instead. Exit status 1 means it does not.
          2. Wait for the checker. If the primary has not answered for 90 seconds the checker promotes the
             replica on its own; if it has not promoted after 90 seconds, promote manually with
             `python -m dbfailover.cli --config /etc/dbfailover.ini promote --reason "manual failover"`.
          3. Confirm the promotion: `cat /var/lib/dbfailover/state.json` shows `"promoted": true` and the
             replica as `new_primary`.
          4. Point the applications at the new primary and tell the database owners in the incident channel.

          ## Do not promote early

          Never promote by hand while the checker is still waiting. The checker keeps its own clock and
          promotes again when its timeout lapses, and two writable primaries diverge (split-brain). If you
          promoted by mistake, stop the checker with `systemctl stop dbfailover` before doing anything else.

          ## Rollback

          A promotion is not undone by this tool. Rebuilding the old primary as a replica is a job for the
          database owners; hand over the state file and the time of the promotion.
