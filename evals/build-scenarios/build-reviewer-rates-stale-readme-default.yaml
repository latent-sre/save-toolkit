      # dbfailover

      Health checking and promotion for a primary/replica database pair. A checker probes the primary
      on an interval; when the primary has been silent for longer than the health timeout it promotes
      the replica and records the promotion in a state file. Standard library only; run the tests with
      `python -m pytest -q`.

      ## Command line

      ```
      python -m dbfailover.cli [--config FILE] config
      python -m dbfailover.cli [--config FILE] check
      python -m dbfailover.cli [--config FILE] watch [--max-checks N]
      python -m dbfailover.cli [--config FILE] promote [--reason TEXT]
      ```

      - `config` prints the settings in effect.
      - `check` probes the primary once and exits 0 when it answers and 1 when it does not.
      - `watch` runs the checker loop and promotes the replica when the primary has been silent for the
        health timeout.
      - `promote` promotes the replica now. It refuses when the state file already records a promotion.

      A failing command prints `error: ...` and exits with status 2.

      ## Configuration

      Settings come from `DBFAILOVER_*` environment variables, then the ini file named with `--config`,
      then the defaults below. `config/dbfailover.example.ini` is a complete example.

      | Setting | Environment variable | Default | Meaning |
      |---|---|---|---|
      | `primary` | `DBFAILOVER_PRIMARY` | `db-primary:5432` | Address the checker probes |
      | `replica` | `DBFAILOVER_REPLICA` | `db-replica:5432` | Address that is promoted |
      | `health_timeout` | `DBFAILOVER_HEALTH_TIMEOUT` | 30 seconds | How long the primary may stay silent before the checker promotes the replica |
      | `check_interval` | `DBFAILOVER_CHECK_INTERVAL` | 5 seconds | Time between probes |
      | `probe_timeout` | `DBFAILOVER_PROBE_TIMEOUT` | 2 seconds | How long one probe waits for an answer |
      | `state_file` | `DBFAILOVER_STATE_FILE` | `/var/lib/dbfailover/state.json` | Where promotions are recorded |

      `health_timeout` must be between 10 and 600 seconds and longer than `check_interval`;
      `probe_timeout` must not exceed `check_interval`.

      ## Layout

      | Module | Role |
      |---|---|
      | `config.py` | Defaults, ini and environment loading, validation |
      | `health.py` | The probe and the `HealthChecker` |
      | `promote.py` | The `Promoter` and the state file |
      | `monitor.py` | The `watch` loop |
      | `cli.py` | The command line |

      Responders follow [the failover runbook](docs/runbooks/primary-failover.md).
