      """The watch loop: probe on an interval and promote when the primary is dead."""

      import sys
      import time

      from .health import Status


      def watch(config, checker, promoter, sleep=time.sleep, max_checks=None, out=None):
          """Check every `config.check_interval` seconds until the primary is dead.

          Returns the promotion record when the replica was promoted, or `None` when `max_checks` probes
          passed without the primary being declared dead.
          """
          out = sys.stdout if out is None else out
          checks = 0
          while max_checks is None or checks < max_checks:
              status = checker.check()
              checks += 1
              print(f"primary {status.value}", file=out)
              if status is Status.DEAD:
                  record = promoter.promote(f"primary silent for {checker.silent_for():.0f} seconds")
                  print(f"promoted {record['new_primary']}", file=out)
                  return record
              sleep(config.check_interval)
          return None
    dbfailover/promote.py: |
      """Promoting the replica and remembering that it happened.

      The state file is the only memory: once it records a promotion, `Promoter.promote` refuses to run
      again on this host. The command that performs the promotion is injected; the default asks the
      replica's host to run `pg_ctl promote` over ssh.
      """

      import json
      import os
      import subprocess
      import time
      from pathlib import Path

      from .errors import AlreadyPromoted, PromotionFailed


      def pg_promote(address):
          """Run `pg_ctl promote` on the host of `address`; return the exit status and stderr."""
          host, _, _ = address.rpartition(":")
          done = subprocess.run(
              ["ssh", host, "pg_ctl", "promote"], capture_output=True, text=True, timeout=60, check=False
          )
          return done.returncode, done.stderr.strip()


      class Promoter:
          """Promotes `config.replica` once and records it in `config.state_file`."""

          def __init__(self, config, command=pg_promote, clock=time.time):
              self._config = config
              self._command = command
              self._clock = clock

          def state(self) -> dict:
              """The recorded state, or an empty dict when nothing has been promoted."""
              path = Path(self._config.state_file)
              if not path.exists():
                  return {}
              return json.loads(path.read_text(encoding="utf-8"))

          def promote(self, reason) -> dict:
              """Promote the replica; raise `AlreadyPromoted` or `PromotionFailed` instead of acting twice."""
              replica = self._config.replica
              if self.state().get("promoted"):
                  raise AlreadyPromoted(replica)
              code, detail = self._command(replica)
              if code != 0:
                  raise PromotionFailed(replica, detail)
              record = {"promoted": True, "new_primary": replica, "reason": reason, "at": int(self._clock())}
              self._write(record)
              return record

          def _write(self, record):
              path = Path(self._config.state_file)
              path.parent.mkdir(parents=True, exist_ok=True)
              temp = path.with_name(path.name + ".tmp")
              temp.write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
              os.replace(temp, path)
