      import io

      from dbfailover import config as config_module
      from dbfailover.cli import main


      class Clock:
          def __init__(self):
              self.now = 0.0

          def __call__(self):
              return self.now


      def run(tmp_path, *argv, up=True, command=lambda address: (0, ""), clock=None):
          out, err = io.StringIO(), io.StringIO()
          env = {"DBFAILOVER_STATE_FILE": str(tmp_path / "state.json")}
          clock = clock or Clock()

          def sleep(seconds):
              clock.now += seconds

          code = main(list(argv), out=out, err=err, env=env, probe=lambda address, timeout: up,
                      command=command, sleep=sleep, clock=clock)
          return code, out.getvalue(), err.getvalue()


      def test_config_prints_the_settings_in_effect(tmp_path):
          code, out, _ = run(tmp_path, "config")
          assert code == 0
          assert f"health_timeout = {config_module.DEFAULT_HEALTH_TIMEOUT}" in out.splitlines()
          assert f"state_file = {tmp_path / 'state.json'}" in out.splitlines()


      def test_check_reports_whether_the_primary_answers(tmp_path):
          assert run(tmp_path, "check", up=True) == (0, "primary answering\n", "")
          assert run(tmp_path, "check", up=False) == (1, "primary not answering\n", "")


      def test_promote_records_the_reason(tmp_path):
          code, out, _ = run(tmp_path, "promote", "--reason", "drill")
          assert code == 0 and out.startswith("promoted db-replica:5432")
          assert '"reason": "drill"' in (tmp_path / "state.json").read_text(encoding="utf-8")


      def test_a_second_promote_exits_with_status_two(tmp_path):
          run(tmp_path, "promote")
          code, out, err = run(tmp_path, "promote")
          assert (code, out) == (2, "")
          assert "error: db-replica:5432 has already been promoted" in err


      def test_a_failed_promotion_exits_with_status_two(tmp_path):
          code, _, err = run(tmp_path, "promote", command=lambda address: (255, "connection refused"))
          assert code == 2 and "connection refused" in err


      def test_watch_promotes_when_the_primary_stays_down(tmp_path):
          code, out, _ = run(tmp_path, "watch", up=False)
          assert code == 0
          assert out.splitlines()[-2:] == ["primary dead", "promoted db-replica:5432"]


      def test_watch_with_max_checks_exits_with_status_three(tmp_path):
          code, out, _ = run(tmp_path, "watch", "--max-checks", "2", up=False)
          assert (code, out) == (3, "primary degraded\nprimary degraded\n")


      def test_a_bad_config_exits_with_status_two(tmp_path):
          code, _, err = run(tmp_path, "--config", str(tmp_path / "absent.ini"), "check")
          assert code == 2 and "cannot read config file" in err
