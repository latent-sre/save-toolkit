          import io

          from svccatalog import store
          from svccatalog.cli import main


          def run(snapshot, *argv):
              out = io.StringIO()
              code = main(["--snapshot", str(snapshot), *argv], out=out)
              return code, out.getvalue()


          def test_add_alias_and_list(snapshot):
              assert run(snapshot, "add", "api", "--owner", "platform", "--port", "8080") == (0, "added api on port 8080\n")
