          import pytest

          from svccatalog import Catalog
          from svccatalog.errors import (
              DuplicateName,
              InvalidName,
              InvalidRecord,
              NotAnAlias,
              StillReferenced,
              UnknownService,
          )
          from svccatalog.records import alias, service


          def test_len_counts_services_not_aliases(catalog):
              assert len(catalog) == 3
              assert len(catalog.names()) == 5


          def test_iteration_yields_services_in_name_order(catalog):
              assert [record.name for record in catalog] == ["api", "billing", "search"]


          def test_names_and_records_include_aliases(catalog):
              assert catalog.names() == ["api", "api-v1", "billing", "billing-old", "search"]
              assert [record.name for record in catalog.records()] == catalog.names()
              assert catalog.alias_names == {"api-v1", "billing-old"}


          def test_contains_and_get(catalog):
              assert "billing-old" in catalog
              assert "ghost" not in catalog
              assert catalog.get("billing-old").target == "billing"
              with pytest.raises(UnknownService, match="ghost is not in the catalog"):
                  catalog.get("ghost")


          def test_aliases_of(catalog):
              catalog.add_alias("billing-legacy", "billing")
              assert catalog.aliases_of("billing") == ["billing-legacy", "billing-old"]
              assert catalog.aliases_of("search") == []


          def test_add_validates_and_rejects_duplicates(catalog):
              with pytest.raises(DuplicateName):
                  catalog.add("api", "platform", 9000)
              with pytest.raises(DuplicateName):
                  catalog.add("api-v1", "platform", 9000)
              with pytest.raises(InvalidName):
                  catalog.add("Bad Name", "platform", 9000)
              with pytest.raises(InvalidRecord):
                  catalog.add("worker", "platform", 70000)
              with pytest.raises(InvalidRecord):
                  catalog.add("worker", "", 9000)
              assert len(catalog) == 3


          def test_add_alias_copies_owner_and_port(catalog):
              record = catalog.add_alias("find", "search")
              assert (record.owner, record.port, record.target) == ("discovery", 8082, "search")
              assert len(catalog) == 3


          def test_add_alias_rejects_unknown_duplicate_and_alias_targets(catalog):
              with pytest.raises(UnknownService):
                  catalog.add_alias("find", "ghost")
              with pytest.raises(DuplicateName):
                  catalog.add_alias("search", "api")
              with pytest.raises(InvalidRecord, match="is an alias"):
                  catalog.add_alias("find", "api-v1")


          def test_remove_an_alias(catalog):
              catalog.remove("billing-old")
              assert "billing-old" not in catalog
              assert len(catalog) == 3
              assert catalog.alias_names == {"api-v1"}


          def test_remove_a_service_without_aliases(catalog):
              catalog.remove("search")
              assert catalog.names() == ["api", "api-v1", "billing", "billing-old"]
              assert len(catalog) == 2


          def test_remove_a_referenced_service_needs_cascade(catalog):
              with pytest.raises(StillReferenced, match="billing is still referenced by: billing-old") as caught:
                  catalog.remove("billing")
              assert caught.value.aliases == ["billing-old"]
              assert "billing" in catalog
              catalog.remove("billing", cascade=True)
              assert catalog.names() == ["api", "api-v1", "search"]
              assert len(catalog) == 2


          def test_remove_unknown_name(catalog):
              with pytest.raises(UnknownService):
                  catalog.remove("ghost")


          def test_rename_a_service_moves_its_aliases(catalog):
              catalog.rename("billing", "payments-api")
              assert catalog.get("billing-old").target == "payments-api"
              assert "billing" not in catalog
              assert len(catalog) == 3


          def test_rename_an_alias(catalog):
              catalog.rename("api-v1", "api-legacy")
              assert catalog.alias_names == {"api-legacy", "billing-old"}
              assert catalog.get("api-legacy").target == "api"


          def test_rename_rejects_taken_and_invalid_names(catalog):
              with pytest.raises(DuplicateName):
                  catalog.rename("api", "search")
              with pytest.raises(InvalidName):
                  catalog.rename("api", "API")
              with pytest.raises(UnknownService):
                  catalog.rename("ghost", "ghost-2")


          def test_set_owner_updates_aliases(catalog):
              catalog.set_owner("api", "edge")
              assert catalog.get("api").owner == "edge"
              assert catalog.get("api-v1").owner == "edge"
              with pytest.raises(InvalidRecord, match="is an alias"):
                  catalog.set_owner("api-v1", "edge")
              with pytest.raises(InvalidRecord, match="needs an owner"):
                  catalog.set_owner("api", "")


          def test_every_change_notifies_listeners_once():
              catalog = Catalog()
              seen = []
              catalog.subscribe(lambda changed: seen.append(len(changed)))
              catalog.add("api", "platform", 8080)
              catalog.add_alias("api-v1", "api")
              catalog.rename("api-v1", "api-old")
              catalog.set_owner("api", "edge")
              catalog.remove("api", cascade=True)
              assert seen == [1, 1, 1, 1, 0]


          def test_a_failed_change_does_not_notify(catalog):
              seen = []
              catalog.subscribe(seen.append)
              with pytest.raises(DuplicateName):
                  catalog.add("api", "platform", 8080)
              with pytest.raises(StillReferenced):
                  catalog.remove("api")
              assert seen == []


          def test_from_records_checks_links():
              base = service("api", "platform", 8080)
              built = Catalog.from_records([alias("api-v1", base), base])
              assert len(built) == 1
              assert built.alias_names == {"api-v1"}
              with pytest.raises(DuplicateName):
                  Catalog.from_records([base, base])
              with pytest.raises(InvalidRecord, match="alias target"):
                  Catalog.from_records([alias("api-v1", base)])
              with pytest.raises(InvalidRecord, match="alias target"):
                  Catalog.from_records([base, alias("api-v1", base), alias("api-v2", alias("api-v1", base))])


          def test_remove_many_removes_every_named_service_and_alias(catalog):
              catalog.remove_many(["search", "billing-old"])
              assert catalog.names() == ["api", "api-v1", "billing"]
              assert len(catalog) == 2


          def test_remove_many_notifies_once(catalog):
              seen = []
              catalog.subscribe(seen.append)
              catalog.remove_many(["search", "billing", "billing-old", "billing"], cascade=True)
              assert len(seen) == 1
              assert catalog.names() == ["api", "api-v1"]


          def test_remove_many_with_a_service_and_its_aliases_needs_no_cascade(catalog):
              catalog.remove_many(["billing", "billing-old"])
              assert catalog.names() == ["api", "api-v1", "search"]
              assert len(catalog) == 2


          def test_remove_many_cascades_to_aliases_that_were_not_named(catalog):
              catalog.remove_many(["api", "billing"], cascade=True)
              assert catalog.names() == ["search"]
              assert len(catalog) == 1


          def test_remove_many_is_all_or_nothing(catalog):
              with pytest.raises(StillReferenced, match="billing is still referenced by: billing-old"):
                  catalog.remove_many(["search", "billing"])
              with pytest.raises(UnknownService):
                  catalog.remove_many(["search", "ghost"])
              assert len(catalog.names()) == 5


          def test_remove_many_of_nothing_is_not_a_change(catalog):
              seen = []
              catalog.subscribe(seen.append)
              catalog.remove_many([])
