          import pytest

          from svccatalog import store
          from svccatalog.errors import InvalidRecord
          from svccatalog.records import alias, service
          from svccatalog.sync import sync_to


          def release():
              api = service("api", "platform", 8080)
              search = service("search", "discovery", 8082)
              worker = service("worker", "platform", 9000)
              return [api, search, worker, alias("api-v1", api)]


          def test_sync_removes_what_is_gone_and_adds_what_is_new(catalog):
              result = sync_to(catalog, release())
              assert catalog.names() == ["api", "api-v1", "search", "worker"]
              assert sorted(result.removed) == ["billing", "billing-old"]
              assert result.added == ["worker"]
              assert result.changed


          def test_sync_adds_aliases_after_their_services():
              from svccatalog.catalog import Catalog

              catalog = Catalog()
              result = sync_to(catalog, [alias("api-v1", service("api", "platform", 8080)), service("api", "platform", 8080)])
              assert catalog.names() == ["api", "api-v1"]
              assert result.added == ["api", "api-v1"]
              assert len(catalog) == 1


          def test_sync_leaves_matching_records_alone(catalog):
              before = catalog.records()
              result = sync_to(catalog, catalog.records())
              assert catalog.records() == before
              assert not result.changed


          def test_sync_rejects_an_alias_without_its_service(catalog):
              with pytest.raises(InvalidRecord, match="alias target must be a service in the release"):
                  sync_to(catalog, [alias("api-v1", service("api", "platform", 8080))])
              assert len(catalog) == 3


          def test_sync_removes_a_service_together_with_its_aliases(catalog):
              sync_to(catalog, [service("api", "platform", 8080), alias("api-v1", service("api", "platform", 8080))])
              assert catalog.names() == ["api", "api-v1"]
              assert len(catalog) == 1


          def test_sync_snapshots_stay_loadable(catalog, snapshot):
              store.autosave(catalog, snapshot)
              sync_to(catalog, release())
              assert store.load(snapshot).names() == ["api", "api-v1", "search", "worker"]


          def test_sync_removes_in_one_change(catalog):
              seen = []
              catalog.subscribe(seen.append)
              sync_to(catalog, [service("search", "discovery", 8082)])
              assert catalog.names() == ["search"]
              assert len(seen) == 1


          def test_sync_with_nothing_to_remove_notifies_only_for_additions(catalog):
              seen = []
              catalog.subscribe(seen.append)
              sync_to(catalog, [*catalog.records(), service("worker", "platform", 9000)])
              assert len(seen) == 1
