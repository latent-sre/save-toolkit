          """The `svccatalog` command line.

          Each invocation loads the snapshot, runs one command and, for a command that changes the catalog,
          writes the snapshot back through `store.autosave`. A missing snapshot file is an empty catalog.
          """

          import argparse
          import os
          import sys
          from pathlib import Path

          from . import report, resolver, store
          from .catalog import Catalog
          from .errors import CatalogError

          DEFAULT_SNAPSHOT = "catalog.json"


          def build_parser():
              parser = argparse.ArgumentParser(prog="svccatalog", description="Inspect and edit the service catalog.")
              parser.add_argument(
                  "--snapshot",
                  default=os.environ.get("SVCCATALOG_SNAPSHOT", DEFAULT_SNAPSHOT),
                  help="snapshot file (default: $SVCCATALOG_SNAPSHOT or %(default)s)",
              )
              commands = parser.add_subparsers(dest="command", required=True)

              add = commands.add_parser("add", help="add a service")
              add.add_argument("name")
              add.add_argument("--owner", required=True)
              add.add_argument("--port", required=True, type=int)

              alias = commands.add_parser("alias", help="add another name for a service")
              alias.add_argument("name")
              alias.add_argument("target")

              remove = commands.add_parser("remove", help="remove a service or an alias")
              remove.add_argument("name")
              remove.add_argument("--cascade", action="store_true", help="also remove the aliases of a service")

              rename = commands.add_parser("rename", help="rename a service or an alias")
              rename.add_argument("old")
              rename.add_argument("new")

              reset = commands.add_parser("reset-alias", help="stop treating an alias as an alias")
              reset.add_argument("name")
              reset.add_argument("--drop", action="store_true", help="delete the name instead of keeping it as a service")

              commands.add_parser("list", help="list every name")
              commands.add_parser("report", help="print the capacity summary")

              resolve = commands.add_parser("resolve", help="print the endpoint a name resolves to")
              resolve.add_argument("name")
              return parser


          def _load(path):
              path = Path(path)
              return store.load(path) if path.exists() else Catalog()


          def _run(args, catalog, out):
              if args.command == "add":
                  record = catalog.add(args.name, args.owner, args.port)
                  print(f"added {record.name} on port {record.port}", file=out)
              elif args.command == "alias":
                  record = catalog.add_alias(args.name, args.target)
                  print(f"added {record.name} as an alias of {record.target}", file=out)
              elif args.command == "remove":
                  catalog.remove(args.name, cascade=args.cascade)
                  print(f"removed {args.name}", file=out)
              elif args.command == "rename":
                  catalog.rename(args.old, args.new)
                  print(f"renamed {args.old} to {args.new}", file=out)
              elif args.command == "reset-alias":
                  catalog.reset_alias(args.name, drop=args.drop)
                  print(f"dropped alias {args.name}" if args.drop else f"{args.name} is now a service", file=out)
              elif args.command == "list":
                  for record in catalog.records():
                      suffix = f" -> {record.target}" if record.is_alias else ""
                      print(f"{record.name}{suffix}", file=out)
              elif args.command == "report":
                  out.write(report.render(catalog))
              elif args.command == "resolve":
                  print(resolver.endpoint(catalog, args.name), file=out)


          def main(argv=None, out=None):
              """Run one command and return the process exit status: 0, or 2 when the command fails."""
              out = out if out is not None else sys.stdout
              args = build_parser().parse_args(argv)
              try:
                  catalog = _load(args.snapshot)
                  store.autosave(catalog, args.snapshot)
                  _run(args, catalog, out)
              except CatalogError as exc:
                  print(f"error: {exc}", file=sys.stderr)
                  return 2
              return 0
