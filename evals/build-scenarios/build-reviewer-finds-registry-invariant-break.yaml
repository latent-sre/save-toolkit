      """Naming rules and record checks.

      These run before a record enters a catalog, whether it comes from a caller or from a snapshot.
      """

      import re

      from .errors import InvalidName, InvalidRecord
      from .records import ALIAS, KINDS, SERVICE

      NAME_PATTERN = re.compile(r"[a-z][a-z0-9]*(?:-[a-z0-9]+)*")
      MAX_NAME_LENGTH = 63
      RESERVED_NAMES = frozenset({"all", "default", "none"})
      MIN_PORT = 1
      MAX_PORT = 65535


      def check_name(name):
          """Return `name` when it follows the naming rules, otherwise raise `InvalidName`."""
          if not isinstance(name, str) or not name:
              raise InvalidName("a name must be a non-empty string")
          if len(name) > MAX_NAME_LENGTH:
              raise InvalidName(f"{name[:12]}... is longer than {MAX_NAME_LENGTH} characters")
          if NAME_PATTERN.fullmatch(name) is None:
              raise InvalidName(f"{name!r} must be lowercase words of letters and digits joined by hyphens")
          if name in RESERVED_NAMES:
              raise InvalidName(f"{name} is reserved")
          return name


      def check_port(port):
          """Return `port` when it can be listened on, otherwise raise `InvalidRecord`."""
          if isinstance(port, bool) or not isinstance(port, int) or not MIN_PORT <= port <= MAX_PORT:
              raise InvalidRecord(f"port must be an integer from {MIN_PORT} to {MAX_PORT}, not {port!r}")
          return port


      def check_record(record):
          """Raise unless `record` is a well-formed service or alias on its own.

          Whether an alias points at a real service is a question for the catalog, which sees the
          other records.
          """
          check_name(record.name)
          if record.kind not in KINDS:
              raise InvalidRecord(f"{record.name}: kind must be one of {', '.join(KINDS)}")
          if record.kind == SERVICE:
              if record.target is not None:
                  raise InvalidRecord(f"{record.name}: a service has no target")
              if not record.owner:
                  raise InvalidRecord(f"{record.name}: a service needs an owner")
          if record.kind == ALIAS:
              if record.target is None:
                  raise InvalidRecord(f"{record.name}: an alias needs a target")
              if record.target == record.name:
                  raise InvalidRecord(f"{record.name}: an alias cannot point at itself")
          check_port(record.port)
          return record
