          def test_reset_alias_keeps_the_name_as_a_service(catalog):
              catalog.reset_alias("billing-old")
              record = catalog.get("billing-old")
              assert (record.kind, record.target, record.owner, record.port) == ("service", None, "payments", 8081)
              assert catalog.names() == ["api", "api-v1", "billing", "billing-old", "search"]
              assert catalog.alias_names == {"api-v1"}
              assert len(catalog) == 4
              assert [r.name for r in catalog] == ["api", "billing", "billing-old", "search"]


          def test_reset_alias_with_drop_removes_the_name(catalog):
              catalog.reset_alias("billing-old", drop=True)
              assert "billing-old" not in catalog
              assert catalog.names() == ["api", "api-v1", "billing", "search"]
              assert catalog.get("billing").owner == "payments"
              with pytest.raises(UnknownService):
                  catalog.get("billing-old")


          def test_reset_alias_rejects_services_and_unknown_names(catalog):
              with pytest.raises(NotAnAlias, match="api is not an alias"):
                  catalog.reset_alias("api")
              with pytest.raises(UnknownService):
                  catalog.reset_alias("ghost")
              assert len(catalog) == 3


          def test_reset_alias_notifies_once_per_call(catalog):
              seen = []
              catalog.subscribe(seen.append)
              catalog.reset_alias("api-v1")
