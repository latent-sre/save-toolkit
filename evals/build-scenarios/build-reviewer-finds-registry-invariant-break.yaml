      """The `svccatalog` command line.

      Each invocation loads the snapshot, runs one command and, for a command that changes the catalog,
      writes the snapshot back through `store.autosave`. A missing snapshot file is an empty catalog.
      """

      import argparse
      import os
      import sys
      from pathlib import Path

      from . import report, resolver, store
      from .catalog import Catalog
      from .errors import CatalogError

      DEFAULT_SNAPSHOT = "catalog.json"


      def build_parser():
          parser = argparse.ArgumentParser(prog="svccatalog", description="Inspect and edit the service catalog.")
          parser.add_argument(
              "--snapshot",
              default=os.environ.get("SVCCATALOG_SNAPSHOT", DEFAULT_SNAPSHOT),
              help="snapshot file (default: $SVCCATALOG_SNAPSHOT or %(default)s)",
          )
          commands = parser.add_subparsers(dest="command", required=True)

          add = commands.add_parser("add", help="add a service")
          add.add_argument("name")
          add.add_argument("--owner", required=True)
          add.add_argument("--port", required=True, type=int)

          alias = commands.add_parser("alias", help="add another name for a service")
          alias.add_argument("name")
          alias.add_argument("target")

          remove = commands.add_parser("remove", help="remove a service or an alias")
          remove.add_argument("name")
          remove.add_argument("--cascade", action="store_true", help="also remove the aliases of a service")

          rename = commands.add_parser("rename", help="rename a service or an alias")
          rename.add_argument("old")
          rename.add_argument("new")

          commands.add_parser("list", help="list every name")
          commands.add_parser("report", help="print the capacity summary")

          resolve = commands.add_parser("resolve", help="print the endpoint a name resolves to")
          resolve.add_argument("name")
          return parser


      def _load(path):
          path = Path(path)
          return store.load(path) if path.exists() else Catalog()


      def _run(args, catalog, out):
          if args.command == "add":
              record = catalog.add(args.name, args.owner, args.port)
              print(f"added {record.name} on port {record.port}", file=out)
          elif args.command == "alias":
              record = catalog.add_alias(args.name, args.target)
              print(f"added {record.name} as an alias of {record.target}", file=out)
          elif args.command == "remove":
              catalog.remove(args.name, cascade=args.cascade)
              print(f"removed {args.name}", file=out)
          elif args.command == "rename":
              catalog.rename(args.old, args.new)
              print(f"renamed {args.old} to {args.new}", file=out)
          elif args.command == "list":
              for record in catalog.records():
                  suffix = f" -> {record.target}" if record.is_alias else ""
                  print(f"{record.name}{suffix}", file=out)
          elif args.command == "report":
              out.write(report.render(catalog))
          elif args.command == "resolve":
              print(resolver.endpoint(catalog, args.name), file=out)


      def main(argv=None, out=None):
          """Run one command and return the process exit status: 0, or 2 when the command fails."""
          out = out if out is not None else sys.stdout
          args = build_parser().parse_args(argv)
          try:
              catalog = _load(args.snapshot)
              store.autosave(catalog, args.snapshot)
              _run(args, catalog, out)
          except CatalogError as exc:
              print(f"error: {exc}", file=sys.stderr)
              return 2
          return 0
    svccatalog/errors.py: |
      """Exceptions raised by svccatalog.

      Every error the package raises on purpose derives from `CatalogError`, so a caller that only wants
      to report a failure can catch that one class.
      """


      class CatalogError(Exception):
          """Base class for every error this package raises on purpose."""


      class InvalidName(CatalogError):
          """A service or alias name does not follow the naming rules."""


      class InvalidRecord(CatalogError):
          """A record is malformed or contradicts the rest of the catalog."""


      class DuplicateName(CatalogError):
          """The name is already taken by a service or an alias."""

          def __init__(self, name):
              super().__init__(f"{name} already exists")
              self.name = name


      class UnknownService(CatalogError):
          """The name is not in the catalog."""

          def __init__(self, name):
              super().__init__(f"{name} is not in the catalog")
              self.name = name


      class NotAnAlias(CatalogError):
          """The operation needs an alias and the name belongs to a service."""

          def __init__(self, name):
              super().__init__(f"{name} is not an alias")
              self.name = name


      class StillReferenced(CatalogError):
          """A service cannot be removed while aliases still point at it."""

          def __init__(self, name, aliases):
              super().__init__(f"{name} is still referenced by: {', '.join(sorted(aliases))}")
              self.name = name
              self.aliases = sorted(aliases)


      class AliasCycle(CatalogError):
          """Following an alias never reached a service."""


      class CorruptSnapshot(CatalogError):
          """A snapshot file cannot be turned back into a catalog."""
    svccatalog/records.py: |
      """Record types held by the catalog.

      A `Record` is immutable. Changing a service means replacing its record, which keeps every
      snapshot a plain list of values.
      """

      from dataclasses import dataclass

      from .errors import InvalidRecord

      SERVICE = "service"
      ALIAS = "alias"
      KINDS = (SERVICE, ALIAS)


      @dataclass(frozen=True)
      class Record:
          """One name in the catalog.

          A service carries the owning team and the port it listens on. An alias is another name for a
          service: `target` names that service, and the owner and port are copies taken when the alias
          was created, so a listing can show them without a lookup.
          """

          name: str
          kind: str = SERVICE
          owner: str = ""
          port: int = 0
          target: str | None = None

          @property
          def is_alias(self):
              return self.kind == ALIAS

          def to_dict(self):
              """The JSON-ready form written to snapshots."""
              return {
                  "name": self.name,
                  "kind": self.kind,
                  "owner": self.owner,
                  "port": self.port,
                  "target": self.target,
              }

          @classmethod
          def from_dict(cls, data):
              """Rebuild a record from `to_dict` output; anything else raises `InvalidRecord`."""
              if not isinstance(data, dict):
                  raise InvalidRecord(f"a record must be an object, not {type(data).__name__}")
              unknown = set(data) - {"name", "kind", "owner", "port", "target"}
              if unknown:
                  raise InvalidRecord(f"unknown record fields: {', '.join(sorted(unknown))}")
              try:
                  return cls(
                      name=data["name"],
                      kind=data.get("kind", SERVICE),
                      owner=data.get("owner", ""),
                      port=data.get("port", 0),
                      target=data.get("target"),
                  )
              except KeyError as exc:
                  raise InvalidRecord(f"record is missing {exc.args[0]}") from None


      def service(name, owner, port):
          """A service record."""
          return Record(name, SERVICE, owner, port)


      def alias(name, of):
          """An alias record for the service record `of`, copying its owner and port."""
          return Record(name, ALIAS, of.owner, of.port, of.name)
    svccatalog/report.py: |
      """Text reports over a catalog.

      `summary` is the one-line capacity figure the agents print at boot; `render` is the table behind
      `svccatalog report`.
      """

      from .resolver import owners


      def summary(catalog) -> str:
          """One line: how many services, how many extra names, how many owning teams."""
          extra = sum(1 for record in catalog.records() if record.is_alias)
          return f"{len(catalog)} services, {extra} aliases, {len(owners(catalog))} owners"


      def render(catalog) -> str:
          """A capacity summary followed by one row per service with its aliases."""
          lines = [f"Capacity summary: {summary(catalog)}"]
          ports = sorted(record.port for record in catalog)
          if ports:
              lines.append(f"Ports in use: {ports[0]}-{ports[-1]}")
          width = max((len(record.name) for record in catalog), default=4)
          lines.append(f"{'NAME':<{width}}  {'OWNER':<12}  {'PORT':>5}  ALIASES")
          for record in catalog:
              names = ", ".join(catalog.aliases_of(record.name)) or "-"
              lines.append(f"{record.name:<{width}}  {record.owner:<12}  {record.port:>5}  {names}")
          return "\n".join(lines) + "\n"
    svccatalog/resolver.py: |
      """Follow aliases to the services they name.

      The catalog refuses aliases of aliases, so a lookup is one hop. The resolver still bounds the
      walk, because it is also pointed at records that were built by hand in tests and tools.
      """

      from .errors import AliasCycle, NotAnAlias
      from .records import Record

      MAX_HOPS = 8


      def resolve(catalog, name) -> Record:
          """The service that `name` stands for: `name` itself, or what its alias points at."""
          record = catalog.get(name)
          hops = 0
          while record.is_alias:
              hops += 1
              if hops > MAX_HOPS:
                  raise AliasCycle(f"{name} does not reach a service within {MAX_HOPS} hops")
              record = catalog.get(record.target)
          return record


      def target_of(catalog, name) -> str:
          """The service an alias points at; `NotAnAlias` for a service."""
          record = catalog.get(name)
          if not record.is_alias:
              raise NotAnAlias(name)
          return record.target


      def endpoint(catalog, name, host="localhost") -> str:
          """`host:port` for the service `name` resolves to."""
          return f"{host}:{resolve(catalog, name).port}"


      def owners(catalog) -> dict[str, list[str]]:
          """Service names grouped by owning team; aliases never appear."""
          grouped: dict[str, list[str]] = {}
          for record in catalog:
              grouped.setdefault(record.owner, []).append(record.name)
          return grouped
    svccatalog/store.py: |
      """Snapshots: the catalog as a JSON file that survives a restart.

      A snapshot holds the records and, beside them, the list of alias names. `load` checks that every
      listed alias is one of the records before it builds a catalog, and raises `CorruptSnapshot` when
      it is not, so a half-written or hand-edited file never becomes a running catalog.
      """

      import json
      import os
      from pathlib import Path

      from .catalog import Catalog
      from .errors import CatalogError, CorruptSnapshot
      from .records import Record

      SNAPSHOT_VERSION = 1


      def to_document(catalog) -> dict:
          """The JSON-ready form of a catalog."""
          return {
              "version": SNAPSHOT_VERSION,
              "records": [record.to_dict() for record in catalog.records()],
              "aliases": sorted(catalog.alias_names),
          }


      def save(catalog, path):
          """Write the snapshot to `path`, replacing the previous one in a single step."""
          path = Path(path)
          temp = path.with_name(path.name + ".tmp")
          temp.write_text(json.dumps(to_document(catalog), indent=2) + "\n", encoding="utf-8")
          os.replace(temp, path)


      def load(path) -> Catalog:
          """Read a snapshot back into a catalog; anything unusable raises `CorruptSnapshot`."""
          path = Path(path)
          try:
              document = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              raise CorruptSnapshot(f"{path}: cannot read snapshot: {exc}") from exc
          if not isinstance(document, dict) or document.get("version") != SNAPSHOT_VERSION:
              raise CorruptSnapshot(f"{path}: not a version {SNAPSHOT_VERSION} snapshot")
          try:
              records = [Record.from_dict(item) for item in document.get("records", [])]
          except CatalogError as exc:
              raise CorruptSnapshot(f"{path}: {exc}") from exc
          known = {record.name for record in records}
          missing = sorted(set(document.get("aliases", [])) - known)
          if missing:
              raise CorruptSnapshot(f"{path}: alias names missing from the records: {', '.join(missing)}")
          try:
              return Catalog.from_records(records)
          except CatalogError as exc:
              raise CorruptSnapshot(f"{path}: {exc}") from exc


      def autosave(catalog, path):
          """Write a snapshot to `path` after every change to `catalog`."""
          catalog.subscribe(lambda changed: save(changed, path))
