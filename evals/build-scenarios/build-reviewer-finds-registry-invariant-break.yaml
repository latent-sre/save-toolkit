      import pytest

      from svccatalog import store
      from svccatalog.errors import InvalidRecord
      from svccatalog.records import alias, service
      from svccatalog.sync import sync_to


      def release():
          api = service("api", "platform", 8080)
          search = service("search", "discovery", 8082)
          worker = service("worker", "platform", 9000)
          return [api, search, worker, alias("api-v1", api)]


      def test_sync_removes_what_is_gone_and_adds_what_is_new(catalog):
          result = sync_to(catalog, release())
          assert catalog.names() == ["api", "api-v1", "search", "worker"]
          assert sorted(result.removed) == ["billing", "billing-old"]
          assert result.added == ["worker"]
          assert result.changed


      def test_sync_adds_aliases_after_their_services():
          from svccatalog.catalog import Catalog

          catalog = Catalog()
          result = sync_to(catalog, [alias("api-v1", service("api", "platform", 8080)), service("api", "platform", 8080)])
          assert catalog.names() == ["api", "api-v1"]
          assert result.added == ["api", "api-v1"]
          assert len(catalog) == 1


      def test_sync_leaves_matching_records_alone(catalog):
          before = catalog.records()
          result = sync_to(catalog, catalog.records())
          assert catalog.records() == before
          assert not result.changed


      def test_sync_rejects_an_alias_without_its_service(catalog):
          with pytest.raises(InvalidRecord, match="alias target must be a service in the release"):
              sync_to(catalog, [alias("api-v1", service("api", "platform", 8080))])
          assert len(catalog) == 3


      def test_sync_removes_a_service_together_with_its_aliases(catalog):
          sync_to(catalog, [service("api", "platform", 8080), alias("api-v1", service("api", "platform", 8080))])
          assert catalog.names() == ["api", "api-v1"]
          assert len(catalog) == 1


      def test_sync_snapshots_stay_loadable(catalog, snapshot):
          store.autosave(catalog, snapshot)
          sync_to(catalog, release())
          assert store.load(snapshot).names() == ["api", "api-v1", "search", "worker"]
  branches:
    refactor/alias-reset:
      message: |
        Extract _forget and add Catalog.reset_alias; remove names in batches

        Name removal lived inline in Catalog.remove, and sync_to called it once per removed name, so a
        release that retired N services wrote N snapshots. Move the record-table deletion into _forget,
        add remove_many (one change notification for the whole batch, same StillReferenced and cascade
        rules as remove) and make sync_to use it.

        Add reset_alias(name, drop=False) for an alias that has outlived its purpose. By default the name
        stays in the catalog as an ordinary service record with the owner and port the alias carried;
        with drop=True the name is deleted. It is exposed as `svccatalog reset-alias NAME [--drop]`.

        README documents both methods. Tests cover both reset paths, remove_many (batching, cascade,
        all-or-nothing) and the new CLI command. remove, lookups, snapshots and reports are unchanged.
      files:
        README.md: |
          # svccatalog

          The catalog of deployable services. The agent on every node loads a snapshot of it at start, and
          the deploy tooling edits it through the command line or the `Catalog` class. Standard library
          only; run the tests with `python -m pytest -q`.

          ## Concepts

          - A **service** has a name, an owning team and a port.
          - An **alias** is another name for a service. It points at the service (its `target`), carries a
            copy of the service's owner and port, and can be removed without touching the service.
          - Names are lowercase words of letters and digits joined by hyphens, at most 63 characters.
            `all`, `default` and `none` are reserved.

          ## Contracts

          - `len(catalog)` is the number of real services; aliases are not counted.
          - Iterating a catalog yields the real services in name order. `names()` and `records()` also
            list aliases.
          - An alias points at a service, never at another alias.
          - Removing a service that aliases still point at fails with `StillReferenced`, unless
            `cascade=True` is passed, which removes those aliases too.
          - `reset_alias(name, drop=False)` stops treating an alias as an alias. The name stays as a
            service with the owner and port the alias carried; with `drop=True` the name is removed.
          - `remove_many(names, cascade=False)` removes several names as one change, with the same rules as
            `remove`.
          - Snapshots are written on every catalog change, through `store.autosave`. The command line and
            the node agent both attach it, so a snapshot on disk is never older than the last change.
          - Loading a snapshot checks it first. A snapshot that cannot be loaded raises `CorruptSnapshot`.
          - A node that cannot load its snapshot exits and stays out of rotation until an operator repairs
            the snapshot.

          ## Command line

          ```
          python -m svccatalog [--snapshot FILE] add NAME --owner TEAM --port PORT
          python -m svccatalog [--snapshot FILE] alias NAME TARGET
          python -m svccatalog [--snapshot FILE] remove NAME [--cascade]
          python -m svccatalog [--snapshot FILE] rename OLD NEW
          python -m svccatalog [--snapshot FILE] reset-alias NAME [--drop]
          python -m svccatalog [--snapshot FILE] list
          python -m svccatalog [--snapshot FILE] report
          python -m svccatalog [--snapshot FILE] resolve NAME
          ```

          The snapshot file defaults to `$SVCCATALOG_SNAPSHOT`, then `catalog.json`. A missing file is an
          empty catalog. A failing command prints `error: ...` and exits with status 2.

          ## Node agent

          `python -m svccatalog.agent.startup` is what the node's service manager runs. It reads
          `$SVCCATALOG_SNAPSHOT` (default `/var/lib/svccatalog/catalog.json`), prints the capacity summary
          and exits 0. When the snapshot cannot be loaded it prints the reason and exits 3.

          ## Layout

          | Module | Role |
          |---|---|
          | `catalog.py` | The `Catalog` class |
          | `records.py` | `Record` and its constructors |
          | `validation.py` | Naming rules and record checks |
          | `resolver.py` | Follow an alias to its service |
          | `report.py` | Capacity summary and table |
          | `store.py` | Snapshot save, load and autosave |
          | `sync.py` | Match the catalog to a release's list of names |
          | `cli.py` | The command line |
          | `agent/startup.py` | Node agent boot |
