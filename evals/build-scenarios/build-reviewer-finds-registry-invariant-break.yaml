          """The in-memory service catalog.

          A catalog holds services and the aliases that point at them. Every mutating method ends with a
          change notification, which is how a store keeps its snapshot current (see `store.autosave`).
          """

          from collections.abc import Callable, Iterable, Iterator
          from dataclasses import replace

          from .errors import DuplicateName, InvalidRecord, NotAnAlias, StillReferenced, UnknownService
          from .records import ALIAS, SERVICE, Record, alias, service
          from .validation import check_name, check_port, check_record

          Listener = Callable[["Catalog"], None]


          class Catalog:
              """Services and their aliases, keyed by name.

              `len(catalog)` is the number of real services; aliases are not counted. Iterating a catalog
              yields the real services in name order. `names()` and `records()` cover aliases as well.
              """

              def __init__(self):
                  self._records: dict[str, Record] = {}
                  # Names in _records that are aliases, kept beside the table so len() stays constant time.
                  self._alias_names: set[str] = set()
                  self._listeners: list[Listener] = []

              @classmethod
              def from_records(cls, records: Iterable[Record]):
                  """Build a catalog from records, checking each one and the links between them."""
                  catalog = cls()
                  for record in records:
                      check_record(record)
                      if record.name in catalog._records:
                          raise DuplicateName(record.name)
                      catalog._records[record.name] = record
                      if record.is_alias:
                          catalog._alias_names.add(record.name)
                  for name in sorted(catalog._alias_names):
                      target = catalog._records.get(catalog._records[name].target)
                      if target is None or target.is_alias:
                          raise InvalidRecord(f"{name}: alias target must be a service in the catalog")
                  return catalog

              # -- reading ---------------------------------------------------------------------------

              def __len__(self):
                  return len(self._records) - len(self._alias_names)

              def __iter__(self) -> Iterator[Record]:
                  services = (record for record in self._records.values() if not record.is_alias)
                  return iter(sorted(services, key=lambda record: record.name))

              def __contains__(self, name):
                  return name in self._records

              def get(self, name) -> Record:
                  """The record for `name`, which may be an alias; `UnknownService` when absent."""
                  return self._require(name)

              def names(self) -> list[str]:
                  """Every name, services and aliases, in order."""
                  return sorted(self._records)

              def records(self) -> list[Record]:
                  """Every record, services and aliases, in name order."""
                  return [self._records[name] for name in self.names()]

              @property
              def alias_names(self) -> frozenset[str]:
                  """The names that are aliases."""
                  return frozenset(self._alias_names)

              def aliases_of(self, name) -> list[str]:
                  """The aliases that point at the service `name`, in order."""
                  return sorted(n for n, record in self._records.items() if record.target == name)

              # -- changing --------------------------------------------------------------------------

              def add(self, name, owner, port) -> Record:
                  """Add a service."""
                  check_name(name)
                  check_port(port)
                  if name in self._records:
                      raise DuplicateName(name)
                  record = service(name, owner, port)
                  check_record(record)
                  self._records[name] = record
                  self._changed()
                  return record

              def add_alias(self, name, target) -> Record:
                  """Add `name` as another name for the service `target`."""
                  check_name(name)
                  if name in self._records:
                      raise DuplicateName(name)
                  base = self._require(target)
                  if base.is_alias:
                      raise InvalidRecord(f"{target} is an alias; point at the service it names")
                  record = alias(name, base)
                  check_record(record)
                  self._records[name] = record
                  self._alias_names.add(name)
                  self._changed()
                  return record

              def remove(self, name, *, cascade=False):
                  """Remove a service or an alias.

                  A service that aliases still point at raises `StillReferenced`, unless `cascade` is true,
                  which removes those aliases with it.
                  """
                  self.remove_many([name], cascade=cascade)

              def remove_many(self, names, *, cascade=False):
                  """Remove several services or aliases as one change, with a single notification.

                  The rules of `remove` apply to each name; an alias that is removed together with its
                  service does not count as a reference.
                  """
                  requested = list(dict.fromkeys(names))
                  if not requested:
                      return
                  for name in requested:
                      self._require(name)
                  doomed = set(requested)
                  for name in requested:
                      blockers = [n for n in self.aliases_of(name) if n not in doomed]
                      if blockers and not cascade:
                          raise StillReferenced(name, blockers)
                      doomed.update(blockers)
                  self._forget(name for name in self._records if name in doomed)
                  self._alias_names -= doomed
                  self._changed()

              def reset_alias(self, name, drop=False):
                  """Stop treating `name` as an alias of its service.

                  By default the name stays in the catalog as a service in its own right, with the owner
                  and port its alias carried. With `drop=True` the name is removed instead.
                  """
                  record = self._require(name)
                  if not record.is_alias:
                      raise NotAnAlias(name)
                  if drop:
                      self._forget([name])
                  else:
                      self._records[name] = replace(record, kind=SERVICE, target=None)
                      self._alias_names.discard(name)
                  self._changed()

              def rename(self, old, new):
                  """Give a service or alias a new name; aliases that point at it follow."""
                  record = self._require(old)
                  check_name(new)
                  if new in self._records:
                      raise DuplicateName(new)
                  for dependent in self.aliases_of(old):
                      self._records[dependent] = Record(
                          dependent, ALIAS, record.owner, record.port, new
                      )
                  del self._records[old]
                  self._records[new] = Record(new, record.kind, record.owner, record.port, record.target)
                  if record.is_alias:
                      self._alias_names.discard(old)
                      self._alias_names.add(new)
                  self._changed()

              def set_owner(self, name, owner):
                  """Change the owning team of a service; its aliases show the new owner too."""
                  record = self._require(name)
                  if record.is_alias:
                      raise InvalidRecord(f"{name} is an alias; change the owner of {record.target}")
                  if not owner:
                      raise InvalidRecord(f"{name}: a service needs an owner")
                  self._records[name] = Record(name, SERVICE, owner, record.port)
                  for dependent in self.aliases_of(name):
                      self._records[dependent] = Record(dependent, ALIAS, owner, record.port, name)
                  self._changed()

              # -- notification ----------------------------------------------------------------------

              def subscribe(self, listener: Listener):
                  """Call `listener(catalog)` after every change."""
                  self._listeners.append(listener)

              def _changed(self):
                  for listener in list(self._listeners):
                      listener(self)

              def _forget(self, names):
                  """Delete `names` from the record table."""
                  names = list(names)
                  for name in names:
                      del self._records[name]

              def _require(self, name) -> Record:
                  try:
                      return self._records[name]
                  except KeyError:
                      raise UnknownService(name) from None
