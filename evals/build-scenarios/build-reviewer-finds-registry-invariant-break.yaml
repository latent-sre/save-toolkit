          """Bring a catalog in line with a desired list of records.

          Used by the deploy tooling after a release: the release lists the names that should exist, and
          `sync_to` removes what is gone and adds what is new.
          """

          from dataclasses import dataclass, field

          from .errors import InvalidRecord
          from .validation import check_record


          @dataclass
          class SyncResult:
              added: list[str] = field(default_factory=list)
              removed: list[str] = field(default_factory=list)

              @property
              def changed(self):
                  return bool(self.added or self.removed)


          def sync_to(catalog, desired) -> SyncResult:
              """Make the catalog's names match `desired`; records already present are left as they are.

              An alias in `desired` must point at a service that is also in `desired`. Everything that is
              removed goes in one change, so a snapshot is written once rather than once per name.
              """
              wanted = {}
              for record in desired:
                  check_record(record)
                  wanted[record.name] = record
              for record in wanted.values():
                  if record.is_alias and (record.target not in wanted or wanted[record.target].is_alias):
                      raise InvalidRecord(f"{record.name}: alias target must be a service in the release")

              result = SyncResult()
              result.removed = [name for name in catalog.names() if name not in wanted]
              catalog.remove_many(result.removed, cascade=True)
              for record in wanted.values():
                  if record.name not in catalog and not record.is_alias:
                      catalog.add(record.name, record.owner, record.port)
                      result.added.append(record.name)
              for record in wanted.values():
                  if record.name not in catalog and record.is_alias:
                      catalog.add_alias(record.name, record.target)
                      result.added.append(record.name)
              return result
