    README.md: |
      # svccatalog

      The catalog of deployable services. The agent on every node loads a snapshot of it at start, and
      the deploy tooling edits it through the command line or the `Catalog` class. Standard library
      only; run the tests with `python -m pytest -q`.

      ## Concepts

      - A **service** has a name, an owning team and a port.
      - An **alias** is another name for a service. It points at the service (its `target`), carries a
        copy of the service's owner and port, and can be removed without touching the service.
      - Names are lowercase words of letters and digits joined by hyphens, at most 63 characters.
        `all`, `default` and `none` are reserved.

      ## Contracts

      - `len(catalog)` is the number of real services; aliases are not counted.
      - Iterating a catalog yields the real services in name order. `names()` and `records()` also
        list aliases.
      - An alias points at a service, never at another alias.
      - Removing a service that aliases still point at fails with `StillReferenced`, unless
        `cascade=True` is passed, which removes those aliases too.
      - Snapshots are written on every catalog change, through `store.autosave`. The command line and
        the node agent both attach it, so a snapshot on disk is never older than the last change.
      - Loading a snapshot checks it first. A snapshot that cannot be loaded raises `CorruptSnapshot`.
      - A node that cannot load its snapshot exits and stays out of rotation until an operator repairs
        the snapshot.

      ## Command line

      ```
      python -m svccatalog [--snapshot FILE] add NAME --owner TEAM --port PORT
      python -m svccatalog [--snapshot FILE] alias NAME TARGET
      python -m svccatalog [--snapshot FILE] remove NAME [--cascade]
      python -m svccatalog [--snapshot FILE] rename OLD NEW
      python -m svccatalog [--snapshot FILE] list
      python -m svccatalog [--snapshot FILE] report
      python -m svccatalog [--snapshot FILE] resolve NAME
      ```

      The snapshot file defaults to `$SVCCATALOG_SNAPSHOT`, then `catalog.json`. A missing file is an
      empty catalog. A failing command prints `error: ...` and exits with status 2.

      ## Node agent

      `python -m svccatalog.agent.startup` is what the node's service manager runs. It reads
      `$SVCCATALOG_SNAPSHOT` (default `/var/lib/svccatalog/catalog.json`), prints the capacity summary
      and exits 0. When the snapshot cannot be loaded it prints the reason and exits 3.

      ## Layout

      | Module | Role |
      |---|---|
      | `catalog.py` | The `Catalog` class |
      | `records.py` | `Record` and its constructors |
      | `validation.py` | Naming rules and record checks |
      | `resolver.py` | Follow an alias to its service |
      | `report.py` | Capacity summary and table |
      | `store.py` | Snapshot save, load and autosave |
      | `sync.py` | Match the catalog to a release's list of names |
      | `cli.py` | The command line |
      | `agent/startup.py` | Node agent boot |
