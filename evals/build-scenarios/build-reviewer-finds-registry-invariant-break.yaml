      """Boot sequence of the node agent.

      The agent loads the catalog snapshot once at start, keeps it current with `store.autosave`, and
      reports the capacity summary. When the snapshot cannot be loaded the agent exits with
      `EXIT_CORRUPT` and the node stays out of rotation; it never starts on a catalog it could not read.
      """

      import os
      import sys
      from pathlib import Path

      from .. import report, store
      from ..catalog import Catalog
      from ..errors import CorruptSnapshot

      EXIT_OK = 0
      EXIT_CORRUPT = 3
      DEFAULT_SNAPSHOT = "/var/lib/svccatalog/catalog.json"


      def snapshot_path(env=None) -> Path:
          """Where this node keeps its snapshot."""
          env = os.environ if env is None else env
          return Path(env.get("SVCCATALOG_SNAPSHOT", DEFAULT_SNAPSHOT))


      def boot(path) -> Catalog:
          """Load the snapshot, or start empty on a node that has none, and keep it current."""
          path = Path(path)
          catalog = store.load(path) if path.exists() else Catalog()
          store.autosave(catalog, path)
          return catalog


      def main(env=None, out=None, err=None) -> int:
          """Start the agent and return its exit status."""
          out = out if out is not None else sys.stdout
          err = err if err is not None else sys.stderr
          path = snapshot_path(env)
          try:
              catalog = boot(path)
          except CorruptSnapshot as exc:
              print(f"svccatalog-agent: refusing to start: {exc}", file=err)
              return EXIT_CORRUPT
          print(f"svccatalog-agent: loaded {path}: {report.summary(catalog)}", file=out)
          return EXIT_OK


      if __name__ == "__main__":
          raise SystemExit(main())
