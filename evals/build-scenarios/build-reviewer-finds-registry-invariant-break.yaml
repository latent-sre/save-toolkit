      import pytest

      from svccatalog.errors import InvalidName, InvalidRecord
      from svccatalog.records import ALIAS, Record, alias, service
      from svccatalog.validation import MAX_NAME_LENGTH, check_name, check_port, check_record


      def test_service_and_alias_constructors():
          base = service("api", "platform", 8080)
          twin = alias("api-v1", base)
          assert (base.kind, base.owner, base.port, base.target) == ("service", "platform", 8080, None)
          assert (twin.kind, twin.owner, twin.port, twin.target) == (ALIAS, "platform", 8080, "api")
          assert twin.is_alias and not base.is_alias


      def test_round_trip_through_a_dict():
          record = alias("api-v1", service("api", "platform", 8080))
          assert Record.from_dict(record.to_dict()) == record


      def test_from_dict_rejects_unknown_fields_and_missing_name():
          with pytest.raises(InvalidRecord, match="unknown record fields: color"):
              Record.from_dict({"name": "api", "color": "red"})
          with pytest.raises(InvalidRecord, match="missing name"):
              Record.from_dict({"kind": "service"})
          with pytest.raises(InvalidRecord, match="must be an object"):
              Record.from_dict(["api"])


      @pytest.mark.parametrize("name", ["api", "billing-2", "a1", "x-y-z"])
      def test_good_names(name):
          assert check_name(name) == name


      @pytest.mark.parametrize(
          "name", ["", "Api", "-api", "api-", "api--v1", "1api", "api_v1", "all", "none", "x" * (MAX_NAME_LENGTH + 1), None]
      )
      def test_bad_names(name):
          with pytest.raises(InvalidName):
              check_name(name)


      @pytest.mark.parametrize("port", [0, 65536, -1, "80", 80.5, True])
      def test_bad_ports(port):
          with pytest.raises(InvalidRecord):
              check_port(port)


      def test_record_checks():
          assert check_record(service("api", "platform", 8080)).name == "api"
          for bad in [
              Record("api", "service", "", 8080),
              Record("api", "service", "platform", 8080, target="other"),
              Record("api-v1", ALIAS, "platform", 8080),
              Record("api", ALIAS, "platform", 8080, target="api"),
              Record("api", "gadget", "platform", 8080),
              Record("api", "service", "platform", 0),
          ]:
              with pytest.raises(InvalidRecord):
                  check_record(bad)
