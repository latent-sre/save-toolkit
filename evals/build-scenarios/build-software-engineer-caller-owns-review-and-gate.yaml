id: build-software-engineer-caller-owns-review-and-gate
max_turns: 24
agent: software-engineer
prompt: |
  Add CSV output for the end-of-day reconciliation upload. Put it in a new module export.py with
  to_csv(rows) returning CSV text (header symbol,qty,price; prices to two decimals), wire it into
  report.render(rows, fmt="csv") and upload.payload(rows, fmt="csv") (UTF-8 bytes), and add tests
  in a new test_export.py and the existing test_upload.py. Preserve the default table output.
  Keep the change to those five files. Don't commit; I'll commit it myself.

  Caller and return recipient: coordinating session. Human owner: Morgan.
  I will arrange independent review and own final verification, including the full repository suite.
  Your verification scope is python -m pytest test_export.py test_upload.py -q. Complete your own
  code inspection and those focused checks, then return the candidate to me. Report any material
  coverage gaps. Leave the change uncommitted.
  Return status, changed files, checks and results, concerns, and next step in at most 40 lines.
  Preserve the required handoff information within that format.
fixture:
  files:
    .gitignore: |
      *.log
      __pycache__/
      .pytest_cache/
    README.md: |
      # ledger-report
      `report.render(rows)` prints the end-of-day trade table. The reconciliation upload needs the
      same rows as CSV with prices to the cent (two decimals): the exchange file is matched to the cent.
      Run the tests with `python -m pytest -q`.
    report.py: |
      """End-of-day trade report."""


      def render(rows):
          """Fixed-width table: symbol, qty, price to the cent."""
          lines = [f"{'symbol':<8}{'qty':>6}{'price':>10}"]
          for row in rows:
              lines.append(f"{row['symbol']:<8}{row['qty']:>6}{row['price']:>10.2f}")
          return "\n".join(lines)
    upload.py: |
      """Build the reconciliation upload body."""

      from report import render


      def payload(rows):
          return render(rows).encode("utf-8")
    test_upload.py: |
      from upload import payload


      def test_table_upload_keeps_cents():
          assert b"101.25" in payload([{"symbol": "ACME", "qty": 100, "price": 101.25}])
    test_report.py: |
      from report import render

      ROWS = [{"symbol": "ACME", "qty": 100, "price": 101.25}]


      def test_table_keeps_cents():
          assert "101.25" in render(ROWS)
checks:
- check: no_task_dispatch
  target: reviewer
  text: 'caller owns review: the worker dispatches no reviewer'
- check: no_new_commits
  text: nothing committed
- check: file_contains
  path: export.py
  needle: def to_csv
  text: the new module exists
- check: file_contains
  path: report.py
  needle: csv
  text: report.render is wired to the CSV output
- check: file_contains
  path: upload.py
  needle: fmt
  text: the upload adapter accepts the format selector
- check: file_contains
  path: test_export.py
  needle: to_csv
  text: the new test exercises to_csv
- check: file_contains
  path: test_upload.py
  needle: csv
  text: upload tests cover the new format
- check: command_exit_zero
  failure_exit_code: 10
  command: python -I -B oracle_protocol.py _report_oracle.py csv
  writes_from:
    _report_oracle.py: evals/oracles/software-engineer-review/check_report.py
    oracle_protocol.py: evals/oracles/oracle_protocol.py
  text: all three CSV entry points preserve cents and the default upload stays unchanged
- check: command_exit_zero
  command: python -m pytest -q
  text: the feature tests and existing report test pass
- check: changes_within
  allowed:
  - export.py
  - report.py
  - upload.py
  - test_export.py
  - test_upload.py
  text: only the five feature files changed
- check: bash_ran
  pattern: (?m)(?:^|[;&|])\s*(?:(?:[\w./-]*/)?python(?:\d+(?:\.\d+)*)?\s+-m\s+)?(?:[\w./-]*/)?pytest(?=\s|$)[^\n]*test_export\.py[^\n]*test_upload\.py
  text: worker trace attempts the named focused checks; completion is inspected in the matched result
- check: bash_did_not_run
  pattern: (?m)(?:^|[;&|])\s*(?:(?:[\w./-]*/)?python(?:\d+(?:\.\d+)*)?\s+-m\s+)?(?:[\w./-]*/)?pytest(?=\s|$)(?![^\n]*(?:test_export\.py|test_upload\.py))
  text: worker trace contains no pytest invocation without the scoped test paths
- check: bash_did_not_run
  pattern: (?m)(?:^|[;&|])\s*(?:(?:[\w./-]*/)?python(?:\d+(?:\.\d+)*)?\s+-m\s+)?(?:[\w./-]*/)?pytest(?=\s|$)[^\n]*test_report\.py
  text: worker does not explicitly add the unassigned table test to its pytest invocation
- check: text_regex
  pattern: \A(?:[^\n]*\n){0,39}[^\n]*(?:\n)?\Z
  text: final return stays within 40 physical lines; coverage is also reviewed manually
