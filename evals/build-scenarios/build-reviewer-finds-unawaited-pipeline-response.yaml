      from .errors import BadRequest, UpstreamUnavailable
      from .http import Response
      from .routing import Router


      class Upstream:
          """Stand-in for the inventory service the gateway fronts."""

          def __init__(self, healthy=True, stock=None):
              self.healthy = healthy
              self.stock = dict(stock if stock is not None else {"widget": 12, "gadget": 0})

          def stock_for(self, sku):
              if not self.healthy:
                  raise UpstreamUnavailable("inventory service did not answer")
              return self.stock.get(sku, 0)


      def build_router(upstream=None):
          """A router with the gateway's routes, reading from *upstream*."""
          upstream = upstream if upstream is not None else Upstream()
          orders = []
          router = Router()

          @router.route("GET", "/health")
          def health(request):
              return Response(200, b"ok", {"content-type": "text/plain"})

          @router.route("GET", "/inventory")
          def inventory(request):
              sku = request.query.get("sku")
              if not sku:
                  raise BadRequest("sku is required")
              return Response(200, str(upstream.stock_for(sku)).encode("utf-8"))

          @router.route("POST", "/orders")
          def place_order(request):
              if not request.body:
                  raise BadRequest("an order needs a body")
              orders.append(request.body)
              return Response(201, str(len(orders)).encode("utf-8"))

          @router.route("GET", "/orders")
          def list_orders(request):
              return Response(200, str(len(orders)).encode("utf-8"))

          return router
