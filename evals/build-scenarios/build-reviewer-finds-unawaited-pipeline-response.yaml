      from unittest import mock

      from edgegate.audit import AuditLogMiddleware, AuditSink
      from edgegate.config.pipelines import Layer
      from edgegate.http import Response
      from edgegate.servers import serve_sync
      from support import make_request


      def test_sink_keeps_the_latest_records():
          sink = AuditSink(capacity=2)
          for number in range(3):
              sink.write({"n": number})
          assert sink.records() == [{"n": 1}, {"n": 2}]


      def test_sink_appends_json_lines_to_a_file(tmp_path):
          path = tmp_path / "audit.jsonl"
          sink = AuditSink(path=path)
          sink.write({"b": 1, "a": 2})
          sink.write({"c": 3})
          assert path.read_text(encoding="utf-8").splitlines() == ['{"a": 2, "b": 1}', '{"c": 3}']


      def test_sink_clear():
          sink = AuditSink()
          sink.write({"n": 1})
          sink.clear()
          assert sink.records() == []


      def test_record_describes_the_response():
          middleware = AuditLogMiddleware(lambda request: Response())
          record = middleware.record(make_request("/orders", "POST", tenant="globex"), Response(201))
          assert (record["tenant"], record["method"], record["path"], record["status"]) == ("globex", "POST", "/orders", 201)


      def test_record_tolerates_a_response_without_a_status():
          middleware = AuditLogMiddleware(lambda request: object())
          assert middleware.record(make_request(), object())["status"] is None


      def test_sync_server_writes_one_record_per_request():
          sink = AuditSink()
          with mock.patch.object(AuditLogMiddleware, "sink", sink):
              serve_sync(make_request("/health", tenant="acme"), (Layer(AuditLogMiddleware),))
              serve_sync(make_request("/missing", tenant="globex"), (Layer(AuditLogMiddleware),))
          assert [(r["tenant"], r["path"], r["status"]) for r in sink.records()] == [
              ("acme", "/health", 200),
              ("globex", "/missing", 404),
          ]
