        edgegate/audit.py: |
          """The audit trail: one record per request, written to a sink."""

          import asyncio
          import collections
          import json
          import threading
          import time

          from .middleware import Middleware


          class AuditSink:
              """Keeps the most recent records in memory and, when given a path, appends them as JSON lines."""

              def __init__(self, path=None, capacity=1000):
                  self.path = path
                  self._lock = threading.Lock()
                  self._records = collections.deque(maxlen=capacity)

              def write(self, record):
                  with self._lock:
                      self._records.append(record)
                      if self.path is not None:
                          with open(self.path, "a", encoding="utf-8") as handle:
                              handle.write(json.dumps(record, sort_keys=True) + "\n")

              def records(self):
                  with self._lock:
                      return list(self._records)

              def clear(self):
                  with self._lock:
                      self._records.clear()


          DEFAULT_SINK = AuditSink()


          class AuditLogMiddleware(Middleware):
              """Writes one record per response: who called, what, and the status that went back.

              Pass `sink` to write somewhere other than the process-wide default.
              """

              async_capable = True
              sink = DEFAULT_SINK

              def __init__(self, next_handler, sink=None):
                  self.next_handler = next_handler
                  if sink is not None:
                      self.sink = sink

              def record(self, request, response):
                  """The audit record for *request* and the *response* it produced."""
                  return {
                      "tenant": request.tenant,
                      "method": request.method,
                      "path": request.path,
                      # Endpoints mounted from older services can hand back objects without a status.
                      "status": getattr(response, "status", None),
                      "at": round(time.time(), 3),
                  }

              def after(self, request, response):
                  self.sink.write(self.record(request, response))
                  return response

              async def __acall__(self, request):
                  response = await self.next_handler(request)
                  # A file sink blocks on disk, so the write runs in a worker thread, not on the event loop.
                  await asyncio.to_thread(self.sink.write, self.record(request, response))
                  return response
