      """Request counters and latency totals, and the middleware that feeds them."""

      import threading
      import time

      from .middleware import Middleware


      class MetricsRegistry:
          """Thread-safe counters keyed by path and status class."""

          def __init__(self):
              self._lock = threading.Lock()
              self._counts = {}
              self._seconds = {}

          def observe(self, path, status, seconds):
              key = (path, f"{status // 100}xx")
              with self._lock:
                  self._counts[key] = self._counts.get(key, 0) + 1
                  self._seconds[key] = self._seconds.get(key, 0.0) + seconds

          def count(self, path, status_class):
              with self._lock:
                  return self._counts.get((path, status_class), 0)

          def total_seconds(self, path, status_class):
              with self._lock:
                  return self._seconds.get((path, status_class), 0.0)

          def snapshot(self):
              """A copy of every counter, keyed `(path, status_class)`."""
              with self._lock:
                  return dict(self._counts)

          def reset(self):
              with self._lock:
                  self._counts.clear()
                  self._seconds.clear()


      DEFAULT_REGISTRY = MetricsRegistry()


      class MetricsMiddleware(Middleware):
          """Counts every response that reaches it and adds its latency to the registry.

          Metrics is the outermost layer, so it sees the status every other layer produced.
          """

          async_capable = True

          def __init__(self, next_handler, registry=None):
              super().__init__(next_handler)
              self.registry = registry if registry is not None else DEFAULT_REGISTRY

          def before(self, request):
              request.state["metrics_started"] = time.perf_counter()

          def after(self, request, response):
              elapsed = time.perf_counter() - request.state.pop("metrics_started", time.perf_counter())
              self.registry.observe(request.path, response.status, elapsed)
              return response
    edgegate/middleware.py: |
      """The middleware base class.

      A layer wraps the next handler. Whether an instance runs its synchronous or its asynchronous path
      is decided once, in `__init__`, from the handler it wraps: an instance over an async handler is
      marked as a coroutine function, and calling it then returns a coroutine. Layers that only need the
      two hooks override `before` and `after`; a layer with its own asynchronous path also overrides
      `__acall__` and sets `async_capable`.
      """

      import inspect


      class Middleware:
          """Base class for pipeline layers.

          `before(request)` may return a response to answer without calling the next handler; the next
          layer's `after` is then skipped. `after(request, response)` returns the response to pass on.
          """

          sync_capable = True
          async_capable = False

          def __init__(self, next_handler):
              self.next_handler = next_handler
              if inspect.iscoroutinefunction(next_handler):
                  inspect.markcoroutinefunction(self)

          def __call__(self, request):
              if inspect.iscoroutinefunction(self):
                  return self.__acall__(request)
              early = self.before(request)
              if early is not None:
                  return early
              response = self.next_handler(request)
              return self.after(request, response)

          async def __acall__(self, request):
              early = self.before(request)
              if early is not None:
                  return early
              response = await self.next_handler(request)
              return self.after(request, response)

          def before(self, request):
              return None

          def after(self, request, response):
              return response
