      from edgegate.errors import QuotaExceeded, UpstreamUnavailable
      from edgegate.http import ANONYMOUS, Request, Response
      from support import make_request


      def test_request_normalises_method_and_header_names():
          request = Request("get", "/x", {"X-Tenant": "acme"})
          assert request.method == "GET"
          assert request.headers == {"x-tenant": "acme"}


      def test_tenant_comes_from_the_header():
