      """Builds a handler from a tuple of layers and an endpoint, for the synchronous or asyncio server."""

      import asyncio
      import inspect

      from .errors import ConfigurationError


      def sync_to_async(handler):
          """Run a synchronous handler in a worker thread so it cannot block the event loop."""

          async def run(request):
              return await asyncio.to_thread(handler, request)

          return run


      def to_async(handler):
          return handler if inspect.iscoroutinefunction(handler) else sync_to_async(handler)


      def build_pipeline(layers, endpoint, *, asynchronous):
          """Wrap *endpoint* in *layers* (outermost first) and return the handler for the server.

          Under the asyncio server a layer with `async_capable` runs on the event loop; any other layer
          runs synchronously, and its whole synchronous segment is then moved to a worker thread by
          the first async-capable layer above it. Layers that are not async-capable therefore have to
          sit innermost, next to the endpoint.
          """
          handler = endpoint
          for layer in reversed(layers):
              cls = layer.middleware
              run_async = asynchronous and cls.async_capable
              if not (cls.async_capable if run_async else cls.sync_capable):
                  raise ConfigurationError(f"{cls.__name__} cannot run in this mode")
              if run_async:
                  handler = to_async(handler)
              elif inspect.iscoroutinefunction(handler):
                  raise ConfigurationError(f"{cls.__name__} is not async-capable and cannot wrap an async layer")
              handler = cls(handler, **layer.options)
          return to_async(handler) if asynchronous else handler
