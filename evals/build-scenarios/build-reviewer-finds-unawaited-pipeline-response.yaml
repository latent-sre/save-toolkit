      """Demo entry point: `python -m edgegate sync` or `python -m edgegate async`."""

      import argparse
      import asyncio

      from .http import Request
      from .servers import serve_async, serve_sync

      SAMPLE = (
          Request("GET", "/health", {"x-tenant": "acme"}),
          Request("GET", "/inventory", {"x-tenant": "acme"}, {"sku": "widget"}),
          Request("POST", "/orders", {"x-tenant": "globex"}, body=b"2 widgets"),
          Request("GET", "/missing", {"x-tenant": "globex"}),
      )


      def describe(request, response):
          return f"{request.method} {request.path} -> {response.status}"


      def main(argv=None):
          parser = argparse.ArgumentParser(prog="edgegate", description=__doc__)
          parser.add_argument("server", choices=("sync", "async"))
          args = parser.parse_args(argv)
          for request in SAMPLE:
              if args.server == "sync":
                  response = serve_sync(request)
              else:
                  response = asyncio.run(serve_async(request))
              print(describe(request, response))
          return 0


      if __name__ == "__main__":
          raise SystemExit(main())
