      def test_tenant_defaults_to_anonymous():
          assert Request("GET", "/x").tenant == ANONYMOUS


      def test_state_is_not_shared_between_requests():
          first, second = make_request(), make_request()
          first.state["k"] = 1
          assert second.state == {}


      def test_response_from_error_carries_status_and_message():
          response = Response.from_error(QuotaExceeded("slow down"))
          assert (response.status, response.body) == (429, b"slow down")


      def test_error_without_message_names_itself():
          assert Response.from_error(UpstreamUnavailable()).body == b"UpstreamUnavailable"


      def test_server_error_covers_only_5xx():
          assert [Response(code).is_server_error for code in (200, 404, 499, 500, 503, 599)] == [
              False, False, False, True, True, True,
          ]


      def test_status_class():
          assert Response(204).status_class == "2xx"
          assert Response(503).status_class == "5xx"
