      import asyncio
      import inspect

      from edgegate.http import Response
      from edgegate.middleware import Middleware
      from support import make_request


      class Tag(Middleware):
          def before(self, request):
              request.state.setdefault("order", []).append("before")

          def after(self, request, response):
              request.state["order"].append("after")
              return response


      class Gate(Middleware):
          def before(self, request):
              return Response(403, b"closed")

          def after(self, request, response):
              raise AssertionError("after must not run after an early answer")


      def ok(request):
          request.state.setdefault("order", []).append("endpoint")
          return Response(200, b"ok")


      async def aok(request):
          request.state.setdefault("order", []).append("endpoint")
          return Response(200, b"ok")


      def test_hooks_run_around_the_next_handler():
          request = make_request()
          assert Tag(ok)(request).status == 200
          assert request.state["order"] == ["before", "endpoint", "after"]


      def test_before_can_answer_early():
          assert Gate(ok)(make_request()).status == 403


      def test_instance_over_a_sync_handler_is_sync():
          assert not inspect.iscoroutinefunction(Tag(ok))


      def test_instance_over_an_async_handler_is_a_coroutine_function():
          assert inspect.iscoroutinefunction(Tag(aok))


      def test_async_path_runs_the_same_hooks():
          request = make_request()
          response = asyncio.run(Tag(aok)(request))
          assert response.status == 200
          assert request.state["order"] == ["before", "endpoint", "after"]


      def test_async_path_honours_an_early_answer():
          assert asyncio.run(Gate(aok)(make_request())).status == 403


      def test_base_class_is_sync_only_by_default():
