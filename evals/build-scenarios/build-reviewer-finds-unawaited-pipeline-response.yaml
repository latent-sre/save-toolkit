        Make the audit-log and quota middleware async-capable

        AuditLogMiddleware and QuotaMiddleware now run on the event loop under serve_async instead of
        hopping to a worker thread, which removes two thread round trips from every request on the
        production pipeline. Audit takes an optional sink argument and writes through asyncio.to_thread;
        quota charges through QuotaStore.charge_on_loop.

        Behaviour is unchanged: same audit records, same limits, same responses, same refunds. The README
