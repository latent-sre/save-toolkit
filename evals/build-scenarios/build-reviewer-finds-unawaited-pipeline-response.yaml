      """Per-tenant request quota: a counter store and the middleware that charges it."""

      import threading
      import time

      from .errors import QuotaExceeded
      from .http import Response
      from .middleware import Middleware


      class QuotaStore:
          """Counts units used per key within a fixed window.

          The threaded server calls `charge` and `refund` from many threads, so both take the store's
          lock. A store belongs to one server: a deployment runs either the threaded server or the
          asyncio server in a process, and the two never share a store.
          """

          def __init__(self, limit=1000, window=60.0, clock=time.monotonic):
              self.limit = limit
              self.window = window
              self._clock = clock
              self._lock = threading.Lock()
              self._counts = {}
              self._window_end = clock() + window

          def _roll(self):
              now = self._clock()
              if now >= self._window_end:
                  self._counts.clear()
                  self._window_end = now + self.window

          def charge(self, key):
              """Take one unit for *key*; False when the key has used its limit."""
              with self._lock:
                  self._roll()
                  used = self._counts.get(key, 0)
                  if used >= self.limit:
                      return False
                  self._counts[key] = used + 1
                  return True

          def refund(self, key):
              """Give one unit back to *key*."""
              with self._lock:
                  used = self._counts.get(key, 0)
                  if used > 0:
                      self._counts[key] = used - 1

          def used(self, key):
              with self._lock:
                  self._roll()
                  return self._counts.get(key, 0)


      DEFAULT_STORE = QuotaStore()


      class QuotaMiddleware(Middleware):
          """Charges one unit per request and refunds it when the request ends in a 5xx response.

          A tenant over its limit gets a 429 and the request goes no further.
          """

          def __init__(self, next_handler, store=None):
              super().__init__(next_handler)
              self.store = store if store is not None else DEFAULT_STORE

          def rejection(self, request):
              return Response.from_error(QuotaExceeded(f"quota exhausted for {request.tenant}"))

          def before(self, request):
              if not self.store.charge(request.tenant):
                  return self.rejection(request)
              return None

          def after(self, request, response):
              if response.is_server_error:
                  self.store.refund(request.tenant)
              return response
    edgegate/routing.py: |
      """Exact-match routing from (method, path) to an endpoint handler."""

      from .errors import GatewayError, MethodNotAllowed, RouteNotFound
      from .http import Response


      class Router:
          """Maps requests to handlers. Handlers are plain functions: `handler(request) -> Response`."""

          def __init__(self):
              self._routes = {}

          def add(self, method, path, handler):
              self._routes[(method.upper(), path)] = handler

          def route(self, method, path):
              """Decorator form of `add`."""

              def register(handler):
                  self.add(method, path, handler)
                  return handler

              return register

          def lookup(self, request):
              """The handler for *request*; 404 for an unknown path, 405 for a known path and wrong method."""
              handler = self._routes.get((request.method, request.path))
              if handler is not None:
                  return handler
              if any(path == request.path for _, path in self._routes):
                  raise MethodNotAllowed(f"{request.method} is not allowed on {request.path}")
              raise RouteNotFound(f"no route for {request.path}")

          def handle(self, request):
              """Run the handler. Gateway errors keep their status; anything else becomes a 500."""
              try:
                  return self.lookup(request)(request)
              except GatewayError as error:
                  return Response.from_error(error)
              except Exception:
                  return Response(500, b"internal error", {"content-type": "text/plain"})
    edgegate/servers.py: |
      """The two servers. Each takes a request and returns a response; sockets are out of scope here.

      `serve_sync` is what a threaded server calls from its worker threads. `serve_async` is what an
      asyncio server awaits from its event loop. Both run the same layers, built for their mode.
      """

      from concurrent.futures import ThreadPoolExecutor

      from . import handlers
      from .config import pipelines
      from .pipeline import build_pipeline

      DEFAULT_ROUTER = handlers.build_router()


      def serve_sync(request, layers=None, router=None):
          """Run *request* through the layers and the router on the calling thread."""
          layers = pipelines.PRODUCTION if layers is None else layers
          router = DEFAULT_ROUTER if router is None else router
          return build_pipeline(layers, router.handle, asynchronous=False)(request)


      async def serve_async(request, layers=None, router=None):
          """Run *request* through the layers and the router on the running event loop."""
          layers = pipelines.PRODUCTION if layers is None else layers
          router = DEFAULT_ROUTER if router is None else router
          return await build_pipeline(layers, router.handle, asynchronous=True)(request)


      def run_threaded(requests, workers=4, layers=None, router=None):
          """Serve *requests* from a pool of worker threads; responses come back in request order."""
          with ThreadPoolExecutor(max_workers=workers) as pool:
              return list(pool.map(lambda request: serve_sync(request, layers, router), requests))
    README.md: |
      # edgegate

      A small internal API gateway. A request passes through a middleware pipeline to an endpoint
      handler. The same pipeline runs under two servers, and both are supported:

      - `serve_sync(request)` is the threaded synchronous server. Worker threads call it.
      - `serve_async(request)` is the asyncio server. It is awaited from the event loop.

      A server here is a function that takes a request and returns a response, so everything runs
      in-process and is testable without sockets.

      ```
      python -m edgegate sync
      python -m edgegate async
      python -m pytest -q
      ```

      ## Pipeline

      Production order is set in `edgegate/config/pipelines.py`, outermost first:

      1. `MetricsMiddleware` counts every response and its latency.
      2. `AuditLogMiddleware` writes one audit record per response.
      3. `QuotaMiddleware` charges the calling tenant (the `x-tenant` header) and rejects it with a 429
         when its quota is used up.
      4. The endpoint handler, found by `edgegate/routing.py`.

      ## Writing a middleware

      Subclass `edgegate.middleware.Middleware` and override `before(request)` and/or
      `after(request, response)`. `before` may return a response to answer without calling the rest of
      the pipeline. A layer with its own asynchronous path also overrides `__acall__` and sets
      `async_capable = True`.

      The base class decides in `__init__` whether an instance runs its synchronous or its
      asynchronous path, from the handler it wraps. A subclass that overrides `__init__` must call
      `super().__init__(next_handler)`.

      ### Capability

      | Layer | Threaded server | Asyncio server |
      |---|---|---|
      | `MetricsMiddleware` | runs inline | runs on the event loop |
      | `AuditLogMiddleware` | runs inline | runs in a worker thread |
      | `QuotaMiddleware` | runs inline | runs in a worker thread |

      A layer that is not async-capable runs in a worker thread under the asyncio server, together
      with everything inside it, so such layers have to sit innermost, next to the endpoint.

      ## Quota

      One request consumes one quota unit. A request that ends in a 5xx response is not charged: the
      unit is refunded. A request rejected with a 429 is never charged.

      Units are counted per tenant in a fixed window (60 seconds by default) and all counters reset
      when the window ends. A quota store belongs to one server; a process runs either the threaded
      server or the asyncio server, never both against one store.

      ## Audit

      Each record holds the tenant, method, path and status, and a timestamp. Records go to an
      `AuditSink`, which keeps the latest 1000 in memory and appends JSON lines to a file when it is
      given a path.

      ## Metrics

      `MetricsRegistry` counts responses per path and status class (`2xx`, `4xx`, ...) and sums
      latency. All of its methods are thread-safe.
