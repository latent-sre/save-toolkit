          def test_async_server_rejects_over_limit_with_429():
              store = QuotaStore(limit=2)
              responses = serve_all([make_request("/health") for _ in range(3)], store)
              assert [r.status for r in responses] == [200, 200, 429]
              assert responses[2].body == b"quota exhausted for acme"


          def test_async_rejection_is_not_charged():
              store = QuotaStore(limit=1)
              serve_all([make_request("/health") for _ in range(3)], store)
              assert store.used("acme") == 1


          def test_async_server_charges_tenants_separately():
              store = QuotaStore(limit=1)
              responses = serve_all([make_request("/health", tenant=t) for t in ("acme", "globex", "acme")], store)
              assert [r.status for r in responses] == [200, 200, 429]


          def test_async_server_answers_concurrent_requests_within_the_limit():
              store = QuotaStore(limit=10)

              async def main():
                  return await asyncio.gather(*(serve_async(make_request("/health"), layers_for(store)) for _ in range(25)))

              statuses = [r.status for r in asyncio.run(main())]
              assert statuses.count(200) == 10
              assert statuses.count(429) == 15


          def test_async_server_keeps_the_charge_for_a_4xx():
              store = QuotaStore(limit=5)
              assert serve_all([make_request("/missing")], store)[0].status == 404
              assert store.used("acme") == 1
