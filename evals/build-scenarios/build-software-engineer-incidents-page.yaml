id: build-software-engineer-incidents-page
agent: software-engineer
# The frontend bar with real tools. The prompt asks only for a page, a table, and a status filter;
# it never says "loading state", "empty state", "labelled control", "the URL is state", or
# "accessible". Those are what frontend-craft is for, so the probe-owned oracle (probe_ui.test.tsx,
# written by the first check, never seen by the agent) grades them on the rendered page: a loading
# indicator while the request is in flight, an inline error that keeps the heading instead of a
# white page, a designed empty state, an accessible name on every control, the filter reflected in
# and restored from the URL, a clean axe pass, and status conveyed as text rather than colour alone.
# The fixture is Vite + React 19 + TypeScript with react-router-dom, Vitest, Testing Library and
# MSW, pinned to exact versions; the existing repository's stack wins over the skill's greenfield
# default, so react-router rather than TanStack Router is the correct thing to extend here, and the
# agent should add no dependency. src/pages/Services.tsx is deliberately naive — a bare fetch into
# state, no loading/error/empty states, an unlabelled select, filter in component memory — so the
# repository's own code does not model the bar the oracle grades. The agent runs on a host with a
# network, so `npm install` inside the workspace is expected; the first check runs it too, so the
# oracle does not depend on the agent having done so.
prompt: |
  Add an Incidents page at `/incidents` to this React app: a table of the incidents returned by
  `GET /api/incidents` (fields `id`, `status`, `title`, `service`, `created_at`), with a status
  filter (open or closed). Build it end to end in this repo and tell me what you ran to verify it.
  Tests go next to the code as `*.test.tsx`; this repo uses Vitest, Testing Library, and MSW (see
  the README). This is a code change, not a design question, not a review, and not an incident.
fixture:
  files:
    .gitignore: |
      node_modules/
