  # runs here so the oracle does not depend on the agent having installed anything.
  # `--ignore-scripts`: grading runs on the host as the operator, with the real HOME and network,
  # over a dependency tree the agent may have edited. No package's lifecycle script executes in
  # the grading step; a package that needs one is a scenario the fixture must pin, not run.
