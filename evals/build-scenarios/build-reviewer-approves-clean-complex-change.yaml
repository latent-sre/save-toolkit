              {"name": "Slow", "severity": "error", "labels": {"service": "checkout"}, "fired_at": "2031-03-01T12:01:00Z"},
              {"name": "Down", "severity": "critical", "labels": {"service": "cart"}, "fired_at": "2031-03-01T12:02:00Z"},
          ]), encoding="utf-8")
          return str(config), str(alerts)


      def test_check_reports_the_size_of_the_file(files):
