      from alertrouter import config
      from alertrouter.dispatch import DELIVERED, SUPPRESSED, Dispatcher
      from tests import alert, at, rules_file


      def dispatcher(**overrides):
          sent = []
          settings = config.parse(rules_file(**overrides))
          return Dispatcher(settings, lambda team, target, a: sent.append((team, target, a.name))), sent


      def test_a_matching_alert_is_delivered_to_the_first_level():
          dispatch, sent = dispatcher()
          outcome = dispatch.handle(alert("Slow", "error", {"service": "checkout"}))
          assert outcome.kind == DELIVERED
          assert outcome.decision.team == "payments"
          assert sent == [("payments", "payments-oncall", "Slow")]


      def test_an_unmatched_alert_goes_to_the_catch_all_team():
          dispatch, sent = dispatcher()
          dispatch.handle(alert("Slow", "error", {"service": "cart"}))
          assert sent == [("platform", "platform-oncall", "Slow")]


      def test_a_duplicate_is_suppressed_and_not_notified():
          dispatch, sent = dispatcher()
          first = dispatch.handle(alert("Slow", fired_at=at(12, 0)))
          second = dispatch.handle(alert("Slow", fired_at=at(12, 1)))
          assert (first.kind, second.kind) == (DELIVERED, SUPPRESSED)
          assert second.decision is None
          assert len(sent) == 1


      def test_a_duplicate_after_the_window_is_delivered_again():
          dispatch, sent = dispatcher(dedup_seconds=60)
