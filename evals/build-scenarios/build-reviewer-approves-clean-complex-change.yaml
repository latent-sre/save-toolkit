          code, out, _ = run(["dispatch", "--config", files[0], "--alerts", files[1]])
          assert code == 0
          assert out.splitlines() == [
              "delivered\tpayments\tSlow",
              "suppressed\t-\tSlow",
              "delivered\tplatform\tDown",
              "notify\tpayments\tpayments-oncall\tSlow",
              "notify\tplatform\tplatform-oncall\tDown",
          ]


