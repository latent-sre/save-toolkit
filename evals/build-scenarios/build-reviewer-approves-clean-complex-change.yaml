      """The command line: `check`, `route` and `dispatch`.

      A failing command prints `error: ...` to stderr and exits with status 2.
      """

      from __future__ import annotations

      import argparse
      import json
      import sys

      from . import config
      from .dispatch import Dispatcher
      from .models import Alert, AlertError


      def _read_alerts(path):
          try:
              with open(path, encoding="utf-8") as handle:
                  raw = json.load(handle)
          except OSError as exc:
              raise AlertError(f"cannot read {path}: {exc.strerror or exc}") from None
          except json.JSONDecodeError as exc:
              raise AlertError(f"{path} is not valid JSON: {exc}") from None
          if not isinstance(raw, list):
              raise AlertError(f"{path}: expected a list of alerts")
          return [Alert.from_dict(item) for item in raw]


      def _check(args, out):
          settings = config.load(args.config)
          out.write(f"ok: {len(settings.rules)} rules, {len(settings.teams)} teams\n")


      def _route(args, out):
          settings = config.load(args.config)
          router = settings.build_router()
          for decision in router.route_all(_read_alerts(args.alerts)):
              out.write(json.dumps(decision.as_dict(), sort_keys=True) + "\n")


      def _dispatch(args, out):
          settings = config.load(args.config)
          deliveries = []
          dispatcher = Dispatcher(settings, lambda team, target, alert: deliveries.append((team, target, alert.name)))
          for alert in _read_alerts(args.alerts):
              outcome = dispatcher.handle(alert)
              team = outcome.decision.team if outcome.decision else "-"
              out.write(f"{outcome.kind}\t{team}\t{alert.name}\n")
          for team, target, name in deliveries:
              out.write(f"notify\t{team}\t{target}\t{name}\n")


      def _parser():
          parser = argparse.ArgumentParser(prog="alertrouter")
          commands = parser.add_subparsers(dest="command", required=True)
          for name, handler, needs_alerts in (("check", _check, False), ("route", _route, True), ("dispatch", _dispatch, True)):
              sub = commands.add_parser(name)
              sub.add_argument("--config", required=True)
              if needs_alerts:
                  sub.add_argument("--alerts", required=True)
              sub.set_defaults(handler=handler)
          return parser


      def main(argv=None, out=None, err=None):
          out = out or sys.stdout
          err = err or sys.stderr
          args = _parser().parse_args(argv)
          try:
              args.handler(args, out)
          except (config.ConfigError, AlertError) as exc:
              err.write(f"error: {exc}\n")
              return 2
          return 0
