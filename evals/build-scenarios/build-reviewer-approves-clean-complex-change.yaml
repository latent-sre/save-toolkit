      """The de-duplication window.

      An alert with the same fingerprint as one admitted less than `seconds` earlier is a duplicate and is
      dropped. A dropped duplicate does not restart the window.
      """

      from __future__ import annotations

      from datetime import timedelta


      class DedupWindow:
          def __init__(self, seconds):
              if seconds < 0:
                  raise ValueError("the dedup window cannot be negative")
              self.window = timedelta(seconds=seconds)
              self._last = {}

          def admit(self, alert):
              """True when *alert* is new; False when it repeats one admitted inside the window."""
              if not self.window:
                  return True
              now = alert.fired_at
              last = self._last.get(alert.fingerprint)
              if last is not None and now - last < self.window:
                  return False
              self._last[alert.fingerprint] = now
              self._forget_expired(now)
              return True

          def _forget_expired(self, now):
              expired = [key for key, seen in self._last.items() if now - seen >= self.window]
              for key in expired:
                  del self._last[key]

          def __len__(self):
              return len(self._last)
