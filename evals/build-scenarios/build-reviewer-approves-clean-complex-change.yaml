      """Builders shared by the alertrouter tests."""

      from datetime import UTC, datetime

      from alertrouter.models import Alert, Rule


      def at(hour=12, minute=0, second=0, day=1):
          """A UTC time on a fixed month, for alerts that need a time of day."""
          return datetime(2031, 3, day, hour, minute, second, tzinfo=UTC)


      def alert(name="HighLatency", severity="warning", labels=None, fired_at=None):
          return Alert(name, severity, dict(labels or {}), fired_at or at())


      def rule(name, team, match=None, absent=(), min_severity=None):
          values = {label: (v,) if isinstance(v, str) else tuple(v) for label, v in (match or {}).items()}
          return Rule(name, team, values, tuple(absent), min_severity)


      def rules_file(**overrides):
          """A small valid rules document; keyword arguments replace top-level keys."""
          data = {
              "catch_all": "platform",
              "dedup_seconds": 300,
              "teams": {
                  "platform": {"escalation": [{"target": "platform-oncall", "after_minutes": 0}]},
                  "payments": {
                      "escalation": [
                          {"target": "payments-oncall", "after_minutes": 0},
                          {"target": "payments-lead", "after_minutes": 30},
                      ]
                  },
              },
              "rules": [
                  {"name": "payments-errors", "team": "payments", "match": {"service": "checkout"}, "min_severity": "error"},
              ],
          }
          data.update(overrides)
          return data
