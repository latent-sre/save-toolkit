      """Loading and validating the rules file.

      The file is JSON. `parse` checks the whole document and raises `ConfigError` naming the first
      problem, with a path such as `rules[2].team`, so a bad file never produces a half-built router.
      """

      from __future__ import annotations

      import json
      from collections.abc import Mapping
      from dataclasses import dataclass
      from datetime import timedelta

      from .escalation import Escalation, Level
      from .models import Rule
      from .router import Router
      from .severity import SEVERITIES

      DEFAULT_DEDUP_SECONDS = 300


      class ConfigError(ValueError):
          """The rules file is unreadable or invalid."""


      @dataclass(frozen=True)
      class TeamSettings:
          name: str
          escalation: Escalation


      @dataclass(frozen=True)
      class Settings:
          catch_all: str
          teams: Mapping[str, TeamSettings]
          rules: tuple[Rule, ...]
          dedup_seconds: int = DEFAULT_DEDUP_SECONDS

          def build_router(self):
              return Router(self.rules, self.catch_all)


      def load(path):
          """Read and parse the rules file at *path*."""
          try:
              with open(path, encoding="utf-8") as handle:
                  data = json.load(handle)
          except OSError as exc:
              raise ConfigError(f"cannot read {path}: {exc.strerror or exc}") from None
          except json.JSONDecodeError as exc:
              raise ConfigError(f"{path} is not valid JSON: {exc}") from None
          return parse(data)


      def _object(value, where):
          if not isinstance(value, Mapping):
              raise ConfigError(f"{where}: expected an object")
          return value


      def _text(value, where):
          if not isinstance(value, str) or not value:
              raise ConfigError(f"{where}: expected a non-empty string")
          return value


      def _parse_level(raw, where):
          raw = _object(raw, where)
          target = _text(raw.get("target"), f"{where}.target")
          minutes = raw.get("after_minutes")
          if isinstance(minutes, bool) or not isinstance(minutes, int) or minutes < 0:
              raise ConfigError(f"{where}.after_minutes: expected a whole number of minutes, 0 or more")
          return Level(target, timedelta(minutes=minutes))


      def _parse_team(name, raw):
          where = f"teams.{name}"
          raw = _object(raw, where)
          levels = raw.get("escalation")
          if not isinstance(levels, list):
              raise ConfigError(f"{where}.escalation: expected a list of levels")
          parsed = [_parse_level(level, f"{where}.escalation[{index}]") for index, level in enumerate(levels)]
          try:
              escalation = Escalation(parsed)
          except ValueError as exc:
              raise ConfigError(f"{where}.escalation: {exc}") from None
          return TeamSettings(name, escalation)


      def _parse_match(raw, where):
          raw = _object(raw, where)
          match = {}
          for label, wanted in raw.items():
              values = [wanted] if isinstance(wanted, str) else wanted
              if not isinstance(values, list) or not values or not all(isinstance(v, str) for v in values):
                  raise ConfigError(f"{where}.{label}: expected a string or a non-empty list of strings")
              match[label] = tuple(values)
          return match


      def _parse_rule(raw, index, teams):
          where = f"rules[{index}]"
          raw = _object(raw, where)
          name = _text(raw.get("name"), f"{where}.name")
          team = _text(raw.get("team"), f"{where}.team")
          if team not in teams:
              raise ConfigError(f"{where}.team: unknown team {team!r}")
          absent = raw.get("absent", [])
          if not isinstance(absent, list) or not all(isinstance(label, str) for label in absent):
              raise ConfigError(f"{where}.absent: expected a list of label names")
          floor = raw.get("min_severity")
          if floor is not None and floor not in SEVERITIES:
              raise ConfigError(f"{where}.min_severity: must be one of {', '.join(SEVERITIES)}")
          match = _parse_match(raw.get("match", {}), f"{where}.match")
          return Rule(name, team, match, tuple(absent), floor)


      def parse(data):
          """Validate the decoded rules file and return its `Settings`."""
          data = _object(data, "the rules file")
          raw_teams = _object(data.get("teams"), "teams")
          if not raw_teams:
              raise ConfigError("teams: define at least one team")
          teams = {name: _parse_team(name, raw) for name, raw in raw_teams.items()}
          catch_all = _text(data.get("catch_all"), "catch_all")
          if catch_all not in teams:
              raise ConfigError(f"catch_all: unknown team {catch_all!r}")
          raw_rules = data.get("rules", [])
          if not isinstance(raw_rules, list):
              raise ConfigError("rules: expected a list")
          rules = [_parse_rule(raw, index, teams) for index, raw in enumerate(raw_rules)]
          seen = set()
          for index, rule in enumerate(rules):
              if rule.name in seen:
                  raise ConfigError(f"rules[{index}].name: duplicate rule name {rule.name!r}")
              seen.add(rule.name)
          seconds = data.get("dedup_seconds", DEFAULT_DEDUP_SECONDS)
          if isinstance(seconds, bool) or not isinstance(seconds, int) or seconds < 0:
              raise ConfigError("dedup_seconds: expected a whole number of seconds, 0 or more")
          return Settings(catch_all, teams, tuple(rules), seconds)
