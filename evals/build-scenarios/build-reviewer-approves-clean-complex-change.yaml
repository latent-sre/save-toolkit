      from datetime import timedelta

      import pytest

      from alertrouter.escalation import Escalation, Level


      def minutes(n):
          return timedelta(minutes=n)


      def ladder():
          return Escalation([Level("primary", minutes(0)), Level("secondary", minutes(15)), Level("lead", minutes(45))])


      def test_the_first_level_is_in_charge_at_once():
          assert ladder().level_at(minutes(0)).target == "primary"


      def test_a_level_takes_over_exactly_at_its_delay():
          assert ladder().level_at(minutes(14)).target == "primary"
          assert ladder().level_at(minutes(15)).target == "secondary"
          assert ladder().level_at(minutes(44)).target == "secondary"
          assert ladder().level_at(minutes(45)).target == "lead"


      def test_the_top_level_stays_in_charge():
          assert ladder().level_at(minutes(24 * 60)).target == "lead"


      def test_next_after_names_the_following_level():
          assert ladder().next_after(minutes(0)).target == "secondary"
          assert ladder().next_after(minutes(15)).target == "lead"
          assert ladder().next_after(minutes(45)) is None


      def test_an_empty_ladder_is_rejected():
          with pytest.raises(ValueError, match="at least one level"):
              Escalation([])


      def test_the_first_level_must_start_at_zero():
          with pytest.raises(ValueError, match="start at 0"):
              Escalation([Level("primary", minutes(5))])


      @pytest.mark.parametrize("delays", [(0, 10, 10), (0, 20, 10)])
      def test_delays_must_strictly_increase(delays):
          with pytest.raises(ValueError, match="strictly increasing"):
              Escalation([Level(f"l{n}", minutes(delay)) for n, delay in enumerate(delays)])
