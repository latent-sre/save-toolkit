      """The dispatcher: de-duplicate, route, and notify.

      `Dispatcher.handle` takes one alert at a time. The notifier is any callable taking
      `(team, target, alert)`; the dispatcher calls it once per delivered alert, with the target of the
      first level of the team's escalation ladder.
      """

      from __future__ import annotations

      from dataclasses import dataclass
      from datetime import timedelta

      from .dedup import DedupWindow
      from .router import Decision

      DELIVERED = "delivered"
      SUPPRESSED = "suppressed"


      @dataclass(frozen=True)
      class Outcome:
          """What `handle` did with an alert; `decision` is None for a suppressed duplicate."""

          kind: str
          decision: Decision | None


      class Dispatcher:
          def __init__(self, settings, notify):
              self.settings = settings
              self.router = settings.build_router()
              self.dedup = DedupWindow(settings.dedup_seconds)
              self._notify = notify

          def handle(self, alert):
              if not self.dedup.admit(alert):
                  return Outcome(SUPPRESSED, None)
              decision = self.router.route(alert)
              self._deliver(decision)
              return Outcome(DELIVERED, decision)

          def _deliver(self, decision):
              ladder = self.settings.teams[decision.team].escalation
              target = ladder.level_at(timedelta(0)).target
              self._notify(decision.team, target, decision.alert)
    alertrouter/escalation.py: |
      """Escalation ladders: who is paged first and who is paged if nobody acknowledges.

      A ladder is an ordered list of levels. Each level names a target (a person or a rotation) and the
      time after the alert first reached the team at which that target takes over.
      """

      from __future__ import annotations

      from dataclasses import dataclass
      from datetime import timedelta


      @dataclass(frozen=True)
      class Level:
          target: str
          after: timedelta


      class Escalation:
          """An ordered, non-empty ladder whose first level starts at once."""

          def __init__(self, levels):
              levels = tuple(levels)
              if not levels:
                  raise ValueError("an escalation needs at least one level")
              if levels[0].after != timedelta(0):
                  raise ValueError("the first escalation level must start at 0 minutes")
              for earlier, later in zip(levels, levels[1:]):
                  if later.after <= earlier.after:
                      raise ValueError("escalation levels must be in strictly increasing order of delay")
              self.levels = levels

          def level_at(self, elapsed):
              """The level in charge once *elapsed* has passed since the alert reached the team."""
              current = self.levels[0]
              for level in self.levels:
                  if level.after <= elapsed:
                      current = level
              return current

          def next_after(self, elapsed):
              """The next level to take over after *elapsed*, or None at the top of the ladder."""
              for level in self.levels:
                  if level.after > elapsed:
                      return level
              return None
    alertrouter/models.py: |
      """Alert and rule types shared by every alertrouter module.

      An `Alert` is what a monitoring system sends us. A `Rule` is one entry of the routing table that the
      config loader builds from the rules file.
      """

      from __future__ import annotations

      from collections.abc import Mapping
      from dataclasses import dataclass, field
      from datetime import UTC, datetime

      from .severity import SEVERITIES


      class AlertError(ValueError):
          """An alert payload that cannot be turned into an Alert."""


      def _moment(value):
          """Parse *value* into an aware UTC datetime; a naive time is taken to be UTC already."""
          if isinstance(value, datetime):
              moment = value
          else:
              try:
                  moment = datetime.fromisoformat(value)
              except (TypeError, ValueError):
                  raise AlertError(f"fired_at is not an ISO 8601 time: {value!r}") from None
          if moment.tzinfo is None:
              return moment.replace(tzinfo=UTC)
          return moment.astimezone(UTC)


      @dataclass(frozen=True)
      class Alert:
          """One alert as received: a name, a severity, string labels and the time it fired (UTC)."""

          name: str
          severity: str
          labels: Mapping[str, str]
          fired_at: datetime

          @property
          def fingerprint(self):
              """Stable identity used for de-duplication: the name plus the sorted labels."""
              pairs = (f"{key}={value}" for key, value in sorted(self.labels.items()))
              return "|".join([self.name, *pairs])

          @classmethod
          def from_dict(cls, data):
              if not isinstance(data, Mapping):
                  raise AlertError("an alert must be an object")
              name = data.get("name")
              if not isinstance(name, str) or not name:
                  raise AlertError("an alert needs a non-empty string name")
              severity = data.get("severity")
              if severity not in SEVERITIES:
                  raise AlertError(f"alert {name!r}: severity must be one of {', '.join(SEVERITIES)}")
              labels = data.get("labels", {})
              if not isinstance(labels, Mapping) or not all(
                  isinstance(key, str) and isinstance(value, str) for key, value in labels.items()
              ):
                  raise AlertError(f"alert {name!r}: labels must map strings to strings")
              if "fired_at" not in data:
                  raise AlertError(f"alert {name!r}: fired_at is required")
              return cls(name, severity, dict(labels), _moment(data["fired_at"]))


      @dataclass(frozen=True)
      class Rule:
          """A routing rule.

          `match` maps a label to the values it may have (any one of them); `absent` lists labels that
          must not be present; `min_severity` is a floor. A rule with no conditions matches every alert.
          """

          name: str
          team: str
          match: Mapping[str, tuple[str, ...]] = field(default_factory=dict)
          absent: tuple[str, ...] = ()
          min_severity: str | None = None
    alertrouter/router.py: |
      """The routing table: which team an alert goes to.

      Rules are evaluated in file order and the first match wins. An alert that matches no rule goes to the
      catch-all team.
      """

      from __future__ import annotations

      from dataclasses import dataclass

      from .models import Alert
      from .severity import at_least


      @dataclass(frozen=True)
      class Decision:
          """Where one alert goes and which rule sent it there (None for the catch-all)."""

          alert: Alert
          team: str
          rule: str | None

          def as_dict(self):
              return {
                  "alert": self.alert.name,
                  "fingerprint": self.alert.fingerprint,
                  "team": self.team,
                  "rule": self.rule,
              }


      def _labels_match(rule, alert):
          for label, allowed in rule.match.items():
              if alert.labels.get(label) not in allowed:
                  return False
          for label in rule.absent:
              if label in alert.labels:
                  return False
          return True


      def _rule_matches(rule, alert):
          if rule.min_severity is not None and not at_least(alert.severity, rule.min_severity):
              return False
          return _labels_match(rule, alert)


      class Router:
          """Routes alerts with an ordered list of rules and a catch-all team."""

          def __init__(self, rules, catch_all):
              self.rules = tuple(rules)
              self.catch_all = catch_all

          def route(self, alert):
              for rule in self.rules:
                  if _rule_matches(rule, alert):
                      return Decision(alert, rule.team, rule.name)
              return Decision(alert, self.catch_all, None)

          def route_all(self, alerts):
              """Decisions for *alerts*, in the order given."""
              return [self.route(alert) for alert in alerts]
    alertrouter/severity.py: |
      """Severity names and their order.

      Monitoring systems disagree about severity vocabularies, so alertrouter accepts exactly these four,
      lowest first. Everything that compares severities goes through `rank` or `at_least`.
      """

      SEVERITIES = ("info", "warning", "error", "critical")


      class UnknownSeverity(ValueError):
          """A severity name outside SEVERITIES."""


      def rank(name):
          """Position of *name* in SEVERITIES; higher is more severe."""
          try:
              return SEVERITIES.index(name)
          except ValueError:
              raise UnknownSeverity(f"unknown severity {name!r}; expected one of {', '.join(SEVERITIES)}") from None


      def at_least(severity, floor):
          """True when *severity* is the same as or more severe than *floor*."""
          return rank(severity) >= rank(floor)
