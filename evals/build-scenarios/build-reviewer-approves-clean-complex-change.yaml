          """The dispatcher: de-duplicate, route, and notify.

          `Dispatcher.handle` takes one alert at a time. The notifier is any callable taking
          `(team, target, alert)`; the dispatcher calls it once per delivered alert, with the target of the
          first level of the team's escalation ladder. An alert that a team's quiet hours hold is kept by the
          dispatcher instead, and `release_due` delivers it once the window has ended.
          """

          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import timedelta

          from .dedup import DedupWindow
          from .router import Decision

          DELIVERED = "delivered"
          SUPPRESSED = "suppressed"
          HELD = "held"


          @dataclass(frozen=True)
          class Outcome:
              """What `handle` did with an alert; `decision` is None for a suppressed duplicate."""

              kind: str
              decision: Decision | None


          class Dispatcher:
              def __init__(self, settings, notify):
                  self.settings = settings
                  self.router = settings.build_router()
                  self.dedup = DedupWindow(settings.dedup_seconds)
                  self._notify = notify
                  self._held = []

              def handle(self, alert):
                  if not self.dedup.admit(alert):
                      return Outcome(SUPPRESSED, None)
                  decision = self.router.route(alert)
                  if decision.hold_until is not None:
                      self._held.append(decision)
                      return Outcome(HELD, decision)
                  self._deliver(decision)
                  return Outcome(DELIVERED, decision)

              @property
              def pending(self):
                  """The held decisions not yet delivered, in arrival order."""
                  return tuple(self._held)

              def release_due(self, now):
                  """Deliver every held alert whose window has ended by *now* (an aware time), in arrival order."""
                  if now.tzinfo is None:
                      raise ValueError("now must be a timezone-aware time")
                  due = [decision for decision in self._held if decision.hold_until <= now]
                  self._held = [decision for decision in self._held if decision.hold_until > now]
                  for decision in due:
                      self._deliver(decision)
                  return [Outcome(DELIVERED, decision) for decision in due]

              def _deliver(self, decision):
                  ladder = self.settings.teams[decision.team].escalation
                  target = ladder.level_at(timedelta(0)).target
                  self._notify(decision.team, target, decision.alert)
        alertrouter/matching.py: |
          """Rule matching, apart from everything that happens once a rule has matched.

          `matches` answers whether one rule takes one alert. `select` walks the table in file order and
          returns at the first rule that matches, so the first match wins; an alert that no rule takes falls
          through to the catch-all team.
          """

          from __future__ import annotations

          from typing import NamedTuple

          from .severity import at_least


          class Selection(NamedTuple):
              """The team an alert goes to and the rule that chose it (None for the catch-all)."""

              team: str
              rule: str | None


          def labels_match(rule, alert):
              for label, allowed in rule.match.items():
                  if alert.labels.get(label) not in allowed:
                      return False
              for label in rule.absent:
                  if label in alert.labels:
                      return False
              return True


          def matches(rule, alert):
              """True when every condition of *rule* holds for *alert*."""
              if rule.min_severity is not None and not at_least(alert.severity, rule.min_severity):
                  return False
              return labels_match(rule, alert)


          def select(rules, alert, catch_all):
              """The first rule in *rules* that matches *alert*, or the catch-all team when none does."""
              for rule in rules:
                  if matches(rule, alert):
                      return Selection(rule.team, rule.name)
              return Selection(catch_all, None)
        alertrouter/quiet.py: |
          """Quiet hours: a daily UTC window in which a team is not woken for anything below `critical`.

          A window runs from `start` up to but not including `end`, and may cross midnight: 22:00 to 06:00
          holds an alert fired at 22:00 or 03:00 and delivers one fired at 06:00. `critical` alerts are never
          held.
          """

          from __future__ import annotations

          import re
          from dataclasses import dataclass
          from datetime import datetime, time, timedelta

          from .severity import at_least

          NEVER_HELD = "critical"
          _CLOCK = re.compile(r"([01]\d|2[0-3]):([0-5]\d)")


          def parse_clock(text):
              """Read `HH:MM` (24-hour) into a time of day."""
              found = _CLOCK.fullmatch(text) if isinstance(text, str) else None
              if found is None:
                  raise ValueError(f"expected a time of day as HH:MM, got {text!r}")
              return time(int(found[1]), int(found[2]))


          @dataclass(frozen=True)
          class QuietHours:
              start: time
              end: time

              def __post_init__(self):
                  if self.start == self.end:
                      raise ValueError("quiet hours must start and end at different times")

              @classmethod
              def from_clock(cls, start, end):
                  return cls(parse_clock(start), parse_clock(end))

              def contains(self, moment):
                  """True when the time of day *moment* falls inside the window."""
                  if self.start < self.end:
                      return self.start <= moment < self.end
                  return moment >= self.start or moment < self.end

              def end_after(self, moment):
                  """The first time the window ends after the aware datetime *moment*."""
                  end = datetime.combine(moment.date(), self.end, tzinfo=moment.tzinfo)
                  if end <= moment:
                      end += timedelta(days=1)
                  return end


          def hold_until(window, alert):
              """When *alert* may be delivered under *window*; None when it is not held."""
              if window is None or at_least(alert.severity, NEVER_HELD):
                  return None
              if not window.contains(alert.fired_at.time()):
                  return None
              return window.end_after(alert.fired_at)
        alertrouter/router.py: |
          """The routing table: which team an alert goes to.

          Rules are evaluated in file order and the first match wins. An alert that matches no rule goes to the
          catch-all team. A team with quiet hours has alerts below `critical` held until the window ends; the
          decision says when.
          """

          from __future__ import annotations

          from dataclasses import dataclass
          from datetime import datetime

          from . import quiet
          from .matching import select
          from .models import Alert


          @dataclass(frozen=True)
          class Decision:
              """Where one alert goes and which rule sent it there (None for the catch-all).

              `hold_until` is set only when the team's quiet hours hold the alert.
              """

              alert: Alert
              team: str
              rule: str | None
              hold_until: datetime | None = None

              def as_dict(self):
                  data = {
                      "alert": self.alert.name,
                      "fingerprint": self.alert.fingerprint,
                      "team": self.team,
                      "rule": self.rule,
                  }
                  if self.hold_until is not None:
                      data["hold_until"] = self.hold_until.isoformat()
                  return data


          class Router:
              """Routes alerts with an ordered list of rules and a catch-all team.

              `quiet_hours` maps a team name to its `QuietHours`; teams not listed are never quiet.
              """

              def __init__(self, rules, catch_all, quiet_hours=None):
                  self.rules = tuple(rules)
                  self.catch_all = catch_all
                  self.quiet_hours = dict(quiet_hours or {})

              def route(self, alert):
                  team, rule = select(self.rules, alert, self.catch_all)
                  return Decision(alert, team, rule, quiet.hold_until(self.quiet_hours.get(team), alert))

              def route_all(self, alerts):
                  """Decisions for *alerts*, in the order given."""
                  return [self.route(alert) for alert in alerts]
        README.md: |
          # alertrouter

          Routes incoming alerts to on-call teams. Standard library only; run the tests with
          `python -m pytest -q`.

          ## Concepts

          - An **alert** has a name, a severity (`info`, `warning`, `error` or `critical`), string labels and
            the time it fired. Times are UTC; a time without an offset is read as UTC.
          - A **rule** names a team and says which alerts it takes: label matchers (`match`), labels that
            must be absent (`absent`) and a severity floor (`min_severity`).
          - A **team** has an escalation ladder: who is paged first, and who takes over after how many minutes.
            It may also have quiet hours.

          ## Contracts

          - Rules are evaluated in file order and the first match wins.
          - An alert with no matching rule goes to the catch-all team.
          - A rule matches only when every one of its conditions holds. A label matcher lists the values the
            label may have; the alert's label must be present and equal to one of them.
          - `min_severity` matches alerts at that severity or above.
          - An alert with the same name and labels as one delivered less than `dedup_seconds` earlier is
            suppressed. A suppressed alert does not restart the window. The default is 300 seconds; 0 turns
            de-duplication off.
          - Every delivered alert is notified to the first level of its team's escalation ladder.
          - During a team's quiet hours, alerts below `critical` are held and delivered when the window ends;
            `critical` alerts are never held. A window runs from its start up to but not including its end, in
            UTC, and may cross midnight (`22:00` to `06:00`). Its start and end must differ. Teams without
            quiet hours are unaffected.
          - A rules file is checked as a whole before anything is routed; a file that fails the check raises
            `ConfigError`, and the command line prints `error: ...` and exits with status 2.

          ## Rules file

          ```json
          {
            "catch_all": "platform",
            "dedup_seconds": 300,
            "teams": {
              "platform": {"escalation": [{"target": "platform-oncall", "after_minutes": 0}]},
              "payments": {"escalation": [
                {"target": "payments-oncall", "after_minutes": 0},
                {"target": "payments-lead", "after_minutes": 30}
              ], "quiet_hours": {"start": "22:00", "end": "06:00"}}
            },
            "rules": [
              {"name": "payments-errors", "team": "payments", "match": {"service": ["checkout", "ledger"]},
               "min_severity": "error"}
            ]
          }
          ```

          ## Command line

          ```
          python -m alertrouter check    --config FILE
          python -m alertrouter route    --config FILE --alerts FILE
          python -m alertrouter dispatch --config FILE --alerts FILE
          ```

          `route` prints one JSON decision per alert; a held alert's decision also carries `hold_until`.
          `dispatch` prints what happened to each alert and then the notifications it sent, and reports a
          held alert as `held` without waiting. A long-running service calls `Dispatcher.release_due(now)` on
          its own tick to deliver what the window has released.

          ## Layout

          | Module | Role |
          |---|---|
          | `models.py` | `Alert` and `Rule` |
          | `severity.py` | Severity names and their order |
          | `matching.py` | Whether a rule takes an alert, and first-match selection |
          | `quiet.py` | Quiet-hours windows |
          | `router.py` | `Router` and `Decision` |
          | `escalation.py` | Escalation ladders |
          | `dedup.py` | The de-duplication window |
          | `config.py` | Load and validate the rules file |
          | `dispatch.py` | De-duplicate, route, notify |
          | `cli.py` | The command line |
        tests/test_matching.py: |
          import pytest

          from alertrouter.matching import Selection, matches, select
          from alertrouter.router import Router
          from tests import alert, rule


          def test_matches_requires_every_condition():
              wanted = rule("r", "t", match={"service": "checkout"}, absent=["maintenance"], min_severity="error")
              assert matches(wanted, alert(severity="error", labels={"service": "checkout"}))
              assert not matches(wanted, alert(severity="warning", labels={"service": "checkout"}))
              assert not matches(wanted, alert(severity="error", labels={"service": "cart"}))
              assert not matches(wanted, alert(severity="error", labels={"service": "checkout", "maintenance": "1"}))


          def test_select_returns_the_first_matching_rule():
              rules = [
                  rule("broad", "web", match={"service": "checkout"}),
                  rule("narrow", "payments", match={"service": "checkout"}, min_severity="critical"),
              ]
              picked = select(rules, alert(severity="critical", labels={"service": "checkout"}), "platform")
              assert picked == Selection("web", "broad")


          def test_select_falls_through_to_the_catch_all_after_the_last_rule():
              rules = [rule("db", "data", match={"service": "orders-db"}), rule("web", "web", match={"service": "cart"})]
              assert select(rules, alert(labels={"service": "ledger"}), "platform") == Selection("platform", None)


          @pytest.mark.parametrize("labels, severity", [
              ({"service": "checkout"}, "info"),
              ({"service": "cart"}, "error"),
              ({}, "warning"),
          ])
          def test_the_router_agrees_with_select(labels, severity):
              rules = [
                  rule("loud-checkout", "payments", match={"service": "checkout"}, min_severity="error"),
                  rule("prod", "web", match={"env": ["prod"]}),
                  rule("cart", "cart", match={"service": "cart"}, absent=["env"]),
              ]
              subject = alert(severity=severity, labels=labels)
              decision = Router(rules, "platform").route(subject)
              assert (decision.team, decision.rule) == select(rules, subject, "platform")
              assert decision.hold_until is None
        tests/test_quiet.py: |
          from datetime import UTC, datetime, time

          import pytest

          from alertrouter import config
          from alertrouter.config import ConfigError
          from alertrouter.dispatch import DELIVERED, HELD, Dispatcher
          from alertrouter.quiet import QuietHours, hold_until, parse_clock
          from alertrouter.router import Router
          from tests import alert, at, rule, rules_file

          OVERNIGHT = QuietHours(time(22, 0), time(6, 0))
          DAYTIME = QuietHours(time(9, 0), time(17, 0))


          @pytest.mark.parametrize("moment, inside", [
              (time(22, 0), True), (time(21, 59, 59), False), (time(23, 59, 59), True), (time(0, 0), True),
              (time(5, 59, 59), True), (time(6, 0), False), (time(12, 0), False),
          ])
          def test_a_window_that_crosses_midnight(moment, inside):
              assert OVERNIGHT.contains(moment) is inside


          @pytest.mark.parametrize("moment, inside", [
              (time(9, 0), True), (time(8, 59, 59), False), (time(16, 59, 59), True), (time(17, 0), False),
              (time(0, 0), False), (time(23, 0), False),
          ])
          def test_a_window_inside_one_day(moment, inside):
              assert DAYTIME.contains(moment) is inside


          @pytest.mark.parametrize("text", ["6:00", "24:00", "12:60", "noon", "06:00:00", "", None, 600])
          def test_clock_times_are_strict(text):
              with pytest.raises(ValueError, match="HH:MM"):
                  parse_clock(text)


          def test_the_window_ends_on_the_next_day_when_it_crossed_midnight():
              assert OVERNIGHT.end_after(at(23, 30, day=4)) == at(6, 0, day=5)


          def test_the_window_ends_the_same_day_after_midnight():
              assert OVERNIGHT.end_after(at(3, 0, day=5)) == at(6, 0, day=5)
              assert OVERNIGHT.end_after(at(0, 0, day=5)) == at(6, 0, day=5)


          def test_critical_is_never_held():
              assert hold_until(OVERNIGHT, alert(severity="critical", fired_at=at(23, 0))) is None


          @pytest.mark.parametrize("severity", ["info", "warning", "error"])
          def test_everything_below_critical_is_held(severity):
              assert hold_until(OVERNIGHT, alert(severity=severity, fired_at=at(23, 0, day=4))) == at(6, 0, day=5)


          def test_an_alert_outside_the_window_or_without_one_is_not_held():
              assert hold_until(OVERNIGHT, alert(fired_at=at(12, 0))) is None
              assert hold_until(OVERNIGHT, alert(fired_at=at(6, 0))) is None
              assert hold_until(OVERNIGHT, alert(fired_at=at(5, 59, 59))) == at(6, 0)
              assert hold_until(None, alert(fired_at=at(23, 0))) is None


          def test_the_router_holds_by_the_team_the_rule_picked():
              rules = [rule("pay", "payments", match={"service": "checkout"})]
              router = Router(rules, "platform", {"payments": OVERNIGHT})
              held = router.route(alert(labels={"service": "checkout"}, fired_at=at(23, 0, day=4)))
              assert (held.team, held.hold_until) == ("payments", at(6, 0, day=5))
              other = router.route(alert(labels={"service": "cart"}, fired_at=at(23, 0, day=4)))
              assert (other.team, other.hold_until) == ("platform", None)


          def test_as_dict_shows_hold_until_only_when_held():
              router = Router([rule("pay", "payments")], "platform", {"payments": OVERNIGHT})
              assert router.route(alert(fired_at=at(12, 0))).as_dict().keys() == {"alert", "fingerprint", "team", "rule"}
              held = router.route(alert(fired_at=at(23, 0, day=4))).as_dict()
              assert held["hold_until"] == "2031-03-05T06:00:00+00:00"


          def quiet_settings(**quiet):
              data = rules_file()
              data["teams"]["payments"]["quiet_hours"] = quiet or {"start": "22:00", "end": "06:00"}
              return config.parse(data)


          def test_config_builds_quiet_hours_for_the_team_that_has_them():
              router = quiet_settings().build_router()
              assert router.quiet_hours == {"payments": OVERNIGHT}


          @pytest.mark.parametrize("quiet, message", [
              ({"start": "22:00"}, "teams.payments.quiet_hours: expected a time of day as HH:MM, got None"),
              ({"start": "22:00", "end": "22:00"}, "different times"),
              ({"start": "22:00", "end": "06:00", "zone": "UTC"}, "unknown key 'zone'"),
          ])
          def test_config_rejects_bad_quiet_hours(quiet, message):
              with pytest.raises(ConfigError) as caught:
                  quiet_settings(**quiet)
              assert message in str(caught.value)


          def dispatcher(settings):
              sent = []
              return Dispatcher(settings, lambda team, target, a: sent.append((team, target, a.name))), sent


          def test_a_held_alert_waits_and_is_released_when_the_window_ends():
              dispatch, sent = dispatcher(quiet_settings())
              outcome = dispatch.handle(alert("Slow", "error", {"service": "checkout"}, at(23, 0, day=4)))
              assert outcome.kind == HELD
              assert sent == [] and len(dispatch.pending) == 1
              assert dispatch.release_due(datetime(2031, 3, 5, 5, 59, 59, tzinfo=UTC)) == []
              released = dispatch.release_due(datetime(2031, 3, 5, 6, 0, tzinfo=UTC))
              assert [o.kind for o in released] == [DELIVERED]
              assert sent == [("payments", "payments-oncall", "Slow")]
              assert dispatch.pending == ()


          def test_a_critical_alert_in_quiet_hours_is_delivered_at_once():
              dispatch, sent = dispatcher(quiet_settings())
              outcome = dispatch.handle(alert("Down", "critical", {"service": "checkout"}, at(23, 0, day=4)))
              assert outcome.kind == DELIVERED
              assert len(sent) == 1 and dispatch.pending == ()


          def test_released_alerts_keep_their_arrival_order():
              dispatch, sent = dispatcher(quiet_settings())
              for minute, name in enumerate(["A", "B", "C"]):
                  dispatch.handle(alert(name, "error", {"service": "checkout"}, at(23, minute, day=4)))
              assert sent == []
              dispatch.release_due(datetime(2031, 3, 5, 7, 0, tzinfo=UTC))
              assert [name for _, _, name in sent] == ["A", "B", "C"]


          def test_release_due_keeps_alerts_whose_window_has_not_ended():
              dispatch, sent = dispatcher(quiet_settings())
              dispatch.handle(alert("Late", "error", {"service": "checkout"}, at(23, 0, day=4)))
              dispatch.handle(alert("Early", "error", {"service": "checkout"}, at(3, 0, day=5)))
              dispatch.release_due(datetime(2031, 3, 5, 5, 0, tzinfo=UTC))
              assert sent == []
              assert [d.alert.name for d in dispatch.pending] == ["Late", "Early"]
