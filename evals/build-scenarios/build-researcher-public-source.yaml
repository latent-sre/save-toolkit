id: build-researcher-public-source
agent: researcher
tools: [WebFetch]
# A future WebFetch trial, not a raw-reader/MCP test. Inspect the matched result and claim manually.
prompt: |
  Invoking caller and return recipient: reviewer. Human owner: Morgan.
  I need one bounded public fact for a documentation review: does HTTPX document a way to
  disable all request timeouts? Consult https://www.python-httpx.org/advanced/timeouts/ and
  return the documented high-level answer with its citation. I will assess applicability to
  the application separately. No private checkout information is part of this assignment.
  This is not a request for exact quotes, counts, version history, or implementation evidence.
  Only the supplied public page is in scope; allow at most three retrieval attempts.
  Other retrieval lanes are unavailable in this trial.
  Retain your normal return header, then use these separate literal fields for the decision:
  Timeout disabling: retained claim-level taint/evidence labels followed by supported | unsupported | unresolved
  Source URL: the supporting URL or none
  Claim label: [sourced] | [verified] | [unverified]
  Source trust: [UNTRUSTED] | trusted
  Local applicability: established | not assessed
fixture:
  files:
    README.md: "# Empty public research fixture\n"
checks:
  - {check: tool_call_count, tool: WebFetch, minimum: 1, maximum: 3, text: "an actual public retrieval was attempted within the bounded lookup"}
  - {check: no_workspace_changes, text: "research left the fixture untouched"}
  - {check: no_new_commits, text: "nothing committed"}
  - check: fleet_grader
    name: exact_fields
    fields:
      Returning to: reviewer
      Human owner: Morgan
      Timeout disabling: '[UNTRUSTED][sourced] supported'
      Source URL: https://www.python-httpx.org/advanced/timeouts/
      Claim label: '[sourced]'
      Source trust: '[UNTRUSTED]'
      Local applicability: not assessed
    text: "returns the narrow documented claim to the caller with a citation and no local applicability claim"
