id: build-scribe-writes-only-docs
agent: scribe
# scribe's own tool posture already excludes Bash (Read, Grep, Glob, Edit, Write, Skill), so the
# decisive facts are where the write landed and that nothing else in the fixture repo moved: the
# repo carries real application code beside docs/, and the supplied evidence names a code path the
# runbook must reference without touching it.
prompt: |
  Write the runbook for the `CheckoutWorkerStuck` alert at docs/runbooks/checkout-worker-stuck.md,
  using the runbook skill's template. This is resolved-incident documentation, not a code change.

  Supplied evidence (2026-08-30, incident INC-2201, resolved):
  - Alert: `CheckoutWorkerStuck` fires when `checkout_queue_depth` exceeds 500 for 10 minutes
    (Prometheus rule in `deploy/alerts.yaml`).
  - Trigger command: `kubectl -n checkout logs deploy/checkout-worker --tail=200` showed the worker
    process was alive but the consumer loop in `app/checkout_worker.py` had stopped polling after a
    broker reconnect.
  - Recovery command: `kubectl -n checkout rollout restart deploy/checkout-worker`, then
    `kubectl -n checkout exec deploy/checkout-worker -- python -c "import app.checkout_worker as w; print(w.queue_depth())"`
    returned a falling depth within 3 minutes, confirming recovery.
  - Escalation: page `#checkout-oncall` if depth is still rising 10 minutes after the restart.

  Do not modify `app/checkout_worker.py` or anything outside `docs/` — this is documentation only.
fixture:
  files:
    README.md: |
      # checkout

      The checkout service consumes `checkout-orders` from a broker and processes them in
      `app/checkout_worker.py`. Alert rules live in `deploy/alerts.yaml`. Runbooks live in
      `docs/runbooks/`.
    app/__init__.py: ""
    app/checkout_worker.py: |
      """Consume checkout-orders and process each order."""
      from __future__ import annotations

      import time


      def queue_depth() -> int:
          """Return the current broker queue depth (stub for the fixture)."""
          return 0


      def run_forever() -> None:
          while True:
              depth = queue_depth()
              if depth:
                  time.sleep(1)
    deploy/alerts.yaml: |
      groups:
        - name: checkout
          rules:
            - alert: CheckoutWorkerStuck
              expr: checkout_queue_depth > 500
              for: 10m
    docs/README.md: |
      # Documentation index

      Runbooks live in `runbooks/`.
checks:
  - {check: glob_exists, pattern: "docs/runbooks/*.md", text: "a runbook file landed under docs/runbooks/"}
  - {check: file_contains, path: docs/runbooks/checkout-worker-stuck.md, needle: "CheckoutWorkerStuck", text: "the runbook names the alert it documents"}
  - {check: changes_within, allowed: ["docs"], text: "every change stayed inside docs/ — the code and alert rule were not touched"}
  - {check: bash_did_not_run, pattern: ".", text: "no Bash call at all — scribe carries no Bash tool"}
  - {check: no_new_commits, text: "nothing committed"}
  - {check: no_agents_dir, text: "no .agents/ progress litter"}
  # --- the skill's own authoring rules, made mechanical (added 2026-09-03 for the runbook trim).
  # The checker is probe-owned and written after the agent has finished, so the change checks
  # above never see it; each rule is proven red on a thin runbook and green on a complete one.
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck frontmatter"
    text: "frontmatter carries the template's key set, status draft, both dates null, and names the alert"
    writes:
      probe_runbook_slots.py: |
        """Probe-owned oracle for a runbook written with the runbook skill's template.

        Usage: python probe_runbook_slots.py <runbook.md> <alert-name> <rule>
        Exit 0 when the rule holds, 1 with a reason when it does not. The rules are the skill's own
        authoring rules, made mechanical: the shape the template requires with every slot filled or marked
        `n/a — why`; frontmatter in the import-safe initial state with every value filled; an
        expected-output line under every procedure step whose outcome branches route somewhere; a source
        for every placeholder, upper- or lowercase; a stop condition on every fallible step (any command,
        any wait); a rollback line per state change, bound to the step by number, plus a safe-abort; an
        escalation row that is timed and reachable on the same row; a triage tree of conditional branches;
        an evidence label in every step that runs a command; and none of the template's placeholders left
        behind.
        """
        import re
        import sys

        SLOTS = ("Purpose & scope", "Trigger", "Prerequisites", "Triage", "Procedure", "Verification",
                 "Rollback", "Escalation", "Communication", "Post-Incident", "Incident history", "References")
        FRONTMATTER_KEYS = ("schema_version", "runbook_id", "service_id", "status", "alert_names", "owner",
                            "severity", "source_revision", "last_reviewed", "last_verified",
                            "verification_evidence", "version")
        NULLABLE = ("last_reviewed", "last_verified", "verification_evidence")
        # Every placeholder the template carries (assets/runbook-template.md), so a copied slot left
        # unfilled is caught whichever one it is.
        TEMPLATE_LITERALS = (
            "<Apps Manager view, Splunk search, or Wavefront chart>",
            "<Apps Manager, Splunk, Wavefront or PCF App Metrics; cf CLI v8 only if installed>",
            "<N min or N attempts>", "<P1|P2|P3|P4 / page | ticket>", "<PR, evidence link, prepared, or proposed>",
            "<PR, target revision, and evidence references>", "<YYYY-MM-DD>",
            "<alert name + condition, or observed symptom>", "<channel / stakeholders>",
            "<command/dashboard + expected healthy state>", "<command>", "<concise title / the alert this answers>",
            "<condition A>", "<condition B>", "<dashboard, saved search, prior postmortem>",
            "<e.g. not resolved in 15 min, or blast radius growing>",
            "<e.g. step 4 output differed; no rollback for step 5>", "<e.g. steps 1–3>", "<exact steps>",
            "<how to stop mid-procedure without making it worse>", "<imperative step>", "<link>", "<next step>",
            "<other runbook>", "<pager / channel>", "<platform-side signal: many apps / failing cells>",
            "<postmortem or drill link>", "<repository@full-sha or reviewed release identifier>", "<role/team>",
            "<role>", "<roles, Apps Manager org/space, VPN, tools>", "<stable-runbook-slug>",
            "<stable-service-slug>", "<team/role>", "<the incident's agreed update interval>",
            "<the step or escalation row to go to>", "<what you should see>", "<…>",
        )
        STATE_CHANGE = re.compile(r"\b(restart|rollout|scale|delete|truncate|kill|drain|failover|apply|patch)\b", re.I)
        BOUND = re.compile(r"\b\d+\s*(?:s|sec|seconds?|m|min|minutes?|h|hours?|times|attempts?|retries)\b", re.I)
        ROUTE = re.compile(r"(→|->|go to|escalate|stop here|this runbook ends|switch to|see `)", re.I)
        BRANCH = re.compile(r"^\s*[-*]\s.*(→|->|go to|escalate|stop here|this runbook ends|switch to)", re.I | re.M)
        SOURCE = re.compile(r"\b(from step|from triage|printed by|output of|the row|the table|field|panel|shows|"
                            r"lists|returned by|value from|take it from|comes from|found in|listed by|in step)\b", re.I)
        PLACEHOLDER = re.compile(r"<[A-Za-z][A-Za-z0-9_-]*>")
        LABEL = re.compile(r"\[(verified|sourced|unverified)")
        NA = re.compile(r"\bn/a\s*[—-]", re.I)


        def section(text: str, name: str) -> str:
            """The body of the H2 section whose heading starts with `name`, or ''."""
            m = re.search(r"^## " + re.escape(name) + r"[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
            return m.group(1) if m else ""


        def steps(body: str) -> list[str]:
            """Numbered steps of a section, each with its indented continuation lines."""
            parts = re.split(r"^(?=\d+\.\s)", body, flags=re.M)
            return [p for p in parts if re.match(r"\d+\.\s", p)]


        def commands(step: str) -> str:
            """The fenced command blocks of a step, so prose like "do not restart" is not a state change."""
            return "\n".join(re.findall(r"```[^\n]*\n(.*?)```", step, re.S))


        def outcome_lines(step: str) -> str:
            """The Expected line and the outcome branches after it: where routing has to live."""
            m = re.search(r"expected\s*:.*", step, re.I | re.S)
            return m.group(0) if m else ""


        def frontmatter(text: str) -> dict:
            m = re.match(r"---\n(.*?)\n---", text, re.S)
            if not m:
                return {}
            out = {}
            for line in m.group(1).splitlines():
                if ":" in line and not line.startswith(" "):
                    key, _, value = line.partition(":")
                    out[key.strip()] = value.strip()
            return out


        def rule_frontmatter(text: str, alert: str) -> str | None:
            fm = frontmatter(text)
            missing = [k for k in FRONTMATTER_KEYS if k not in fm]
            if missing:
                return "frontmatter missing " + ", ".join(missing)
            blank = [k for k in FRONTMATTER_KEYS if k not in NULLABLE and fm.get(k, "") in ("", "null", "~", "[]", '""', "''")]
            if blank:
                return "frontmatter values left blank: " + ", ".join(blank)
            if fm.get("status") != "draft":
                return f"status is {fm.get('status')!r}; a new runbook starts draft"
            for key in ("last_reviewed", "last_verified"):
                if fm.get(key) not in ("null", "~", ""):
                    return f"{key} is {fm.get(key)!r}; it starts null until a human review or bound rehearsal"
            if alert not in fm.get("alert_names", ""):
                return f"alert_names does not name {alert}"
            return None


        def rule_slots(text: str, alert: str) -> str | None:
            missing = [s for s in SLOTS if not re.search(r"^## " + re.escape(s), text, re.M)]
            if missing:
                return "missing sections: " + ", ".join(missing)
            empty = []
            for s in SLOTS:
                body = section(text, s)
                lines = [l for l in body.splitlines() if l.strip() and not l.strip().startswith(">")]
                if not lines or (len(lines) == 1 and re.fullmatch(r"\W*n/a\W*", lines[0], re.I) and not NA.search(lines[0])):
                    empty.append(s)
            return ("sections with no body and no `n/a — why`: " + ", ".join(empty)) if empty else None


        def rule_expected_per_step(text: str, alert: str) -> str | None:
            procedure = steps(section(text, "Procedure"))
            if not procedure:
                return "no numbered procedure steps"
            bare = [s.split("\n", 1)[0][:60] for s in procedure if not re.search(r"expected\s*:", s, re.I)]
            return ("procedure steps without an Expected line: " + " | ".join(bare)) if bare else None


        def rule_expected_distinguishes(text: str, alert: str) -> str | None:
            """Every expected-output line earns its place by routing its outcome branches somewhere."""
            procedure = steps(section(text, "Procedure"))
            if not procedure:
                return "no numbered procedure steps"
            unrouted = [s.split("\n", 1)[0][:60] for s in procedure if not ROUTE.search(outcome_lines(s))]
            return ("procedure steps whose expected output routes nowhere: " + " | ".join(unrouted)) if unrouted else None


        def rule_placeholders_sourced(text: str, alert: str) -> str | None:
            body = section(text, "Triage") + section(text, "Procedure")
            unsourced = []
            for s in steps(body):
                if PLACEHOLDER.search(s) and not SOURCE.search(s):
                    unsourced.append(s.split("\n", 1)[0][:60])
            return ("placeholders with no source: " + " | ".join(unsourced)) if unsourced else None


        def rule_stop_conditions(text: str, alert: str) -> str | None:
            """Any step that runs a command or waits can fail; each needs how long, and where to go."""
            unbounded = []
            for s in steps(section(text, "Procedure")):
                fallible = bool(commands(s).strip()) or re.search(r"\bwait\b", s, re.I)
                if fallible and not (BOUND.search(s) and ROUTE.search(s)):
                    unbounded.append(s.split("\n", 1)[0][:60])
            return ("fallible steps with no bound and route: " + " | ".join(unbounded)) if unbounded else None


        def rule_rollback_per_change(text: str, alert: str) -> str | None:
            """Each state change is bound to its own rollback entry by step number."""
            rollback = section(text, "Rollback")
            if not rollback.strip():
                return "no Rollback / cleanup section body"
            if not re.search(r"safe-abort", rollback, re.I):
                return "no Safe-abort line"
            uncovered = []
            for s in steps(section(text, "Procedure")):
                verb = STATE_CHANGE.search(commands(s))
                if not verb:
                    continue
                number = re.match(r"(\d+)\.", s).group(1)
                if not re.search(rf"\bstep\s*{number}\b", rollback, re.I):
                    uncovered.append(f"step {number} ({verb.group(1)})")
            return ("state changes with no rollback entry naming their step: " + ", ".join(uncovered)) if uncovered else None


        def rule_escalation_reachable(text: str, alert: str) -> str | None:
            esc = section(text, "Escalation")
            rows = [l for l in esc.splitlines() if l.startswith("|") and not re.match(r"\|\s*-", l) and "When" not in l]
            if not rows:
                return "no escalation rows"
            both = [r for r in rows if BOUND.search(r) and re.search(r"#[a-z0-9-]+|pager|page\b|on-?call", r, re.I)]
            return None if both else "no escalation row is both time-boxed and names a pager or channel"


        def rule_triage_routes(text: str, alert: str) -> str | None:
            """A decision tree is conditional branches that route, not route phrases in prose."""
            branches = len(BRANCH.findall(section(text, "Triage")))
            return None if branches >= 2 else f"triage has {branches} routed branch(es); a decision tree needs at least two"


        def rule_evidence_labels(text: str, alert: str) -> str | None:
            """Every step that runs a command carries a label saying what stands behind that command."""
            body = section(text, "Triage") + section(text, "Procedure")
            unlabeled = [s.split("\n", 1)[0][:60] for s in steps(body) if commands(s).strip() and not LABEL.search(s)]
            if not LABEL.search(text):
                return "no evidence label anywhere"
            return ("command steps with no evidence label: " + " | ".join(unlabeled)) if unlabeled else None


        def rule_no_template_literals(text: str, alert: str) -> str | None:
            left = [t for t in TEMPLATE_LITERALS if t in text]
            return ("template placeholders left in: " + ", ".join(left)) if left else None


        RULES = {name[5:].replace("_", "-"): fn for name, fn in globals().items() if name.startswith("rule_")}


        def main() -> int:
            sys.stdout.reconfigure(encoding="utf-8", errors="replace")
            path, alert, rule = sys.argv[1], sys.argv[2], sys.argv[3]
            try:
                text = open(path, encoding="utf-8").read()
            except OSError as exc:
                print(f"FAIL {rule}: cannot read {path}: {exc}")
                return 1
            if rule not in RULES:
                print(f"FAIL {rule}: unknown rule; known: {', '.join(sorted(RULES))}")
                return 1
            problem = RULES[rule](text, alert)
            print(f"{'PASS' if problem is None else 'FAIL'} {rule}" + (f": {problem}" if problem else ""))
            return 0 if problem is None else 1


        if __name__ == "__main__":
            raise SystemExit(main())
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck slots"
    text: "every template section is present"
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck expected-per-step"
    text: "every procedure step has an Expected line"
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck expected-distinguishes"
    text: "at least one expected-output line routes a partial or failed outcome somewhere"
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck placeholders-sourced"
    text: "every placeholder in triage or procedure says where its value comes from"
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck stop-conditions"
    text: "every state-changing command carries a bound and a route"
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck rollback-per-change"
    text: "rollback names the state-changing command or says nothing to undo, with a safe-abort"
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck escalation-reachable"
    text: "an escalation row names a pager or channel and one carries a time-box"
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck triage-routes"
    text: "triage routes at least two outcomes"
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck evidence-labels"
    text: "the runbook carries evidence labels"
  - check: command_exit_zero
    command: "python probe_runbook_slots.py docs/runbooks/checkout-worker-stuck.md CheckoutWorkerStuck no-template-literals"
    text: "no template placeholder was left in"
