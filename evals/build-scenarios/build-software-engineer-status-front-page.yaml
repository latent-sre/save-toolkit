    tsconfig.json: |
      {
        "compilerOptions": {
          "target": "ES2022",
          "lib": ["ES2022", "DOM", "DOM.Iterable"],
          "module": "ESNext",
          "moduleResolution": "bundler",
          "jsx": "react-jsx",
          "strict": true,
          "noUnusedLocals": true,
          "noUnusedParameters": true,
          "noFallthroughCasesInSwitch": true,
          "noEmit": true,
          "skipLibCheck": true,
