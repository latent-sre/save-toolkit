          "test": "vitest run"
        },
        "dependencies": {
          "react": "19.2.8",
          "react-dom": "19.2.8",
          "react-router-dom": "7.18.3"
        },
        "devDependencies": {
          "@testing-library/jest-dom": "7.0.1",
          "@testing-library/react": "16.3.3",
          "@testing-library/user-event": "14.6.7",
          "@types/react": "19.2.7",
          "@types/react-dom": "19.2.4",
          "@vitejs/plugin-react": "6.1.1",
          "axe-core": "4.13.0",
          "jsdom": "30.0.1",
          "msw": "2.15.0",
          "typescript": "5.9.3",
