id: build-software-engineer-status-front-page
max_turns: 64
agent: software-engineer
# The site-register and design bar. The prompt asks for the front page of an internal platform
# status site — overall health, each service's state and 30-day availability, a timeline of
# recent incidents — and says it is a site, not an operator console, and should look chosen
# rather than templated; it never says "design brief", "register", "hero", "status never by
# colour alone" or "tokens". There is no rendered-page oracle: register and visual choices are
# judged by a human in the review viewer from the shipped code and the agent's packet (the
# design brief should appear there). The structural checks keep the comparison honest.
# The fixture is the opsconsole app with GET /v1/status and the cursor-paginated GET
# /v1/incidents documented in docs/openapi.yaml and implemented by MSW handlers.
prompt: |
  Build the front page for our internal platform status site at `/` in this React app: overall
  health right now, the list of services with their current state and 30-day availability, and a
  timeline of recent incidents (data from `GET /v1/status` and `GET /v1/incidents`; see
  `docs/openapi.yaml`). This is the page people open from the wiki to check whether "the
  platform" is OK. It's a site, not an operator console; make it look like something we chose,
  not a template. Build it end to end in this repo and tell me what you ran to verify it.
  Tests go next to the code as `*.test.tsx`; this repo uses Vitest, Testing Library, and MSW (see
  the README). This is a code change, not a design question, not a review, and not an incident.
  After your last edit or helper return, run `npx vitest run src` as a standalone foreground
  shell command; use read tools for any final inspection.
  Use separate Changed and Verified headings in your final response, explaining the changes and verification results.
fixture:
  files:
    .gitignore: |
      node_modules/
      dist/
      coverage/
      .vite/
    README.md: |
      # opsconsole

      The internal operations console and platform status site: a Vite + React + TypeScript
      single-page app served behind the ops gateway. Routes live in `src/App.tsx`;
      `src/api/client.ts` wraps `fetch` for the JSON API the gateway proxies at the same origin.
      The API contract is `docs/openapi.yaml`; the legacy `/api/services` endpoint predates it.

      Install dependencies once, then work from the repo root:

          npm install

      Typecheck and test:

          npm run typecheck     # tsc --noEmit
          npm test              # vitest run

      Component tests sit next to the component as `*.test.tsx` and mock the API at the network
      layer with MSW (`src/test/server.ts`); `src/test/setup.ts` starts the server for every test
      file. `npm run dev` serves the app locally.
    docs/openapi.yaml: |
      openapi: 3.1.0
      info: { title: Ops Console API, version: 1.0.0 }
      servers:
        - url: /
      paths:
        /v1/status:
          get:
            operationId: getPlatformStatus
            summary: Overall platform health and each service's current state.
            responses:
              "200":
                description: The platform status.
                headers:
                  X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
                content:
                  application/json:
                    schema: { $ref: "#/components/schemas/PlatformStatus" }
              "500": { $ref: "#/components/responses/Problem" }
        /v1/incidents:
          get:
            operationId: listIncidents
            summary: List incidents, newest first (cursor-paginated).
            parameters:
              - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 2048 }, description: Opaque cursor from next_cursor; omit on the first page. }
              - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1 } }
              - { name: status, in: query, schema: { type: string, enum: [open, closed] } }
            responses:
              "200":
                description: A page of incidents.
                headers:
                  X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
                content:
                  application/json:
                    schema: { $ref: "#/components/schemas/IncidentPage" }
              "429": { $ref: "#/components/responses/RateLimited" }
              "500": { $ref: "#/components/responses/Problem" }
      components:
        headers:
          X-Request-ID:
            description: Correlates this response with the request log line; equals the problem body's request_id.
            schema: { type: string, minLength: 1 }
        responses:
          Problem:
            description: RFC 9457 problem+json. `type` and codes are part of the contract.
            headers:
              X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            content:
              application/problem+json:
                schema: { $ref: "#/components/schemas/Problem" }
          RateLimited:
            description: Rate limited; Retry-After is required.
            headers:
              Retry-After: { required: true, schema: { type: integer }, description: Seconds to wait. }
              X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            content:
              application/problem+json:
                schema: { $ref: "#/components/schemas/Problem" }
        schemas:
          Problem:
            type: object
            properties:
              type: { type: string, format: uri }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
              request_id: { type: string, minLength: 1 }
            required: [type, title, status, request_id]
          ServiceStatus:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              state: { type: string, enum: [ok, degraded, outage, unknown] }
              availability_30d: { type: number, minimum: 0, maximum: 100, description: Percent of the last 30 days the service met its SLO. }
            required: [id, name, state, availability_30d]
          PlatformStatus:
            type: object
            properties:
              overall: { type: string, enum: [ok, degraded, outage] }
              updated_at: { type: string, format: date-time }
              services: { type: array, items: { $ref: "#/components/schemas/ServiceStatus" } }
            required: [overall, updated_at, services]
          Incident:
            type: object
            properties:
              id: { type: string }
              status: { type: string, enum: [open, closed] }
              title: { type: string }
              service: { type: string }
              created_at: { type: string, format: date-time }
              resolved_at: { type: [string, "null"], format: date-time }
            required: [id, status, title, service, created_at, resolved_at]
          IncidentPage:
            type: object
            properties:
              data: { type: array, items: { $ref: "#/components/schemas/Incident" } }
              next_cursor: { type: [string, "null"], minLength: 1, maxLength: 2048 }
            required: [data, next_cursor]
    package.json: |
      {
        "name": "opsconsole",
        "private": true,
        "version": "0.1.0",
        "type": "module",
        "scripts": {
          "dev": "vite",
          "build": "tsc --noEmit && vite build",
