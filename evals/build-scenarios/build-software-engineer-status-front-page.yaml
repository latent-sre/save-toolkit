      }
    src/main.tsx: |
      import { StrictMode } from 'react';
      import { createRoot } from 'react-dom/client';
      import { BrowserRouter } from 'react-router-dom';

      import App from './App';

      createRoot(document.getElementById('root')!).render(
        <StrictMode>
          <BrowserRouter>
            <App />
          </BrowserRouter>
        </StrictMode>,
      );
    src/App.tsx: |
      import { Link, Route, Routes } from 'react-router-dom';

      import Home from './pages/Home';
      import Services from './pages/Services';

      export default function App() {
        return (
          <div className="app">
            <nav aria-label="Primary">
              <ul>
                <li>
                  <Link to="/">Status</Link>
                </li>
                <li>
                  <Link to="/services">Services</Link>
                </li>
              </ul>
            </nav>
            <main>
              <Routes>
                <Route path="/" element={<Home />} />
                <Route path="/services" element={<Services />} />
              </Routes>
            </main>
          </div>
        );
      }
    src/api/client.ts: |
      export async function apiGet<T>(path: string): Promise<T> {
        const response = await fetch(path, { headers: { Accept: 'application/json' } });
        if (!response.ok) {
          throw new Error(`GET ${path} failed with ${response.status}`);
        }
        return (await response.json()) as T;
      }
    src/pages/Home.tsx: |
      export default function Home() {
        return (
          <section>
            <h1>Platform status</h1>
            <p>This page will show whether the platform is healthy.</p>
          </section>
        );
      }
    src/pages/Services.tsx: |
      import { useEffect, useState } from 'react';

      export type Service = {
        name: string;
        tier: number;
        owner: string;
      };

      export default function Services() {
        const [services, setServices] = useState<Service[]>([]);
        const [tier, setTier] = useState('all');

        useEffect(() => {
          fetch('/api/services')
            .then((response) => response.json())
            .then((data) => setServices(data as Service[]));
        }, []);

        const rows = tier === 'all' ? services : services.filter((s) => String(s.tier) === tier);

        return (
          <section>
            <h1>Services</h1>
            <select value={tier} onChange={(event) => setTier(event.target.value)}>
              <option value="all">All tiers</option>
              <option value="1">Tier 1</option>
              <option value="2">Tier 2</option>
            </select>
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Tier</th>
                  <th>Owner</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((service) => (
                  <tr key={service.name}>
                    <td>{service.name}</td>
                    <td>{service.tier}</td>
                    <td>{service.owner}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </section>
        );
      }
    src/pages/Services.test.tsx: |
      import { render, screen } from '@testing-library/react';
      import { MemoryRouter } from 'react-router-dom';
      import { expect, test } from 'vitest';

      import Services from './Services';

      test('renders a row for each service the API returns', async () => {
        render(
          <MemoryRouter>
            <Services />
          </MemoryRouter>,
        );
        expect(await screen.findByText('checkout')).toBeInTheDocument();
      });
    src/test/server.ts: |
      import { http, HttpResponse } from 'msw';
      import { setupServer } from 'msw/node';

      const STATUS = {
        overall: 'degraded',
        updated_at: '2026-08-04T10:05:00Z',
        services: [
          { id: 'checkout', name: 'Checkout', state: 'ok', availability_30d: 99.97 },
          { id: 'search', name: 'Search', state: 'degraded', availability_30d: 99.41 },
          { id: 'settlements', name: 'Settlements', state: 'ok', availability_30d: 99.99 },
          { id: 'ledger', name: 'Ledger', state: 'unknown', availability_30d: 99.9 },
        ],
      };

      const INCIDENTS = [
        { id: 'inc-0003', status: 'open', title: 'Search latency above the error budget', service: 'search', created_at: '2026-08-04T09:40:00Z', resolved_at: null },
        { id: 'inc-0002', status: 'closed', title: 'Settlement batch retried after ledger timeout', service: 'settlements', created_at: '2026-08-02T14:40:00Z', resolved_at: '2026-08-02T15:25:00Z' },
        { id: 'inc-0001', status: 'closed', title: 'Checkout deploy rolled back', service: 'checkout', created_at: '2026-07-29T09:15:00Z', resolved_at: '2026-07-29T09:50:00Z' },
      ];

      export const handlers = [
        http.get('*/api/services', () =>
          HttpResponse.json([
            { name: 'checkout', tier: 1, owner: 'payments-team' },
            { name: 'search', tier: 2, owner: 'discovery-team' },
          ]),
        ),
        http.get('*/v1/status', () => HttpResponse.json(STATUS, { headers: { 'X-Request-ID': 'req-fixture' } })),
        http.get('*/v1/incidents', ({ request }) => {
          const url = new URL(request.url);
          const status = url.searchParams.get('status');
          const cursor = url.searchParams.get('cursor');
          const rows = status ? INCIDENTS.filter((i) => i.status === status) : INCIDENTS;
          const start = cursor ? Number(cursor.replace('cursor-', '')) : 0;
          const data = rows.slice(start, start + 2);
          const next_cursor = start + 2 < rows.length ? `cursor-${start + 2}` : null;
          return HttpResponse.json({ data, next_cursor }, { headers: { 'X-Request-ID': 'req-fixture' } });
        }),
      ];

      export const server = setupServer(...handlers);
    src/test/setup.ts: |
      import '@testing-library/jest-dom/vitest';
      import { afterAll, afterEach, beforeAll } from 'vitest';

      import { server } from './server';

      beforeAll(() => server.listen({ onUnhandledRequest: 'bypass' }));
      afterEach(() => server.resetHandlers());
      afterAll(() => server.close());
