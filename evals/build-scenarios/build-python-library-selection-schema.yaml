id: build-python-library-selection-schema
max_turns: 65
agent: software-engineer
tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
prompt: |
  Load the `python-engineering` skill before you start.
  Replace this reviewed, team-authored Python 3.12+ service's custom JSON Schema
  interpreter with a suitable maintained library. Inspect the callers and offline
  evidence before choosing: the contract is caller-supplied Draft 2020-12 JSON Schema,
  not Python type annotations. Explain capability, maintenance/license, deployment
  cost and evidence limits in your final report. A dependency is justified when it
  removes this substantive machinery. Select from the pinned, already available
  environment; do not install anything or use the network. Declare the direct chosen
  dependency with its exact available pin in requirements.txt. If no available library
  fits, report the blocker instead of inventing a substitute.
  Preserve validation.validate_payload(schema, payload): validate the schema first,
  return the identical valid payload, and raise exactly ValueError('invalid schema')
  or ValueError('invalid payload') for the corresponding failure. Inputs are ordinary
  decoded JSON values; never mutate the schema or payload. Support nested objects,
  required/additionalProperties, arrays/items, allOf/anyOf/oneOf/not, enum/const,
  numeric and string bounds, and local #/$defs references. Task inputs contain only
  local references; no remote retrieval or network is required or allowed. JSON
  Schema integers exclude booleans and accept integral floats. Retire the custom
  interpreter from validation.py rather than wrapping it with a ceremonial package call.
  Keep api.submit(schema, payload) and batch.load(schema, payloads) delegating at
  runtime to validation.validate_payload, so replacing that public owner changes
  both callers, without duplicate checks before or after it. Preserve batch order.
  Add meaningful standard-library unittest tests under tests/ and run
  python -m unittest discover -s tests -t . as your final foreground shell command
  after all edits, without piping or backgrounding it. Report verification and gaps.
  Only change validation.py, api.py, batch.py, requirements.txt and tests/.
  No installs, network, commits or external systems. Do not edit evidence or README.
fixture:
  files:
    .gitignore: "__pycache__/\n"
    README.md: |
      # Schema gateway
      The API and batch gateway accept arbitrary caller-supplied Draft 2020-12 schemas
      and decoded JSON payloads. Only local references are in scope for this task.
      validation.validate_payload is the public policy owner. It returns the original
      valid object and normalizes invalid schema/payload errors to the messages in the
      task. The custom interpreter is costly and incomplete; replace it, preserving
      callers. No dependency installation is permitted in this offline workspace.
    requirements.txt: ""
    evidence/library-notes.md: |
      # Offline selection evidence, retrieved 2026-10-12
      [sourced, documented contract] Context7 official documentation describes
      jsonschema's validate, validator check_schema and iter_errors APIs for validating
      raw JSON schemas/instances. The Context7 page is unversioned; the official
      versioned page confirms the APIs for 4.26.0:
      https://python-jsonschema.readthedocs.io/en/v4.26.0/validate/
      [sourced, upstream metadata] GitHits fetched jsonschema v4.26.0 pyproject.toml,
      commit a7277432b0f7bcd0551f6e589d30457017125df4: MIT; Python >=3.10;
      dependencies attrs>=22.2.0, jsonschema-specifications>=2023.03.6,
      referencing>=0.28.4, rpds-py>=0.25.0. This is package metadata, not an advisory audit.
      https://github.com/python-jsonschema/jsonschema/blob/v4.26.0/pyproject.toml
      [sourced, documented contract] Context7's Pydantic migration documentation
      describes TypeAdapter validation of Python annotations and JSON Schema generation;
      those capabilities do not establish interpretation of arbitrary raw JSON Schema.
      https://github.com/pydantic/pydantic/blob/main/docs/migration.md
      [verified, environment snapshot] jsonschema 4.26.0 and Pydantic 2.13.5 are installed.
      Existing environment pins include their transitive dependencies. Declare only
