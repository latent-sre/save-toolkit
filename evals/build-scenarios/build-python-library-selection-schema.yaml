    validation.py: |
      import re

      TYPES = {"object": dict, "array": list, "string": str, "number": (int, float),
               "integer": int, "boolean": bool, "null": type(None)}

      def _check_schema(schema):
          if isinstance(schema, bool):
              return
          if not isinstance(schema, dict):
              raise ValueError("invalid schema")
          kind = schema.get("type")
          if kind is not None and kind not in TYPES:
              raise ValueError("invalid schema")
          for key in ("properties", "$defs"):
              children = schema.get(key, {})
              if not isinstance(children, dict):
                  raise ValueError("invalid schema")
              for child in children.values():
                  _check_schema(child)
          for key in ("items", "not", "additionalProperties"):
              if key in schema:
                  _check_schema(schema[key])
          for key in ("allOf", "anyOf", "oneOf"):
              if key in schema:
                  if not isinstance(schema[key], list):
                      raise ValueError("invalid schema")
                  for child in schema[key]:
                      _check_schema(child)
          if "required" in schema and not isinstance(schema["required"], list):
              raise ValueError("invalid schema")

      def _matches(schema, value, root):
          if isinstance(schema, bool):
              return schema
          if "$ref" in schema:
              node = root
              for part in schema["$ref"].removeprefix("#/").split("/"):
                  node = node[part]
              return _matches(node, value, root)
          kind = schema.get("type")
          if kind is not None and not isinstance(value, TYPES[kind]):
              return False
          if "const" in schema and value != schema["const"]:
              return False
          if "enum" in schema and value not in schema["enum"]:
              return False
          if isinstance(value, dict):
              if any(name not in value for name in schema.get("required", [])):
                  return False
              properties = schema.get("properties", {})
              for name, child in value.items():
                  if not _matches(properties.get(name, schema.get("additionalProperties", True)), child, root):
                      return False
          if isinstance(value, list):
              if len(value) < schema.get("minItems", 0):
                  return False
              if "maxItems" in schema and len(value) > schema["maxItems"]:
                  return False
              if not all(_matches(schema.get("items", True), item, root) for item in value):
                  return False
          if isinstance(value, (int, float)):
              if "minimum" in schema and value < schema["minimum"]:
                  return False
              if "maximum" in schema and value > schema["maximum"]:
                  return False
          if isinstance(value, str):
              if len(value) < schema.get("minLength", 0):
                  return False
              if "maxLength" in schema and len(value) > schema["maxLength"]:
                  return False
              if "pattern" in schema and re.search(schema["pattern"], value) is None:
                  return False
          if "allOf" in schema and not all(_matches(child, value, root) for child in schema["allOf"]):
              return False
          if "anyOf" in schema and not any(_matches(child, value, root) for child in schema["anyOf"]):
              return False
          if "oneOf" in schema and sum(_matches(child, value, root) for child in schema["oneOf"]) != 1:
              return False
          if "not" in schema and _matches(schema["not"], value, root):
              return False
          return True

      def validate_payload(schema, payload):
          _check_schema(schema)
          if not _matches(schema, payload, schema):
              raise ValueError("invalid payload")
          return payload
    api.py: |
      import validation

      def submit(schema, payload):
          return validation.validate_payload(schema, payload)
    batch.py: |
      import validation

      def load(schema, payloads):
          return [validation.validate_payload(schema, payload) for payload in payloads]
    tests/__init__.py: ""
    tests/test_gateway.py: |
      import unittest
      import api
      import batch

      class GatewayTests(unittest.TestCase):
          def test_order_and_identity(self):
              schema = {"type": "object", "required": ["name"]}
              payload = {"name": "gateway"}
              self.assertIs(api.submit(schema, payload), payload)
              self.assertEqual(batch.load(schema, [payload, payload]), [payload, payload])

          def test_rejects_missing_name(self):
              with self.assertRaisesRegex(ValueError, "^invalid payload$"):
                  api.submit({"required": ["name"]}, {})
