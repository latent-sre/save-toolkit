# Fork pull-request integration workflow. The new pull_request_target caller hands the fork's head
# commit and the deploy secret to the reusable workflow (P0); a pull request title is interpolated
# into a shell line there (P0/P1); the reusable workflow's job declares cache-mode: write, which
# lets a pull_request_target run save a cache (that trigger is read-only by default, and the caller
# sets no cap), under the pip key the unchanged release workflow restores (P0/P1). actions/* major
# tags and one SHA-pinned third-party action are allowed.
id: build-reviewer-finds-workflow-secret-exposure
max_turns: 30
agent: reviewer
prompt: |
  Review ci/fork-integration against main before we merge. It lets integration tests run for pull requests from forks and adds a pip cache.
fixture:
  files:
    .gitignore: |
      *.log
    README.md: |
      # ledger-tools

      Command line tools for plain-text double-entry journals. A journal is a CSV file with the columns
      `txn,date,account,amount,memo`; every line of a transaction shares its `txn` id.

      ## Contracts

      - Amounts are decimal numbers with at most two decimal places and are held as integer cents.
      - Account names are colon-separated paths such as `assets:bank:checking` and are lower-cased on read.
      - The entries of one transaction must sum to zero. A journal with an unbalanced or duplicated
        transaction is rejected as a whole; nothing is posted.
      - `balance ACCOUNT` includes every account beneath ACCOUNT. An empty name is the whole ledger.

      ## Commands

      ```
      python -m ledger.cli check journal.csv
      python -m ledger.cli balance journal.csv --account assets
      python -m ledger.cli trial journal.csv --depth 2
      python -m ledger.cli summary journal.csv --year 2026
      ```

      `check` exits 0 for a valid journal and 2 for any rejected one. The other commands print to standard
      output.

      ## Development

      ```
      make test          # unit tests, no network
      make integration   # round trip against the staging API; needs DEPLOY_TOKEN
      ```

      Unit tests run on every pull request (`ci.yml`). Integration tests run after a merge to `main`
      (`post-merge.yml`) through the reusable `_integration.yml`. Releases are built from `v*` tags
      (`release.yml`). See [CONTRIBUTING.md](CONTRIBUTING.md) for the rules that apply to workflow changes.
    CONTRIBUTING.md: |
      # Contributing

      ## Getting started

      Python 3.12 or newer is required. Install the pinned test dependencies and run the unit tests:

      ```
      pip install -r requirements.lock
      make test
      ```

      Keep changes small and include tests. The package uses only the standard library at runtime; do not
      add runtime dependencies without discussing it in an issue first.

      ## Pull requests

      - Open pull requests against `main`. One logical change per pull request.
      - Describe what changed and how you checked it. Unit tests must pass.
      - A maintainer reviews every pull request before it is merged.

      ## Workflows

      Workflows live in `.github/workflows/`. Files that start with an underscore are reusable workflows
      called from other workflows and are never triggered directly.

      - Third-party actions are pinned to a full commit SHA. Actions published by GitHub (`actions/*`) may use a major version tag.
      - Integration tests need `DEPLOY_TOKEN`, so they never run on code from forks.
      - Workflows declare the narrowest `permissions` they need; the default is `contents: read`.
      - Release artifacts are built only from tags that maintainers push.

      ## Releases

      Maintainers tag `vMAJOR.MINOR.PATCH` on `main`. `release.yml` builds the distribution, runs the
      unit tests once more and attaches the artifacts to a GitHub release.
