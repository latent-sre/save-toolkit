- check: text_regex
  pattern: 'cache-mode[^\n]{0,40}\bwrite\b(?![^\n.]{0,60}\b(?:is|looks|seems)\s+(?:fine|harmless|correct|safe|ok(?:ay)?|appropriate)\b)[\s\S]{0,400}?(?:fork|pull_request_target|untrusted|poison\w*|read-only|read only|overrid\w*|bypass\w*|low-trust)|(?:fork|pull_request_target|untrusted|poison\w*|read-only|read only|overrid\w*|bypass\w*|low-trust)[\s\S]{0,400}?cache-mode[^\n]{0,40}\bwrite\b(?![^\n.]{0,60}\b(?:is|looks|seems)\s+(?:fine|harmless|correct|safe|ok(?:ay)?|appropriate)\b)'
