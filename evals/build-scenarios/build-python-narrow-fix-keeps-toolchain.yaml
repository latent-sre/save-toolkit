id: build-python-narrow-fix-keeps-toolchain
max_turns: 40
agent: software-engineer
tools: [Read, Glob, Grep, Edit, Write, Bash, Skill]
prompt: |
  parse_window("0m") in windows.py raises ValueError, but the written specification says a window
  is a decimal integer without leading zeros followed by m, h, or d, and that zero is valid. Fix
  that bug in this reviewed, team-authored fixture, a Poetry project that supports Python 3.10 and
  later. Use local checks; no network, installs, commits, or external systems. Report what you
  changed and verified, and anything about the project's foundation its owner should know.
fixture:
  files:
    .gitignore: "__pycache__/\n"
    .flake8: |
      [flake8]
      max-line-length = 100
    pyproject.toml: |
      [tool.poetry]
      name = "retention"
      version = "1.4.0"
      description = "Retention window helpers"
      authors = ["Platform Team <platform@example.invalid>"]

      [tool.poetry.dependencies]
      python = "^3.10"

      [tool.poetry.group.dev.dependencies]
      black = "^23.12"
      flake8 = "^6.1"

      [tool.black]
      line-length = 100
      target-version = ["py310"]

      [build-system]
      requires = ["poetry-core>=1.8"]
      build-backend = "poetry.core.masonry.api"
    poetry.lock: |
      # This file is automatically @generated by Poetry 1.8.3 and should not be changed by hand.
      package = []

      [metadata]
      lock-version = "2.0"
      python-versions = "^3.10"
      content-hash = "5d1e1b2f6a7c8d9e0f1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f70"
    windows.py: |
      """Parse retention windows such as 15m, 2h, or 1d."""
      from __future__ import annotations

      import re
      from datetime import timedelta

      _UNITS = {"m": "minutes", "h": "hours", "d": "days"}
      _PATTERN = re.compile(r"([1-9][0-9]*)([mhd])")


      def parse_window(text: str) -> timedelta:
          match = _PATTERN.fullmatch(text)
          if match is None:
              raise ValueError(f"invalid window: {text!r}")
          amount, unit = match.groups()
          return timedelta(**{_UNITS[unit]: int(amount)})
    tests/test_windows.py: |
      import unittest
      from datetime import timedelta

      from windows import parse_window


      class ParseWindowTests(unittest.TestCase):
          def test_units(self):
              self.assertEqual(parse_window("15m"), timedelta(minutes=15))
              self.assertEqual(parse_window("2h"), timedelta(hours=2))
              self.assertEqual(parse_window("1d"), timedelta(days=1))

          def test_rejects_malformed_windows(self):
              for text in ("", "m", "5", "-5m", "05m", "5x"):
                  with self.subTest(text=text), self.assertRaises(ValueError):
                      parse_window(text)


      if __name__ == "__main__":
          unittest.main()
checks:
  - {check: skill_loaded, skill: python-craft, text: "Python craft was loaded for a narrow fix in an older project"}
  - {check: changes_within, allowed: [windows.py, tests/], text: "the fix stays in the module and its tests; the Poetry, Black, and flake8 setup is untouched and nothing is migrated"}
  - {check: no_new_commits, text: "no commits"}
  - check: command_exit_zero
    failure_exit_code: 10
    command: "python -I -B oracle_protocol.py _python_baseline_oracle.py narrow"
    writes_from: {_python_baseline_oracle.py: evals/oracles/python-craft/check_project_baseline.py, oracle_protocol.py: evals/oracles/oracle_protocol.py}
    text: "zero-length windows parse, other windows and rejections are preserved, the code still parses on the Python 3.10 floor, and the toolchain files are byte-for-byte the fixture's; whether the report names the baseline conflict needs semantic review"
