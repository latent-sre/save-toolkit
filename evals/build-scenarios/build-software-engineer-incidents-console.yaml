        expect(await screen.findByText('checkout')).toBeInTheDocument();
      });
    src/test/server.ts: |
      import { http, HttpResponse } from 'msw';
      import { setupServer } from 'msw/node';

      const INCIDENTS = [
        { id: 'inc-0001', status: 'open', title: 'Checkout latency above the error budget', service: 'checkout', created_at: '2026-08-01T09:15:00Z' },
        { id: 'inc-0002', status: 'closed', title: 'Search index replication lag', service: 'search', created_at: '2026-08-02T14:40:00Z' },
        { id: 'inc-0003', status: 'open', title: 'Settlement batch retrying', service: 'settlements', created_at: '2026-08-03T07:05:00Z' },
      ];

      const problem = (status: number, title: string, detail: string, extra: Record<string, unknown> = {}) =>
        HttpResponse.json(
          { type: `https://errors.example.internal/${title.toLowerCase().replace(/ /g, '-')}`, title, status, detail, request_id: 'req-fixture', ...extra },
          { status, headers: { 'Content-Type': 'application/problem+json', 'X-Request-ID': 'req-fixture' } },
        );

      export const handlers = [
        http.get('*/api/services', () =>
          HttpResponse.json([
            { name: 'checkout', tier: 1, owner: 'payments-team' },
            { name: 'search', tier: 2, owner: 'discovery-team' },
          ]),
        ),
        // The house contract: `{ data, next_cursor }` pages of two, an allowlisted status filter.
        http.get('*/v1/incidents', ({ request }) => {
          const url = new URL(request.url);
          const status = url.searchParams.get('status');
          const cursor = url.searchParams.get('cursor');
          const rows = status ? INCIDENTS.filter((i) => i.status === status) : INCIDENTS;
          const start = cursor ? Number(cursor.replace('cursor-', '')) : 0;
          const data = rows.slice(start, start + 2);
          const next_cursor = start + 2 < rows.length ? `cursor-${start + 2}` : null;
          return HttpResponse.json({ data, next_cursor }, { headers: { 'X-Request-ID': 'req-fixture' } });
        }),
        http.post('*/v1/incidents', async ({ request }) => {
          const key = request.headers.get('idempotency-key');
          if (!key) return problem(400, 'Bad request', 'Idempotency-Key is required.');
          const body = (await request.json()) as { title?: string; service?: string };
          if (!body.title || !body.service) {
            return problem(422, 'Validation failed', 'A field is missing.', {
              errors: [
                ...(body.title ? [] : [{ loc: ['body', 'title'], msg: 'must not be empty' }]),
                ...(body.service ? [] : [{ loc: ['body', 'service'], msg: 'must not be empty' }]),
              ],
            });
          }
          return HttpResponse.json(
            { id: 'inc-0099', status: 'open', title: body.title, service: body.service, created_at: '2026-08-04T10:00:00Z' },
            { status: 201, headers: { 'X-Request-ID': 'req-fixture' } },
          );
        }),
      ];

      export const server = setupServer(...handlers);
    src/test/setup.ts: |
      import '@testing-library/jest-dom/vitest';
      import { afterAll, afterEach, beforeAll } from 'vitest';

      import { server } from './server';

      beforeAll(() => server.listen({ onUnhandledRequest: 'bypass' }));
      afterEach(() => server.resetHandlers());
      afterAll(() => server.close());
