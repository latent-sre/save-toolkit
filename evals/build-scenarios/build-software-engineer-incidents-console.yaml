id: build-software-engineer-incidents-console
max_turns: 64
agent: software-engineer
# The operator-console bar with the house API contract. The prompt asks for a table, a filter,
# "load more" and a form, and says on-call needs to find the log line when the API fails; it
# never says "loading state", "empty state", "the URL is state", "request id" or "cursor". The
# probe-owned oracle (probe_ui.test.tsx, written by the first check, never seen by the agent)
# grades the rendered page: the seven incidents-page bars (bar5 also requires the filter to reach
# the server), bar8 (a problem+json 500 shows its request_id), bar9 (load more passes next_cursor
# back), bar10 (a create answered 409 with Retry-After is re-sent under the same Idempotency-Key),
# bar11 (a 422 lands beside its field with the input kept) and bar12 (API text renders as text,
# never markup); evals/test_incidents_console_oracle.py calibrates bars 5 and 10-12 against named
# mutants. The fixture is the opsconsole
# app with the house OpenAPI contract at docs/openapi.yaml and MSW handlers that implement it:
# `{ data, next_cursor }` pages, problem+json with request_id, Idempotency-Key on create. The
# existing repository's stack wins over the skill's greenfield default, so react-router is the
# right thing to extend; src/pages/Services.tsx is deliberately naive so the repository's own
# code does not model the bar.
prompt: |
  Add an Incidents page at `/incidents` to this React app. The API is documented in
  `docs/openapi.yaml` (`GET /v1/incidents` is cursor-paginated; `POST /v1/incidents` creates
  one). I want: a table of incidents with a status filter (open or closed) that survives a
  refresh, a "load more" that follows the API's cursor, and a "New incident" form. On-call uses
  this during incidents, so if the API fails they need enough on screen to find the log line.
  Build it end to end in this repo and tell me what you ran to verify it.
  Tests go next to the code as `*.test.tsx`; this repo uses Vitest, Testing Library, and MSW (see
  the README). This is a code change, not a design question, not a review, and not an incident.
  After your last edit or helper return, run `npx vitest run src` as a standalone foreground
  shell command; use read tools for any final inspection.
  Use separate Changed and Verified headings in your final response, explaining the changes and verification results.
fixture:
  files:
    .gitignore: |
      node_modules/
      dist/
      coverage/
      .vite/
    README.md: |
      # opsconsole

      The internal operations console: a Vite + React + TypeScript single-page app served behind
      the ops gateway. Routes live in `src/App.tsx`; `src/api/client.ts` wraps `fetch` for the
      JSON API the gateway proxies at the same origin. The API contract is `docs/openapi.yaml`;
      the legacy `/api/services` endpoint predates it.

      Install dependencies once, then work from the repo root:

          npm install

      Typecheck and test:

          npm run typecheck     # tsc --noEmit
          npm test              # vitest run

      Component tests sit next to the component as `*.test.tsx` and mock the API at the network
      layer with MSW (`src/test/server.ts`); `src/test/setup.ts` starts the server for every test
      file. `npm run dev` serves the app locally.
    docs/openapi.yaml: |
      openapi: 3.1.0
      info: { title: Ops Console API, version: 1.0.0 }
      servers:
        - url: /
      paths:
        /v1/incidents:
          get:
            operationId: listIncidents
            summary: List incidents (cursor-paginated).
            parameters:
              - { name: cursor, in: query, schema: { type: string, minLength: 1, maxLength: 2048 }, description: Opaque cursor from next_cursor; omit on the first page. }
              - { name: limit, in: query, schema: { type: integer, default: 50, minimum: 1 }, description: Page size; the server lowers values above 200 to 200. }
              - { name: status, in: query, schema: { type: string, enum: [open, closed] }, description: Allowlisted filter. }
            responses:
              "200":
                description: A page of incidents.
                headers:
                  X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
                content:
                  application/json:
                    schema: { $ref: "#/components/schemas/IncidentPage" }
              "422": { $ref: "#/components/responses/Problem" }
              "429": { $ref: "#/components/responses/RateLimited" }
              "500": { $ref: "#/components/responses/Problem" }
          post:
            operationId: createIncident
            summary: Create an incident (idempotent via Idempotency-Key).
            parameters:
              - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
            requestBody:
              required: true
              content:
                application/json:
                  schema: { $ref: "#/components/schemas/IncidentCreate" }
            responses:
              "201":
                description: Created, or a replay of the first completed request with this key.
                headers:
                  Idempotent-Replayed: { schema: { type: boolean }, description: "true on a replay; omitted on the initial creation." }
                  X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
                content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } }
              "400": { $ref: "#/components/responses/Problem" }
              "409":
                description: The first request with this key is still in progress.
                headers:
                  Retry-After: { schema: { type: integer }, description: Seconds before retrying with the same key. }
                  X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
                content:
                  application/problem+json:
                    schema: { $ref: "#/components/schemas/Problem" }
              "422": { $ref: "#/components/responses/Problem" }
              "429": { $ref: "#/components/responses/RateLimited" }
              "500": { $ref: "#/components/responses/Problem" }
      components:
        headers:
          X-Request-ID:
            description: Correlates this response with the request log line; equals the problem body's request_id.
            schema: { type: string, minLength: 1 }
        responses:
          Problem:
            description: RFC 9457 problem+json. `type` and codes are part of the contract.
            headers:
              X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            content:
              application/problem+json:
                schema: { $ref: "#/components/schemas/Problem" }
          RateLimited:
            description: Rate limited; Retry-After is required.
            headers:
              Retry-After: { required: true, schema: { type: integer }, description: Seconds to wait. }
              X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            content:
              application/problem+json:
                schema: { $ref: "#/components/schemas/Problem" }
        schemas:
          Problem:
            type: object
            properties:
              type: { type: string, format: uri, description: Stable URI identifying the error class. }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
              request_id: { type: string, minLength: 1, description: Correlates this response with the request log line. }
              errors:
                type: array
                items:
                  type: object
                  properties:
                    loc: { type: array, items: { type: string } }
                    msg: { type: string }
                  required: [loc, msg]
            required: [type, title, status, request_id]
          Incident:
            type: object
            properties:
              id: { type: string }
              status: { type: string, enum: [open, closed] }
              title: { type: string, minLength: 1, maxLength: 200 }
              service: { type: string }
              created_at: { type: string, format: date-time }
            required: [id, status, title, service, created_at]
          IncidentCreate:
            type: object
            properties:
              title: { type: string, minLength: 1, maxLength: 200 }
              service: { type: string, minLength: 1 }
            required: [title, service]
            additionalProperties: false
          IncidentPage:
            type: object
            properties:
              data: { type: array, items: { $ref: "#/components/schemas/Incident" } }
              next_cursor: { type: [string, "null"], minLength: 1, maxLength: 2048, description: "Pass back as ?cursor= for the next page; null on the last page." }
            required: [data, next_cursor]
