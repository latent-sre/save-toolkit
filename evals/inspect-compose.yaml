services:
  default:
    image: python:3.14.10-slim-bookworm@sha256:516b51cb9db2ef061e465c803e50f64361b82cefd91e525b889b967b83e83527
    init: true
    user: "0:0"
    read_only: true
    environment:
      HOME: /home/agent
      PATH: /usr/local/bin:/usr/bin:/bin
    tmpfs:
      - /workspace:rw,exec,nosuid,nodev,size=128m,mode=0700
      - /home/agent:rw,exec,nosuid,nodev,size=512m,mode=0700
      - /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777
      - /var/tmp:rw,exec,nosuid,nodev,size=256m,mode=1777
    working_dir: /workspace
    command: sleep infinity
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
