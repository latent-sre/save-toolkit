[pytest]
# Collect only the repository's own scripts/ and evals/ test suites. graph-sandbox/ and
# autogen-a2a-sandbox/ are independent repository-owned sandboxes with their own test trees and
# their own dependency assumptions; collecting them here would pull sandbox-only imports into the
# fleet's pytest run.
testpaths = scripts evals
python_files = test_*.py
# Both suites import their tools by module name (`import validate_fleet`, `import judge`); name the
# two roots once here instead of editing sys.path per file. No module name exists in both.
pythonpath = scripts evals
# Local runs use ten workers. CI keeps its explicit four-worker PYTEST_ADDOPTS override.
# A command-line `-n` overrides both; `-n 0` runs in one process for a debugger or `--pdb`.
# Steal pending cases from busy workers so slow parameter cases do not serialize by file.
# The test process may open sockets only to loopback or a Unix socket (Docker, Inspect's control
# socket); the eval threat model assumes an offline suite and this is what enforces it. A test that
# must reach further says so with pytest-socket's markers. Subprocesses a test starts are not covered.
addopts = -n 10 --dist worksteal --disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket
# A hung child names its test instead of holding a shard to the job's 20-minute limit; the slowest
# observed case takes 23 seconds. A test that legitimately needs longer carries @pytest.mark.timeout.
timeout = 300
